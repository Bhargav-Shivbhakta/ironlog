<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0c0d10; --shell:#14161a; --sidebar:#090a0c; --card:#1c1f24; --card-strong:#252930;
    --text:#f5f6f7; --muted:#9da3ad; --faint:#6b7078;
    --line:#30343b; --line-soft:#282c33;
    --accent:#9b82ff; --accent-soft:#2b234c; --logo-bg:#8c70ff;
    --good:#57d6a9; --warn:#ffb35c; --danger:#ff6b7a; --danger-soft:#3a1620;
    --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  svg{display:block;}

  .loading-gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--muted);}

  .auth-overlay,.profile-overlay{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px;max-width:360px;width:100%;text-align:center;}
  .auth-box h2{font-size:20px;margin:0 0 4px;font-weight:700;}
  .auth-box p{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .auth-box input{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:var(--card-strong);color:var(--text);font-size:14px;}
  .auth-box button[type=submit]{width:100%;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:14px;margin-top:6px;}
  .auth-error{color:var(--danger);font-size:12px;min-height:16px;margin-top:8px;}
  .auth-toggle{font-size:12.5px;color:var(--muted);margin-top:14px;}
  .auth-toggle button{background:none;border:none;color:var(--accent);font-weight:700;text-decoration:underline;}
  .profile-grid{display:flex;gap:16px;}
  .profile-card{background:var(--card-strong);border:1px solid var(--line);border-radius:14px;padding:20px 24px;text-align:center;color:var(--text);}
  .profile-card:hover{border-color:var(--accent);}
  .profile-avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;margin:0 auto 10px;}
  .profile-name{font-weight:700;font-size:13.5px;}

  .app-window{max-width:1180px;margin:0 auto;min-height:100vh;}
  .shell{display:grid;grid-template-columns:188px minmax(0,1fr);background:var(--shell);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,0.35);min-height:calc(100vh - 40px);margin:20px auto;max-width:1180px;}
  .sidebar{background:var(--sidebar);color:#f7f7f8;padding:22px 14px;display:flex;flex-direction:column;gap:20px;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 10px 6px;font-weight:500;font-size:14px;letter-spacing:0.02em;}
  .brand-mark{width:28px;height:28px;border-radius:9px;background:var(--logo-bg);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;}
  .back-link{display:block;color:#6d7178;text-decoration:none;font-size:11.5px;padding:0 10px;margin-top:-10px;}
  .nav{display:grid;gap:6px;}
  .nav button{display:flex;align-items:center;gap:10px;border:none;background:transparent;color:#aeb2ba;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:500;text-align:left;width:100%;}
  .nav button:hover{background:#1d2025;color:#fff;}
  .nav button.active{background:#282b31;color:#fff;}
  .nav button svg{width:17px;height:17px;flex:none;}
  .sidebar-foot{margin-top:auto;background:#191b20;border-radius:12px;padding:12px;font-size:12px;color:#aeb2ba;line-height:1.5;}
  .sf-status{color:#62dbb1;display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:3px;}
  .sf-dot{width:7px;height:7px;border-radius:50%;background:#62dbb1;}

  .main{min-width:0;padding:24px 26px 28px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;}
  .topbar h1{font-size:20px;margin:0;font-weight:500;}
  .topbar .sub{color:var(--muted);font-size:13px;margin-top:4px;}
  .topbar-actions{display:flex;gap:8px;flex:none;}
  .tb-btn{border:1px solid var(--line);background:var(--shell);color:var(--text);border-radius:10px;min-height:38px;padding:0 13px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;}
  .tb-btn.primary{border-color:var(--accent);background:var(--accent);color:#fff;}

  .panel{display:none;}
  .panel.active{display:block;}

  .grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,0.9fr);gap:16px;}
  .stack{display:grid;gap:16px;align-content:start;}
  .card{background:var(--shell);border:1px solid var(--line);border-radius:17px;padding:18px;}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .card-title{font-size:14px;font-weight:500;}
  .card-meta{font-size:12px;color:var(--muted);}

  .clock-hero-card{min-height:310px;position:relative;overflow:hidden;background:linear-gradient(145deg,#17191e,#2a2440);color:#fff;border:0;display:flex;flex-direction:column;justify-content:space-between;}
  .clock-hero-card::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-90px;background:radial-gradient(circle,rgba(147,118,255,.38),rgba(147,118,255,0) 68%);pointer-events:none;}
  .clock-card-top{display:flex;justify-content:space-between;align-items:center;color:#c8cad0;font-size:13px;z-index:1;position:relative;}
  .live-tag{display:flex;align-items:center;gap:7px;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#62dbb1;animation:pulse 2s ease infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .big-time{font-size:clamp(58px,8vw,96px);line-height:0.95;letter-spacing:-0.06em;font-weight:400;font-variant-numeric:tabular-nums;z-index:1;position:relative;display:flex;align-items:baseline;gap:0;}
  .big-time small{font-size:0.25em;letter-spacing:0;color:#b9bbc2;margin-left:9px;}
  .clock-date{color:#c8cad0;font-size:15px;z-index:1;position:relative;}
  .hour-toggle-row{display:flex;gap:6px;margin-top:14px;z-index:1;position:relative;}
  .hour-toggle{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);color:#c8cad0;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:600;}
  .hour-toggle.active{background:var(--accent);color:#fff;border-color:transparent;}

  .empty-row{color:var(--faint);font-size:12.5px;font-style:italic;padding:10px 0;}

  .world-mini-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line-soft);}
  .world-mini-item:first-of-type{border-top:none;}
  .wm-city{font-size:13px;font-weight:600;}
  .wm-zone{font-size:10.5px;color:var(--faint);margin-top:1px;}
  .wm-time{font-size:18px;font-variant-numeric:tabular-nums;}

  .alarm-preview-time{font-size:38px;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;}
  .alarm-preview-time small{font-size:13px;letter-spacing:0;color:var(--muted);}
  .alarm-preview-label{font-size:13px;color:var(--muted);margin-top:4px;}

  .toggle-sw{position:relative;width:42px;height:24px;border-radius:20px;background:var(--card-strong);border:none;flex:none;}
  .toggle-sw.on{background:var(--accent);}
  .toggle-sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .2s ease;}
  .toggle-sw.on::after{transform:translateX(18px);background:#fff;}

  .focus-time{font-size:29px;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;}
  .focus-card-highlight{background:var(--accent-soft);border-color:transparent;}
  .progress-track{height:7px;border-radius:10px;background:color-mix(in srgb, var(--accent) 14%, transparent);overflow:hidden;margin:14px 0 10px;}
  .progress-fill{height:100%;border-radius:inherit;background:var(--accent);}
  .progress-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}

  .list-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-top:1px solid var(--line-soft);}
  .list-row:first-of-type{border-top:none;}
  .row-main{flex:1;min-width:0;}
  .row-title{font-size:14px;font-weight:600;}
  .row-sub{font-size:11.5px;color:var(--faint);margin-top:3px;}
  .row-actions{display:flex;align-items:center;gap:10px;flex:none;}
  .icon-btn{background:none;border:none;color:var(--faint);padding:4px;display:flex;}
  .icon-btn:hover{color:var(--danger);}
  .icon-btn svg{width:16px;height:16px;}

  .add-btn{width:100%;background:var(--card);border:1px dashed var(--line);color:var(--muted);border-radius:14px;padding:14px;font-size:13px;font-weight:600;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .add-btn:hover{border-color:var(--accent);color:var(--accent);}
  .empty-note{color:var(--faint);font-style:italic;font-size:13px;text-align:center;padding:34px 10px;}

  .day-chip-row{display:flex;gap:4px;margin-top:7px;}
  .day-chip{width:19px;height:19px;border-radius:50%;background:var(--card-strong);color:var(--faint);font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .day-chip.on{background:var(--accent-soft);color:var(--accent);}

  .timer-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line-soft);}
  .timer-item:first-of-type{border-top:none;}
  .timer-ring-sm{width:52px;height:52px;flex:none;position:relative;}
  .timer-ring-sm svg{width:100%;height:100%;transform:rotate(-90deg);}
  .tring-track{fill:none;stroke:var(--line-soft);stroke-width:4;}
  .tring-sweep{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;}
  .timer-item-main{flex:1;min-width:0;}
  .ti-name{font-size:13.5px;font-weight:600;}
  .ti-time{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px;}
  .ti-actions{display:flex;gap:6px;flex:none;}
  .mini-ctrl{background:var(--card-strong);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;}

  .focus-hero{text-align:center;padding:20px 0 10px;}
  .focus-ring-wrap{width:min(70vw,260px);height:min(70vw,260px);margin:0 auto 18px;position:relative;}
  .focus-ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .fring-track{fill:none;stroke:var(--line-soft);stroke-width:3;}
  .fring-sweep{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .focus-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .focus-big-time{font-family:var(--mono);font-size:clamp(32px,8vw,46px);font-weight:700;}
  .focus-mode-label{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;}
  .focus-task-input{width:100%;max-width:320px;margin:0 auto 16px;display:block;text-align:center;background:var(--card-strong);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);font-size:13.5px;}
  .focus-presets{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;}
  .focus-preset-btn{background:var(--card-strong);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 16px;font-size:12px;font-weight:600;}
  .focus-preset-btn.active{background:var(--accent-soft);color:var(--accent);border-color:transparent;}
  .focus-goal-row{display:flex;justify-content:center;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:20px;}
  .focus-goal-row input{width:50px;background:var(--card-strong);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px;text-align:center;font-size:12px;}

  .control-row{display:flex;gap:10px;justify-content:center;margin-top:22px;}
  .ctrl-btn{border:none;border-radius:999px;padding:12px 26px;font-size:13.5px;font-weight:700;}
  .ctrl-btn.primary{background:var(--accent);color:#fff;}
  .ctrl-btn.ghost{background:var(--card-strong);color:var(--text);border:1px solid var(--line);}
  .ctrl-btn.danger{background:var(--danger-soft);color:var(--danger);}

  .sw-display{font-family:var(--mono);font-size:clamp(34px,8vw,46px);font-weight:700;text-align:center;margin:14px 0 4px;}
  .lap-row{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line-soft);font-size:13px;font-family:var(--mono);}
  .lap-row:first-of-type{border-top:none;}
  .lap-num{color:var(--faint);font-family:'Inter',sans-serif;font-weight:600;}

  .hist-day-group{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--faint);margin:18px 0 8px;}
  .hist-day-group:first-child{margin-top:0;}
  .hist-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line-soft);}
  .hist-row:first-of-type{border-top:none;}
  .hist-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;}
  .hist-icon svg{width:15px;height:15px;}
  .hist-icon.i-focus{background:var(--accent-soft);color:var(--accent);}
  .hist-icon.i-timer{background:var(--accent-soft);color:var(--warn);}
  .hist-icon.i-alarm{background:var(--danger-soft);color:var(--danger);}
  .hist-main{flex:1;min-width:0;}
  .hist-title{font-size:13.5px;font-weight:600;}
  .hist-meta{font-size:11px;color:var(--faint);margin-top:2px;}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
  .stat-cell{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;text-align:center;}
  .stat-num{font-family:var(--mono);font-size:20px;font-weight:700;}
  .stat-label{font-size:10px;color:var(--faint);margin-top:2px;}

  .fire-overlay{position:fixed;inset:0;z-index:250;background:rgba(15,17,21,0.94);display:flex;align-items:center;justify-content:center;padding:20px;}
  .fire-box{text-align:center;}
  .fire-box .fb-label{font-size:14px;color:var(--accent);margin-bottom:6px;font-weight:600;}
  .fire-box .fb-time{font-family:var(--mono);font-size:52px;margin-bottom:24px;font-weight:700;}
  .fire-box button{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px 34px;font-size:14px;font-weight:700;}

  .modal-overlay{position:fixed;inset:0;z-index:190;background:rgba(0,0,0,0.55);display:flex;align-items:flex-end;justify-content:center;}
  .modal-sheet{background:var(--card);width:100%;max-width:420px;border-radius:20px 20px 0 0;padding:22px 20px 28px;border-top:1px solid var(--line);}
  .modal-sheet h3{margin:0 0 16px;font-size:16px;font-weight:700;}
  .m-field{margin-bottom:14px;}
  .m-field label{display:block;font-size:11px;color:var(--faint);margin-bottom:5px;}
  .m-field input,.m-field select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card-strong);color:var(--text);font-size:14px;}
  .day-picker{display:flex;gap:6px;}
  .day-picker button{flex:1;background:var(--card-strong);border:1px solid var(--line);color:var(--faint);border-radius:8px;padding:8px 0;font-size:11px;font-weight:700;}
  .day-picker button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions button{flex:1;padding:12px;border-radius:10px;border:none;font-size:13.5px;font-weight:700;}
  .modal-actions .m-save{background:var(--accent);color:#fff;}
  .modal-actions .m-cancel{background:var(--card-strong);color:var(--muted);}

  @media (max-width:760px){
    .shell{display:block;}
    .sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;width:100%;flex-direction:row;align-items:center;padding:8px 6px;gap:0;z-index:40;border-top:1px solid var(--line);overflow-x:auto;}
    .brand,.back-link,.sidebar-foot{display:none;}
    .nav{flex-direction:row;flex:1;justify-content:space-around;}
    .nav button{flex-direction:column;gap:3px;font-size:9.5px;padding:6px 8px;border-radius:10px;}
    .nav button svg{width:18px;height:18px;}
    .main{padding:18px 16px 90px;}
    .grid{grid-template-columns:1fr;}
    .topbar{flex-direction:column;align-items:stretch;}
    .topbar-actions{justify-content:flex-end;}
  }
</style>
</head>
<body>

<div id="loading-gate" class="loading-gate">Loading…</div>

<div class="auth-overlay" id="auth-overlay" style="display:none;">
  <div class="auth-box">
    <h2>Clock</h2>
    <p id="auth-sub">Sign in to sync across devices.</p>
    <form id="auth-form">
      <input type="email" id="auth-email" placeholder="Email" required>
      <input type="password" id="auth-password" placeholder="Password" required>
      <button type="submit" id="auth-submit">Sign in</button>
    </form>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-toggle">New here? <button type="button" id="auth-toggle-btn">Create an account</button></div>
  </div>
</div>

<div class="profile-overlay" id="profile-overlay" style="display:none;">
  <div class="auth-box" style="max-width:340px;">
    <h2>Who's this?</h2>
    <p>&nbsp;</p>
    <div class="profile-grid">
      <div class="profile-card" data-pickprofile="Bhargav"><div class="profile-avatar">B</div><div class="profile-name">Bhargav</div></div>
      <div class="profile-card" data-pickprofile="Anusha"><div class="profile-avatar">A</div><div class="profile-name">Anusha</div></div>
    </div>
  </div>
</div>

<div id="app-wrap" style="display:none;">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16.5 14"></polyline></svg></span>Clock</div>
      <a href="../index.html" class="back-link">← All apps</a>
      <nav class="nav" id="nav">
        <button data-tab="dashboard" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>Dashboard</button>
        <button data-tab="alarms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M5 3 2 6M22 6l-3-3M12 9v4l2 2"></path></svg>Alarms</button>
        <button data-tab="timers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="2" x2="14" y2="2"></line><line x1="12" y1="14" x2="15" y2="11"></line><circle cx="12" cy="14" r="8"></circle></svg>Timers</button>
        <button data-tab="focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="1"></circle></svg>Focus</button>
        <button data-tab="world"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"></path></svg>World time</button>
        <button data-tab="stopwatch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="2" x2="14" y2="2"></line><line x1="12" y1="14" x2="15" y2="11"></line><circle cx="12" cy="14" r="8"></circle></svg>Stopwatch</button>

let audioCtx = null;
// Browsers block audio from ever starting until the page has registered a
// real click/tap — a background timer (which is how an alarm actually
// fires) doesn't count. This grabs the very first interaction anywhere in
// the app to create and unlock the AudioContext ahead of time, so it's
// actually ready by the time an alarm needs it.
function unlockAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
document.addEventListener('click', unlockAudio, {once:false});
document.addEventListener('touchstart', unlockAudio, {once:false});
function playChimeOnce(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    [880, 1108].forEach(function(freq, i){
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      const start = audioCtx.currentTime + i*0.22;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.28, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.5);
      osc.start(start); osc.stop(start+0.55);
    });
  }catch(e){}
}
// A single short chime is easy to miss for something meant to wake you up
// or flag a finished timer — a real alarm keeps ringing until you deal
// with it, so this repeats the chime until dismissed or stopped.
let chimeLoopInterval = null;
function playChime(){ playChimeOnce(); }
function startRingingLoop(){
  stopRingingLoop();
  playChimeOnce();
  chimeLoopInterval = setInterval(playChimeOnce, 1400);
}
function stopRingingLoop(){ clearInterval(chimeLoopInterval); chimeLoopInterval = null; }

}

function tickDashboard(){
  if(activeTab!=='dashboard') return;
  const now = new Date();
  let h = now.getHours(); const m = now.getMinutes(), s = now.getSeconds();
  if(!use24h){ h = h%12; if(h===0) h=12; }
  const timeEl = document.getElementById('dash-time');
  if(timeEl) timeEl.textContent = pad2(h)+':'+pad2(m);
  const secEl = document.getElementById('dash-sec');
  if(secEl) secEl.textContent = pad2(s);
  const dateEl = document.getElementById('dash-date');
  if(dateEl) dateEl.textContent = now.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});

    const ring = document.getElementById('dash-ring');
    if(ring){ const frac = runningTimer.total ? (runningTimer.total-runningTimer.remaining)/runningTimer.total : 0; ring.style.strokeDashoffset = 163.4*(1-frac); }
  }
}
function nextUpcomingAlarm(){
  const onAlarms = alarms.filter(function(a){ return a.on; });
  if(!onAlarms.length) return null;
  const now = new Date();
  let best = null, bestDiff = Infinity;
  onAlarms.forEach(function(a){
    const parts = a.time.split(':'); const hh = parseInt(parts[0],10), mm = parseInt(parts[1],10);
    for(let addDays=0; addDays<8; addDays++){
      const cand = new Date(now); cand.setDate(now.getDate()+addDays); cand.setHours(hh,mm,0,0);
      if(cand<=now) continue;
      if(a.days && a.days.length && a.days.indexOf(cand.getDay())===-1) continue;
      const diff = cand-now;
      if(diff<bestDiff){ bestDiff=diff; best={a:a, cand:cand}; }
      break;
    }
  });
  if(!best) return null;
  const parts = best.a.time.split(':'); const hh = parseInt(parts[0],10), mm = parseInt(parts[1],10);
  const ampm = hh>=12?'PM':'AM'; const h12 = hh%12===0?12:hh%12;
  const hrs = Math.floor(bestDiff/3600000), mins = Math.round((bestDiff%3600000)/60000);
  return { h12:h12, mm:mm, ampm:ampm, label:best.a.label, rel:'in '+hrs+'h '+mins+'m' };
}

  const parts = a.time.split(':'); const hh = parseInt(parts[0],10), mm = parseInt(parts[1],10);

    '<div class="alarm-preview-time" style="color:'+(a.on?'var(--text)':'var(--faint)')+';">'+h12+':'+pad2(mm)+' <small>'+ampm+'</small></div>'+
    (a.label ? '<div class="row-sub">'+escapeHtml(a.label)+'</div>' : '')+
    '<div class="day-chip-row">'+DAY_LETTERS.map(function(d,i){ return '<span class="day-chip '+((a.days||[]).indexOf(i)!==-1?'on':'')+'">'+d+'</span>'; }).join('')+'</div>'+
    '</div><div class="row-actions">'+
    '<button type="button" class="toggle-sw '+(a.on?'on':'')+'" data-togglealarm="'+a.id+'"></button>'+
    '<button type="button" class="icon-btn" data-delalarm="'+a.id+'">✕</button></div></div>';
}
function openAlarmModal(existing){
  const mount = document.getElementById('modal-mount');
  const days = existing ? (existing.days||[]).slice() : [1,2,3,4,5];
  mount.innerHTML = '<div class="modal-overlay" id="alarm-overlay"><div class="modal-sheet">'+
    '<h3>'+(existing?'Edit alarm':'New alarm')+'</h3>'+
    '<div class="m-field"><label>Time</label><input type="time" id="alarm-time-input" value="'+(existing?existing.time:'07:00')+'"></div>'+
    '<div class="m-field"><label>Label</label><input type="text" id="alarm-label-input" placeholder="e.g. Wake up" value="'+(existing?escapeHtml(existing.label||''):'')+'"></div>'+
    '<div class="m-field"><label>Repeats</label><div class="day-picker" id="alarm-day-picker">'+DAY_LETTERS.map(function(d,i){ return '<button type="button" data-day="'+i+'" class="'+(days.indexOf(i)!==-1?'on':'')+'">'+d+'</button>'; }).join('')+'</div></div>'+
    '<div class="modal-actions">'+(existing?'<button type="button" class="m-cancel" id="alarm-delete">Delete</button>':'<button type="button" class="m-cancel" id="alarm-cancel">Cancel</button>')+'<button type="button" class="m-save" id="alarm-save">Save</button></div>'+
  '</div></div>';
  let selectedDays = days;
  mount.querySelectorAll('[data-day]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const d = parseInt(btn.dataset.day,10); const idx = selectedDays.indexOf(d);
      if(idx!==-1) selectedDays.splice(idx,1); else selectedDays.push(d);
      btn.classList.toggle('on');
    });
  });
  function close(){ mount.innerHTML = ''; }
  if(document.getElementById('alarm-cancel')) document.getElementById('alarm-cancel').addEventListener('click', close);
  if(document.getElementById('alarm-delete')) document.getElementById('alarm-delete').addEventListener('click', async function(){
    alarms = alarms.filter(function(a){ return a.id!==existing.id; });
    await saveAlarms(); close(); renderAlarmsPanel();
  });
  document.getElementById('alarm-overlay').addEventListener('click', function(e){ if(e.target.id==='alarm-overlay') close(); });
  document.getElementById('alarm-save').addEventListener('click', async function(){
    const time = document.getElementById('alarm-time-input').value;
    const label = document.getElementById('alarm-label-input').value.trim();
    if(!time) return;
    if(existing){ existing.time=time; existing.label=label; existing.days=selectedDays; }
    else alarms.push({ id:'alarm-'+Date.now(), time:time, label:label, days:selectedDays, on:true });
    await saveAlarms(); close(); renderAlarmsPanel();
  });
}
function checkAlarms(){
  const now = new Date();
  const hhmm = pad2(now.getHours())+':'+pad2(now.getMinutes());
  const dow = now.getDay(); const todayKey = now.toDateString();
  alarms.forEach(function(a){
    if(!a.on) return;
    if(a.days && a.days.length && a.days.indexOf(dow)===-1) return;
    if(a.time !== hhmm) return;
    const fireKey = a.id+':'+todayKey+':'+hhmm;
    if(firedToday[fireKey]) return;
    firedToday[fireKey] = true;
    fireAlarm(a);
  });
}
function fireAlarm(a){
  if(notifPermission==='granted'){ try{ new Notification('Alarm'+(a.label?' — '+a.label:''), {body:'It\'s '+a.time+'.'}); }catch(e){} }
  logHistory('alarm', (a.label||'Alarm'), 'Rang at '+a.time);
  startRingingLoop();
  const mount = document.getElementById('fire-mount');
  mount.innerHTML = '<div class="fire-overlay"><div class="fire-box">'+
    '<div class="fb-label">'+(a.label?escapeHtml(a.label):'Alarm')+'</div>'+
    '<div class="fb-time">'+a.time+'</div>'+
    '<button type="button" id="dismiss-alarm-btn">Dismiss</button>'+
  '</div></div>';
  document.getElementById('dismiss-alarm-btn').addEventListener('click', function(){ stopRingingLoop(); mount.innerHTML = ''; });
}

let timers = [];
async function loadTimers(){
  try{ const d = await profileDoc('timers').get(); timers = (d.exists && d.data().json) ? JSON.parse(d.data().json) : []; }catch(e){ timers = []; }
  timers.forEach(function(t){ t.running = false; });
}
async function saveTimers(){ try{ await profileDoc('timers').set({json: JSON.stringify(timers.map(function(t){ return {id:t.id,name:t.name,total:t.total,remaining:t.remaining}; }))}); }catch(e){} }
function renderTimersPanel(){
  const el = document.getElementById('panel-timers');
  let html = '<div class="card"><div class="card-head"><div class="card-title">Timers</div><span class="card-meta">Run more than one at once</span></div>';
  html += timers.length ? timers.map(timerItemHtml).join('') : '<div class="empty-note">No timers yet.</div>';
  html += '<button type="button" class="add-btn" id="add-timer-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> New timer</button></div>';
  el.innerHTML = html;
  wireTimerButtons();
  document.getElementById('add-timer-btn').addEventListener('click', openNewTimerModal);
}
function timerItemHtml(t){
  const frac = t.total ? (t.total-t.remaining)/t.total : 0;
  return '<div class="timer-item" data-timerid="'+t.id+'">'+
    '<div class="timer-ring-sm"><svg viewBox="0 0 60 60"><circle class="tring-track" cx="30" cy="30" r="26"></circle><circle class="tring-sweep" style="stroke-dashoffset:'+(163.4*(1-frac))+';" cx="30" cy="30" r="26" stroke-dasharray="163.4"></circle></svg></div>'+
    '<div class="timer-item-main"><div class="ti-name">'+escapeHtml(t.name)+'</div><div class="ti-time">'+pad2(Math.floor(Math.max(0,t.remaining)/60))+':'+pad2(Math.max(0,t.remaining)%60)+'</div></div>'+
    '<div class="ti-actions">'+
      (t.running ? '<button type="button" class="mini-ctrl" data-pausetimer="'+t.id+'">Pause</button>' : '<button type="button" class="mini-ctrl" data-starttimer="'+t.id+'">'+(t.remaining<t.total?'Resume':'Start')+'</button>')+
      '<button type="button" class="mini-ctrl" data-deltimer="'+t.id+'">✕</button>'+
    '</div></div>';
}
function wireTimerButtons(){
  document.querySelectorAll('[data-starttimer]').forEach(function(btn){ btn.addEventListener('click', function(){ startTimerById(btn.dataset.starttimer); }); });
  document.querySelectorAll('[data-pausetimer]').forEach(function(btn){ btn.addEventListener('click', function(){ pauseTimerById(btn.dataset.pausetimer); }); });
  document.querySelectorAll('[data-deltimer]').forEach(function(btn){ btn.addEventListener('click', async function(){ timers = timers.filter(function(t){ return t.id!==btn.dataset.deltimer; }); await saveTimers(); renderTimersPanel(); }); });
}
function startTimerById(id){ const t = timers.find(function(x){ return x.id===id; }); if(t) t.running = true; renderTimersPanel(); }
function pauseTimerById(id){ const t = timers.find(function(x){ return x.id===id; }); if(t) t.running = false; saveTimers(); renderTimersPanel(); }
function openNewTimerModal(){
  const mount = document.getElementById('modal-mount');
  mount.innerHTML = '<div class="modal-overlay" id="timer-overlay"><div class="modal-sheet">'+
    '<h3>New timer</h3>'+
    '<div class="m-field"><label>Name</label><input type="text" id="nt-name" placeholder="e.g. Pasta"></div>'+
    '<div style="display:flex;gap:8px;"><div class="m-field" style="flex:1;"><label>Minutes</label><input type="number" id="nt-min" value="5" min="0"></div><div class="m-field" style="flex:1;"><label>Seconds</label><input type="number" id="nt-sec" value="0" min="0" max="59"></div></div>'+
    '<div class="modal-actions"><button type="button" class="m-cancel" id="nt-cancel">Cancel</button><button type="button" class="m-save" id="nt-save">Create</button></div>'+
  '</div></div>';
  document.getElementById('nt-cancel').addEventListener('click', function(){ mount.innerHTML=''; });
  document.getElementById('timer-overlay').addEventListener('click', function(e){ if(e.target.id==='timer-overlay') mount.innerHTML=''; });
  document.getElementById('nt-save').addEventListener('click', async function(){
    const name = document.getElementById('nt-name').value.trim() || 'Timer';
    const total = (parseInt(document.getElementById('nt-min').value,10)||0)*60 + (parseInt(document.getElementById('nt-sec').value,10)||0);
    if(total<=0) return;
    timers.push({ id:'timer-'+Date.now(), name:name, total:total, remaining:total, running:false });
    await saveTimers(); mount.innerHTML = ''; renderTimersPanel();
  });
}
function tickTimers(){
  let changed = false;
  timers.forEach(function(t){
    if(!t.running) return;
    t.remaining--; changed = true;
    if(t.remaining<=0){
      t.running = false; t.remaining = 0;
      notify('Timer done', t.name+' has finished.');
      logHistory('timer', t.name, 'Timer completed');
    }
  });
  if(changed){
    if(activeTab==='timers') renderTimersPanel();
    if(activeTab==='dashboard') tickDashboard();
  }
}

let focusGoalMinutes = 180;
let focusSessions = [];
let focusState = { running:false, mode:'work', remaining:0, total:0, workMin:25, breakMin:5, task:'' };
async function loadFocusData(){
  try{ const d = await profileDoc('focusGoal').get(); focusGoalMinutes = (d.exists && d.data().value) ? d.data().value : 180; }catch(e){ focusGoalMinutes = 180; }
  try{ const d = await profileDoc('focusSessions').get(); focusSessions = (d.exists && d.data().json) ? JSON.parse(d.data().json) : []; }catch(e){ focusSessions = []; }
}
async function saveFocusGoal(){ try{ await profileDoc('focusGoal').set({value: focusGoalMinutes}); }catch(e){} }
async function saveFocusSessions(){ try{ await profileDoc('focusSessions').set({json: JSON.stringify(focusSessions)}); }catch(e){} }
function todayFocusMinutes(){
  const today = new Date().toDateString();
  return focusSessions.filter(function(s){ return new Date(s.date).toDateString()===today; }).reduce(function(s,x){ return s+x.minutes; }, 0);
}
function todayFocusSessionCount(){
  const today = new Date().toDateString();
  return focusSessions.filter(function(s){ return new Date(s.date).toDateString()===today; }).length;
}
function renderFocusPanel(){
  const el = document.getElementById('panel-focus');
  const circumference = 2*Math.PI*54;
  const frac = focusState.total ? (focusState.total-focusState.remaining)/focusState.total : 0;
  el.innerHTML =
    '<div class="card focus-hero">'+
      '<div class="focus-ring-wrap"><svg viewBox="0 0 120 120">'+
        '<circle class="fring-track" cx="60" cy="60" r="54"></circle>'+
        '<circle class="fring-sweep" id="focus-ring" cx="60" cy="60" r="54" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+(circumference*(1-frac))+'"></circle>'+
      '</svg><div class="focus-center"><div class="focus-big-time" id="focus-time">'+pad2(Math.floor(focusState.remaining/60))+':'+pad2(focusState.remaining%60)+'</div>'+
      '<div class="focus-mode-label" id="focus-mode-label">'+(focusState.running?focusState.mode:'ready')+'</div></div></div>'+
      (!focusState.running ? '<input type="text" class="focus-task-input" id="focus-task-input" placeholder="What are you focusing on?" value="'+escapeHtml(focusState.task)+'">'+
      '<div class="focus-presets">'+[[25,5],[50,10],[15,5]].map(function(p){ return '<button type="button" class="focus-preset-btn '+(focusState.workMin===p[0]?'active':'')+'" data-workmin="'+p[0]+'" data-breakmin="'+p[1]+'">'+p[0]+' / '+p[1]+' min</button>'; }).join('')+'</div>' : '')+
      '<div class="control-row" id="focus-controls"></div>'+
      (!focusState.running ? '<div class="focus-goal-row">Daily goal <input type="number" id="focus-goal-input" value="'+focusGoalMinutes+'"> minutes</div>' : '')+
    '</div>';
  if(!focusState.running){
    el.querySelectorAll('[data-workmin]').forEach(function(btn){
      btn.addEventListener('click', function(){ focusState.workMin = parseInt(btn.dataset.workmin,10); focusState.breakMin = parseInt(btn.dataset.breakmin,10); renderFocusPanel(); });
    });
    document.getElementById('focus-goal-input').addEventListener('change', async function(e){ focusGoalMinutes = parseInt(e.target.value,10)||180; await saveFocusGoal(); });
    document.getElementById('focus-controls').innerHTML = '<button type="button" class="ctrl-btn primary" id="focus-start-btn">Start focusing</button>';
    document.getElementById('focus-start-btn').addEventListener('click', function(){
      focusState.task = document.getElementById('focus-task-input').value.trim();
      startFocusSession();
    });
  } else {
    document.getElementById('focus-controls').innerHTML = '<button type="button" class="ctrl-btn ghost" id="focus-pause-btn">'+(focusState.paused?'Resume':'Pause')+'</button><button type="button" class="ctrl-btn danger" id="focus-stop-btn">End session</button>';
    document.getElementById('focus-pause-btn').addEventListener('click', function(){ focusState.paused = !focusState.paused; renderFocusPanel(); });
    document.getElementById('focus-stop-btn').addEventListener('click', endFocusSession);
  }
}
function startFocusSession(){
  focusState.running = true; focusState.paused = false; focusState.mode = 'work';
  focusState.total = focusState.workMin*60; focusState.remaining = focusState.total;
  focusState._workedSeconds = 0;
  renderFocusPanel();
}
async function endFocusSession(){
  const minutes = Math.round((focusState._workedSeconds||0)/60);
  if(minutes>0){
    focusSessions.push({ date: new Date().toISOString(), minutes: minutes, task: focusState.task });
    await saveFocusSessions();
    logHistory('focus', focusState.task||'Focus session', minutes+' min');
  }
  focusState = { running:false, mode:'work', remaining:0, total:0, workMin:focusState.workMin, breakMin:focusState.breakMin, task:'' };
  renderFocusPanel();
  if(activeTab==='dashboard') renderDashboard();
}
function tickFocus(){
  if(!focusState.running || focusState.paused) return;
  focusState.remaining--;
  if(focusState.mode==='work') focusState._workedSeconds = (focusState._workedSeconds||0)+1;
  if(focusState.remaining<=0){
    if(focusState.mode==='work'){
      notify('Focus session done', 'Time for a '+focusState.breakMin+'-minute break.');
      focusState.mode = 'break'; focusState.total = focusState.breakMin*60; focusState.remaining = focusState.total;
    } else {
      notify('Break over', 'Ready for another focus session?');
      endFocusSession();
      return;
    }
  }
  if(activeTab==='focus'){
    const timeEl = document.getElementById('focus-time');
    if(timeEl) timeEl.textContent = pad2(Math.floor(Math.max(0,focusState.remaining)/60))+':'+pad2(Math.max(0,focusState.remaining)%60);
    const labelEl = document.getElementById('focus-mode-label');
    if(labelEl) labelEl.textContent = focusState.mode;
    const ring = document.getElementById('focus-ring');
    if(ring){ const c=2*Math.PI*54; const frac = focusState.total?(focusState.total-focusState.remaining)/focusState.total:0; ring.style.strokeDashoffset = c*(1-frac); }
  }
}

let swElapsedMs = 0, swRunning = false, swStartTs = 0, swInterval = null, swLaps = [];
function fmtStopwatch(ms){
  const totalCs = Math.floor(ms/10);
  const cs = totalCs%100, s = Math.floor(totalCs/100)%60, m = Math.floor(totalCs/6000);
  return pad2(m)+':'+pad2(s)+'.'+pad2(cs);
}
function renderStopwatchPanel(){
  const el = document.getElementById('panel-stopwatch');
  el.innerHTML = '<div class="card">'+
    '<div class="sw-display" id="sw-display">'+fmtStopwatch(swElapsedMs)+'</div>'+
    '<div class="control-row">'+
      (swRunning ? '<button type="button" class="ctrl-btn ghost" id="sw-lap">Lap</button><button type="button" class="ctrl-btn danger" id="sw-stop">Stop</button>' :
        (swElapsedMs>0 ? '<button type="button" class="ctrl-btn ghost" id="sw-reset">Reset</button><button type="button" class="ctrl-btn primary" id="sw-resume">Resume</button>' :
        '<button type="button" class="ctrl-btn primary" id="sw-start">Start</button>'))+
    '</div>'+
    (swLaps.length ? '<div style="margin-top:22px;">'+swLaps.slice().reverse().map(function(l,i){ return '<div class="lap-row"><span class="lap-num">Lap '+(swLaps.length-i)+'</span><span>'+fmtStopwatch(l)+'</span></div>'; }).join('')+'</div>' : '')+
  '</div>';
  if(document.getElementById('sw-start')) document.getElementById('sw-start').addEventListener('click', startStopwatch);
  if(document.getElementById('sw-resume')) document.getElementById('sw-resume').addEventListener('click', startStopwatch);
  if(document.getElementById('sw-stop')) document.getElementById('sw-stop').addEventListener('click', stopStopwatch);
  if(document.getElementById('sw-lap')) document.getElementById('sw-lap').addEventListener('click', function(){ swLaps.push(swElapsedMs); renderStopwatchPanel(); });
  if(document.getElementById('sw-reset')) document.getElementById('sw-reset').addEventListener('click', function(){ swElapsedMs=0; swLaps=[]; renderStopwatchPanel(); });
}
function startStopwatch(){
  swRunning = true; swStartTs = Date.now() - swElapsedMs; renderStopwatchPanel();
  clearInterval(swInterval);
  swInterval = setInterval(function(){
    if(!swRunning) return;
    swElapsedMs = Date.now() - swStartTs;
    const disp = document.getElementById('sw-display');
    if(disp) disp.textContent = fmtStopwatch(swElapsedMs);
  }, 30);
}
function stopStopwatch(){ swRunning = false; clearInterval(swInterval); renderStopwatchPanel(); }

let historyLog = [];
async function loadHistory(){
  try{ const d = await profileDoc('history').get(); historyLog = (d.exists && d.data().json) ? JSON.parse(d.data().json) : []; }catch(e){ historyLog = []; }
}
async function saveHistory(){ try{ await profileDoc('history').set({json: JSON.stringify(historyLog.slice(0,200))}); }catch(e){} }
function logHistory(type, title, meta){
  historyLog.unshift({ type:type, title:title, meta:meta, at: new Date().toISOString() });
  saveHistory();
}
const HIST_ICONS = {
  focus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>',
  timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2"></path></svg>',
  alarm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"></circle><path d="M5 3 2 6M19 3l3 3M12 9v4l2 2"></path></svg>'
};
function renderHistoryPanel(){
  const el = document.getElementById('panel-history');
  const totalFocusMin = focusSessions.reduce(function(s,x){ return s+x.minutes; }, 0);
  const timerCount = historyLog.filter(function(h){ return h.type==='timer'; }).length;
  const alarmCount = historyLog.filter(function(h){ return h.type==='alarm'; }).length;
  let html = '<div class="stat-row">'+
    '<div class="stat-cell"><div class="stat-num">'+totalFocusMin+'</div><div class="stat-label">focus min, total</div></div>'+
    '<div class="stat-cell"><div class="stat-num">'+timerCount+'</div><div class="stat-label">timers finished</div></div>'+
    '<div class="stat-cell"><div class="stat-num">'+alarmCount+'</div><div class="stat-label">alarms rung</div></div>'+
  '</div>';
  if(!historyLog.length){
    html += '<div class="card"><div class="empty-note">Nothing logged yet — finish a timer, focus session, or let an alarm ring.</div></div>';
  } else {
    const groups = {}; const order = [];
    historyLog.forEach(function(h){
      const day = new Date(h.at).toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
      if(!groups[day]){ groups[day]=[]; order.push(day); }
      groups[day].push(h);
    });
    html += '<div class="card">'+order.map(function(day){
      return '<div class="hist-day-group">'+day+'</div>'+groups[day].map(function(h){
        const time = new Date(h.at).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
        return '<div class="hist-row"><div class="hist-icon i-'+h.type+'">'+HIST_ICONS[h.type]+'</div>'+
          '<div class="hist-main"><div class="hist-title">'+escapeHtml(h.title)+'</div><div class="hist-meta">'+escapeHtml(h.meta)+' · '+time+'</div></div></div>';
      }).join('');
    }).join('')+'</div>';
  }
  el.innerHTML = html;
}

function startMainLoop(){
  setInterval(function(){
    if(activeTab==='dashboard') tickDashboard();
    if(activeTab==='world') tickWorldPanel();
    checkAlarms();
    tickTimers();
    tickFocus();
  }, 1000);
}

} // end firebase-available guard
</script>
