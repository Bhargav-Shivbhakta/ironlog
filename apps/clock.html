<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="../assets/app.css">
<style>
  /* Clock-specific extensions on top of the shared app.css design system —
     same light, accent-only theme as the Hub and every other rebuilt app. */
  body{background:var(--bg)}
  .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .ck-sidebar{background:var(--surface);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column}
  .ck-brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;padding:4px 6px 18px;color:var(--text)}
  .ck-brand-mark{width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}
  .back-link{color:var(--muted);text-decoration:none;font-size:12px;padding:0 6px;margin-bottom:16px;display:block}
  .nav{display:grid;gap:3px}
  .nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--muted);border-radius:10px;padding:10px 11px;text-align:left;font-size:13.5px;font-weight:500}
  .nav button svg{width:16px;height:16px;flex:none}
  .nav button.active,.nav button:hover{background:var(--accent-soft);color:var(--accent-ink)}
  .ck-sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
  .sf-status{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .sf-dot{width:6px;height:6px;border-radius:50%;background:var(--success,#3f8f5f)}
  .ck-main{padding:28px 34px 60px;max-width:1160px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:14px}
  .topbar h1{font-size:30px;margin:0;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
  .tb-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:600}
  .panel{display:none}.panel.active{display:block}
  .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
  @media(max-width:880px){.grid{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.ck-sidebar{display:none}.ck-main{padding:20px 16px 70px}}

  /* Hero time card, matching the reference's time-stage */
  .clock-hero-card{min-height:270px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,var(--surface),var(--surface-soft,#f2f1ea));border:1px solid var(--line);border-radius:var(--radius,18px);padding:24px;position:relative;overflow:hidden}
  .clock-hero-card:after{content:"";position:absolute;width:220px;height:220px;right:-80px;top:-90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%)}
  .clock-card-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;position:relative;z-index:1}
  .live-tag{display:flex;align-items:center;gap:7px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--success,#3f8f5f)}
  .big-time{font-size:clamp(58px,7.5vw,92px);letter-spacing:-.01em;line-height:.95;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);position:relative;z-index:1;display:flex;align-items:center;gap:2px}
  .big-time .colon{animation:colonBlink 2s steps(1) infinite;display:inline-block}
  .big-time small{font-size:.22em;color:var(--muted);margin-left:10px;font-weight:600;letter-spacing:0}
  .clock-date{font-size:13.5px;color:var(--muted);position:relative;z-index:1}
  @keyframes colonBlink{0%,49%{opacity:1}50%,100%{opacity:.22}}
  .sec-ring-wrap{width:28px;height:28px;position:relative;flex:none}
  .sec-ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
  .sec-ring-track,.sec-ring-sweep{fill:none}
  .sec-ring-track{stroke:var(--line)}
  .sec-ring-sweep{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .28s linear}
  .tring-sweep,.fring-sweep{transition:stroke-dashoffset .28s linear}

  /* Generic card, used throughout dashboard/alarms/timers/focus/world/history */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius,18px);padding:18px;margin-bottom:14px}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .card-title{font-weight:700;font-size:14.5px;color:var(--text)}
  .card-meta{font-size:11.5px;color:var(--muted)}
  .list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .list-row:last-child{border-bottom:0}
  .row-main{min-width:0}
  .row-title{font-size:13.5px;font-weight:600;color:var(--text)}
  .row-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .row-actions{display:flex;align-items:center;gap:10px;flex:none}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:3px}
  .icon-btn:hover{color:var(--danger,#a3402f)}
  .empty-note,.empty-row{color:var(--muted);font-style:italic;font-size:13px;padding:8px 2px}
  .add-btn{display:flex;align-items:center;gap:6px;justify-content:center;width:100%;border:1px dashed var(--line);background:transparent;color:var(--accent-ink);border-radius:12px;padding:10px;font-size:12.5px;font-weight:600;margin-top:6px}
  .add-btn:hover{background:var(--accent-soft)}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .stat-cell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
  .stat-num{font-size:20px;font-weight:700;color:var(--text)}
  .stat-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

  /* Alarms */
  .fb-time{font-size:29px;font-weight:700;letter-spacing:-.03em;color:var(--text);font-variant-numeric:tabular-nums}
  .fb-label{font-size:11px;color:var(--muted)}
  .toggle-sw{width:40px;height:23px;border:0;background:var(--line);border-radius:99px;padding:3px;display:flex;justify-content:flex-start;cursor:pointer}
  .toggle-sw:after{content:"";width:17px;height:17px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle-sw.active{background:var(--accent);justify-content:flex-end}
  .day-chip-row{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
  .day-chip{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer}
  .day-chip.active{background:var(--accent);color:#fff;border-color:transparent}
  .hour-toggle-row{display:flex;gap:6px}
  .hour-toggle{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:7px 12px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .hour-toggle.active{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}

  /* Timers */
  .timer-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
  .timer-item:last-child{border-bottom:0}
  .ti-name{font-weight:600;font-size:13.5px;color:var(--text)}
  .ti-time{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
  .ti-actions{display:flex;gap:6px}
  .mini-ctrl{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--text)}
  .timer-ring-sm,.tring-track,.tring-sweep,.fring-track,.fring-sweep{fill:none}
  .tring-track,.fring-track{stroke:var(--line)}
  .tring-sweep,.fring-sweep{stroke:var(--accent);stroke-linecap:round}

  /* Focus */
  .focus-hero{text-align:center;padding:20px 0}
  .focus-ring-wrap{position:relative;width:220px;height:220px;margin:0 auto 14px}
  .focus-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .focus-big-time{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
  .focus-mode-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
  .focus-presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .focus-preset-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--text)}
  .focus-preset-btn.active{background:var(--accent);color:#fff;border-color:transparent}
  .focus-task-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
  .focus-goal-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:10px}
  .focus-card-highlight{background:var(--accent-soft);border-color:transparent}
  .progress-track{height:7px;background:var(--line);border-radius:20px;overflow:hidden;margin:10px 0 4px}
  .progress-fill{height:100%;background:var(--accent);border-radius:20px}
  .progress-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .control-row{display:flex;gap:8px;justify-content:center;margin-top:14px}
  .ctrl-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 18px;font-size:13px;font-weight:600;color:var(--text)}
  .ctrl-btn.primary{background:var(--accent);color:#fff;border-color:transparent}
  .ctrl-btn.danger{background:transparent;color:var(--danger,#a3402f)}

  /* World clock */
  .world-mini-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .world-mini-item:last-child{border-bottom:0}
  .wm-city{font-weight:600;color:var(--text)}
  .wm-zone{font-size:11px;color:var(--muted)}
  .wm-time{font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}

  /* Stopwatch */
  .sw-display{font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;color:var(--text);margin:20px 0}
  .lap-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .lap-num{color:var(--muted)}

  /* History */
  .hist-day-group{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px}
  .hist-day-group:first-child{margin-top:0}
  .hist-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .hist-row:last-child{border-bottom:0}
  .hist-icon{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
  .hist-icon svg{width:15px;height:15px}
  .hist-main{flex:1;min-width:0}
  .hist-title{font-size:13px;font-weight:600;color:var(--text)}
  .hist-meta{font-size:11.5px;color:var(--muted);margin-top:1px}

  /* Fire streak box */
  .fire-box{background:var(--accent-soft);border-radius:14px;padding:14px;text-align:center;position:relative;overflow:hidden}
  .fire-overlay{position:relative;z-index:1}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(20,18,12,.42);display:flex;align-items:flex-end;justify-content:center;z-index:200}
  @media(min-width:640px){.modal-overlay{align-items:center}}
  .modal-sheet{background:var(--surface);border-radius:18px 18px 0 0;padding:22px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto}
  @media(min-width:640px){.modal-sheet{border-radius:18px}}
  .m-field{margin-bottom:12px}
  .m-field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
  .m-field input,.m-field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
  .modal-actions{display:flex;justify-content:flex-start;gap:8px;margin-top:16px}
  .m-cancel,.m-save{flex:1;border-radius:10px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer}
  .m-cancel{border:1px solid var(--line);background:var(--surface);color:var(--text)}
  .m-save{border:0;background:var(--accent);color:#fff}
  .stack{display:grid;gap:10px}

  /* Auth / profile gates (kept minimal, matching Hub's gate style) */
  .loading-gate,.auth-overlay,.profile-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:300}
  .auth-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:340px;text-align:center}
  .auth-box input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;font-size:14px}
  .auth-box button[type=submit]{width:100%;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:11px;font-weight:700;margin-top:4px}
  .auth-error{color:var(--danger,#a3402f);font-size:12.5px;min-height:14px;margin-top:8px}
  .auth-toggle{font-size:12.5px;color:var(--muted);margin-top:12px}
  .auth-toggle button{background:none;border:none;color:var(--accent-ink);font-weight:700;text-decoration:underline}
  .profile-grid{display:flex;gap:18px;justify-content:center;margin-top:16px}
  .profile-card{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
  .profile-avatar{width:64px;height:64px;border-radius:16px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:24px;font-weight:700}
  .profile-name{font-size:13px;font-weight:600;color:var(--muted)}

  /* Sidebar collapse */
  .shell{position:relative;transition:grid-template-columns .18s ease}
  .sidebar-collapse-btn{position:absolute;top:20px;right:-12px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;padding:0;z-index:5}
  .sidebar-collapse-btn svg{width:12px;height:12px;transition:transform .18s ease}
  .shell.sidebar-collapsed{grid-template-columns:64px 1fr}
  .shell.sidebar-collapsed .sidebar-collapse-btn svg{transform:rotate(180deg)}
  .shell.sidebar-collapsed .ck-brand .label,
  .shell.sidebar-collapsed .back-link .label,
  .shell.sidebar-collapsed .nav button .label,
  .shell.sidebar-collapsed .ck-sidebar-foot{display:none}
  .shell.sidebar-collapsed .ck-sidebar{padding-left:12px;padding-right:12px;overflow:visible}
  .shell.sidebar-collapsed .ck-brand{justify-content:center;padding-left:0;padding-right:0}
  .shell.sidebar-collapsed .back-link{text-align:center}
  .shell.sidebar-collapsed .nav button{justify-content:center;padding:10px}
  @media(max-width:880px){.sidebar-collapse-btn{display:none}}

  /* World map pinpoint */
  .modal-sheet.map-sheet{max-width:660px}
  .map-wrap{position:relative;border-radius:14px;overflow:hidden;background:#e7edf3;border:1px solid var(--line)}
  .map-wrap svg{width:100%;height:auto;display:block;cursor:crosshair}
  .map-land{fill:var(--surface-soft,#f2f1ea);stroke:var(--line);stroke-width:.6}
  .map-pin-dot{fill:var(--accent);stroke:#fff;stroke-width:2}
  .map-pin-pulse{fill:none;stroke:var(--accent);stroke-width:1.4;opacity:.55}
  .map-status{font-size:12.5px;color:var(--muted);margin:10px 0;min-height:18px}
  .map-status b{color:var(--text)}
  .map-loading{padding:60px 0;text-align:center;color:var(--muted);font-size:13px}
  .map-alt-btn{background:none;border:none;color:var(--accent-ink);font-size:12.5px;font-weight:600;text-decoration:underline;padding:0;margin-top:4px}
</style>
</head>
<body>

<div id="loading-gate" class="loading-gate">Loading…</div>

<div class="auth-overlay" id="auth-overlay" style="display:none;">
  <div class="auth-box">
    <h2>Clock</h2>
    <p id="auth-sub">Sign in to sync across devices.</p>
    <form id="auth-form">
      <input type="email" id="auth-email" placeholder="Email" required>
      <input type="password" id="auth-password" placeholder="Password" required>
      <button type="submit" id="auth-submit">Sign in</button>
    </form>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-toggle">New here? <button type="button" id="auth-toggle-btn">Create an account</button></div>
  </div>
</div>

<div class="profile-overlay" id="profile-overlay" style="display:none;">
  <div class="auth-box" style="max-width:340px;">
    <h2>Who's this?</h2>
    <p>&nbsp;</p>
    <div class="profile-grid">
      <div class="profile-card" data-pickprofile="Bhargav"><div class="profile-avatar">B</div><div class="profile-name">Bhargav</div></div>
      <div class="profile-card" data-pickprofile="Anusha"><div class="profile-avatar">A</div><div class="profile-name">Anusha</div></div>
    </div>
  </div>
</div>

<div id="app-wrap" style="display:none;">
  <div class="shell" id="app-shell">
    <aside class="ck-sidebar">
      <button type="button" class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="Collapse sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <div class="ck-brand"><span class="ck-brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16.5 14"></polyline></svg></span><span class="label">Clock</span></div>
      <a href="../index.html" class="back-link"><span class="label">← All apps</span></a>
      <nav class="nav" id="nav">
        <button data-tab="dashboard" class="active" title="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg><span class="label">Dashboard</span></button>
        <button data-tab="alarms" title="Alarms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M5 3 2 6M22 6l-3-3M12 9v4l2 2"></path></svg><span class="label">Alarms</span></button>
        <button data-tab="timers" title="Timers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="2" x2="14" y2="2"></line><line x1="12" y1="14" x2="15" y2="11"></line><circle cx="12" cy="14" r="8"></circle></svg><span class="label">Timers</span></button>
        <button data-tab="focus" title="Focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="1"></circle></svg><span class="label">Focus</span></button>
        <button data-tab="world" title="World time"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"></path></svg><span class="label">World time</span></button>
        <button data-tab="stopwatch" title="Stopwatch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="2" x2="14" y2="2"></line><line x1="12" y1="14" x2="15" y2="11"></line><circle cx="12" cy="14" r="8"></circle></svg><span class="label">Stopwatch</span></button>
        <button data-tab="history" title="History"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg><span class="label">History</span></button>
      </nav>
      <div class="ck-sidebar-foot">
        <div class="sf-status"><span class="sf-dot"></span>Synced</div>
        <span id="who-label"></span> · <button type="button" id="switch-profile-btn" style="background:none;border:none;color:var(--accent);font-size:11px;font-weight:700;padding:0;text-decoration:underline;"></button>
      </div>
    </aside>

    <main class="ck-main">
      <div class="topbar">
        <div><h1 id="greeting-title">Hello</h1><div class="sub" id="greeting-sub">Your time, clearly organized.</div></div>
        <div class="topbar-actions">
          <button type="button" class="tb-btn" id="notif-btn" style="display:none;">Enable notifications</button>
        </div>
      </div>

      <div class="panel active" id="panel-dashboard"></div>
      <div class="panel" id="panel-alarms"></div>
      <div class="panel" id="panel-timers"></div>

let audioCtx = null;
// Browsers block audio from ever starting until the page has registered a
// real click/tap — a background timer (which is how an alarm actually
// fires) doesn't count. This grabs the very first interaction anywhere in
// the app to create and unlock the AudioContext ahead of time, so it's
// actually ready by the time an alarm needs it.
function unlockAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
document.addEventListener('click', unlockAudio, {once:false});
document.addEventListener('touchstart', unlockAudio, {once:false});
function playChimeOnce(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    [880, 1108].forEach(function(freq, i){
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      const start = audioCtx.currentTime + i*0.22;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.28, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.5);
      osc.start(start); osc.stop(start+0.55);
    });
  }catch(e){}
}
// A single short chime is easy to miss for something meant to wake you up
// or flag a finished timer — a real alarm keeps ringing until you deal
// with it, so this repeats the chime until dismissed or stopped.
let chimeLoopInterval = null;
function playChime(){ playChimeOnce(); }
function startRingingLoop(){
  stopRingingLoop();
  playChimeOnce();
  chimeLoopInterval = setInterval(playChimeOnce, 1400);
}
function stopRingingLoop(){ clearInterval(chimeLoopInterval); chimeLoopInterval = null; }

function nextUpcomingAlarm(){
  const onAlarms = alarms.filter(function(a){ return a.on; });
  if(!onAlarms.length) return null;
  const now = new Date();
  let best = null, bestDiff = Infinity;
  onAlarms.forEach(function(a){
    const parts = a.time.split(':'); const hh = parseInt(parts[0],10), mm = parseInt(parts[1],10);
    for(let addDays=0; addDays<8; addDays++){
      const cand = new Date(now); cand.setDate(now.getDate()+addDays); cand.setHours(hh,mm,0,0);
      if(cand<=now) continue;
      if(a.days && a.days.length && a.days.indexOf(cand.getDay())===-1) continue;
      const diff = cand-now;
      if(diff<bestDiff){ bestDiff=diff; best={a:a, cand:cand}; }
      break;
    }
  });
  if(!best) return null;
  const parts = best.a.time.split(':'); const hh = parseInt(parts[0],10), mm = parseInt(parts[1],10);
  const ampm = hh>=12?'PM':'AM'; const h12 = hh%12===0?12:hh%12;
  const hrs = Math.floor(bestDiff/3600000), mins = Math.round((bestDiff%3600000)/60000);
  return { h12:h12, mm:mm, ampm:ampm, label:best.a.label, rel:'in '+hrs+'h '+mins+'m' };
}

function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371, toRad=Math.PI/180;
  const dLat=(lat2-lat1)*toRad, dLon=(lon2-lon1)*toRad;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*toRad)*Math.cos(lat2*toRad)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.sqrt(a));
}
function nearestTzFromLatLon(lat,lon){
  let best=null, bestD=Infinity;
  TZ_COORDS.forEach(function(e){
    const d = haversineKm(lat,lon,e[1],e[2]);
    if(d<bestD){ bestD=d; best=e; }
  });
  return best; // [tz, lat, lon]
}
function tzFriendlyLabel(tz){
  const parts = tz.split('/'); return (parts[parts.length-1]||tz).replace(/_/g,' ');
}

// Map libs + land outline are loaded lazily, only the first time someone
// opens the map picker, and cached after that.
let mapLibsPromise = null;
function loadMapLibs(){
  if(mapLibsPromise) return mapLibsPromise;
  mapLibsPromise = (function(){
    function loadScript(src){
      return new Promise(function(res, rej){
        if(document.querySelector('script[data-mapsrc="'+src+'"]')){ res(); return; }
        const s = document.createElement('script');
        s.src = src; s.dataset.mapsrc = src;
        s.onload = function(){ res(); }; s.onerror = function(){ rej(new Error('load fail: '+src)); };
        document.head.appendChild(s);
      });
    }
    return loadScript('https://cdn.jsdelivr.net/npm/d3-geo@3/dist/d3-geo.min.js')
      .then(function(){ return loadScript('https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js'); })
      .then(function(){ return fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json').then(function(r){ return r.json(); }); })
      .then(function(landTopo){ return topojson.feature(landTopo, landTopo.objects.land); });
  })();
  return mapLibsPromise;
}
function openMapPickerModal(existingCity){
  const mount = document.getElementById('modal-mount');

  document.getElementById('map-cancel').addEventListener('click', function(){ mount.innerHTML=''; });

  const saveBtn = document.getElementById('map-save');
  saveBtn.addEventListener('click', async function(){
    if(!picked.tz) return;
    const label = labelInput.value.trim() || tzFriendlyLabel(picked.tz);
    if(existingCity){
      const idx = worldCities.findIndex(function(c){ return c.id===existingCity.id; });
      if(idx!==-1) worldCities[idx] = { id:existingCity.id, label:label, tz:picked.tz, lat:picked.lat, lon:picked.lon };
    } else {
      worldCities.push({ id:'city-'+Date.now(), label:label, tz:picked.tz, lat:picked.lat, lon:picked.lon });
    }
    await saveWorldCities(); mount.innerHTML=''; renderWorldPanel(); if(activeTab==='dashboard') renderDashboard();
  });
  loadMapLibs().then(function(landGeo){
    const wrap = document.getElementById('map-wrap');
    if(!wrap) return; // modal closed before load finished
    const W = 620, H = 320;
    const projection = d3.geoEquirectangular().fitSize([W,H], landGeo);
    const path = d3.geoPath(projection);
    let dAttr = '';
    landGeo.features.forEach(function(f){ dAttr += path(f)||''; });
    wrap.innerHTML = '<svg id="tz-map-svg" viewBox="0 0 '+W+' '+H+'">'+
      '<rect width="'+W+'" height="'+H+'" fill="#e7edf3"></rect>'+
      '<path class="map-land" d="'+dAttr+'"></path>'+
      '<circle class="map-pin-pulse" id="map-pin-pulse" r="9" cx="-99" cy="-99" style="display:none"></circle>'+
      '<circle class="map-pin-dot" id="map-pin-dot" r="5" cx="-99" cy="-99" style="display:none"></circle>'+
    '</svg>';
    const svg = document.getElementById('tz-map-svg');
    function placePin(x,y){
      ['map-pin-dot','map-pin-pulse'].forEach(function(id){ const el=document.getElementById(id); el.setAttribute('cx',x); el.setAttribute('cy',y); el.style.display=''; });
    }
    function handleClick(evt){
      const rect = svg.getBoundingClientRect();
      const px = ((evt.clientX-rect.left)/rect.width)*W;
      const py = ((evt.clientY-rect.top)/rect.height)*H;
      const inv = projection.invert([px,py]);
      if(!inv) return;
      const lon = inv[0], lat = inv[1];
      if(lat<-90||lat>90||lon<-180||lon>180) return;
      const nearest = nearestTzFromLatLon(lat,lon);
      picked.lat = Math.round(lat*100)/100; picked.lon = Math.round(lon*100)/100; picked.tz = nearest[0];
      placePin(px,py);
      document.getElementById('map-status').innerHTML = '<b>'+escapeHtml(tzFriendlyLabel(nearest[0]))+'</b> · '+escapeHtml(nearest[0]);
      if(!labelTouched) labelInput.value = tzFriendlyLabel(nearest[0]);
      saveBtn.removeAttribute('disabled');
    }
    svg.addEventListener('click', handleClick);
    if(picked.lat!=null){
      const [px,py] = projection([picked.lon,picked.lat]);
      placePin(px,py);
    }
  }).catch(function(){
    const wrap = document.getElementById('map-wrap');
    if(wrap) wrap.innerHTML = '<div class="map-loading">Couldn\'t load the map — check your connection.<br><button type="button" class="map-alt-btn" id="map-fallback-search">Use search instead</button></div>';
    const fb = document.getElementById('map-fallback-search');
    if(fb) fb.addEventListener('click', function(){ mount.innerHTML=''; openAddCityModal(); });
  });
}

    hourStr = now.toLocaleTimeString('en-US', {timeZone:c.tz, hour:'2-digit', minute:'2-digit', hour12:true});
    const localDay = now.getDate(); const cityDay = parseInt(now.toLocaleDateString('en-US', {timeZone:c.tz, day:'numeric'}),10);
    const offsetMin = Math.round((new Date(now.toLocaleString('en-US',{timeZone:c.tz})) - new Date(now.toLocaleString('en-US',{timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone})))/60000);
    const sign = offsetMin>=0?'+':'';
    const oh = Math.floor(Math.abs(offsetMin)/60), om = Math.abs(offsetMin)%60;
    dateRel = (cityDay!==localDay ? (cityDay>localDay || (localDay>=28&&cityDay<=3) ? 'Tomorrow · ' : 'Yesterday · ') : '') + sign+oh+'h'+(om?' '+om+'m':'');
  }catch(e){ return; }
  ['wm-time-','wc-time-'].forEach(function(pfx){ const el=document.getElementById(pfx+c.id); if(el) el.textContent = hourStr; });
  ['wm-zone-','wc-zone-'].forEach(function(pfx){ const el=document.getElementById(pfx+c.id); if(el) el.textContent = dateRel; });

function checkAlarms(){
  const now = new Date();
  const hhmm = pad2(now.getHours())+':'+pad2(now.getMinutes());
  const dow = now.getDay(); const todayKey = now.toDateString();
  alarms.forEach(function(a){
    if(!a.on) return;
    if(a.days && a.days.length && a.days.indexOf(dow)===-1) return;
    if(a.time !== hhmm) return;
    const fireKey = a.id+':'+todayKey+':'+hhmm;
    if(firedToday[fireKey]) return;
    firedToday[fireKey] = true;
    fireAlarm(a);
  });
}

    '<div class="ti-actions">'+
      (t.running ? '<button type="button" class="mini-ctrl" data-pausetimer="'+t.id+'">Pause</button>' : '<button type="button" class="mini-ctrl" data-starttimer="'+t.id+'">'+(t.remaining<t.total?'Resume':'Start')+'</button>')+
      '<button type="button" class="mini-ctrl" data-deltimer="'+t.id+'">✕</button>'+
    '</div></div>';
}
function wireTimerButtons(){
  document.querySelectorAll('[data-starttimer]').forEach(function(btn){ btn.addEventListener('click', function(){ startTimerById(btn.dataset.starttimer); }); });
  document.querySelectorAll('[data-pausetimer]').forEach(function(btn){ btn.addEventListener('click', function(){ pauseTimerById(btn.dataset.pausetimer); }); });
  document.querySelectorAll('[data-deltimer]').forEach(function(btn){ btn.addEventListener('click', async function(){ timers = timers.filter(function(t){ return t.id!==btn.dataset.deltimer; }); await saveTimers(); renderTimersPanel(); }); });
}
function startTimerById(id){ const t = timers.find(function(x){ return x.id===id; }); if(t) t.running = true; renderTimersPanel(); }
function pauseTimerById(id){ const t = timers.find(function(x){ return x.id===id; }); if(t) t.running = false; saveTimers(); renderTimersPanel(); }
function openNewTimerModal(){
  const mount = document.getElementById('modal-mount');
  mount.innerHTML = '<div class="modal-overlay" id="timer-overlay"><div class="modal-sheet">'+
    '<h3>New timer</h3>'+
    '<div class="m-field"><label>Name</label><input type="text" id="nt-name" placeholder="e.g. Pasta"></div>'+
    '<div style="display:flex;gap:8px;"><div class="m-field" style="flex:1;"><label>Minutes</label><input type="number" id="nt-min" value="5" min="0"></div><div class="m-field" style="flex:1;"><label>Seconds</label><input type="number" id="nt-sec" value="0" min="0" max="59"></div></div>'+
    '<div class="modal-actions"><button type="button" class="m-cancel" id="nt-cancel">Cancel</button><button type="button" class="m-save" id="nt-save">Create</button></div>'+
  '</div></div>';
  document.getElementById('nt-cancel').addEventListener('click', function(){ mount.innerHTML=''; });
  document.getElementById('timer-overlay').addEventListener('click', function(e){ if(e.target.id==='timer-overlay') mount.innerHTML=''; });
  document.getElementById('nt-save').addEventListener('click', async function(){
    const name = document.getElementById('nt-name').value.trim() || 'Timer';
    const total = (parseInt(document.getElementById('nt-min').value,10)||0)*60 + (parseInt(document.getElementById('nt-sec').value,10)||0);
    if(total<=0) return;
    timers.push({ id:'timer-'+Date.now(), name:name, total:total, remaining:total, running:false });
    await saveTimers(); mount.innerHTML = ''; renderTimersPanel();
  });
}
function tickTimers(){
  let changed = false;
  timers.forEach(function(t){
    if(!t.running) return;
    t.remaining--; changed = true;
    if(t.remaining<=0){
      t.running = false; t.remaining = 0;
      notify('Timer done', t.name+' has finished.');
      logHistory('timer', t.name, 'Timer completed');
    }
  });
  if(changed){
    if(activeTab==='timers') renderTimersPanel();
    if(activeTab==='dashboard') tickDashboard();
  }
}

let focusGoalMinutes = 180;
let focusSessions = [];
let focusState = { running:false, mode:'work', remaining:0, total:0, workMin:25, breakMin:5, task:'' };
async function loadFocusData(){
  try{ const d = await profileDoc('focusGoal').get(); focusGoalMinutes = (d.exists && d.data().value) ? d.data().value : 180; }catch(e){ focusGoalMinutes = 180; }
  try{ const d = await profileDoc('focusSessions').get(); focusSessions = (d.exists && d.data().json) ? JSON.parse(d.data().json) : []; }catch(e){ focusSessions = []; }
}
async function saveFocusGoal(){ try{ await profileDoc('focusGoal').set({value: focusGoalMinutes}); }catch(e){} }
async function saveFocusSessions(){ try{ await profileDoc('focusSessions').set({json: JSON.stringify(focusSessions)}); }catch(e){} }
function todayFocusMinutes(){
  const today = new Date().toDateString();
  return focusSessions.filter(function(s){ return new Date(s.date).toDateString()===today; }).reduce(function(s,x){ return s+x.minutes; }, 0);
}
function todayFocusSessionCount(){
  const today = new Date().toDateString();
  return focusSessions.filter(function(s){ return new Date(s.date).toDateString()===today; }).length;
}
function renderFocusPanel(){
  const el = document.getElementById('panel-focus');
  const circumference = 2*Math.PI*54;
  const frac = focusState.total ? (focusState.total-focusState.remaining)/focusState.total : 0;
  el.innerHTML =
    '<div class="card focus-hero">'+
      '<div class="focus-ring-wrap"><svg viewBox="0 0 120 120">'+
        '<circle class="fring-track" cx="60" cy="60" r="54"></circle>'+
        '<circle class="fring-sweep" id="focus-ring" cx="60" cy="60" r="54" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+(circumference*(1-frac))+'"></circle>'+
      '</svg><div class="focus-center"><div class="focus-big-time" id="focus-time">'+pad2(Math.floor(focusState.remaining/60))+':'+pad2(focusState.remaining%60)+'</div>'+
      '<div class="focus-mode-label" id="focus-mode-label">'+(focusState.running?focusState.mode:'ready')+'</div></div></div>'+
      (!focusState.running ? '<input type="text" class="focus-task-input" id="focus-task-input" placeholder="What are you focusing on?" value="'+escapeHtml(focusState.task)+'">'+
      '<div class="focus-presets">'+[[25,5],[50,10],[15,5]].map(function(p){ return '<button type="button" class="focus-preset-btn '+(focusState.workMin===p[0]?'active':'')+'" data-workmin="'+p[0]+'" data-breakmin="'+p[1]+'">'+p[0]+' / '+p[1]+' min</button>'; }).join('')+'</div>' : '')+
      '<div class="control-row" id="focus-controls"></div>'+
      (!focusState.running ? '<div class="focus-goal-row">Daily goal <input type="number" id="focus-goal-input" value="'+focusGoalMinutes+'"> minutes</div>' : '')+
    '</div>';
  if(!focusState.running){
    el.querySelectorAll('[data-workmin]').forEach(function(btn){
      btn.addEventListener('click', function(){ focusState.workMin = parseInt(btn.dataset.workmin,10); focusState.breakMin = parseInt(btn.dataset.breakmin,10); renderFocusPanel(); });
    });
    document.getElementById('focus-goal-input').addEventListener('change', async function(e){ focusGoalMinutes = parseInt(e.target.value,10)||180; await saveFocusGoal(); });
    document.getElementById('focus-controls').innerHTML = '<button type="button" class="ctrl-btn primary" id="focus-start-btn">Start focusing</button>';
    document.getElementById('focus-start-btn').addEventListener('click', function(){
      focusState.task = document.getElementById('focus-task-input').value.trim();
      startFocusSession();
    });
  } else {
    document.getElementById('focus-controls').innerHTML = '<button type="button" class="ctrl-btn ghost" id="focus-pause-btn">'+(focusState.paused?'Resume':'Pause')+'</button><button type="button" class="ctrl-btn danger" id="focus-stop-btn">End session</button>';
    document.getElementById('focus-pause-btn').addEventListener('click', function(){ focusState.paused = !focusState.paused; renderFocusPanel(); });
    document.getElementById('focus-stop-btn').addEventListener('click', endFocusSession);
  }
}
function startFocusSession(){
  focusState.running = true; focusState.paused = false; focusState.mode = 'work';
  focusState.total = focusState.workMin*60; focusState.remaining = focusState.total;
  focusState._workedSeconds = 0;
  renderFocusPanel();
}
async function endFocusSession(){
  const minutes = Math.round((focusState._workedSeconds||0)/60);
  if(minutes>0){
    focusSessions.push({ date: new Date().toISOString(), minutes: minutes, task: focusState.task });
    await saveFocusSessions();
    logHistory('focus', focusState.task||'Focus session', minutes+' min');
  }
  focusState = { running:false, mode:'work', remaining:0, total:0, workMin:focusState.workMin, breakMin:focusState.breakMin, task:'' };
  renderFocusPanel();
  if(activeTab==='dashboard') renderDashboard();
}
function tickFocus(){
  if(!focusState.running || focusState.paused) return;
  focusState.remaining--;
  if(focusState.mode==='work') focusState._workedSeconds = (focusState._workedSeconds||0)+1;
  if(focusState.remaining<=0){
    if(focusState.mode==='work'){
      notify('Focus session done', 'Time for a '+focusState.breakMin+'-minute break.');
      focusState.mode = 'break'; focusState.total = focusState.breakMin*60; focusState.remaining = focusState.total;
    } else {
      notify('Break over', 'Ready for another focus session?');
      endFocusSession();
      return;
    }
  }
  if(activeTab==='focus'){
    const timeEl = document.getElementById('focus-time');
    if(timeEl) timeEl.textContent = pad2(Math.floor(Math.max(0,focusState.remaining)/60))+':'+pad2(Math.max(0,focusState.remaining)%60);
    const labelEl = document.getElementById('focus-mode-label');
    if(labelEl) labelEl.textContent = focusState.mode;
    const ring = document.getElementById('focus-ring');
    if(ring){ const c=2*Math.PI*54; const frac = focusState.total?(focusState.total-focusState.remaining)/focusState.total:0; ring.style.strokeDashoffset = c*(1-frac); }
  }
}

let swElapsedMs = 0, swRunning = false, swStartTs = 0, swInterval = null, swLaps = [];
function fmtStopwatch(ms){
  const totalCs = Math.floor(ms/10);
  const cs = totalCs%100, s = Math.floor(totalCs/100)%60, m = Math.floor(totalCs/6000);
  return pad2(m)+':'+pad2(s)+'.'+pad2(cs);
}
function renderStopwatchPanel(){
  const el = document.getElementById('panel-stopwatch');
  el.innerHTML = '<div class="card">'+
    '<div class="sw-display" id="sw-display">'+fmtStopwatch(swElapsedMs)+'</div>'+
    '<div class="control-row">'+
      (swRunning ? '<button type="button" class="ctrl-btn ghost" id="sw-lap">Lap</button><button type="button" class="ctrl-btn danger" id="sw-stop">Stop</button>' :
        (swElapsedMs>0 ? '<button type="button" class="ctrl-btn ghost" id="sw-reset">Reset</button><button type="button" class="ctrl-btn primary" id="sw-resume">Resume</button>' :
        '<button type="button" class="ctrl-btn primary" id="sw-start">Start</button>'))+
    '</div>'+
    (swLaps.length ? '<div style="margin-top:22px;">'+swLaps.slice().reverse().map(function(l,i){ return '<div class="lap-row"><span class="lap-num">Lap '+(swLaps.length-i)+'</span><span>'+fmtStopwatch(l)+'</span></div>'; }).join('')+'</div>' : '')+
  '</div>';
  if(document.getElementById('sw-start')) document.getElementById('sw-start').addEventListener('click', startStopwatch);
  if(document.getElementById('sw-resume')) document.getElementById('sw-resume').addEventListener('click', startStopwatch);
  if(document.getElementById('sw-stop')) document.getElementById('sw-stop').addEventListener('click', stopStopwatch);
  if(document.getElementById('sw-lap')) document.getElementById('sw-lap').addEventListener('click', function(){ swLaps.push(swElapsedMs); renderStopwatchPanel(); });
  if(document.getElementById('sw-reset')) document.getElementById('sw-reset').addEventListener('click', function(){ swElapsedMs=0; swLaps=[]; renderStopwatchPanel(); });
}
function startStopwatch(){
  swRunning = true; swStartTs = Date.now() - swElapsedMs; renderStopwatchPanel();
  clearInterval(swInterval);
  swInterval = setInterval(function(){
    if(!swRunning) return;
    swElapsedMs = Date.now() - swStartTs;
    const disp = document.getElementById('sw-display');
    if(disp) disp.textContent = fmtStopwatch(swElapsedMs);
  }, 30);
}
function stopStopwatch(){ swRunning = false; clearInterval(swInterval); renderStopwatchPanel(); }

let historyLog = [];
async function loadHistory(){
  try{ const d = await profileDoc('history').get(); historyLog = (d.exists && d.data().json) ? JSON.parse(d.data().json) : []; }catch(e){ historyLog = []; }
}
async function saveHistory(){ try{ await profileDoc('history').set({json: JSON.stringify(historyLog.slice(0,200))}); }catch(e){} }
function logHistory(type, title, meta){
  historyLog.unshift({ type:type, title:title, meta:meta, at: new Date().toISOString() });
  saveHistory();
}
const HIST_ICONS = {
  focus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>',
  timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2"></path></svg>',
  alarm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"></circle><path d="M5 3 2 6M19 3l3 3M12 9v4l2 2"></path></svg>'
};
function renderHistoryPanel(){
  const el = document.getElementById('panel-history');
  const totalFocusMin = focusSessions.reduce(function(s,x){ return s+x.minutes; }, 0);
  const timerCount = historyLog.filter(function(h){ return h.type==='timer'; }).length;
  const alarmCount = historyLog.filter(function(h){ return h.type==='alarm'; }).length;
  let html = '<div class="stat-row">'+
    '<div class="stat-cell"><div class="stat-num">'+totalFocusMin+'</div><div class="stat-label">focus min, total</div></div>'+
    '<div class="stat-cell"><div class="stat-num">'+timerCount+'</div><div class="stat-label">timers finished</div></div>'+
    '<div class="stat-cell"><div class="stat-num">'+alarmCount+'</div><div class="stat-label">alarms rung</div></div>'+
  '</div>';
  if(!historyLog.length){
    html += '<div class="card"><div class="empty-note">Nothing logged yet — finish a timer, focus session, or let an alarm ring.</div></div>';
  } else {
    const groups = {}; const order = [];
    historyLog.forEach(function(h){
      const day = new Date(h.at).toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
      if(!groups[day]){ groups[day]=[]; order.push(day); }
      groups[day].push(h);
    });
    html += '<div class="card"><div class="card-head"><div class="card-title">Recent activity</div><button type="button" class="icon-btn" id="clear-history-btn" style="font-size:11.5px;font-weight:600;">Clear all</button></div>'+order.map(function(day){
      return '<div class="hist-day-group">'+day+'</div>'+groups[day].map(function(h){
        const time = new Date(h.at).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
        return '<div class="hist-row"><div class="hist-icon i-'+h.type+'">'+HIST_ICONS[h.type]+'</div>'+
          '<div class="hist-main"><div class="hist-title">'+escapeHtml(h.title)+'</div><div class="hist-meta">'+escapeHtml(h.meta)+' · '+time+'</div></div>'+
          '<button type="button" class="icon-btn" data-delhist="'+escapeHtml(h.at)+'" title="Delete this entry">✕</button></div>';
      }).join('');
    }).join('')+'</div>';
  }
  el.innerHTML = html;
  const clearBtn = document.getElementById('clear-history-btn');
  if(clearBtn) clearBtn.addEventListener('click', async function(){
    if(!confirm('Delete all history? This can\'t be undone.')) return;
    historyLog = []; await saveHistory(); renderHistoryPanel();
  });
  el.querySelectorAll('[data-delhist]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      historyLog = historyLog.filter(function(h){ return h.at !== btn.dataset.delhist; });
      await saveHistory(); renderHistoryPanel();
    });
  });
}

// enterProfile() runs every time someone switches profile (or re-enters
// one), and used to call this unconditionally — each call registered a
// brand-new setInterval without ever clearing the last one. Every switch
// stacked one more 1-second ticker on top, so timers/focus/the dashboard
// clock would silently speed up (2x, 3x…) the more you switched profiles
// in one session. Clearing the previous interval first keeps exactly one
// ticker alive at all times.
let mainLoopInterval = null;
function startMainLoop(){
  if(mainLoopInterval) clearInterval(mainLoopInterval);
  mainLoopInterval = setInterval(function(){
    if(activeTab==='dashboard') tickDashboard();
    if(activeTab==='world') tickWorldPanel();
    checkAlarms();
    tickTimers();
    tickFocus();
  }, 1000);
}
function wireSidebarCollapse(){
  const shell = document.getElementById('app-shell');
  const btn = document.getElementById('sidebar-collapse-btn');
  if(!shell || !btn || btn.dataset.wired) return;
  btn.dataset.wired = '1';
  let collapsed = false;
  try{ collapsed = localStorage.getItem('clock-sidebar-collapsed')==='1'; }catch(e){}
  if(collapsed){ shell.classList.add('sidebar-collapsed'); btn.title = 'Expand sidebar'; }
  btn.addEventListener('click', function(){
    collapsed = !collapsed;
    shell.classList.toggle('sidebar-collapsed', collapsed);
    btn.title = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
    try{ localStorage.setItem('clock-sidebar-collapsed', collapsed?'1':'0'); }catch(e){}
  });
}

} // end firebase-available guard
