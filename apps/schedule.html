<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  /* These match the Hub shell's own tokens exactly (assets/app.css's
     :root), same as the Calendar/Todo restyle — Schedule was previously
     running its own unrelated dark-green palette (#1F3B32 etc.). The
     per-category routine colors (sleep/fitness/code/meal/…) stay
     distinct on purpose, same reasoning as Calendar's per-source event
     colors — only the page chrome changes here. */
  :root{
    --bg:#F4F4F0; --surface:#FFFFFF; --surface-alt:#F2F0E9;
    --border:#E3E3DC; --border-soft:#ECECE6;
    --text:#20211E; --text-soft:#74766F; --text-faint:#9C9E97;
    --accent:#AD7B20; --accent-soft:#F7EFD9; --accent-deep:#6F4A08;
    --gold:#6F4A08; --gold-soft:#F7EFD9;
    --danger:#B8493F; --danger-soft:#FAECEA;
    --radius-lg:16px; --radius-md:11px; --radius-sm:8px;
    --shadow:0 18px 50px rgba(37,38,32,.08);
  }
  /* Same accent swap the Hub shell itself uses for Anusha's profile. */
  body[data-profile="anusha"]{--accent:#B25C78;--accent-soft:#FAEAF0;--accent-deep:#813B53;--gold:#813B53;--gold-soft:#FAEAF0;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:14px 12px 60px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1040px;margin:0 auto;}
  h1,h2,h3{font-family:'Manrope',sans-serif;}
  button,input,select{font-family:inherit;}
  a{color:var(--accent);}

  .auth-overlay,.profile-overlay{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-box{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px 24px;text-align:center;box-shadow:var(--shadow);}
  .auth-box h2{font-size:21px;margin:0 0 4px;}
  .auth-box p{color:var(--text-soft);font-size:15px;margin:0 0 16px;}
  .auth-box input{width:100%;font-size:15.5px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px;}
  .auth-box button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:9px;font-size:15.5px;font-weight:700;cursor:pointer;}
  .auth-toggle{margin-top:10px;font-size:14px;color:var(--text-soft);}
  .auth-toggle button{background:none;color:var(--gold);text-decoration:underline;font-weight:600;width:auto;padding:0 0 0 4px;}
  .auth-error{color:var(--danger);font-size:14px;min-height:14px;margin-bottom:6px;}

  .profile-inner{text-align:center;}
  .profile-inner h1{font-size:24px;margin:0 0 30px;}
  .profile-row{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;}
  .profile-card{background:none;border:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;}
  .profile-avatar{width:92px;height:92px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff;border:3px solid transparent;font-family:'Manrope',sans-serif;}
  .profile-card:hover .profile-avatar{border-color:var(--accent);}
  .av-b{background:linear-gradient(135deg,#AD7B20,#C9A227);}
  .av-a{background:linear-gradient(135deg,#B25C78,#D68CA4);}
  .profile-name{font-size:16px;font-weight:600;color:var(--text-soft);}

  .topbar{margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .topbar a.back,.topbar button.switch{font-size:14px;color:var(--text-soft);text-decoration:none;background:none;border:none;cursor:pointer;padding:0;}
  /* Hidden when embedded in the Hub's app viewer — its own "Back to Hub"
     button already handles this safely; this in-page link, if clicked
     inside the iframe, would load a second copy of the whole Hub inside
     itself instead (the nested-Home-Hub bug). */
  body.embedded .topbar a.back{display:none}

  /* Hidden entirely when embedded in the Hub's app viewer — the Hub's own
     top bar already shows the profile capsule there (see app-frame-
     profile in index.html/app.js), same pattern as Todo. Standalone
     (opened in its own tab), it's the only copy, doubling as the click
     -to-switch-profile control. */
  body.embedded header.app-head{display:none}
  header.app-head{text-align:center;margin-bottom:12px;}
  header.app-head .who-badge{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 12px 3px 4px;margin-bottom:6px;cursor:pointer;font-family:inherit;}
  header.app-head .who-badge:hover{background:var(--accent-soft);}
  header.app-head .who-avatar{width:20px;height:20px;border-radius:6px;font-size:12.5px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;}
  header.app-head .who-avatar.av-b{background:#AD7B20;}
  header.app-head .who-avatar.av-a{background:#B25C78;}
  header.app-head .who-name{font-size:14px;font-weight:700;}
  header.app-head h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-0.01em;}

  .schedule-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
  .schedule-toolbar .search-bar{flex:1;min-width:220px;margin-bottom:0;}
  .segmented{flex:none;max-width:320px;margin:0;background:var(--surface-alt);border-radius:999px;padding:3px;display:flex;gap:2px;}
  .segmented button{flex:1;border:none;background:transparent;border-radius:999px;padding:7px 14px;font-size:14.5px;font-weight:700;color:var(--text-soft);cursor:pointer;white-space:nowrap;}
  .segmented button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
  @media(max-width:640px){
    .schedule-toolbar{flex-direction:column;align-items:stretch;}
    .segmented{max-width:none;}
  }

  .notif-banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius-md);padding:8px 12px;margin-bottom:10px;font-size:13.5px;color:var(--accent-deep);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

  .search-bar{margin-bottom:10px;position:relative;}
  .search-bar input{width:100%;font-size:15px;padding:8px 12px;border-radius:var(--radius-md);border:1px dashed var(--border);background:var(--surface-alt);}
  #search-results{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:6px;margin:-4px 0 10px;max-height:280px;overflow-y:auto;}
  .search-result-row{padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;}
  .search-result-row:hover{background:var(--surface-alt);}
  .search-result-row .sr-title{font-size:15.5px;font-weight:600;}
  .search-result-row .sr-meta{font-size:13px;color:var(--text-faint);margin-top:2px;}
  .search-empty{padding:10px;font-size:14.5px;color:var(--text-faint);font-style:italic;}
  .notif-banner button{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:4px 10px;font-size:13.5px;font-weight:700;cursor:pointer;}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:9px 10px;box-shadow:var(--shadow);}
  .stat-card .sc-label{font-size:12px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;}
  .stat-card .sc-value{font-family:'Manrope',sans-serif;font-weight:800;font-size:17px;margin-top:1px;}

  .section-title{font-family:'Manrope',sans-serif;font-size:15px;font-weight:700;color:var(--text-soft);margin:14px 0 6px;display:flex;align-items:center;gap:6px;}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border);}

  .row-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius-sm);border-bottom:1px solid var(--border-soft);background:var(--surface);}
  .row-item.auto{border-style:dashed;background:var(--surface-alt);}
  .row-item.mirrored{opacity:0.85;}
  .row-time{font-family:'Manrope',sans-serif;font-weight:700;font-size:13.5px;color:var(--text-soft);min-width:42px;}
  .row-body{flex:1;min-width:0;}
  .row-title{font-size:15px;font-weight:600;outline:none;}
  .row-title[contenteditable]:hover,.row-title[contenteditable]:focus{border-bottom:1px dashed var(--border);}
  .row-title.strike{text-decoration:line-through;color:var(--text-faint);}
  .row-meta{font-size:12.5px;color:var(--text-faint);margin-top:1px;}
  .tag{font-size:11.5px;font-weight:700;border-radius:20px;padding:1px 7px;}
  .tag.shared{background:var(--gold-soft);color:var(--gold);}
  .tag.auto{background:var(--surface);border:1px solid var(--border);color:var(--text-faint);}
  .row-actions{display:flex;gap:4px;flex:none;}
  .icon-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:14.5px;padding:2px;}
  .icon-btn:hover{color:var(--text);}
  .empty-note{color:var(--text-faint);font-style:italic;font-size:14px;padding:6px 3px;}

  .chk{appearance:none;width:17px;height:17px;border-radius:5px;border:2px solid var(--border);flex:none;cursor:pointer;position:relative;background:var(--surface);}
  .chk:checked{background:var(--accent);border-color:var(--accent);}
  .chk:checked::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}

  .add-bar{display:flex;justify-content:center;margin:8px 0;}
  .add-btn{background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:700;cursor:pointer;}

  .inline-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow);}
  .inline-form h3{font-size:15px;margin:0 0 8px;}
  .ff-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;}
  @media(max-width:520px){.ff-grid{grid-template-columns:1fr 1fr;}}
  .ff-grid .f{display:flex;flex-direction:column;gap:2px;}
  .ff-grid label{font-size:11.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;}
  .ff-grid input,.ff-grid select{font-size:14.5px;padding:6px 7px;border-radius:var(--radius-sm);border:1px solid var(--border);}
  .ff-check{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text-soft);}
  .weekday-picker{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/-1;}
  .weekday-picker button{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surface-alt);font-size:12.5px;font-weight:700;color:var(--text-soft);cursor:pointer;}
  .weekday-picker button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ff-actions{grid-column:1/-1;display:flex;gap:6px;margin-top:2px;}
  .btn{font-size:14px;font-weight:700;border:none;border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.ghost{background:var(--surface-alt);color:var(--text-soft);}
  .btn.danger{background:none;color:var(--danger);}

  .day-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);overflow:hidden;margin-bottom:6px;}
  .day-head{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .day-head.today{background:var(--accent-soft);}
  .day-head .dh-name{font-family:'Manrope',sans-serif;font-weight:700;font-size:14.5px;}
  .day-head .dh-date{font-size:12.5px;color:var(--text-faint);margin-left:5px;}
  .day-head .dh-count{font-size:12.5px;color:var(--text-faint);font-weight:700;}
  .day-content{padding:0 12px 10px;display:none;}
  .day-content.open{display:block;}

  .view-toggle-mini{display:flex;gap:4px;background:var(--surface-alt);border-radius:999px;padding:3px;width:fit-content;margin-bottom:10px;}
  .view-toggle-mini button{border:none;background:transparent;color:var(--text-soft);font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;cursor:pointer;}
  .view-toggle-mini button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}

  .cal-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);}
  .cal-grid{display:grid;grid-template-columns:44px repeat(7,minmax(84px,1fr));min-width:680px;}
  .cal-headrow{display:contents;}
  .cal-daylabel{font-size:13px;font-weight:700;color:var(--text-soft);text-align:center;padding:6px 2px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);}
  .cal-daylabel.today{color:var(--gold);}
  .cal-timecol{position:relative;border-right:1px solid var(--border-soft);}
  .cal-timelabel{position:absolute;right:4px;font-size:11.5px;color:var(--text-faint);transform:translateY(-50%);}
  .cal-daycol{position:relative;border-right:1px solid var(--border-soft);background-image:repeating-linear-gradient(to bottom, var(--border-soft) 0, var(--border-soft) 1px, transparent 1px, transparent 56px);}
  .cal-daycol.today{background-color:rgba(201,162,39,0.04);}
  .cal-block{
    position:absolute;left:2px;right:2px;border-radius:5px;border-left:3px solid;padding:2px 5px;overflow:hidden;
    font-size:12px;line-height:1.25;cursor:pointer;
  }
  .cal-block .cb-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-block.done{opacity:0.45;}
  .cal-dragsel{position:absolute;left:2px;right:2px;background:var(--accent);opacity:0.25;border-radius:5px;pointer-events:none;}

  details.reference{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:9px 12px;margin-top:12px;box-shadow:var(--shadow);}
  details.reference summary{cursor:pointer;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;list-style:none;}
  details.reference summary::-webkit-details-marker{display:none;}
  details.reference summary::before{content:'▸ ';color:var(--text-faint);}
  details.reference[open] summary::before{content:'▾ ';}
  details.reference p{font-size:13.5px;color:var(--text-soft);line-height:1.5;margin:6px 0 0;}

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  @media(max-width:520px){.stats-grid{grid-template-columns:1fr;}}
  .stat-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow);}
  .stat-block .sb-label{font-size:12px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;}
  .stat-block .sb-value{font-family:'Manrope',sans-serif;font-weight:800;font-size:21px;margin-top:2px;}

  .cat-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .cat-bar-label{font-size:13.5px;width:74px;flex:none;color:var(--text-soft);}
  .cat-bar-track{flex:1;height:9px;background:var(--surface-alt);border-radius:20px;overflow:hidden;}
  .cat-bar-fill{height:100%;border-radius:20px;}
  .cat-bar-val{font-size:12.5px;color:var(--text-faint);width:44px;text-align:right;flex:none;}

  .streak-row{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;border-bottom:1px solid var(--border-soft);font-size:15px;}
  .streak-row:last-child{border-bottom:none;}
  .day-completion-row{display:flex;gap:5px;align-items:flex-end;height:70px;margin-bottom:6px;}
  .day-completion-bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;position:relative;min-height:2px;}
  .day-completion-labels{display:flex;gap:5px;}
  .day-completion-labels span{flex:1;text-align:center;font-size:12px;color:var(--text-faint);}

  /* ---- Daily routine timeline ---- */
  .routine-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .progress-ring{position:relative;width:54px;height:54px;flex:none;}
  .progress-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .progress-ring .ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;}
  .routine-summary{flex:1;}
  .routine-summary .rs-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:16.5px;}
  .routine-summary .rs-sub{font-size:13.5px;color:var(--text-faint);margin-top:1px;}
  .cat-legend{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
  .cat-chip{font-size:11.5px;font-weight:700;border-radius:20px;padding:5px 11px;border:none;cursor:pointer;transition:transform .1s ease;}
  .cat-chip:hover{transform:translateY(-1px);}
  .cat-chip-active{box-shadow:0 2px 8px rgba(0,0,0,0.18);}

  .routine-block{
    display:flex;align-items:center;gap:9px;padding:7px 9px 7px 10px;border-radius:var(--radius-sm);
    background:var(--surface);margin-bottom:4px;border-left:4px solid transparent;transition:opacity .15s ease;
  }
  .routine-block.done{opacity:0.5;}
  .routine-block.now{box-shadow:0 0 0 1.5px var(--gold);}
  .routine-chk{appearance:none;width:19px;height:19px;border-radius:6px;border:2px solid var(--border);flex:none;cursor:pointer;position:relative;background:var(--surface);}
  .routine-chk:checked{background:var(--accent);border-color:var(--accent);}
  .routine-chk:checked::after{content:'';position:absolute;left:4.5px;top:1.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .rb-body{flex:1;min-width:0;}
  .rb-title{font-size:15px;font-weight:600;outline:none;}
  .rb-title[contenteditable]:hover,.rb-title[contenteditable]:focus{border-bottom:1px dashed var(--border);}
  .rb-title.strike{text-decoration:line-through;color:var(--text-faint);}
  .rb-time-edit{display:flex;align-items:center;gap:5px;margin-top:4px;}
  .rb-time-input{
    font-size:13px;color:var(--text-faint);background:transparent;border:none;padding:2px 3px;
    border-radius:4px;width:98px;font-family:'Inter',sans-serif;
  }
  .rb-time-input::-webkit-calendar-picker-indicator{width:14px;height:14px;padding:0;margin-left:2px;}
  .rb-time-input:hover,.rb-time-input:focus{background:var(--surface-alt);color:var(--text-soft);outline:none;}
  .rb-time-dash{font-size:13px;color:var(--text-faint);}
  .rb-cat{font-size:11.5px;font-weight:700;border-radius:20px;padding:1px 7px;flex:none;}
  .now-badge{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:0.04em;margin-left:4px;}

  .template-editor{margin-top:10px;}
  .te-daygroup{margin-bottom:12px;}
  .te-daygroup h4{font-size:14px;margin:0 0 6px;color:var(--text-soft);}
  .te-block-row{display:flex;align-items:center;gap:5px;margin-bottom:4px;}
  .te-block-row input[type=time]{font-size:13.5px;padding:4px 5px;border-radius:6px;border:1px solid var(--border);width:82px;}
  .te-block-row input[type=text]{flex:1;font-size:14px;padding:5px 7px;border-radius:6px;border:1px solid var(--border);}
  .te-block-row button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14.5px;}
  .te-add-row{font-size:13.5px;color:var(--accent);background:none;border:1px dashed var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;margin-top:2px;}

  /* ---- Today view rebuild: hero + metrics + day intelligence + task/
     event/chore panels — ported from the more advanced Schedule
     prototype, reskinned to this file's own Hub-matched tokens above
     (the prototype's near-black #171714 accents become --accent-deep,
     etc.) rather than copying its literal colors. ---- */
  .day-navigator{display:flex;align-items:center;justify-content:center;gap:7px;margin:0 0 12px;}
  .day-navigator button{width:36px;height:36px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);color:var(--text);font-size:17px;cursor:pointer;}
  .day-navigator input{height:36px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);padding:0 10px;color:var(--text);font-weight:700;font-size:14px;}
  .day-navigator .today-jump,.day-navigator .quickadd-jump{width:auto;padding:0 12px;font-size:12.5px;font-weight:800;color:var(--accent-deep);background:var(--accent-soft);border-color:transparent;}

  .today-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(230px,.7fr);gap:16px;background:var(--accent-deep);color:#fff;border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow);}

});
function showFirebaseLoadError(){
  const box = document.querySelector('.auth-box');

}

const FIREBASE_CONFIG = {

/* =====================================================================
   HOUSEHOLD CHORES SYNC — if this Schedule chore is linked to an entry
   in the Household Chores tracker, checking it off here also marks it
   done there (and logs it to that app's completion history).
===================================================================== */
function householdChoresDoc(key){
  return db.collection('users').doc(currentUser.uid).collection('apps').doc('chores').collection('data').doc(key);
}
async function syncChoreToHousehold(scheduleChoreId, profile, dateStr){
  try{
    const doc = await householdChoresDoc('chores').get();
    if(!doc.exists || !doc.data().json) return;
    let hcChores = JSON.parse(doc.data().json);
    const matched = hcChores.find(function(hc){
      return (hc.links||[]).some(function(l){ return l.profile===profile && l.scheduleChoreId===scheduleChoreId; });
    });
    if(!matched) return;
    matched.lastCompleted = dateStr;
    await householdChoresDoc('chores').set({json: JSON.stringify(hcChores)});
    const histDoc = await householdChoresDoc('history').get();
    let hist = (histDoc.exists && histDoc.data().json) ? JSON.parse(histDoc.data().json) : [];
    hist.unshift({date: dateStr, task: matched.name, by: profile, shift:null, notes:'Synced from Schedule'});
    await householdChoresDoc('history').set({json: JSON.stringify(hist)});
  }catch(e){ console.error('household sync failed', e); }
}

});

  let last = null;
  try{ last = localStorage.getItem('hub-active-profile'); }catch(e){}

});

function weekParity(dateStr){

async function loadDayTemplates(){
  const seed = templateSeedForProfile();
  try{
    const doc = await profileDoc(activeProfile,'dayTemplates').get();
    let loaded = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : null;
    loaded = migrateOldTemplateFormat(loaded);
    const isEmpty = !loaded || Object.keys(loaded).length===0 || Object.values(loaded).every(arr=>!arr || !arr.length);
    if(loaded && !isEmpty){
      dayTemplates = loaded; // real saved content (possibly hand-edited) — never overwrite it
      // A day that's specifically empty (however it happened — a past
      // edit, an old bug) stayed empty forever before, since only the
      // *global* all-days-empty case triggered a reseed. This backfills
      // just that one day from the seed template, leaving every other
      // day's real saved content completely untouched.
      if(seed){
        TEMPLATE_KEYS.forEach(function(day){
          const dayEmpty = !dayTemplates[day] || !dayTemplates[day].length;
          if(dayEmpty && seed[day] && seed[day].length) dayTemplates[day] = JSON.parse(JSON.stringify(seed[day]));
        });
      }
      await saveDayTemplates(); // persist the migrated format
    } else if(seed){
      dayTemplates = JSON.parse(JSON.stringify(seed));
      await saveDayTemplates();
    } else {
      dayTemplates = loaded || {};
    }
  }catch(e){ dayTemplates = seed ? JSON.parse(JSON.stringify(seed)) : {}; }
  // Existing saved schedules keep whatever the person already edited, so a
  // seed change alone won't reach them — this renames only the exact,
  // untouched "Final review" block to add the skin routine alongside it,
  // and leaves anything already customized exactly as it is.
  if(activeProfile==='Bhargav'){
    let changed = false;
    Object.keys(dayTemplates).forEach(function(day){
      (dayTemplates[day]||[]).forEach(function(block){
        if(block.activity === 'Final review'){ block.activity = 'Final review + Skin routine'; changed = true; }
      });
    });
    if(changed) await saveDayTemplates();
  }
}

// Resolves which variant of Bhargav's Saturday actually applies for a
// given date — but only auto-alternates if the stored content still
// matches the original, unedited seed. If he's hand-edited Saturday at
// all, that edit is respected exactly like any other day, and auto
// alternation stops (same "never overwrite what's been customized"
// rule used everywhere else in this app).
function resolveDayBlocks(profileKey, templateKey, dateStr){
  const stored = dayTemplates[templateKey] || [];
  if(profileKey === 'Bhargav' && templateKey === 'Saturday'){
    const laundryVariant = buildBhargavSaturday('laundry');
    const deepCleanVariant = buildBhargavSaturday('deepclean');
    const matchesVariant = function(variant){
      return stored.length === variant.length && stored.every(function(b,i){ return b.activity === variant[i].activity; });
    };
    if(matchesVariant(laundryVariant) || matchesVariant(deepCleanVariant)){
      return weekParity(dateStr) === 0 ? laundryVariant : deepCleanVariant;
    }
  }
  return stored;
}
function todaysBlocks(dateStr){ return resolveDayBlocks(activeProfile, todaysTemplateKey(dateStr), dateStr); }
function currentBlockIndex(blocks){
  const now = new Date();
  let nowMin = now.getHours()*60 + now.getMinutes();
  if(nowMin < 270) nowMin += 1440; // before 4:30am counts as continuation of the prior day
  let idx = -1;
  blocks.forEach((b,i)=>{ if(toMinutes(b.start) <= nowMin) idx = i; });
  return idx;
}

function eventsForDate(dateStr){
  const wd = weekdayOf(dateStr);
  const list = [];
  events.forEach(ev=>{
    if(ev.recurring){
      if(ev.weekday === wd && dateStr >= ev.startDate) list.push(Object.assign({}, ev, {occDate:dateStr, auto:false}));
    } else if(ev.date === dateStr){
      list.push(Object.assign({}, ev, {occDate:dateStr, auto:false}));
    }
  });
  if(autoConfig.workoutsOn && WORKOUT_PATTERN[wd]){
    list.push({ id:'auto-workout-'+dateStr, title:WORKOUT_PATTERN[wd], time:'', occDate:dateStr, auto:true, link:'../gym/index.html' });

  if(autoConfig.groceryOn && wd === autoConfig.groceryWeekday){
    list.push({ id:'auto-grocery-'+dateStr, title:"Grocery run (Costco / TJ's)", time:'', occDate:dateStr, auto:true, link:'../apps/grocery.html' });
  }
  return list.sort(timeSort);
}

function choreStreak(chore){
  let streak = 0, cursor = todayStr();
  for(let i=0;i<365;i++){
    if(choreDueOn(chore, cursor)){
      if(isChoreDone(chore.id, cursor)) streak++;
      else if(cursor !== todayStr()) break;
    }
    cursor = addDays(cursor, -1);
  }
  return streak;
}
function whoseTurn(chore, dateStr){
  if(!chore.rotates) return null;
  const ref = dateObj(chore.rotateStart || '2026-01-01');
  const weeksSince = Math.floor((dateObj(dateStr) - ref) / (7*86400000));
  const people = ['Bhargav','Anusha'];
  return people[((weeksSince % 2)+2)%2];
}

function checkUpcoming(){
  if(notifPermission !== 'granted') return;
  const now = new Date(), today = todayStr();
  eventsForDate(today).forEach(ev=>{
    if(!ev.time) return;
    const notifKey = 'evt-'+ev.id+'-'+ev.occDate;
    if(notifiedToday.has(notifKey)) return;
    const parts = ev.time.split(':').map(Number);
    const evDate = new Date(now); evDate.setHours(parts[0],parts[1],0,0);
    const diffMin = (evDate-now)/60000;
    if(diffMin>0 && diffMin<=15){ fireNotification('Coming up: '+ev.title, ev.time, notifKey); notifiedToday.add(notifKey); saveNotifiedToday(); }
  });
  if(now.getHours()===20 && now.getMinutes()<5){
    const key = 'chore-evening-'+today;
    if(!notifiedToday.has(key)){
      const due = choresDueOn(today).filter(c=>!c.done);
      if(due.length){ fireNotification('Chores left today', due.map(c=>c.title).join(', '), key); notifiedToday.add(key); saveNotifiedToday(); }
    }
  }
}
function startNotificationLoop(){ checkUpcoming(); setInterval(checkUpcoming, 60000); }

function runSearch(query){
  const el = document.getElementById('search-results');
  const q = query.trim().toLowerCase();
  if(!q){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display = 'block';

  const results = [];
  events.forEach(ev=>{
    if(ev.title.toLowerCase().includes(q) || (ev.notes||'').toLowerCase().includes(q)){
      results.push({ type:ev.kind==='task'?'Task':'Event', title:ev.title, meta: ev.recurring ? 'Weekly on '+DAY_NAMES[ev.weekday] : fmtHeaderDate(ev.date) });
    }
  });
  chores.forEach(c=>{
    if(c.title.toLowerCase().includes(q)){
      results.push({ type:'Chore', title:c.title, meta: (c.weekdays||[]).map(w=>DAY_SHORT[w]).join(' ') });
    }
  });
  Object.entries(dayTemplates).forEach(([day, blocks])=>{
    (blocks||[]).forEach(b=>{
      if(b.activity.toLowerCase().includes(q)){
        results.push({ type:'Routine', title:b.activity, meta: day+' · '+fmt12(b.start)+'–'+fmt12(b.end) });
      }
    });
  });

  el.innerHTML = results.length
    ? results.slice(0,20).map(r=>'<div class="search-result-row"><div class="sr-title">'+escapeHtml(r.title)+'</div><div class="sr-meta">'+r.type+' · '+escapeHtml(r.meta)+'</div></div>').join('')
    : '<div class="search-empty">No matches.</div>';
}

function routineProgress(dateStr){
  const blocks = todaysBlocks(dateStr);
  if(!blocks.length) return {done:0, total:0};
  let done = 0;
  blocks.forEach((b,i)=>{ if(templateLog[templateBlockKey(dateStr,i)]) done++; });
  return {done, total: blocks.length};
}

function renderDailyRoutineHtml(dateStr){
  const blocks = todaysBlocks(dateStr);
  if(!blocks.length){
    return '<div class="empty-note">No daily routine set up yet. Build one below.</div>';
  }
  const {done, total} = routineProgress(dateStr);
  const pct = total ? Math.round(100*done/total) : 0;
  const circumference = 2*Math.PI*22;
  const isToday = dateStr === todayStr();
  const curIdx = isToday ? currentBlockIndex(blocks) : -1;

  const legend = [...new Set(blocks.map(b=>categorize(b.activity)))].map(cat=>{
    const m = CATEGORY_META[cat];
    const isActive = activeCategoryFilter === cat;
    return '<button type="button" class="cat-chip '+(isActive?'cat-chip-active':'')+'" data-filtercat="'+cat+'" style="background:'+(isActive?m.color:m.soft)+';color:'+(isActive?'#fff':m.color)+';">'+m.label+'</button>';
  }).join('');

  const rows = blocks.map((b,i)=>{
    const cat = categorize(b.activity);
    const meta = CATEGORY_META[cat];
    const key = templateBlockKey(dateStr, i);
    const isDone = !!templateLog[key];
    const isNow = i === curIdx;
    const tKey = todaysTemplateKey(dateStr);
    const hiddenByFilter = activeCategoryFilter && cat !== activeCategoryFilter;
    return '<div class="routine-block '+(isDone?'done':'')+' '+(isNow?'now':'')+'" style="border-left-color:'+meta.color+';'+(hiddenByFilter?'display:none;':'')+'">'+
      '<input type="checkbox" class="routine-chk" data-blockkey="'+key+'" '+(isDone?'checked':'')+'>'+
      '<div class="rb-body">'+
        '<div class="rb-title '+(isDone?'strike':'')+'" contenteditable="true" data-tplkey="'+tKey+'" data-tplidx="'+i+'" data-field="activity">'+escapeHtml(b.activity)+'</div>'+
        (isNow?'<span class="now-badge">now</span>':'')+
        '<div class="rb-time-edit">'+
          '<input type="time" class="rb-time-input" value="'+b.start+'" data-tplkey="'+tKey+'" data-tplidx="'+i+'" data-field="start">'+
          '<span class="rb-time-dash">–</span>'+
          '<input type="time" class="rb-time-input" value="'+b.end+'" data-tplkey="'+tKey+'" data-tplidx="'+i+'" data-field="end">'+
        '</div>'+
      '</div>'+
      '<span class="rb-cat" style="background:'+meta.soft+';color:'+meta.color+';">'+meta.label+'</span>'+
    '</div>';
  }).join('');

  return `
    <div class="routine-head">
      <div class="progress-ring">
        <svg viewBox="0 0 54 54">
          <circle cx="27" cy="27" r="22" fill="none" stroke="var(--surface-alt)" stroke-width="6"/>
          <circle cx="27" cy="27" r="22" fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="${circumference}" stroke-dashoffset="${circumference*(1-pct/100)}"/>
        </svg>
        <div class="ring-pct">${pct}%</div>
      </div>
      <div class="routine-summary">
        <div class="rs-title">${done}/${total} blocks done</div>
        <div class="rs-sub">${TEMPLATE_LABELS[todaysTemplateKey(dateStr)]} routine</div>
      </div>
    </div>
    <div class="cat-legend">${legend}</div>
    <div id="routine-blocks">${rows}</div>
  `;
}

/* =====================================================================
   STATS — category time-breakdown, 7-day completion trend, chore streaks
===================================================================== */
function renderStats(){
  const el = document.getElementById('stats-view');

  // category minutes across one full week (fixed weekly rhythm from templates)
  const catMinutes = {};
  Object.values(dayTemplates).forEach(blocks=>{
    (blocks||[]).forEach(b=>{
      const cat = categorize(b.activity);
      const mins = (toMinutes(b.end) - toMinutes(b.start) + 1440) % 1440 || 1440;
      catMinutes[cat] = (catMinutes[cat]||0) + mins;
    });
  });
  const catEntries = Object.entries(catMinutes).sort((a,b)=>b[1]-a[1]);
  const maxMin = catEntries.length ? catEntries[0][1] : 1;

  const catBarsHtml = catEntries.length ? catEntries.map(([cat,mins])=>{
    const meta = CATEGORY_META[cat];
    const hrs = (mins/60).toFixed(1);
    const pct = Math.round(100*mins/maxMin);
    return '<div class="cat-bar-row"><span class="cat-bar-label">'+meta.label+'</span><div class="cat-bar-track"><div class="cat-bar-fill" style="width:'+pct+'%;background:'+meta.color+';"></div></div><span class="cat-bar-val">'+hrs+'h/wk</span></div>';
  }).join('') : '<div class="empty-note">No routine set up yet.</div>';

  // last 7 days completion %
  const days = [];
  for(let i=6;i>=0;i--){
    const d = addDays(todayStr(), -i);
    const prog = routineProgress(d);
    days.push({ d, label: DAY_SHORT[weekdayOf(d)], pct: prog.total ? Math.round(100*prog.done/prog.total) : null });
  }
  const barsHtml = days.map(x=> '<div class="day-completion-bar" style="height:'+(x.pct==null?2:Math.max(4,x.pct))+'%;opacity:'+(x.pct==null?0.15:1)+';" title="'+(x.pct==null?'No routine':x.pct+'%')+'"></div>').join('');
  const labelsHtml = days.map(x=>'<span>'+x.label+'</span>').join('');

  // chore streaks
  const streakList = chores.map(c=>({title:c.title, streak:choreStreak(c)})).sort((a,b)=>b.streak-a.streak);
  const streakHtml = streakList.length
    ? streakList.map(s=>'<div class="streak-row"><span>'+escapeHtml(s.title)+'</span><span>'+s.streak+'🔥</span></div>').join('')
    : '<div class="empty-note">No recurring chores yet.</div>';

  const totalMinutesWeek = Object.values(catMinutes).reduce((a,b)=>a+b,0);
  const avgCompletion = days.filter(x=>x.pct!=null).length
    ? Math.round(days.filter(x=>x.pct!=null).reduce((s,x)=>s+x.pct,0) / days.filter(x=>x.pct!=null).length)
    : null;

  el.innerHTML = '<div class="stats-grid">'+
    '<div class="stat-block"><div class="sb-label">Weekly routine time</div><div class="sb-value">'+(totalMinutesWeek/60).toFixed(0)+'h</div></div>'+
    '<div class="stat-block"><div class="sb-label">7-day avg completion</div><div class="sb-value">'+(avgCompletion!=null?avgCompletion+'%':'—')+'</div></div>'+
    '</div>'+
    '<div class="section-title" style="margin-top:0;">Time by category (weekly)</div>'+
    '<div class="stat-block">'+catBarsHtml+'</div>'+
    '<div class="section-title">Last 7 days — routine completion</div>'+
    '<div class="stat-block"><div class="day-completion-row">'+barsHtml+'</div><div class="day-completion-labels">'+labelsHtml+'</div></div>'+
    '<div class="section-title">Chore streaks</div>'+
    '<div class="stat-block">'+streakHtml+'</div>';
}

/* =====================================================================
   TASKS — flexible, due-dated work items. Tasks are NOT a separate data
   structure: they live in the same `events` array and reuse the same
   saveEvents()/mirrorToPartner('event', …) sync path as calendar
   events, distinguished purely by kind:'task' (an ordinary event has no
   kind, or kind:'event'). This means the existing event sync/mirroring
   code needs zero changes to also carry tasks.
===================================================================== */
function taskRowHtml(task, viewDate){
  const isOverdue = !task.completed && task.date && task.date < todayStr();
  const priority = task.priority || 'medium';
  const estimate = task.estimate ? task.estimate+' min' : 'Flexible time';
  return '<div class="task-row '+(task.completed?'done ':'')+(isOverdue?'overdue':'')+'">'+
    '<input type="checkbox" class="chk" data-taskcheck="'+task.id+'" '+(task.completed?'checked':'')+'>'+
    '<div><div class="task-title">'+escapeHtml(task.title)+'</div><div class="task-meta"><span><i class="priority-dot '+priority+'"></i>'+priority+'</span><span>'+escapeHtml(estimate)+'</span>'+(task.time?'<span class="task-time">'+fmt12(task.time)+(task.endTime?'–'+fmt12(task.endTime):'')+'</span>':'')+(isOverdue?'<span>Overdue · '+fmtHeaderDate(task.date)+'</span>':'')+(task.shared?'<span class="tag shared">shared</span>':'')+'</div></div>'+
    '<div class="task-actions"><button data-edittask="'+task.id+'">Edit</button>'+(!task.completed?'<button data-movetask="'+task.id+'" data-moveto="'+addDays(viewDate||todayStr(),1)+'"><span class="move-label">Move </span>→</button>':'')+'<button data-deltask="'+task.id+'" aria-label="Delete task">×</button></div></div>';
}

    task.completed = cb.checked;

  }));
  wrap.querySelectorAll('[data-movetask]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const task = events.find(e=>e.id===btn.dataset.movetask);
    if(!task) return;
    task.date = btn.dataset.moveto;
    task.completed = false;
    await saveEvents();
    if(task.shared) await mirrorToPartner('event', task, false);

    if(task.shared) await mirrorToPartner('event', task, true);
    showView(activeView);
  }));
}

  mount.innerHTML = '<div class="inline-form"><h3>'+(task?'Edit task':'Add task')+'</h3><div class="ff-grid">'+
    '<div class="f"><label>Task</label><input type="text" id="tf-title" placeholder="e.g. Submit assignment" value="'+(task?escapeHtml(task.title):'')+'"></div>'+

    '<label class="ff-check"><input type="checkbox" id="tf-shared" '+(task&&task.shared?'checked':'')+'> Share with '+otherProfile(activeProfile)+'</label>'+
    '<div class="f" style="grid-column:1/-1"><label>Notes</label><input type="text" id="tf-notes" placeholder="Optional context" value="'+(task?escapeHtml(task.notes||''):'')+'"></div>'+
    '<div class="ff-actions"><button class="btn primary" id="tf-save">'+(task?'Save task':'Add task')+'</button><button class="btn ghost" id="tf-cancel">Cancel</button></div></div></div>';
  mount.scrollIntoView({behavior:'smooth',block:'center'});

      date:document.getElementById('tf-date').value||todayStr(), time:document.getElementById('tf-time').value,
      priority:document.getElementById('tf-priority').value, estimate:Number(document.getElementById('tf-estimate').value),
      notes:document.getElementById('tf-notes').value.trim(), shared:document.getElementById('tf-shared').checked,
      recurring:false, completed:task?!!task.completed:false
    });
    if(task) events = events.map(e=>e.id===task.id?item:e); else events.push(item);
    await saveEvents();

}

/* =====================================================================
   CONFLICT DETECTION — used by the event form to warn (with a confirm
   gate) when a new/edited timed event overlaps another timed event or
   a routine block on the same day.
===================================================================== */
function findScheduleConflicts(dateStr, startTime, endTime, excludeId){
  if(!startTime) return [];
  const start = toMinutes(startTime), end = endTime && toMinutes(endTime)>start ? toMinutes(endTime) : start+45;
  const conflicts = [];
  eventsForDate(dateStr).forEach(item=>{
    if(item.id===excludeId || item.kind==='task' || item.auto || !item.time) return;
    const a=toMinutes(item.time), b=item.endTime&&toMinutes(item.endTime)>a?toMinutes(item.endTime):a+45;
    if(start<b && end>a) conflicts.push(item.title);
  });
  todaysBlocksFor(dateStr).forEach(block=>{
    const a=toMinutes(block.start), b=toMinutes(block.end);
    if(start<b && end>a) conflicts.push(block.activity);
  });
  return [...new Set(conflicts)];
}

/* =====================================================================
   DAY INTELLIGENCE + FREE-TIME FINDER — a short "here's how your day
   looks" briefing, plus a same-day gap finder. The Free-time finder's
   *results* are a floating panel (see .free-time-panel CSS above), per
   an explicit product decision to not give it a dedicated full-width
   spot in the layout.
===================================================================== */
function isFlexibleRoutineActivity(activity){
  return /free|flexible|open|reset/i.test(activity || '');
}
function formatMinutesCompact(minutes){
  const hrs = Math.floor(minutes/60), mins = minutes%60;
  if(hrs && mins) return hrs+'h '+mins+'m';
  if(hrs) return hrs+'h';
  return mins+'m';
}
function mergeIntervals(intervals){
  const sorted = intervals.filter(x=>x.end>x.start).sort((a,b)=>a.start-b.start);
  const merged = [];
  sorted.forEach(item=>{
    const last = merged[merged.length-1];
    if(last && item.start<=last.end) last.end = Math.max(last.end,item.end);
    else merged.push({start:item.start,end:item.end});
  });
  return merged;
}
function freeWindowsForDate(dateStr){
  const dayStart = activeProfile==='Bhargav' ? 270 : 300;
  const dayEnd = activeProfile==='Bhargav' ? 1290 : 1320;
  const busy = [];
  todaysBlocksFor(dateStr).forEach(block=>{
    if(isFlexibleRoutineActivity(block.activity)) return;
    const start=toMinutes(block.start), end=toMinutes(block.end);
    if(end<=start) return;
    busy.push({start:Math.max(dayStart,start),end:Math.min(dayEnd,end)});
  });
  eventsForDate(dateStr).forEach(item=>{
    if(!item.time) return;
    const start=toMinutes(item.time);
    const fallback = item.kind==='task' ? Number(item.estimate)||30 : 45;
    const end=item.endTime&&toMinutes(item.endTime)>start ? toMinutes(item.endTime) : start+fallback;
    busy.push({start:Math.max(dayStart,start),end:Math.min(dayEnd,end)});
  });
  const merged = mergeIntervals(busy);
  const windows=[];
  let cursor=dayStart;
  merged.forEach(item=>{
    if(item.start>cursor) windows.push({start:cursor,end:item.start});
    cursor=Math.max(cursor,item.end);
  });
  if(cursor<dayEnd) windows.push({start:cursor,end:dayEnd});
  const now = new Date();
  const nowMinutes = now.getHours()*60+now.getMinutes();
  return windows.map(slot=>({
    start:dateStr===todayStr()?Math.max(slot.start,nowMinutes):slot.start,
    end:slot.end
  })).filter(slot=>slot.end-slot.start>=20);
}
function rankedOpenTasks(tasks){
  const rank={high:0,medium:1,low:2};
  return tasks.filter(t=>!t.completed).slice().sort((a,b)=>
    (rank[a.priority||'medium']-rank[b.priority||'medium']) ||
    ((Number(a.estimate)||30)-(Number(b.estimate)||30))
  );
}
function renderDayIntelligenceHtml(dateStr,tasks){
  const windows=freeWindowsForDate(dateStr);
  const totalFree=windows.reduce((sum,slot)=>sum+slot.end-slot.start,0);
  const nextSlot=windows[0];
  const ranked=rankedOpenTasks(tasks);
  const fitTask=nextSlot ? ranked.find(task=>(Number(task.estimate)||30)<=nextSlot.end-nextSlot.start) : null;
  const nowHour=new Date().getHours();
  const greeting=dateStr===todayStr() ? (nowHour<12?'Morning plan':nowHour<18?'Afternoon check-in':'Evening close') : 'Day plan';
  let title='Your day has breathing room.';
  let copy='Use the open windows for focused work, recovery, or anything unexpected.';
  if(fitTask && nextSlot){
    title=escapeHtml(fitTask.title)+' fits your next open window.';
    copy=fmt12(minutesToTime(nextSlot.start))+'–'+fmt12(minutesToTime(nextSlot.end))+' gives you '+formatMinutesCompact(nextSlot.end-nextSlot.start)+' available.';
  }else if(ranked.length && !nextSlot){
    title='Today is fully planned.';
    copy='Keep the task list flexible, or move lower-priority work to another day.';
  }else if(!ranked.length){
    title='No open tasks are competing for your attention.';
    copy=nextSlot ? 'Your next open window begins at '+fmt12(minutesToTime(nextSlot.start))+'.' : 'Your routine and events cover the active day.';
  }
  const focusHref='clock.html?profile='+encodeURIComponent(activeProfile||'');
  return '<div class="day-intelligence">'+
    '<section class="briefing-card"><div class="briefing-kicker">'+greeting+'</div><div class="briefing-title">'+title+'</div><div class="briefing-copy">'+copy+'</div><div class="intel-actions"><button class="intel-button primary" id="find-time-btn">🔎 Find time</button><a class="intel-link" href="'+focusHref+'">⏱ Open Focus clock</a></div></section>'+
    '<section class="free-time-card"><div class="briefing-kicker">Capacity</div><div class="free-time-summary"><div><strong>'+formatMinutesCompact(totalFree)+'</strong><span>Open time left</span></div><div><strong>'+(nextSlot?fmt12(minutesToTime(nextSlot.start)):'—')+'</strong><span>Next opening</span></div></div><div class="briefing-copy">'+ranked.length+' open task'+(ranked.length===1?'':'s')+' · '+windows.length+' usable window'+(windows.length===1?'':'s')+'</div></section>'+
    '<section class="free-time-panel" id="free-time-panel" hidden>'+renderFreeTimePanelHtml(dateStr,windows,ranked)+'</section></div>';
}
function renderFreeTimePanelHtml(dateStr,windows,tasks){
  const cards=windows.length ? windows.map(slot=>{
    const duration=slot.end-slot.start;
    const fit=tasks.find(task=>(Number(task.estimate)||30)<=duration);
    return '<div class="free-slot"><strong>'+fmt12(minutesToTime(slot.start))+'–'+fmt12(minutesToTime(slot.end))+'</strong><small>'+formatMinutesCompact(duration)+' available'+(fit?' · '+escapeHtml(fit.title)+' fits':'')+'</small>'+(fit?'<button data-fit-task="'+fit.id+'" data-fit-date="'+dateStr+'" data-fit-start="'+minutesToTime(slot.start)+'">Schedule '+escapeHtml(fit.title)+'</button>':'')+'</div>';
  }).join('') : '<div class="empty-note">No open window of 20 minutes or more remains in the active day.</div>';
  return '<div class="free-time-head"><div><h2>Free-time finder</h2><p>Openings are calculated from routine blocks, scheduled tasks, and events.</p></div><button class="free-time-close" id="free-time-close" aria-label="Close">×</button></div><div class="free-slot-list">'+cards+'</div>';
}
function attachDayIntelligenceHandlers(wrap,dateStr){
  const panel=wrap.querySelector('#free-time-panel');
  const open=wrap.querySelector('#find-time-btn');
  const close=wrap.querySelector('#free-time-close');
  if(open&&panel) open.onclick=()=>{ panel.hidden=false; };
  if(close&&panel) close.onclick=()=>{ panel.hidden=true; };
  wrap.querySelectorAll('[data-fit-task]').forEach(btn=>btn.addEventListener('click',async ()=>{
    const task=events.find(item=>item.id===btn.dataset.fitTask);
    if(!task) return;
    const start=toMinutes(btn.dataset.fitStart);
    const estimate=Math.max(15,Number(task.estimate)||30);
    task.date=btn.dataset.fitDate;
    task.time=minutesToTime(start);
    task.endTime=minutesToTime(Math.min(start+estimate,1439));
    task.completed=false;
    await saveEvents();
    if(task.shared) await mirrorToPartner('event',task,false);
    renderToday();
  }));
}

/* =====================================================================
   CALENDAR GRID — hour-by-hour week view. Drag on empty space to create
   an event at that time; click an existing block to open/toggle it.
===================================================================== */
const GRID_START_HOUR = 4;
const GRID_END_HOUR = 23;
const GRID_HOUR_PX = 56;

function renderCalendarGrid(wrap, weekStart, today){
  const totalHours = GRID_END_HOUR - GRID_START_HOUR;
  const gridHeight = totalHours * GRID_HOUR_PX;

  let timeLabels = '';
  for(let h=GRID_START_HOUR; h<GRID_END_HOUR; h++){
    timeLabels += '<div class="cal-timelabel" style="top:'+((h-GRID_START_HOUR)*GRID_HOUR_PX)+'px;">'+fmt12(String(h).padStart(2,'0')+':00')+'</div>';
  }

  let headHtml = '<div class="cal-daylabel"></div>';
  let colsHtml = '';
  for(let i=0;i<7;i++){
    const d = addDays(weekStart, i);
    const isToday = d === today;
    headHtml += '<div class="cal-daylabel '+(isToday?'today':'')+'">'+DAY_SHORT[weekdayOf(d)]+' '+fmtHeaderDate(d)+'</div>';

    const dayEvents = eventsForDate(d).filter(e=>e.kind!=='task' && e.time);
    let blocksHtml = '';
    dayEvents.forEach(ev=>{
      const startMin = toMinutes(ev.time) - GRID_START_HOUR*60;
      const durMin = ev.endTime && toMinutes(ev.endTime)>toMinutes(ev.time) ? toMinutes(ev.endTime)-toMinutes(ev.time) : 45;
      const top = (startMin/60)*GRID_HOUR_PX;
      const height = Math.max(22, (durMin/60)*GRID_HOUR_PX);
      const color = ev.auto ? 'var(--text-faint)' : 'var(--accent)';
      blocksHtml += '<div class="cal-block" style="top:'+top+'px;height:'+height+'px;border-left-color:'+color+';background:'+(ev.auto?'var(--surface-alt)':'var(--accent-soft)')+';" data-blockdate="'+d+'" data-blockid="'+ev.id+'" data-blockauto="'+(ev.auto?1:0)+'"><div class="cb-title">'+escapeHtml(ev.title)+'</div></div>';
    });
    // routine blocks, colored by category
    todaysBlocksFor(d).forEach((b,bi)=>{
      const startMin = toMinutes(b.start) - GRID_START_HOUR*60;
      let endMin = toMinutes(b.end) - GRID_START_HOUR*60;
      if(endMin <= startMin) endMin = startMin + 30;
      if(startMin > totalHours*60 || endMin < 0) return;
      const top = Math.max(0,(startMin/60))*GRID_HOUR_PX;
      const height = Math.max(18, ((endMin-startMin)/60)*GRID_HOUR_PX);
      const meta = CATEGORY_META[categorize(b.activity)];
      const key = templateBlockKey(d, bi);
      const isDone = !!templateLog[key];
      blocksHtml += '<div class="cal-block '+(isDone?'done':'')+'" style="top:'+top+'px;height:'+height+'px;border-left-color:'+meta.color+';background:'+meta.soft+';color:'+meta.color+';" data-blockkey="'+key+'"><div class="cb-title">'+escapeHtml(b.activity)+'</div></div>';
    });

    colsHtml += '<div class="cal-daycol '+(isToday?'today':'')+'" style="height:'+gridHeight+'px;" data-daycol="'+d+'">'+blocksHtml+'</div>';
  }

  wrap.innerHTML = '<div class="cal-wrap"><div class="cal-grid">'+
    headHtml+
    '<div class="cal-timecol" style="height:'+gridHeight+'px;">'+timeLabels+'</div>'+
    colsHtml+
    '</div></div>'+
    '<div id="grid-event-form-mount"></div>';

  wrap.querySelectorAll('[data-blockkey]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const key = el.dataset.blockkey;
      if(templateLog[key]) delete templateLog[key]; else templateLog[key] = true;
      await saveTemplateLog();
      renderWeek();
    });
  });
  wrap.querySelectorAll('[data-blockid]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.dataset.blockauto==='1') return;
      const ev = events.find(e=>e.id===el.dataset.blockid);
      if(ev) openEventForm('grid-event-form-mount', el.dataset.blockdate, ev);
    });
  });

  // drag-to-create on empty day-column space
  wrap.querySelectorAll('.cal-daycol').forEach(col=>{
    let dragEl = null, startY = 0;
    col.addEventListener('mousedown', e=>{
      if(e.target.closest('.cal-block')) return;
      const rect = col.getBoundingClientRect();
      startY = e.clientY - rect.top;
      dragEl = document.createElement('div');
      dragEl.className = 'cal-dragsel';
      dragEl.style.top = startY+'px';
      dragEl.style.height = '2px';
      col.appendChild(dragEl);
      const onMove = me=>{
        const y = Math.max(0, me.clientY - rect.top);
        const top = Math.min(startY, y), h = Math.abs(y-startY);
        dragEl.style.top = top+'px';
        dragEl.style.height = h+'px';
      };
      const onUp = me=>{
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        const rect2 = col.getBoundingClientRect();
        const endY = Math.max(0, me.clientY - rect2.top);
        const top = Math.min(startY, endY), bottom = Math.max(startY, endY);
        if(dragEl) dragEl.remove();
        if(bottom - top < 8){
          // treat as a simple click: default 30-min slot
          const startMinutes = GRID_START_HOUR*60 + Math.round(top/GRID_HOUR_PX*60/15)*15;
          openEventForm('grid-event-form-mount', col.dataset.daycol, null, minutesToTime(startMinutes));
        } else {
          const startMinutes = GRID_START_HOUR*60 + Math.round(top/GRID_HOUR_PX*60/15)*15;
          openEventForm('grid-event-form-mount', col.dataset.daycol, null, minutesToTime(startMinutes));
        }
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}
function minutesToTime(mins){
  mins = Math.max(0, Math.min(1439, mins));
  const h = Math.floor(mins/60), m = mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function todaysBlocksFor(dateStr){ return resolveDayBlocks(activeProfile, templateKeyForWeekday(weekdayOf(dateStr)), dateStr); }

function openEventForm(mountId, defaultDate, existingEvent, defaultTime){
  const mount = document.getElementById(mountId);
  const ev = existingEvent || null;
  mount.innerHTML = '<div class="inline-form"><h3>'+(ev?'Edit event':'Add event')+'</h3><div class="ff-grid">'+
    '<div class="f"><label>Title</label><input type="text" id="ef-title" required placeholder="e.g. Dinner with parents" value="'+(ev?escapeHtml(ev.title):'')+'"></div>'+
    '<div class="f"><label>Starts</label><input type="time" id="ef-time" value="'+(ev?ev.time||'':defaultTime||'')+'"></div>'+
    '<div class="f"><label>Ends</label><input type="time" id="ef-end-time" value="'+(ev?ev.endTime||'':'')+'"></div>'+
    '<div class="f"><label>Repeats</label><select id="ef-recurring"><option value="0" '+(ev&&!ev.recurring?'selected':'')+'>Just once</option><option value="1" '+(ev&&ev.recurring?'selected':'')+'>Weekly</option></select></div>'+
    '<div class="f"><label>Date</label><input type="date" id="ef-date" value="'+(ev?(ev.date||defaultDate||todayStr()):(defaultDate||todayStr()))+'"></div>'+
    '<label class="ff-check"><input type="checkbox" id="ef-shared" '+(ev&&ev.shared?'checked':'')+'> Share with '+otherProfile(activeProfile)+'</label>'+
    '<div class="f" style="grid-column:1/-1;"><label>Notes</label><input type="text" id="ef-notes" placeholder="optional" value="'+(ev?escapeHtml(ev.notes||''):'')+'"></div>'+
    '<div class="form-warning" id="ef-conflict"></div><div class="ff-actions"><button class="btn primary" id="ef-save">'+(ev?'Save changes':'Add')+'</button>'+(ev?'<button class="btn danger" id="ef-delete">Delete</button>':'')+'<button class="btn ghost" id="ef-cancel">Cancel</button></div>'+
    '</div></div>';
  mount.scrollIntoView({behavior:'smooth', block:'center'});

  const updateConflictPreview = ()=>{
    const dateVal = document.getElementById('ef-date').value || todayStr();
    const conflicts = findScheduleConflicts(dateVal, document.getElementById('ef-time').value, document.getElementById('ef-end-time').value, ev&&ev.id);
    const warning = document.getElementById('ef-conflict');
    warning.style.display = conflicts.length ? 'block' : 'none';
    warning.textContent = conflicts.length ? 'Possible conflict: '+conflicts.slice(0,3).join(', ') : '';
  };
  ['ef-date','ef-time','ef-end-time'].forEach(id=>document.getElementById(id).addEventListener('change', updateConflictPreview));
  updateConflictPreview();

  document.getElementById('ef-cancel').addEventListener('click', ()=>{ mount.innerHTML=''; });
  if(ev){
    document.getElementById('ef-delete').addEventListener('click', async ()=>{
      if(!window.confirm('Delete "'+ev.title+'"?')) return;
      events = events.filter(e=>e.id!==ev.id);
      await saveEvents();
      if(ev.shared) await mirrorToPartner('event', ev, true);
      mount.innerHTML = '';
      showView(activeView);
    });
  }
  document.getElementById('ef-save').addEventListener('click', async ()=>{
    const title = document.getElementById('ef-title').value.trim();
    if(!title){ document.getElementById('ef-title').style.outline='2px solid var(--danger)'; return; }
    const isRecurring = document.getElementById('ef-recurring').value === '1';
    const dateVal = document.getElementById('ef-date').value || todayStr();
    const startTime = document.getElementById('ef-time').value;
    const endTime = document.getElementById('ef-end-time').value;
    if(startTime && endTime && toMinutes(endTime)<=toMinutes(startTime)){
      document.getElementById('ef-end-time').style.outline='2px solid var(--danger)';
      return;
    }
    const conflicts = findScheduleConflicts(dateVal, startTime, endTime, ev&&ev.id);
    if(conflicts.length && !window.confirm('This overlaps with '+conflicts.slice(0,3).join(', ')+'. Add it anyway?')) return;
    const newEv = {
      id: ev ? ev.id : 'evt-'+Date.now()+'-'+Math.floor(Math.random()*1000),
      kind:'event', title, time: startTime, endTime,
      notes: document.getElementById('ef-notes').value.trim(),
      shared: document.getElementById('ef-shared').checked,
      recurring: isRecurring,
      date: isRecurring ? null : dateVal,
      weekday: isRecurring ? weekdayOf(dateVal) : undefined,
      startDate: isRecurring ? dateVal : undefined
    };
    if(ev) events = events.map(e=>e.id===ev.id ? newEv : e);
    else events.push(newEv);
    await saveEvents();
    await mirrorToPartner('event', newEv, false);
    mount.innerHTML = '';
    showView(activeView);
  });
}

function openChoreForm(mountId){
  const mount = document.getElementById(mountId);
  const daySet = new Set();
  mount.innerHTML = '<div class="inline-form"><h3>New recurring chore</h3><div class="ff-grid">'+
    '<div class="f" style="grid-column:1/-1;"><label>Title</label><input type="text" id="cf-title" required placeholder="e.g. Take out trash"></div>'+
    '<div class="weekday-picker" id="cf-weekdays">'+DAY_SHORT.map(function(s,i){ return '<button type="button" data-day="'+i+'">'+s+'</button>'; }).join('')+'</div>'+
    '<label class="ff-check"><input type="checkbox" id="cf-shared"> Share with '+otherProfile(activeProfile)+'</label>'+
    '<label class="ff-check" id="cf-rotate-wrap" style="display:none;"><input type="checkbox" id="cf-rotates"> Alternate whose turn each week</label>'+
    '<div class="ff-actions"><button class="btn primary" id="cf-save">Add chore</button><button class="btn ghost" id="cf-cancel">Cancel</button></div>'+
    '</div></div>';
  mount.scrollIntoView({behavior:'smooth', block:'center'});

  mount.querySelectorAll('#cf-weekdays button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const d = Number(btn.dataset.day);
      if(daySet.has(d)){ daySet.delete(d); btn.classList.remove('on'); }
      else{ daySet.add(d); btn.classList.add('on'); }
    });
  });
  document.getElementById('cf-shared').addEventListener('change', e=>{
    document.getElementById('cf-rotate-wrap').style.display = e.target.checked ? 'flex' : 'none';
  });
  document.getElementById('cf-cancel').addEventListener('click', ()=>{ mount.innerHTML=''; });
  document.getElementById('cf-save').addEventListener('click', async ()=>{
    const title = document.getElementById('cf-title').value.trim();
    if(!title || !daySet.size){
      if(!title) document.getElementById('cf-title').style.outline='2px solid var(--danger)';
      return;
    }
    const newChore = {
      id: 'chore-'+Date.now()+'-'+Math.floor(Math.random()*1000),
      title, weekdays: [...daySet].sort(),
      shared: document.getElementById('cf-shared').checked,
      rotates: document.getElementById('cf-shared').checked ? document.getElementById('cf-rotates').checked : false,
      rotateStart: todayStr()
    };
    chores.push(newChore);
    await saveChores();
    await mirrorToPartner('chore', newChore, false);
    mount.innerHTML = '';
    showView(activeView);
  });
}

} // end firebase-available guard
