<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  /* These match the Hub shell's own tokens exactly (assets/app.css's
     :root), same as the Calendar/Todo restyle — Schedule was previously
     running its own unrelated dark-green palette (#1F3B32 etc.). The
     per-category routine colors (sleep/fitness/code/meal/…) stay
     distinct on purpose, same reasoning as Calendar's per-source event
     colors — only the page chrome changes here. */
  :root{
    --bg:#F4F4F0; --surface:#FFFFFF; --surface-alt:#F2F0E9;
    --border:#E3E3DC; --border-soft:#ECECE6;
    --text:#20211E; --text-soft:#74766F; --text-faint:#9C9E97;
    --accent:#AD7B20; --accent-soft:#F7EFD9; --accent-deep:#6F4A08;
    --gold:#6F4A08; --gold-soft:#F7EFD9;
    --danger:#B8493F; --danger-soft:#FAECEA;
    --radius-lg:16px; --radius-md:11px; --radius-sm:8px;
    --shadow:0 18px 50px rgba(37,38,32,.08);
  }
  /* Same accent swap the Hub shell itself uses for Anusha's profile. */
  body[data-profile="anusha"]{--accent:#B25C78;--accent-soft:#FAEAF0;--accent-deep:#813B53;--gold:#813B53;--gold-soft:#FAEAF0;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:14px 12px 60px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:min(94vw,1680px);margin:0 auto;}
  h1,h2,h3{font-family:'Manrope',sans-serif;}
  button,input,select{font-family:inherit;}
  a{color:var(--accent);}

  .auth-overlay,.profile-overlay{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-box{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px 24px;text-align:center;box-shadow:var(--shadow);}
  .auth-box h2{font-size:21px;margin:0 0 4px;}
  .auth-box p{color:var(--text-soft);font-size:15px;margin:0 0 16px;}
  .auth-box input{width:100%;font-size:15.5px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px;}
  .auth-box button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:9px;font-size:15.5px;font-weight:700;cursor:pointer;}
  .auth-toggle{margin-top:10px;font-size:14px;color:var(--text-soft);}
  .auth-toggle button{background:none;color:var(--gold);text-decoration:underline;font-weight:600;width:auto;padding:0 0 0 4px;}
  .auth-error{color:var(--danger);font-size:14px;min-height:14px;margin-bottom:6px;}

  .profile-inner{text-align:center;}
  .profile-inner h1{font-size:24px;margin:0 0 30px;}
  .profile-row{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;}
  .profile-card{background:none;border:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;}
  .profile-avatar{width:92px;height:92px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff;border:3px solid transparent;font-family:'Manrope',sans-serif;}
  .profile-card:hover .profile-avatar{border-color:var(--accent);}
  .av-b{background:linear-gradient(135deg,#AD7B20,#C9A227);}
  .av-a{background:linear-gradient(135deg,#B25C78,#D68CA4);}
  .profile-name{font-size:16px;font-weight:600;color:var(--text-soft);}

  .topbar{margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .topbar a.back,.topbar button.switch{font-size:14px;color:var(--text-soft);text-decoration:none;background:none;border:none;cursor:pointer;padding:0;}
  /* Hidden when embedded in the Hub's app viewer — its own "Back to Hub"
     button already handles this safely; this in-page link, if clicked
     inside the iframe, would load a second copy of the whole Hub inside
     itself instead (the nested-Home-Hub bug). */
  body.embedded .topbar a.back{display:none}

  /* Hidden entirely when embedded in the Hub's app viewer — the Hub's own
     top bar already shows the profile capsule there (see app-frame-
     profile in index.html/app.js), same pattern as Todo. Standalone
     (opened in its own tab), it's the only copy, doubling as the click
     -to-switch-profile control. */
  body.embedded header.app-head{display:none}
  header.app-head{text-align:center;margin-bottom:12px;}
  header.app-head .who-badge{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 12px 3px 4px;margin-bottom:6px;cursor:pointer;font-family:inherit;}
  header.app-head .who-badge:hover{background:var(--accent-soft);}
  header.app-head .who-avatar{width:20px;height:20px;border-radius:6px;font-size:12.5px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;}
  header.app-head .who-avatar.av-b{background:#AD7B20;}
  header.app-head .who-avatar.av-a{background:#B25C78;}
  header.app-head .who-name{font-size:14px;font-weight:700;}
  header.app-head h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-0.01em;}

  .schedule-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
  .schedule-toolbar .search-bar{flex:1;min-width:220px;margin-bottom:0;}
  .segmented{flex:none;max-width:320px;margin:0;background:var(--surface-alt);border-radius:999px;padding:3px;display:flex;gap:2px;}
  .segmented button{flex:1;border:none;background:transparent;border-radius:999px;padding:7px 14px;font-size:14.5px;font-weight:700;color:var(--text-soft);cursor:pointer;white-space:nowrap;}
  .segmented button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
  @media(max-width:640px){
    .schedule-toolbar{flex-direction:column;align-items:stretch;}
    .segmented{max-width:none;}
  }

  .notif-banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius-md);padding:8px 12px;margin-bottom:10px;font-size:13.5px;color:var(--accent-deep);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

  .search-bar{margin-bottom:10px;position:relative;}
  .search-bar input{width:100%;font-size:15px;padding:8px 12px;border-radius:var(--radius-md);border:1px dashed var(--border);background:var(--surface-alt);}
  #search-results{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:6px;margin:-4px 0 10px;max-height:280px;overflow-y:auto;}
  .search-result-row{padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;}
  .search-result-row:hover{background:var(--surface-alt);}
  .search-result-row .sr-title{font-size:15.5px;font-weight:600;}
  .search-result-row .sr-meta{font-size:13px;color:var(--text-faint);margin-top:2px;}
  .search-empty{padding:10px;font-size:14.5px;color:var(--text-faint);font-style:italic;}
  .notif-banner button{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:4px 10px;font-size:13.5px;font-weight:700;cursor:pointer;}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:9px 10px;box-shadow:var(--shadow);}
  .stat-card .sc-label{font-size:12px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;}
  .stat-card .sc-value{font-family:'Manrope',sans-serif;font-weight:800;font-size:17px;margin-top:1px;}

  .section-title{font-family:'Manrope',sans-serif;font-size:15px;font-weight:700;color:var(--text-soft);margin:14px 0 6px;display:flex;align-items:center;gap:6px;}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border);}

  .row-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius-sm);border-bottom:1px solid var(--border-soft);background:var(--surface);}
  .row-item.auto{border-style:dashed;background:var(--surface-alt);}
  .row-item.mirrored{opacity:0.85;}
  .row-time{font-family:'Manrope',sans-serif;font-weight:700;font-size:13.5px;color:var(--text-soft);min-width:42px;}
  .row-body{flex:1;min-width:0;}
  .row-title{font-size:15px;font-weight:600;outline:none;}
  .row-title[contenteditable]:hover,.row-title[contenteditable]:focus{border-bottom:1px dashed var(--border);}
  .row-title.strike{text-decoration:line-through;color:var(--text-faint);}
  .row-meta{font-size:12.5px;color:var(--text-faint);margin-top:1px;}
  .tag{font-size:11.5px;font-weight:700;border-radius:20px;padding:1px 7px;}
  .tag.shared{background:var(--gold-soft);color:var(--gold);}
  .tag.auto{background:var(--surface);border:1px solid var(--border);color:var(--text-faint);}
  .row-actions{display:flex;gap:4px;flex:none;}
  .icon-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:14.5px;padding:2px;}
  .icon-btn:hover{color:var(--text);}
  .empty-note{color:var(--text-faint);font-style:italic;font-size:14px;padding:6px 3px;}

  .chk{appearance:none;width:17px;height:17px;border-radius:5px;border:2px solid var(--border);flex:none;cursor:pointer;position:relative;background:var(--surface);}
  .chk:checked{background:var(--accent);border-color:var(--accent);}
  .chk:checked::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}

  .add-bar{display:flex;justify-content:center;margin:8px 0;}
  .add-btn{background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:700;cursor:pointer;}

  .inline-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow);}
  .inline-form h3{font-size:15px;margin:0 0 8px;}
  .ff-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;}
  @media(max-width:520px){.ff-grid{grid-template-columns:1fr 1fr;}}
  .ff-grid .f{display:flex;flex-direction:column;gap:2px;}
  .ff-grid label{font-size:11.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;}
  .ff-grid input,.ff-grid select{font-size:14.5px;padding:6px 7px;border-radius:var(--radius-sm);border:1px solid var(--border);}
  .ff-check{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text-soft);}
  .weekday-picker{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/-1;}
  .weekday-picker button{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surface-alt);font-size:12.5px;font-weight:700;color:var(--text-soft);cursor:pointer;}
  .weekday-picker button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ff-actions{grid-column:1/-1;display:flex;gap:6px;margin-top:2px;}
  .btn{font-size:14px;font-weight:700;border:none;border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.ghost{background:var(--surface-alt);color:var(--text-soft);}
  .btn.danger{background:none;color:var(--danger);}

  .day-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);overflow:hidden;margin-bottom:6px;}
  .day-head{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .day-head.today{background:var(--accent-soft);}
  .day-head .dh-name{font-family:'Manrope',sans-serif;font-weight:700;font-size:14.5px;}
  .day-head .dh-date{font-size:12.5px;color:var(--text-faint);margin-left:5px;}
  .day-head .dh-count{font-size:12.5px;color:var(--text-faint);font-weight:700;}
  .day-content{padding:0 12px 10px;display:none;}
  .day-content.open{display:block;}

  .view-toggle-mini{display:flex;gap:4px;background:var(--surface-alt);border-radius:999px;padding:3px;width:fit-content;margin-bottom:10px;}
  .view-toggle-mini button{border:none;background:transparent;color:var(--text-soft);font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;cursor:pointer;}
  .view-toggle-mini button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}

  .cal-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);}
  .cal-grid{display:grid;grid-template-columns:44px repeat(7,minmax(84px,1fr));min-width:680px;}
  .cal-headrow{display:contents;}
  .cal-daylabel{font-size:13px;font-weight:700;color:var(--text-soft);text-align:center;padding:6px 2px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);}
  .cal-daylabel.today{color:var(--gold);}
  .cal-timecol{position:relative;border-right:1px solid var(--border-soft);}
  .cal-timelabel{position:absolute;right:4px;font-size:11.5px;color:var(--text-faint);transform:translateY(-50%);}
  .cal-daycol{position:relative;border-right:1px solid var(--border-soft);background-image:repeating-linear-gradient(to bottom, var(--border-soft) 0, var(--border-soft) 1px, transparent 1px, transparent 56px);}
  .cal-daycol.today{background-color:rgba(201,162,39,0.04);}
  .cal-block{
    position:absolute;left:2px;right:2px;border-radius:5px;border-left:3px solid;padding:2px 5px;overflow:hidden;
    font-size:12px;line-height:1.25;cursor:pointer;
  }
  .cal-block .cb-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-block.done{opacity:0.45;}
  .cal-dragsel{position:absolute;left:2px;right:2px;background:var(--accent);opacity:0.25;border-radius:5px;pointer-events:none;}

  details.reference{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:9px 12px;margin-top:12px;box-shadow:var(--shadow);}
  details.reference summary{cursor:pointer;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;list-style:none;}
  details.reference summary::-webkit-details-marker{display:none;}
  details.reference summary::before{content:'▸ ';color:var(--text-faint);}
  details.reference[open] summary::before{content:'▾ ';}
  details.reference p{font-size:13.5px;color:var(--text-soft);line-height:1.5;margin:6px 0 0;}

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  @media(max-width:520px){.stats-grid{grid-template-columns:1fr;}}
  .stat-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;box-shadow:var(--shadow);}
  .stat-block .sb-label{font-size:12px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;}
  .stat-block .sb-value{font-family:'Manrope',sans-serif;font-weight:800;font-size:21px;margin-top:2px;}

  .cat-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .cat-bar-label{font-size:13.5px;width:74px;flex:none;color:var(--text-soft);}
  .cat-bar-track{flex:1;height:9px;background:var(--surface-alt);border-radius:20px;overflow:hidden;}
  .cat-bar-fill{height:100%;border-radius:20px;}
  .cat-bar-val{font-size:12.5px;color:var(--text-faint);width:44px;text-align:right;flex:none;}

  .streak-row{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;border-bottom:1px solid var(--border-soft);font-size:15px;}
  .streak-row:last-child{border-bottom:none;}
  .day-completion-row{display:flex;gap:5px;align-items:flex-end;height:70px;margin-bottom:6px;}
  .day-completion-bar{flex:1;background:var(--accent);border-radius:4px 4px 0 0;position:relative;min-height:2px;}
  .day-completion-labels{display:flex;gap:5px;}
  .day-completion-labels span{flex:1;text-align:center;font-size:12px;color:var(--text-faint);}

  /* ---- Daily routine timeline ---- */
  .routine-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .progress-ring{position:relative;width:54px;height:54px;flex:none;}
  .progress-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .progress-ring .ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;}
  .routine-summary{flex:1;}
  .routine-summary .rs-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:16.5px;}
  .routine-summary .rs-sub{font-size:13.5px;color:var(--text-faint);margin-top:1px;}
  .cat-legend{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
  .cat-chip{font-size:11.5px;font-weight:700;border-radius:20px;padding:5px 11px;border:none;cursor:pointer;transition:transform .1s ease;}
  .cat-chip:hover{transform:translateY(-1px);}
  .cat-chip-active{box-shadow:0 2px 8px rgba(0,0,0,0.18);}

  .routine-block{
    display:flex;align-items:center;gap:9px;padding:7px 9px 7px 10px;border-radius:var(--radius-sm);
    background:var(--surface);margin-bottom:4px;border-left:4px solid transparent;transition:opacity .15s ease;
  }
  .routine-block.done{opacity:0.5;}
  .routine-block.now{box-shadow:0 0 0 1.5px var(--gold);}
  .routine-chk{appearance:none;width:19px;height:19px;border-radius:6px;border:2px solid var(--border);flex:none;cursor:pointer;position:relative;background:var(--surface);}
  .routine-chk:checked{background:var(--accent);border-color:var(--accent);}
  .routine-chk:checked::after{content:'';position:absolute;left:4.5px;top:1.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .rb-body{flex:1;min-width:0;}
  .rb-title{font-size:15px;font-weight:600;outline:none;}
  .rb-title[contenteditable]:hover,.rb-title[contenteditable]:focus{border-bottom:1px dashed var(--border);}
  .rb-title.strike{text-decoration:line-through;color:var(--text-faint);}
  .rb-time-edit{display:flex;align-items:center;gap:5px;margin-top:4px;}
  .rb-time-input{
    font-size:13px;color:var(--text-faint);background:transparent;border:none;padding:2px 3px;
    border-radius:4px;width:98px;font-family:'Inter',sans-serif;
  }
  .rb-time-input::-webkit-calendar-picker-indicator{width:14px;height:14px;padding:0;margin-left:2px;}
  .rb-time-input:hover,.rb-time-input:focus{background:var(--surface-alt);color:var(--text-soft);outline:none;}
  .rb-time-dash{font-size:13px;color:var(--text-faint);}
  .rb-cat{font-size:11.5px;font-weight:700;border-radius:20px;padding:1px 7px;flex:none;}
  .rb-status{font-weight:800;font-size:12px;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .rb-status.done{background:var(--accent-soft);color:var(--accent-deep);}
  .rb-status.missed{background:var(--danger-soft);color:var(--danger);}
  .now-badge{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:0.04em;margin-left:4px;}
  /* "Hide done" toggle on the routine panel — checked-off blocks pile up
     as the day goes on and push what's actually next off the bottom of
     the screen, so this collapses them out of the list (reversible with
     the same button) instead of making you scroll past them. */
  /* "Show all" reveals routine blocks whose time has passed; by default
     those auto-hide (regardless of done/not-done) so you don't scroll
     past things you can't act on anymore. */
  .routine-hide-past .routine-block.past{display:none;}

  .template-editor{margin-top:10px;}
  .te-daygroup{margin-bottom:12px;}
  .te-daygroup h4{font-size:14px;margin:0 0 6px;color:var(--text-soft);}
  .te-block-row{display:flex;align-items:center;gap:5px;margin-bottom:4px;}
  .te-block-row input[type=time]{font-size:13.5px;padding:4px 5px;border-radius:6px;border:1px solid var(--border);width:82px;}
  .te-block-row input[type=text]{flex:1;font-size:14px;padding:5px 7px;border-radius:6px;border:1px solid var(--border);}
  .te-block-row button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14.5px;}
  .te-add-row{font-size:13.5px;color:var(--accent);background:none;border:1px dashed var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;margin-top:2px;}

  /* ---- Today view rebuild: hero + metrics + day intelligence + task/
     event/chore panels — ported from the more advanced Schedule
     prototype, reskinned to this file's own Hub-matched tokens above
     (the prototype's near-black #171714 accents become --accent-deep,
     etc.) rather than copying its literal colors. ---- */
  /* ---- Horizontal control bar — one slim strip under the hero card,
     holding date-nav + Today/+Add/Weekly + the routine/chores/open-task
     counts + Find-time/Focus, all inline, instead of a separate card. ---- */
  .control-bar{display:flex;align-items:center;flex-wrap:wrap;gap:14px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:10px 14px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;}
  .cb-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .cb-nav button{width:30px;height:30px;border:1px solid var(--border);background:var(--surface-alt);border-radius:var(--radius-sm);color:var(--text);font-size:15px;cursor:pointer;flex:none;}
  .cb-nav input{height:30px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);padding:0 8px;color:var(--text);font-weight:700;font-size:12.5px;width:132px;}
  .cb-pill{border:0;border-radius:var(--radius-sm);padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;}
  .cb-today{background:var(--accent-soft);color:var(--accent-deep);}
  .cb-add{background:var(--accent);color:#fff;}
  .cb-weekly,.cb-tool{background:var(--surface-alt);color:var(--text-soft);}
  .cb-metrics{gap:14px;padding-left:12px;border-left:1px solid var(--border-soft);}
  .cb-metric{font-size:12px;color:var(--text-faint);white-space:nowrap;}
  .cb-metric strong{color:var(--text);font-family:'Manrope',sans-serif;font-weight:800;}
  .cb-tools{margin-left:auto;padding-left:12px;border-left:1px solid var(--border-soft);}
  @media(max-width:900px){
    .cb-metrics,.cb-tools{border-left:0;padding-left:0;margin-left:0;}
  }

  .today-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(230px,.7fr);gap:16px;background:var(--accent-deep);color:#fff;border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow);}
  .today-hero::after{content:'';position:absolute;width:230px;height:230px;border-radius:50%;right:-90px;top:-125px;background:rgba(255,255,255,.08);}
  .hero-eyebrow{position:relative;z-index:1;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.65);font-weight:800;margin-bottom:8px;}
  .hero-title{position:relative;z-index:1;font-family:'Manrope',sans-serif;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.15;}
  .hero-time{position:relative;z-index:1;font-size:13.5px;color:rgba(255,255,255,.72);margin-top:6px;}
  .hero-next{position:relative;z-index:1;border-left:1px solid rgba(255,255,255,.18);padding-left:16px;display:flex;flex-direction:column;justify-content:center;}
  .hero-next-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.55);font-weight:800;}
  .hero-next-title{font-family:'Manrope',sans-serif;font-size:16px;font-weight:800;margin-top:4px;}
  .hero-next-meta{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:3px;}

  .today-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px;}
  .metric{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:11px 13px;box-shadow:var(--shadow);}
  .metric-label{font-size:10.5px;color:var(--text-faint);font-weight:800;text-transform:uppercase;letter-spacing:.06em;}
  .metric-value{font-family:'Manrope',sans-serif;font-weight:800;font-size:18px;margin-top:3px;}

  /* Tasks / Routine / Events+Chores as three content columns. */
  .today-layout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start;}
  .events-chores-col{min-width:0;}
  @media(max-width:1100px){
    .today-layout{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:760px){
    .today-layout{grid-template-columns:1fr;}
  }
  .panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow);}
  .panel + .panel{margin-top:12px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;}
  .panel-title{font-family:'Manrope',sans-serif;font-size:15.5px;font-weight:800;letter-spacing:-.01em;}
  .panel-subtitle{font-size:12px;color:var(--text-faint);margin-top:2px;}
  .panel-action{border:0;background:var(--accent-soft);color:var(--accent-deep);padding:6px 10px;border-radius:var(--radius-sm);font-size:12px;font-weight:800;cursor:pointer;}

  .task-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border-soft);}
  .task-row:last-child{border-bottom:0;}
  .task-row.overdue{background:var(--danger-soft);border-radius:var(--radius-sm);padding-left:8px;padding-right:8px;margin-bottom:4px;}
  .task-title{font-size:14px;font-weight:600;}
  .task-row.done .task-title{text-decoration:line-through;color:var(--text-faint);}
  .task-meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .task-time{color:var(--accent);}
  .priority-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:2px;background:var(--text-faint);}
  .priority-dot.high{background:var(--danger);}
  .priority-dot.medium{background:var(--gold);}
  .priority-dot.low{background:var(--accent);}
  .task-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
  .task-actions button{border:0;background:var(--surface-alt);color:var(--text-soft);border-radius:7px;min-height:28px;padding:3px 7px;font-size:11.5px;font-weight:700;cursor:pointer;}

  .quick-chooser{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px;}
  .quick-choice{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-md);padding:12px;text-align:left;cursor:pointer;}
  .quick-choice strong{display:block;font-size:13.5px;color:var(--text);}
  .quick-choice span{display:block;font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .form-warning{grid-column:1/-1;background:var(--accent-soft);color:var(--accent-deep);border-radius:var(--radius-sm);padding:7px 10px;font-size:12px;display:none;}


  /* ---- Generic modal shell, shared by Quick-add and the Weekly popup. ---- */
  .sched-modal-overlay{position:fixed;inset:0;background:rgba(32,33,30,.45);z-index:160;display:flex;align-items:center;justify-content:center;padding:16px;}
  .sched-modal-body{background:var(--surface);border-radius:var(--radius-lg);box-shadow:0 24px 60px rgba(37,38,32,.28);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:18px 20px;}
  .sched-modal-body.weekly-modal-body{max-width:960px;}
  .sched-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;}
  .sched-modal-head h2{font-family:'Manrope',sans-serif;font-size:17px;margin:0;}
  .sched-modal-close{border:0;background:var(--surface-alt);width:30px;height:30px;border-radius:var(--radius-sm);color:var(--text-soft);cursor:pointer;font-size:15px;flex:none;}

  /* ---- Inline Focus panel — a lean focus-clock timer embedded right in
     Schedule (not a link out to the Clock app, and not a new pop-out),
     so hitting Focus on a task starts a real countdown without leaving
     the page. It renders above Events/Chores, pushing them down, and
     completed sessions save to the same place the Clock app keeps them
     so the "minutes today" stat matches in both apps. ---- */
  .focus-inline-card{background:linear-gradient(155deg,var(--accent-deep),var(--accent));color:#fff;border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden;}
  .focus-inline-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;position:relative;z-index:1;}
  .focus-inline-head h3{margin:0;font-family:'Manrope',sans-serif;font-size:14px;font-weight:800;}
  .focus-inline-task{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:2px;}
  .focus-inline-close{border:0;background:rgba(255,255,255,.18);color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:13px;flex:none;}
  .focus-inline-body{display:flex;align-items:center;gap:16px;position:relative;z-index:1;flex-wrap:wrap;}
  .focus-ring-wrap{position:relative;width:104px;height:104px;flex:none;}
  .focus-ring-wrap.running{animation:focusBreathe 3.2s ease-in-out infinite;}
  @keyframes focusBreathe{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0));}50%{filter:drop-shadow(0 0 9px rgba(255,255,255,.4));}}
  .focus-ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .fring-track{fill:none;stroke:rgba(255,255,255,.22);stroke-width:8;}
  .fring-sweep{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .focus-ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .focus-big-time{font-family:'Manrope',sans-serif;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;}
  .focus-mode-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.7);margin-top:2px;}
  .focus-inline-controls{flex:1;min-width:160px;display:flex;flex-direction:column;gap:8px;}
  .focus-presets{display:flex;gap:6px;flex-wrap:wrap;}
  .focus-preset-btn{border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.1);color:#fff;border-radius:var(--radius-sm);padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;}
  .focus-preset-btn.active{background:#fff;color:var(--accent-deep);border-color:#fff;}
  .focus-ctrl-row{display:flex;gap:8px;flex-wrap:wrap;}
  .focus-ctrl-row button{border:0;border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer;}
  .focus-start-btn{background:#fff;color:var(--accent-deep);}
  .focus-pause-btn{background:rgba(255,255,255,.2);color:#fff;}
  .focus-end-btn{background:rgba(240,89,107,.9);color:#fff;}
  .focus-today-total{font-size:10.5px;color:rgba(255,255,255,.72);}
  .task-actions button.focus-task-btn{background:var(--accent-soft);color:var(--accent-deep);}

  /* Free-time finder RESULTS — explicitly not a dedicated inline/full-
     width section (the prototype uses grid-column:1/-1, stealing a
     fixed slot in the layout at all times). It floats instead: pinned
     to the bottom-right on desktop so it doesn't push Today's panels
     around, and becomes a full-width bottom sheet on phone so it never
     breaks the mobile layout. Opened/closed via the Find-time button. */
  .free-time-panel{
    position:fixed; right:20px; bottom:20px; width:min(360px, calc(100vw - 32px));
    max-height:min(70vh, 520px); overflow-y:auto; z-index:130;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:16px 18px; box-shadow:0 20px 55px rgba(37,38,32,.22);
  }
  .free-time-panel[hidden]{display:none;}
  .free-time-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
  .free-time-head h2{font-size:15px;margin:0 0 3px;font-family:'Manrope',sans-serif;}
  .free-time-head p{font-size:12px;color:var(--text-soft);margin:0;}
  .free-time-close{border:0;background:var(--surface-alt);width:30px;height:30px;border-radius:var(--radius-sm);color:var(--text-soft);flex:none;cursor:pointer;font-size:15px;}
  .free-slot-list{display:flex;flex-direction:column;gap:8px;}
  .free-slot{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 11px;}
  .free-slot strong{font-size:13px;font-weight:700;}
  .free-slot small{display:block;color:var(--text-soft);font-size:11.5px;margin-top:3px;}
  .free-slot button{margin-top:8px;border:0;background:var(--accent-soft);color:var(--accent-deep);border-radius:var(--radius-sm);padding:6px 9px;font-size:11.5px;font-weight:700;cursor:pointer;}

  @media(max-width:760px){
    .today-hero{grid-template-columns:1fr;padding:18px;border-radius:var(--radius-lg);gap:14px;}
    .hero-next{border-left:0;border-top:1px solid rgba(255,255,255,.18);padding:12px 0 0;}
    .today-metrics{gap:6px;}
    .metric{padding:9px 8px;border-radius:var(--radius-sm);}
    .metric-value{font-size:15px;}
    .today-layout{grid-template-columns:1fr;gap:12px;}
    .control-nav{flex-wrap:wrap;}
    .panel{padding:13px;border-radius:var(--radius-md);}
    .task-actions .move-label{display:none;}
    .quick-chooser{grid-template-columns:1fr;}
    .free-time-summary{grid-template-columns:1fr 1fr;}
    .free-time-summary>div:last-child{grid-column:1/-1;}
    .focus-inline-body{flex-direction:column;align-items:stretch;}
    .sched-modal-body{padding:14px 15px;}
    /* the floating panel becomes a full-width bottom sheet instead of a
       fixed-width corner card, so it never overflows a narrow screen */
    .free-time-panel{ left:10px; right:10px; bottom:10px; width:auto; max-height:60vh; }
  }
  @media(max-width:480px){
    .today-metrics{grid-template-columns:1fr 1fr;}
    .today-metrics .metric:last-child{grid-column:1/-1;}
  }

  :focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
</style>
</head>

<script>try{ if(window.self !== window.top) document.body.classList.add('embedded'); }catch(e){ document.body.classList.add('embedded'); }</script>

<div id="conn-loading" style="position:fixed;inset:0;z-index:250;background:#F4F4F0;display:flex;align-items:center;justify-content:center;padding:20px;">

<script>
window.addEventListener('error', function(e){
  const gate = document.getElementById('fb-load-error');
  if(gate) return; // already shown
  if(typeof firebase !== 'undefined') return; // a different, unrelated error — don't misattribute it
  showFirebaseLoadError();
});
function showFirebaseLoadError(){
  const box = document.querySelector('.auth-box');
  if(!box || document.getElementById('fb-load-error')) return;
  const msg = document.createElement('div');
  msg.id = 'fb-load-error';
  msg.style.cssText = 'background:#FAECEA;color:#B8493F;border-radius:10px;padding:11px 13px;font-size:12.5px;font-weight:600;margin-bottom:14px;';
  msg.textContent = "Couldn't load — check your internet connection and refresh the page.";
  box.insertBefore(msg, box.firstChild.nextSibling);
}
if(typeof firebase === 'undefined'){
  showFirebaseLoadError();
} else {
/* =====================================================================
   FIREBASE
===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBe01eR2RZwSbU_aoJMeh_2MMJ5mqkVuKk",
  authDomain: "iron-log-bfc55.firebaseapp.com",
  projectId: "iron-log-bfc55",
  storageBucket: "iron-log-bfc55.firebasestorage.app",
  messagingSenderId: "106586808946",
  appId: "1:106586808946:web:f4736554ba9fc82c6fd8eb"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
let currentUser = null;
let activeProfile = null;

// If Firebase Auth's own callback never fires — a real network issue,
// a blocked request, anything — the person was previously left staring
// at a fully-rendered but non-functional page with zero feedback. This
// guarantees they see an actual message instead of silence.
let authResolved = false;
setTimeout(function(){
  if(authResolved) return;
  const txt = document.getElementById('conn-loading-text');
  if(txt) txt.innerHTML = "This is taking longer than expected.<br>Check your connection, then <a href=\"#\" onclick=\"location.reload();return false;\" style=\"color:#AD7B20;font-weight:700;\">tap here to retry</a>.";
}, 7000);
function hideConnLoading(){
  authResolved = true;
  const el = document.getElementById('conn-loading');
  if(el) el.style.display = 'none';
}

function profileDoc(profileId, key){
  return db.collection('users').doc(currentUser.uid).collection('schedule-profiles').doc(profileId).collection('data').doc(key);
}
function otherProfile(p){ return p==='Bhargav' ? 'Anusha' : 'Bhargav'; }

/* =====================================================================
   HOUSEHOLD CHORES SYNC — if this Schedule chore is linked to an entry
   in the Household Chores tracker, checking it off here also marks it
   done there (and logs it to that app's completion history).
===================================================================== */
function householdChoresDoc(key){
  return db.collection('users').doc(currentUser.uid).collection('apps').doc('chores').collection('data').doc(key);
}
async function syncChoreToHousehold(scheduleChoreId, profile, dateStr){
  try{
    const doc = await householdChoresDoc('chores').get();
    if(!doc.exists || !doc.data().json) return;
    let hcChores = JSON.parse(doc.data().json);
    const matched = hcChores.find(function(hc){
      return (hc.links||[]).some(function(l){ return l.profile===profile && l.scheduleChoreId===scheduleChoreId; });
    });
    if(!matched) return;
    matched.lastCompleted = dateStr;
    await householdChoresDoc('chores').set({json: JSON.stringify(hcChores)});
    const histDoc = await householdChoresDoc('history').get();
    let hist = (histDoc.exists && histDoc.data().json) ? JSON.parse(histDoc.data().json) : [];
    hist.unshift({date: dateStr, task: matched.name, by: profile, shift:null, notes:'Synced from Schedule'});
    await householdChoresDoc('history').set({json: JSON.stringify(hist)});
  }catch(e){ console.error('household sync failed', e); }
}

/* =====================================================================
   HOUSEHOLD CHORES — Schedule's Chores panel is no longer its own
   separate list. It reads and writes the SAME chores/history documents
   as the Household Chores app (same Firestore path as householdChoresDoc
   above), so a chore added, completed, or deleted from either app shows
   up in both. Due-date logic below is ported verbatim from that app's
   own nextDueFor()/statusFor() so "due today / overdue" agree exactly.
===================================================================== */
let householdChores = [];
let householdChoreHistory = [];
async function loadHouseholdChores(){
  try{ const doc = await householdChoresDoc('chores').get(); householdChores = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : []; }
  catch(e){ householdChores = []; }
}
async function saveHouseholdChores(){
  try{ await householdChoresDoc('chores').set({json: JSON.stringify(householdChores)}); }
  catch(e){ console.error('household chores save failed', e); }
}
async function loadHouseholdChoreHistory(){
  try{ const doc = await householdChoresDoc('history').get(); householdChoreHistory = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : []; }
  catch(e){ householdChoreHistory = []; }
}
async function saveHouseholdChoreHistory(){
  try{ await householdChoresDoc('history').set({json: JSON.stringify(householdChoreHistory)}); }
  catch(e){ console.error('household chore history save failed', e); }
}
function hcNextDue(chore){
  const today = todayStr();
  if(chore.freqType === 'asNeeded') return null;
  if(!chore.lastCompleted && chore.dueOverride) return chore.dueOverride;
  if(chore.freqType === 'daily') return chore.lastCompleted ? addDays(chore.lastCompleted,1) : today;
  if(chore.freqType === 'everyNDays') return chore.lastCompleted ? addDays(chore.lastCompleted, chore.freqDays) : today;
  if(chore.freqType === 'specificDays'){
    const start = chore.lastCompleted ? addDays(chore.lastCompleted,1) : today;
    for(let i=0;i<14;i++){
      const dd = addDays(start,i);
      if((chore.days||[]).indexOf(weekdayOf(dd)) !== -1) return dd;
    }
  }
  return today;
}
function hcStatusFor(chore){
  const nd = hcNextDue(chore);
  if(nd === null) return 'asneeded';
  const today = todayStr();
  if(nd < today) return 'overdue';
  if(nd === today) return 'today';
  return 'upcoming';
}
function hcFreqLabel(chore){
  if(chore.freqType==='asNeeded') return 'As needed';
  if(chore.freqType==='daily') return 'Every day';
  if(chore.freqType==='everyNDays') return 'Every '+chore.freqDays+' days';
  if(chore.freqType==='specificDays') return (chore.days||[]).map(w=>DAY_SHORT[w]).join(' ');
  return '';
}
function choresForProfileToday(){
  return householdChores.filter(c=>{
    if(!(c.assignedTo||[]).includes(activeProfile)) return false;
    const st = hcStatusFor(c);
    return st==='today' || st==='overdue';
  }).map(c=>Object.assign({}, c, { hcStatus: hcStatusFor(c) }));
}
function householdChoreDueOnDate(dateStrTarget){
  return householdChores.filter(c=>(c.assignedTo||[]).includes(activeProfile) && hcNextDue(c)===dateStrTarget);

function householdChoreRowHtml(c){

      '<div class="row-meta">'+hcFreqLabel(c)+(c.hcStatus==='overdue'?' · <span style="color:var(--danger);font-weight:700;">overdue</span>':'')+(isShared?' <span class="tag shared">'+(c.assignedTo||[]).join(' & ')+'</span>':'')+'</div></div>'+

function attachHouseholdChoreHandlers(wrap){
  wrap.querySelectorAll('[data-hchoreid]').forEach(cb=>cb.addEventListener('change', async e=>{
    if(!e.target.checked) return;
    const chore = householdChores.find(c=>c.id===e.target.dataset.hchoreid);
    if(!chore) return;
    const today = todayStr();
    chore.lastCompleted = today;
    householdChoreHistory.unshift({date:today, task:chore.name, by:activeProfile, rating:null, notes:'Completed from Schedule', recordedBy:activeProfile});
    await saveHouseholdChores();
    await saveHouseholdChoreHistory();
    showView(activeView);
  }));
  wrap.querySelectorAll('[data-delhchore]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const chore = householdChores.find(c=>c.id===btn.dataset.delhchore);
    if(!chore || !window.confirm('Delete chore "'+chore.name+'"?')) return;
    householdChores = householdChores.filter(c=>c.id!==chore.id);
    await saveHouseholdChores();
    showView(activeView);
  }));
}

/* =====================================================================
   TODO TASKS — Schedule's Task panel reads and writes the SAME
   personal/shared task documents as the Todo app (todo-profiles/<id>/
   data/tasks and todo-shared/data/tasks), so a task added, edited, or
   completed from either app shows up in both instead of Schedule
   keeping its own separate copy.
===================================================================== */
function todoProfileDoc(profileId, key){
  return db.collection('users').doc(currentUser.uid).collection('todo-profiles').doc(profileId).collection('data').doc(key);
}
function todoSharedDoc(key){
  return db.collection('users').doc(currentUser.uid).collection('todo-shared').doc(key);
}
let todoPersonalTasks = [];
let todoSharedTasks = [];
async function loadTodoTasks(){
  try{ const doc = await todoProfileDoc(activeProfile,'tasks').get(); todoPersonalTasks = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : []; }
  catch(e){ todoPersonalTasks = []; }
  try{ const doc2 = await todoSharedDoc('tasks').get(); todoSharedTasks = (doc2.exists && doc2.data().json) ? JSON.parse(doc2.data().json) : []; }
  catch(e){ todoSharedTasks = []; }
}
async function saveTodoPersonalTasks(){
  try{ await todoProfileDoc(activeProfile,'tasks').set({json: JSON.stringify(todoPersonalTasks)}); }
  catch(e){ console.error('todo personal tasks save failed', e); }
}
async function saveTodoSharedTasks(){
  try{ await todoSharedDoc('tasks').set({json: JSON.stringify(todoSharedTasks)}); }
  catch(e){ console.error('todo shared tasks save failed', e); }
}
async function saveTodoTasksFor(shared){ return shared ? saveTodoSharedTasks() : saveTodoPersonalTasks(); }
function allTodoTasks(){ return todoPersonalTasks.concat(todoSharedTasks); }
function findTodoTaskAnywhere(id){
  let t = todoPersonalTasks.find(x=>x.id===id);
  if(t) return {arr:todoPersonalTasks, t:t, shared:false};
  t = todoSharedTasks.find(x=>x.id===id);
  if(t) return {arr:todoSharedTasks, t:t, shared:true};
  return null;
}

function todoPriorityLabel(p){ return p===1?'P1':p===2?'P2':p===3?'P3':'No priority'; }

function weekParity(dateStr){
  const ref = dateObj('2026-01-03'); // a Saturday, so parity flips cleanly on Saturdays
  const weeksSince = Math.floor((dateObj(dateStr) - ref) / (7*86400000));
  return ((weeksSince % 2)+2)%2; // 0 = laundry week, 1 = deep-clean week

async function loadDayTemplates(){
  const seed = templateSeedForProfile();
  try{
    const doc = await profileDoc(activeProfile,'dayTemplates').get();
    let loaded = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : null;
    loaded = migrateOldTemplateFormat(loaded);
    const isEmpty = !loaded || Object.keys(loaded).length===0 || Object.values(loaded).every(arr=>!arr || !arr.length);
    if(loaded && !isEmpty){
      dayTemplates = loaded; // real saved content (possibly hand-edited) — never overwrite it
      // A day that's specifically empty (however it happened — a past
      // edit, an old bug) stayed empty forever before, since only the
      // *global* all-days-empty case triggered a reseed. This backfills
      // just that one day from the seed template, leaving every other
      // day's real saved content completely untouched.
      if(seed){
        TEMPLATE_KEYS.forEach(function(day){
          const dayEmpty = !dayTemplates[day] || !dayTemplates[day].length;
          if(dayEmpty && seed[day] && seed[day].length) dayTemplates[day] = JSON.parse(JSON.stringify(seed[day]));
        });
      }
      await saveDayTemplates(); // persist the migrated format
    } else if(seed){
      dayTemplates = JSON.parse(JSON.stringify(seed));
      await saveDayTemplates();
    } else {
      dayTemplates = loaded || {};
    }
  }catch(e){ dayTemplates = seed ? JSON.parse(JSON.stringify(seed)) : {}; }
  // Existing saved schedules keep whatever the person already edited, so a
  // seed change alone won't reach them — this renames only the exact,
  // untouched "Final review" block to add the skin routine alongside it,
  // and leaves anything already customized exactly as it is.
  if(activeProfile==='Bhargav'){
    let changed = false;
    Object.keys(dayTemplates).forEach(function(day){
      (dayTemplates[day]||[]).forEach(function(block){
        if(block.activity === 'Final review'){ block.activity = 'Final review + Skin routine'; changed = true; }
      });

    if(changed) await saveDayTemplates();
  }

// Resolves which variant of Bhargav's Saturday actually applies for a
// given date — but only auto-alternates if the stored content still
// matches the original, unedited seed. If he's hand-edited Saturday at
// all, that edit is respected exactly like any other day, and auto
// alternation stops (same "never overwrite what's been customized"
// rule used everywhere else in this app).
function resolveDayBlocks(profileKey, templateKey, dateStr){
  const stored = dayTemplates[templateKey] || [];
  if(profileKey === 'Bhargav' && templateKey === 'Saturday'){
    const laundryVariant = buildBhargavSaturday('laundry');
    const deepCleanVariant = buildBhargavSaturday('deepclean');
    const matchesVariant = function(variant){
      return stored.length === variant.length && stored.every(function(b,i){ return b.activity === variant[i].activity; });
    };
    if(matchesVariant(laundryVariant) || matchesVariant(deepCleanVariant)){
      return weekParity(dateStr) === 0 ? laundryVariant : deepCleanVariant;
    }
  }
  return stored;
}

function currentBlockIndex(blocks){

  if(nowMin < 270) nowMin += 1440; // before 4:30am counts as continuation of the prior day
  let idx = -1;
  blocks.forEach((b,i)=>{ if(toMinutes(b.start) <= nowMin) idx = i; });
  return idx;
}

// Generalized recurrence check shared with Calendar's meeting-scheduling
// layer (same event objects, read straight from this same Firestore doc)
// — old events (recurring:true/weekday/startDate, no repeat field) keep
// behaving exactly as before (implicit weekly), new ones can additionally
// set repeat:{type:'daily'|'weekly'|'monthly'|'yearly', until}.
function eventOccursOn(ev, dateStr){
  if(!ev.recurring) return ev.date === dateStr;
  if(!ev.startDate || dateStr < ev.startDate) return false;
  const repeat = ev.repeat || {type:'weekly', until:null};
  if(repeat.until && dateStr > repeat.until) return false;
  if(repeat.type==='daily') return true;
  if(repeat.type==='monthly') return dateObj(dateStr).getDate() === dateObj(ev.startDate).getDate();
  if(repeat.type==='yearly'){
    const d=dateObj(dateStr), s=dateObj(ev.startDate);
    return d.getMonth()===s.getMonth() && d.getDate()===s.getDate();
  }
  return weekdayOf(dateStr) === (ev.weekday!=null ? ev.weekday : weekdayOf(ev.startDate));
}
function eventsForDate(dateStr){
  const wd = weekdayOf(dateStr);
  const list = [];
  events.forEach(ev=>{
    if(eventOccursOn(ev, dateStr)) list.push(Object.assign({}, ev, {occDate:dateStr, auto:false}));
  });
  if(autoConfig.workoutsOn && WORKOUT_PATTERN[wd]){
    list.push({ id:'auto-workout-'+dateStr, title:WORKOUT_PATTERN[wd], time:'', occDate:dateStr, auto:true, link:'../gym/index.html' });
  }
  if(autoConfig.groceryOn && wd === autoConfig.groceryWeekday){
    list.push({ id:'auto-grocery-'+dateStr, title:"Grocery run (Costco / TJ's)", time:'', occDate:dateStr, auto:true, link:'../apps/grocery.html' });
  }
  return list.sort(timeSort);
}

function choreStreak(chore){
  let streak = 0, cursor = todayStr();
  for(let i=0;i<365;i++){
    if(choreDueOn(chore, cursor)){
      if(isChoreDone(chore.id, cursor)) streak++;
      else if(cursor !== todayStr()) break;
    }
    cursor = addDays(cursor, -1);
  }
  return streak;
}
function whoseTurn(chore, dateStr){
  if(!chore.rotates) return null;
  const ref = dateObj(chore.rotateStart || '2026-01-01');
  const weeksSince = Math.floor((dateObj(dateStr) - ref) / (7*86400000));
  const people = ['Bhargav','Anusha'];
  return people[((weeksSince % 2)+2)%2];
}
function choresDueOn(dateStr){
  return chores.filter(c=>choreDueOn(c,dateStr)).map(c=>Object.assign({}, c, {
    done: isChoreDone(c.id, dateStr), streak: choreStreak(c), turn: whoseTurn(c, dateStr), forDate: dateStr
  }));
}

function checkUpcoming(){
  if(notifPermission !== 'granted') return;
  const now = new Date(), today = todayStr();
  eventsForDate(today).forEach(ev=>{
    if(!ev.time) return;
    const notifKey = 'evt-'+ev.id+'-'+ev.occDate;
    if(notifiedToday.has(notifKey)) return;
    const parts = ev.time.split(':').map(Number);
    const evDate = new Date(now); evDate.setHours(parts[0],parts[1],0,0);
    const diffMin = (evDate-now)/60000;
    if(diffMin>0 && diffMin<=15){ fireNotification('Coming up: '+ev.title, ev.time, notifKey); notifiedToday.add(notifKey); saveNotifiedToday(); }
  });
  if(now.getHours()===20 && now.getMinutes()<5){
    const key = 'chore-evening-'+today;
    if(!notifiedToday.has(key)){
      const due = choresForProfileToday();
      if(due.length){ fireNotification('Chores left today', due.map(c=>c.name).join(', '), key); notifiedToday.add(key); saveNotifiedToday(); }
    }
  }
}

function runSearch(query){
  const el = document.getElementById('search-results');
  const q = query.trim().toLowerCase();
  if(!q){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display = 'block';

  const results = [];
  events.forEach(ev=>{

      results.push({ type:'Event', title:ev.title, meta: ev.recurring ? 'Weekly on '+DAY_NAMES[ev.weekday] : fmtHeaderDate(ev.date) });
    }
  });
  allTodoTasks().forEach(t=>{
    if(t.title.toLowerCase().includes(q) || (t.notes||'').toLowerCase().includes(q)){
      results.push({ type:'Task', title:t.title, meta: t.due ? fmtHeaderDate(t.due) : 'No due date' });
    }
  });
  householdChores.forEach(c=>{
    if(c.name.toLowerCase().includes(q)){
      results.push({ type:'Chore', title:c.name, meta: hcFreqLabel(c) });
    }
  });
  Object.entries(dayTemplates).forEach(([day, blocks])=>{
    (blocks||[]).forEach(b=>{
      if(b.activity.toLowerCase().includes(q)){
        results.push({ type:'Routine', title:b.activity, meta: day+' · '+fmt12(b.start)+'–'+fmt12(b.end) });
      }
    });
  });

  el.innerHTML = results.length
    ? results.slice(0,20).map(r=>'<div class="search-result-row"><div class="sr-title">'+escapeHtml(r.title)+'</div><div class="sr-meta">'+r.type+' · '+escapeHtml(r.meta)+'</div></div>').join('')

}

        '</div>'+
      '</div>'+
      statusBadge+
      '<span class="rb-cat" style="background:'+meta.soft+';color:'+meta.color+';">'+meta.label+'</span>'+
    '</div>';
  }).join('');

  return `
    <div class="routine-head">
      <div class="progress-ring">
        <svg viewBox="0 0 54 54">
          <circle cx="27" cy="27" r="22" fill="none" stroke="var(--surface-alt)" stroke-width="6"/>
          <circle cx="27" cy="27" r="22" fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="${circumference}" stroke-dashoffset="${circumference*(1-pct/100)}"/>
        </svg>

}

/* =====================================================================

===================================================================== */
function renderStats(){
  const el = document.getElementById('stats-view');

  // category minutes across one full week (fixed weekly rhythm from templates)
  const catMinutes = {};
  Object.values(dayTemplates).forEach(blocks=>{
    (blocks||[]).forEach(b=>{
      const cat = categorize(b.activity);
      const mins = (toMinutes(b.end) - toMinutes(b.start) + 1440) % 1440 || 1440;
      catMinutes[cat] = (catMinutes[cat]||0) + mins;
    });
  });
  const catEntries = Object.entries(catMinutes).sort((a,b)=>b[1]-a[1]);
  const maxMin = catEntries.length ? catEntries[0][1] : 1;

  const catBarsHtml = catEntries.length ? catEntries.map(([cat,mins])=>{
    const meta = CATEGORY_META[cat];
    const hrs = (mins/60).toFixed(1);
    const pct = Math.round(100*mins/maxMin);
    return '<div class="cat-bar-row"><span class="cat-bar-label">'+meta.label+'</span><div class="cat-bar-track"><div class="cat-bar-fill" style="width:'+pct+'%;background:'+meta.color+';"></div></div><span class="cat-bar-val">'+hrs+'h/wk</span></div>';
  }).join('') : '<div class="empty-note">No routine set up yet.</div>';

  // last 7 days completion %
  const days = [];
  for(let i=6;i>=0;i--){
    const d = addDays(todayStr(), -i);
    const prog = routineProgress(d);
    days.push({ d, label: DAY_SHORT[weekdayOf(d)], pct: prog.total ? Math.round(100*prog.done/prog.total) : null });
  }
  const barsHtml = days.map(x=> '<div class="day-completion-bar" style="height:'+(x.pct==null?2:Math.max(4,x.pct))+'%;opacity:'+(x.pct==null?0.15:1)+';" title="'+(x.pct==null?'No routine':x.pct+'%')+'"></div>').join('');
  const labelsHtml = days.map(x=>'<span>'+x.label+'</span>').join('');

  // chore streaks
  const streakList = chores.map(c=>({title:c.title, streak:choreStreak(c)})).sort((a,b)=>b.streak-a.streak);
  const streakHtml = streakList.length
    ? streakList.map(s=>'<div class="streak-row"><span>'+escapeHtml(s.title)+'</span><span>'+s.streak+'🔥</span></div>').join('')
    : '<div class="empty-note">No recurring chores yet.</div>';

  const totalMinutesWeek = Object.values(catMinutes).reduce((a,b)=>a+b,0);
  const avgCompletion = days.filter(x=>x.pct!=null).length
    ? Math.round(days.filter(x=>x.pct!=null).reduce((s,x)=>s+x.pct,0) / days.filter(x=>x.pct!=null).length)
    : null;

  el.innerHTML = '<div class="stats-grid">'+
    '<div class="stat-block"><div class="sb-label">Weekly routine time</div><div class="sb-value">'+(totalMinutesWeek/60).toFixed(0)+'h</div></div>'+
    '<div class="stat-block"><div class="sb-label">7-day avg completion</div><div class="sb-value">'+(avgCompletion!=null?avgCompletion+'%':'—')+'</div></div>'+
    '</div>'+
    '<div class="section-title" style="margin-top:0;">Time by category (weekly)</div>'+
    '<div class="stat-block">'+catBarsHtml+'</div>'+
    '<div class="section-title">Last 7 days — routine completion</div>'+
    '<div class="stat-block"><div class="day-completion-row">'+barsHtml+'</div><div class="day-completion-labels">'+labelsHtml+'</div></div>'+
    '<div class="section-title">Chore streaks</div>'+

/* =====================================================================
   CONFLICT DETECTION — used by the event form to warn (with a confirm
   gate) when a new/edited timed event overlaps another timed event or
   a routine block on the same day.
===================================================================== */
function findScheduleConflicts(dateStr, startTime, endTime, excludeId){
  if(!startTime) return [];
  const start = toMinutes(startTime), end = endTime && toMinutes(endTime)>start ? toMinutes(endTime) : start+45;
  const conflicts = [];
  eventsForDate(dateStr).forEach(item=>{
    if(item.id===excludeId || item.kind==='task' || item.auto || !item.time) return;
    const a=toMinutes(item.time), b=item.endTime&&toMinutes(item.endTime)>a?toMinutes(item.endTime):a+45;
    if(start<b && end>a) conflicts.push(item.title);
  });
  todaysBlocksFor(dateStr).forEach(block=>{
    const a=toMinutes(block.start), b=toMinutes(block.end);
    if(start<b && end>a) conflicts.push(block.activity);
  });
  allTodoTasks().forEach(t=>{
    if(t.id===excludeId || t.done || t.due!==dateStr || !t.dueTime) return;
    const a=toMinutes(t.dueTime), b=t.endTime&&toMinutes(t.endTime)>a?toMinutes(t.endTime):a+(Number(t.estimate)||45);
    if(start<b && end>a) conflicts.push(t.title);
  });
  return [...new Set(conflicts)];
}

/* =====================================================================
   DAY INTELLIGENCE + FREE-TIME FINDER — a short "here's how your day
   looks" briefing, plus a same-day gap finder. The Free-time finder's
   *results* are a floating panel (see .free-time-panel CSS above), per
   an explicit product decision to not give it a dedicated full-width
   spot in the layout.
===================================================================== */
function isFlexibleRoutineActivity(activity){
  return /free|flexible|open|reset/i.test(activity || '');
}
function formatMinutesCompact(minutes){
  const hrs = Math.floor(minutes/60), mins = minutes%60;
  if(hrs && mins) return hrs+'h '+mins+'m';
  if(hrs) return hrs+'h';
  return mins+'m';
}
function mergeIntervals(intervals){
  const sorted = intervals.filter(x=>x.end>x.start).sort((a,b)=>a.start-b.start);
  const merged = [];
  sorted.forEach(item=>{
    const last = merged[merged.length-1];
    if(last && item.start<=last.end) last.end = Math.max(last.end,item.end);
    else merged.push({start:item.start,end:item.end});
  });
  return merged;
}
function freeWindowsForDate(dateStr){
  const dayStart = activeProfile==='Bhargav' ? 270 : 300;
  const dayEnd = activeProfile==='Bhargav' ? 1290 : 1320;
  const busy = [];
  todaysBlocksFor(dateStr).forEach(block=>{
    if(isFlexibleRoutineActivity(block.activity)) return;
    const start=toMinutes(block.start), end=toMinutes(block.end);
    if(end<=start) return;
    busy.push({start:Math.max(dayStart,start),end:Math.min(dayEnd,end)});
  });
  eventsForDate(dateStr).forEach(item=>{
    if(!item.time) return;
    const start=toMinutes(item.time);
    const end=item.endTime&&toMinutes(item.endTime)>start ? toMinutes(item.endTime) : start+45;
    busy.push({start:Math.max(dayStart,start),end:Math.min(dayEnd,end)});
  });
  allTodoTasks().filter(t=>t.due===dateStr && t.dueTime && !t.done).forEach(item=>{
    const start=toMinutes(item.dueTime);
    const fallback = Number(item.estimate)||30;
    const end=item.endTime&&toMinutes(item.endTime)>start ? toMinutes(item.endTime) : start+fallback;
    busy.push({start:Math.max(dayStart,start),end:Math.min(dayEnd,end)});
  });
  const merged = mergeIntervals(busy);
  const windows=[];
  let cursor=dayStart;
  merged.forEach(item=>{
    if(item.start>cursor) windows.push({start:cursor,end:item.start});
    cursor=Math.max(cursor,item.end);
  });
  if(cursor<dayEnd) windows.push({start:cursor,end:dayEnd});
  const now = new Date();
  const nowMinutes = now.getHours()*60+now.getMinutes();
  return windows.map(slot=>({
    start:dateStr===todayStr()?Math.max(slot.start,nowMinutes):slot.start,
    end:slot.end
  })).filter(slot=>slot.end-slot.start>=20);
}
function rankedOpenTasks(tasks){
  const rankOf = t=> (!t.priority) ? 99 : t.priority; // Todo's own scheme: P1 is most urgent, lower number first
  return tasks.filter(t=>!t.done).slice().sort((a,b)=>
    (rankOf(a)-rankOf(b)) ||
    ((Number(a.estimate)||30)-(Number(b.estimate)||30))
  );
}
// The "breathing room" briefing + "Today's capacity" card are gone —
// this now just builds the floating Free-time finder panel's contents;
// its trigger button lives in the horizontal control bar instead.

  }).join('') : '<div class="empty-note">No open window of 20 minutes or more remains in the active day.</div>';
  return '<div class="free-time-head"><div><h2>Free-time finder</h2><p>Openings are calculated from routine blocks, scheduled tasks, and events.</p></div><button class="free-time-close" id="free-time-close" aria-label="Close">×</button></div><div class="free-slot-list">'+cards+'</div>';
}

    task.due=btn.dataset.fitDate;
    task.dueTime=minutesToTime(start);
    task.endTime=minutesToTime(Math.min(start+estimate,1439));
    task.done=false;
    await saveTodoTasksFor(found.shared);
    renderToday();
  }));
}

/* =====================================================================
   INLINE FOCUS PANEL — a real focus-clock timer embedded in Schedule,
   opened from the Focus button on any task. It renders above Events/
   Chores (pushing them down), not in a new tab/app, and its finished
   sessions are saved to the SAME place the Clock app's own Focus tab
   keeps them (clock-profiles/<profile>/data/focusSessions) — so this
   is the same "linked to the clock" data, just a quick way to start a
   session without leaving Schedule.
===================================================================== */
function clockProfileDoc(key){ return db.collection('users').doc(currentUser.uid).collection('clock-profiles').doc(activeProfile).collection('data').doc(key); }
let focusSessions = [];
let focusState = { open:false, running:false, paused:false, mode:'work', total:0, remaining:0, workMin:25, breakMin:5, task:'', taskId:null, _workedSeconds:0 };
async function loadFocusData(){
  try{ const d = await clockProfileDoc('focusSessions').get(); focusSessions = (d.exists && d.data().json) ? JSON.parse(d.data().json) : []; }catch(e){ focusSessions = []; }
}
async function saveFocusSessions(){ try{ await clockProfileDoc('focusSessions').set({json: JSON.stringify(focusSessions)}); }catch(e){} }
function todayFocusMinutes(){
  const today = new Date().toDateString();
  return focusSessions.filter(s=> new Date(s.date).toDateString()===today).reduce((s,x)=>s+x.minutes,0);
}
function openFocusPanel(taskId){
  const found = findTodoTaskAnywhere(taskId);
  focusState.open = true;
  focusState.taskId = taskId;
  if(!focusState.running) focusState.task = found ? found.t.title : '';
  renderInlineFocusPanel();
  const mount = document.getElementById('today-focus-mount');
  if(mount) mount.scrollIntoView({behavior:'smooth', block:'center'});
}
function renderInlineFocusPanel(){
  const mount = document.getElementById('today-focus-mount');
  if(!mount) return;
  if(!focusState.open){ mount.innerHTML=''; return; }
  const circumference = 2*Math.PI*46;
  const frac = focusState.total ? (focusState.total-focusState.remaining)/focusState.total : 0;
  const liveMin = todayFocusMinutes() + (focusState.running && focusState.mode==='work' ? Math.floor((focusState._workedSeconds||0)/60) : 0);
  mount.innerHTML = '<div class="focus-inline-card"><div class="focus-inline-head"><div><h3>⏱ Focus</h3><div class="focus-inline-task">'+(focusState.task?escapeHtml(focusState.task):'Pick a duration and start')+'</div></div><button type="button" class="focus-inline-close" id="focus-inline-close" aria-label="Close">×</button></div>'+
    '<div class="focus-inline-body">'+
      '<div class="focus-ring-wrap '+(focusState.running && !focusState.paused?'running':'')+'"><svg viewBox="0 0 104 104"><circle class="fring-track" cx="52" cy="52" r="46"></circle><circle class="fring-sweep" id="inline-focus-ring" cx="52" cy="52" r="46" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+(circumference*(1-frac))+'"></circle></svg><div class="focus-ring-center"><div class="focus-big-time" id="inline-focus-time">'+pad2(Math.floor(focusState.remaining/60))+':'+pad2(focusState.remaining%60)+'</div><div class="focus-mode-label" id="inline-focus-mode">'+(focusState.running?focusState.mode:'ready')+'</div></div></div>'+
      '<div class="focus-inline-controls">'+
        (!focusState.running ? '<div class="focus-presets">'+[[25,5],[50,10],[15,5]].map(p=>'<button type="button" class="focus-preset-btn '+(focusState.workMin===p[0]?'active':'')+'" data-workmin="'+p[0]+'" data-breakmin="'+p[1]+'">'+p[0]+'/'+p[1]+' min</button>').join('')+'</div>' : '')+
        '<div class="focus-ctrl-row">'+(!focusState.running ? '<button type="button" class="focus-start-btn" id="focus-inline-start">Start focusing</button>' : '<button type="button" class="focus-pause-btn" id="focus-inline-pause">'+(focusState.paused?'Resume':'Pause')+'</button><button type="button" class="focus-end-btn" id="focus-inline-end">End</button>')+'</div>'+
        '<div class="focus-today-total">'+liveMin+'m focused today'+(focusState.running?' · running':'')+'</div>'+
      '</div>'+
    '</div></div>';
  document.getElementById('focus-inline-close').onclick = async ()=>{
    if(focusState.running && !window.confirm('End the current focus session?')) return;
    if(focusState.running) await endFocusSession();
    focusState.open = false;
    renderInlineFocusPanel();
  };
  if(!focusState.running){
    mount.querySelectorAll('[data-workmin]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ focusState.workMin=parseInt(btn.dataset.workmin,10); focusState.breakMin=parseInt(btn.dataset.breakmin,10); renderInlineFocusPanel(); });
    });
    document.getElementById('focus-inline-start').onclick = ()=> startFocusSession();
  } else {
    document.getElementById('focus-inline-pause').onclick = ()=>{ focusState.paused=!focusState.paused; renderInlineFocusPanel(); };
    document.getElementById('focus-inline-end').onclick = async ()=>{ await endFocusSession(); renderInlineFocusPanel(); };
  }
}
function startFocusSession(){
  focusState.running = true; focusState.paused = false; focusState.mode = 'work';
  focusState.total = focusState.workMin*60; focusState.remaining = focusState.total;
  focusState._workedSeconds = 0;
  renderInlineFocusPanel();
}
async function endFocusSession(){
  const minutes = Math.round((focusState._workedSeconds||0)/60);
  if(minutes>0){
    focusSessions.push({ date: new Date().toISOString(), minutes: minutes, task: focusState.task });
    await saveFocusSessions();
  }
  focusState.running = false; focusState.paused = false; focusState.mode = 'work';
  focusState.remaining = 0; focusState.total = 0; focusState._workedSeconds = 0;
}
function tickFocus(){
  if(!focusState.running || focusState.paused) return;
  focusState.remaining--;
  if(focusState.mode==='work') focusState._workedSeconds = (focusState._workedSeconds||0)+1;
  if(focusState.remaining<=0){
    if(focusState.mode==='work'){
      focusState.mode = 'break'; focusState.total = focusState.breakMin*60; focusState.remaining = focusState.total;
      try{ if(window.Notification && Notification.permission==='granted') new Notification('Focus session done', {body:'Time for a '+focusState.breakMin+'-minute break.'}); }catch(e){}
    } else {
      endFocusSession().then(renderInlineFocusPanel);
      return;
    }
  }
  const timeEl = document.getElementById('inline-focus-time');
  if(timeEl) timeEl.textContent = pad2(Math.floor(Math.max(0,focusState.remaining)/60))+':'+pad2(Math.max(0,focusState.remaining)%60);
  const modeEl = document.getElementById('inline-focus-mode');
  if(modeEl) modeEl.textContent = focusState.mode;
  const ring = document.getElementById('inline-focus-ring');
  if(ring){ const c=2*Math.PI*46; const frac=focusState.total?(focusState.total-focusState.remaining)/focusState.total:0; ring.style.strokeDashoffset = c*(1-frac); }
  const totalEl = document.querySelector('.focus-today-total');
  if(totalEl){ const liveMin = todayFocusMinutes()+(focusState.mode==='work'?Math.floor((focusState._workedSeconds||0)/60):0); totalEl.textContent = liveMin+'m focused today'+(focusState.running?' · running':''); }
}
let focusTickerStarted = false;
function startFocusTicker(){
  if(focusTickerStarted) return;
  focusTickerStarted = true;
  setInterval(tickFocus, 1000);
}
