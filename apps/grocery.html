<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F6F7FB; --surface:#FFFFFF; --surface-alt:#EEF0F8;
    --border:#E4E6F1; --border-soft:#EDEFF7;
    --text:#191A2B; --text-soft:#5B5F78; --text-faint:#9599B2;
    --accent:#22A06B; --accent-soft:#DFF5EA; --accent-deep:#178152;
    --link-blue:#3D7BF5; --link-soft:#E5EDFE;
    --danger:#F0596B; --danger-soft:#FCE1E5;
    --radius-lg:18px; --radius-md:13px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(20,20,50,0.04), 0 12px 26px -16px rgba(20,20,50,0.16);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px 14px 80px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;}
  h1,h2,h3{font-family:'Manrope',sans-serif;}
  button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer;transition:transform .12s cubic-bezier(.34,1.56,.64,1);}
  button:active{transform:scale(0.96);}

  .loading-gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-soft);}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .topbar a{font-size:12.5px;color:var(--text-soft);text-decoration:none;}
  header.app-head{text-align:center;margin-bottom:16px;}
  header.app-head h1{font-size:23px;font-weight:800;margin:0 0 2px;letter-spacing:-0.02em;background:linear-gradient(135deg,var(--accent-deep),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  header.app-head p{margin:0;color:var(--text-soft);font-size:12.5px;}

  /* ADD FORM */
  .add-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .add-row1{display:flex;gap:8px;margin-bottom:8px;}
  .add-row1 input{flex:1;font-size:15px;padding:11px 13px;border-radius:var(--radius-md);border:1px solid var(--border);}
  .add-row1 button{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border:none;border-radius:var(--radius-md);padding:0 18px;font-size:14px;font-weight:700;box-shadow:0 4px 12px -5px rgba(34,160,107,0.6);}
  .add-row2{display:flex;gap:8px;}
  .add-row2 input{flex:1;font-size:12.5px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-alt);}
  .add-row2 input::placeholder{color:var(--text-faint);}

  /* CONTROLS ROW */
  .controls-row{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
  .controls-row input[type=text]{flex:1;font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);}
  .clear-done-btn{background:var(--surface-alt);color:var(--text-soft);border:none;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;white-space:nowrap;}

  /* STORE GROUPS */
  .store-group{margin-bottom:16px;}
  .store-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;padding-left:2px;}
  .store-head h3{font-size:12.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-faint);font-weight:800;margin:0;}
  .store-head .count{font-size:11px;color:var(--text-faint);background:var(--surface-alt);border-radius:20px;padding:1px 8px;}

  .item-row{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:11px 12px;margin-bottom:7px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:10px;transition:opacity .3s ease;}
  .item-row.done{opacity:0.55;}
  .item-chk{appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex:none;margin-top:1px;cursor:pointer;position:relative;background:var(--surface);transition:all .18s cubic-bezier(.34,1.7,.64,1);}
  .item-chk:hover{border-color:var(--accent);}
  .item-chk:checked{background:linear-gradient(135deg,var(--accent),var(--accent-deep));border-color:transparent;}
  .item-chk:checked::after{content:'';position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);}
  .item-body{flex:1;min-width:0;}
  .item-name{font-size:14.5px;font-weight:600;word-break:break-word;}
  .item-row.done .item-name{text-decoration:line-through;color:var(--text-faint);}
  .item-note{font-size:12px;color:var(--text-soft);margin-top:1px;}
  .item-actions{display:flex;gap:4px;flex:none;align-items:center;}
  .icon-btn{background:var(--surface-alt);border:none;border-radius:8px;width:30px;height:30px;font-size:13px;flex:none;color:var(--text-soft);}
  .icon-btn.link-btn{background:var(--link-soft);color:var(--link-blue);text-decoration:none;display:flex;align-items:center;justify-content:center;}
  .icon-btn.link-btn:hover{background:var(--link-blue);color:#fff;}
  .icon-btn.del-btn{background:var(--danger-soft);color:var(--danger);}
  .icon-btn.del-btn:hover{background:var(--danger);color:#fff;}
  .icon-btn.edit-btn:hover{background:var(--accent-soft);color:var(--accent-deep);}

  .edit-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;margin:-3px 0 7px;box-shadow:var(--shadow);}
  .edit-panel .ef{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;}
  .edit-panel label{font-size:10px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;}
  .edit-panel input{font-size:13.5px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);}
  .edit-actions{display:flex;gap:8px;margin-top:4px;}
  .btn-mini{font-size:12px;font-weight:700;border:none;border-radius:var(--radius-sm);padding:8px 14px;}
  .btn-mini.primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;}
  .btn-mini.ghost{background:var(--surface-alt);color:var(--text-soft);}

  .empty-note{color:var(--text-faint);font-style:italic;font-size:13.5px;padding:30px 10px;text-align:center;}
  .store-badge-input{margin-top:2px;}
</style>
</head>
<body>

<div id="loading-gate" class="loading-gate">Loading…</div>

<div class="wrap" id="app-wrap" style="display:none;">
  <div class="topbar"><a href="../index.html">← All apps</a></div>
  <header class="app-head">
    <h1>Grocery</h1>
    <p>Add it, link it, order it, check it off.</p>
  </header>

  <div class="add-card">
    <div class="add-row1">
      <input type="text" id="add-name" placeholder="What do you need?">
      <button id="add-btn" type="button">Add</button>
    </div>
    <div class="add-row2">
      <input type="text" id="add-store" placeholder="Store (e.g. Costco)" list="store-suggestions">
      <input type="url" id="add-link" placeholder="Link to order it (optional)">
    </div>
    <datalist id="store-suggestions"></datalist>
  </div>

  <div class="controls-row">
    <input type="text" id="search-input" placeholder="Search your list…">
    <button class="clear-done-btn" id="clear-done-btn">Clear checked</button>
  </div>

  <div id="list-mount"></div>
</div>

<script>
window.addEventListener('error', function(e){
  const gate = document.getElementById('loading-gate');
  if(gate && gate.style.display !== 'none') gate.textContent = 'Something went wrong: ' + (e.message||'unknown error') + '. Try a hard refresh.';
});
if(typeof firebase === 'undefined'){
  document.getElementById('loading-gate').textContent = "Couldn't load — check your internet connection and refresh.";
} else {

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBe01eR2RZwSbU_aoJMeh_2MMJ5mqkVuKk",
  authDomain: "iron-log-bfc55.firebaseapp.com",
  projectId: "iron-log-bfc55",
  storageBucket: "iron-log-bfc55.firebasestorage.app",
  messagingSenderId: "106586808946",
  appId: "1:106586808946:web:f4736554ba9fc82c6fd8eb"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
try{ db.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}
let currentUser = null;
let items = [];
let searchQuery = '';

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function groceryDoc(key){ return db.collection('users').doc(currentUser.uid).collection('apps').doc('grocery-v2').collection('data').doc(key); }

async function loadItems(){
  try{
    const doc = await groceryDoc('items').get();
    items = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : [];
  }catch(e){ items = []; }
}
async function saveItems(){ try{ await groceryDoc('items').set({json: JSON.stringify(items)}); }catch(e){ console.error(e); } }

auth.onAuthStateChanged(async function(user){
  currentUser = user;
  if(!user){ window.location.href = '../index.html'; return; }
  await loadItems();
  document.getElementById('loading-gate').style.display = 'none';
  document.getElementById('app-wrap').style.display = 'block';
  wireControls();
  render();
});

function wireControls(){
  document.getElementById('add-btn').addEventListener('click', addItem);
  document.getElementById('add-name').addEventListener('keydown', function(e){ if(e.key==='Enter') addItem(); });
  document.getElementById('add-link').addEventListener('keydown', function(e){ if(e.key==='Enter') addItem(); });
  document.getElementById('search-input').addEventListener('input', function(e){ searchQuery = e.target.value.toLowerCase().trim(); render(); });
  document.getElementById('clear-done-btn').addEventListener('click', async function(){
    const doneCount = items.filter(function(i){ return i.done; }).length;
    if(!doneCount) return;
    if(!confirm('Remove '+doneCount+' checked item'+(doneCount===1?'':'s')+' from the list?')) return;
    items = items.filter(function(i){ return !i.done; });
    await saveItems();
    render();
  });
}

async function addItem(){
  const nameInput = document.getElementById('add-name');
  const name = nameInput.value.trim();
  if(!name) return;
  const store = document.getElementById('add-store').value.trim();
  let link = document.getElementById('add-link').value.trim();
  if(link && !/^https?:\/\//i.test(link)) link = 'https://'+link;
  items.push({ id:'item-'+Date.now()+'-'+Math.floor(Math.random()*10000), name:name, note:'', store:store, link:link, done:false, addedAt:Date.now() });
  await saveItems();
  nameInput.value = '';
  document.getElementById('add-store').value = '';
  document.getElementById('add-link').value = '';
  nameInput.focus();
  render();
}

function knownStores(){
  const set = new Set();
  items.forEach(function(i){ if(i.store) set.add(i.store); });
  return [...set].sort();
}

let editingItemId = null;

function render(){
  document.getElementById('store-suggestions').innerHTML = knownStores().map(function(s){ return '<option value="'+escapeHtml(s)+'">'; }).join('');

  const mount = document.getElementById('list-mount');
  const q = searchQuery;
  const visible = items.filter(function(i){ return !q || i.name.toLowerCase().indexOf(q)!==-1 || (i.store||'').toLowerCase().indexOf(q)!==-1; });

  if(!visible.length){
    mount.innerHTML = '<div class="empty-note">'+(q ? 'No items match "'+escapeHtml(q)+'".' : 'Your list is empty — add something above.')+'</div>';
    return;
  }

  const groups = {};
  const groupOrder = [];
  visible.forEach(function(i){
    const g = i.store || 'No store yet';
    if(!groups[g]){ groups[g] = []; groupOrder.push(g); }
    groups[g].push(i);
  });
  groupOrder.sort(function(a,b){ if(a==='No store yet') return 1; if(b==='No store yet') return -1; return a.localeCompare(b); });

  mount.innerHTML = groupOrder.map(function(g){
    const rows = groups[g];
    const activeCount = rows.filter(function(i){ return !i.done; }).length;
    return '<div class="store-group">'+
      '<div class="store-head"><h3>'+escapeHtml(g)+'</h3><span class="count">'+activeCount+' left</span></div>'+
      rows.map(itemRowHtml).join('')+
    '</div>';
  }).join('');

  attachRowHandlers();
}

function itemRowHtml(item){
  const isEditing = editingItemId === item.id;
  let html = '<div class="item-row '+(item.done?'done':'')+'" data-itemid="'+item.id+'">'+
    '<input type="checkbox" class="item-chk" data-toggle="'+item.id+'" '+(item.done?'checked':'')+'>'+
    '<div class="item-body">'+
      '<div class="item-name">'+escapeHtml(item.name)+'</div>'+
      (item.note ? '<div class="item-note">'+escapeHtml(item.note)+'</div>' : '')+
    '</div>'+
    '<div class="item-actions">'+
      (item.link ? '<a class="icon-btn link-btn" href="'+escapeHtml(item.link)+'" target="_blank" rel="noopener" title="Open link to order">🔗</a>' : '')+
      '<button type="button" class="icon-btn edit-btn" data-edit="'+item.id+'" title="Edit">✎</button>'+
      '<button type="button" class="icon-btn del-btn" data-del="'+item.id+'" title="Delete">✕</button>'+
    '</div>'+
  '</div>';
  if(isEditing){
    html += '<div class="edit-panel" data-editpanel="'+item.id+'">'+
      '<div class="ef"><label>Name</label><input type="text" class="ei-name" value="'+escapeHtml(item.name)+'"></div>'+
      '<div class="ef"><label>Note (quantity, brand, etc.)</label><input type="text" class="ei-note" value="'+escapeHtml(item.note||'')+'"></div>'+
      '<div class="ef"><label>Store</label><input type="text" class="ei-store" value="'+escapeHtml(item.store||'')+'" list="store-suggestions"></div>'+
      '<div class="ef"><label>Link to order it</label><input type="url" class="ei-link" value="'+escapeHtml(item.link||'')+'"></div>'+
      '<div class="edit-actions"><button type="button" class="btn-mini primary" data-save="'+item.id+'">Save</button><button type="button" class="btn-mini ghost" data-cancel="'+item.id+'">Cancel</button></div>'+
    '</div>';
  }
  return html;
}

function attachRowHandlers(){
  document.querySelectorAll('[data-toggle]').forEach(function(cb){
    cb.addEventListener('change', async function(){
      const item = items.find(function(i){ return i.id===cb.dataset.toggle; });
      if(!item) return;
      item.done = cb.checked;
      await saveItems();
      render();
    });
  });
  document.querySelectorAll('[data-del]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      const item = items.find(function(i){ return i.id===btn.dataset.del; });
      if(!item) return;
      if(!confirm('Delete "'+item.name+'"?')) return;
      items = items.filter(function(i){ return i.id!==btn.dataset.del; });
      await saveItems();
      render();
    });
  });
  document.querySelectorAll('[data-edit]').forEach(function(btn){
    btn.addEventListener('click', function(){
      editingItemId = editingItemId===btn.dataset.edit ? null : btn.dataset.edit;
      render();
    });
  });
  document.querySelectorAll('[data-cancel]').forEach(function(btn){
    btn.addEventListener('click', function(){ editingItemId = null; render(); });
  });
  document.querySelectorAll('[data-save]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      const item = items.find(function(i){ return i.id===btn.dataset.save; });
      if(!item) return;
      const panel = document.querySelector('[data-editpanel="'+item.id+'"]');
      const newName = panel.querySelector('.ei-name').value.trim();
      if(!newName) return;
      item.name = newName;
      item.note = panel.querySelector('.ei-note').value.trim();
      item.store = panel.querySelector('.ei-store').value.trim();
      let newLink = panel.querySelector('.ei-link').value.trim();
      if(newLink && !/^https?:\/\//i.test(newLink)) newLink = 'https://'+newLink;
      item.link = newLink;
      editingItemId = null;
      await saveItems();
      render();
    });
  });
}

} // end firebase-available guard
</script>
</body>
</html>
