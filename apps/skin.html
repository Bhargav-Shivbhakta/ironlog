<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skin Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F5F6F3; --surface:#FFFFFF; --surface-alt:#EFF1EC;
    --border:#DEE2D8; --border-soft:#E9EBE5;
    --text:#1C201A; --text-soft:#5B6355; --text-faint:#8E9587;
    --accent:#3F7A54; --accent-soft:#E3EEE5; --accent-deep:#2C5A3C;
    --am:#D97A3F; --am-soft:#FBEADC;
    --pm:#5B5FA8; --pm-soft:#E7E7F5;
    --warn:#B4483B; --warn-soft:#F7E4E1;
    --radius-lg:16px; --radius-md:11px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(28,32,26,0.05), 0 8px 20px -14px rgba(28,32,26,0.16);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px 14px 60px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:min(90vw,960px);margin:0 auto;}
  h1,h2,h3{font-family:'Manrope',sans-serif;}
  button,input,select,textarea{font-family:inherit;}
  a{color:var(--accent-deep);}

  .loading-gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-soft);}

  .profile-inner{text-align:center;}
  .profile-inner h1{font-size:22px;margin:0 0 30px;font-weight:800;color:var(--text);}
  .profile-row{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;}
  .profile-card{background:none;border:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;}
  .profile-avatar{width:88px;height:88px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;border:3px solid transparent;font-family:'Manrope',sans-serif;}
  .profile-card:hover .profile-avatar{border-color:var(--accent);}
  .av-b{background:linear-gradient(135deg,#3F7A54,#2C5A3C);}
  .av-a{background:linear-gradient(135deg,#C97BA0,#A8517A);}
  .profile-name{font-size:13.5px;font-weight:600;color:var(--text-soft);}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .topbar a{font-size:12.5px;color:var(--text-soft);text-decoration:none;}
  .switch-btn{background:none;border:none;font-size:12.5px;color:var(--text-soft);cursor:pointer;padding:0;}

  .who-badge{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 13px 3px 4px;margin-bottom:8px;}
  .who-avatar{width:20px;height:20px;border-radius:6px;font-size:10px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;}
  .who-avatar.av-b{background:#3F7A54;}
  .who-avatar.av-a{background:#A8517A;}
  .who-name{font-size:11.5px;font-weight:700;color:var(--text-soft);}


  header.app-head{text-align:center;margin-bottom:14px;}
  header.app-head h1{font-size:23px;font-weight:800;margin:0 0 2px;}
  header.app-head p{margin:0;color:var(--text-soft);font-size:12.5px;}

  .week-banner{background:var(--accent);color:#fff;border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow);}
  .week-banner .wb-top{display:flex;justify-content:space-between;align-items:baseline;}
  .week-banner .wb-week{font-family:'Manrope',sans-serif;font-weight:800;font-size:18px;}
  .week-banner .wb-dates{font-size:11.5px;opacity:0.85;}
  .week-banner .wb-note{font-size:12px;margin-top:6px;opacity:0.95;}
  .wb-editrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;}
  .wb-editrow span{opacity:0.85;}
  .wb-editrow button{background:rgba(255,255,255,0.2);border:none;color:inherit;border-radius:7px;padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer;}
  .wb-editrow input[type=date]{font-size:11px;padding:3px 6px;border-radius:6px;border:none;}
  .week-banner.done{background:var(--text-soft);}

  .segmented{max-width:460px;margin:0 auto 14px;background:var(--surface-alt);border-radius:999px;padding:3px;display:flex;gap:2px;}
  .segmented button{flex:1;border:none;background:transparent;border-radius:999px;padding:8px 4px;font-size:12px;font-weight:700;color:var(--text-soft);cursor:pointer;}
  .segmented button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}

  .routine-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);}
  .routine-card .rc-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .routine-card .rc-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
  .routine-card.am .rc-icon{background:var(--am-soft);}
  .routine-card.pm .rc-icon{background:var(--pm-soft);}
  .routine-card .rc-title{font-size:14.5px;font-weight:700;}
  .routine-card .rc-time{font-size:11px;color:var(--text-faint);}

  .step-row{display:flex;align-items:flex-start;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border-soft);}
  .step-row:last-child{border-bottom:none;}
  .step-chk{appearance:none;width:21px;height:21px;border-radius:6px;border:2px solid var(--border);flex:none;margin-top:1px;cursor:pointer;position:relative;background:var(--surface);}
  .step-chk:checked{background:var(--accent);border-color:var(--accent);}
  .step-chk:checked::after{content:'';position:absolute;left:5px;top:1px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .step-text{font-size:13.5px;font-weight:500;}
  .step-text.strike{text-decoration:line-through;color:var(--text-faint);}
  .step-note{font-size:11px;color:var(--warn);margin-top:2px;}

  .empty-note{color:var(--text-faint);font-style:italic;font-size:13px;padding:10px 2px;}

  .section-title{font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;color:var(--text-soft);margin:18px 0 8px;display:flex;align-items:center;gap:8px;}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border);}

  .shop-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border-soft);}
  .shop-text{font-size:13.5px;font-weight:600;flex:1;}
  .shop-text.strike{text-decoration:line-through;color:var(--text-faint);}
  .shop-sub{font-size:11px;color:var(--text-faint);}
  .shop-sent{display:block;font-size:10.5px;color:var(--accent-deep);margin-top:2px;font-weight:600;}
  .send-grocery-btn{flex:none;font-size:11.5px;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 12px;cursor:pointer;}
  .send-grocery-btn:disabled{opacity:0.6;cursor:default;}
  .send-grocery-btn.wide{width:100%;background:var(--surface-alt);color:var(--accent-deep);border:1px solid var(--accent);}

  .milestone-row{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border-soft);}
  .milestone-date{font-family:'Manrope',sans-serif;font-weight:800;font-size:12px;color:var(--text-soft);min-width:58px;}
  .milestone-row.overdue .milestone-date{color:var(--warn);}
  .milestone-row.today .milestone-date{color:var(--accent-deep);}
  .milestone-text{font-size:13px;flex:1;}
  .milestone-text.strike{text-decoration:line-through;color:var(--text-faint);}
  .badge{font-size:9.5px;font-weight:700;border-radius:20px;padding:1px 7px;background:var(--warn-soft);color:var(--warn);}
  .badge.today{background:var(--accent-soft);color:var(--accent-deep);}

  .checkin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);}
  .checkin-card h3{font-size:14px;margin:0 0 3px;display:flex;align-items:center;gap:7px;}
  .gym-sync-tag{font-size:9.5px;font-weight:700;background:var(--accent-soft);color:var(--accent-deep);border-radius:20px;padding:2px 8px;}
  .gym-log-link{display:inline-block;font-size:12.5px;font-weight:700;color:var(--accent-deep);text-decoration:none;background:var(--accent-soft);padding:8px 13px;border-radius:8px;}
  .checkin-card .ci-sub{font-size:11.5px;color:var(--text-faint);margin-bottom:10px;}
  .checkin-card .ci-due{font-size:11px;font-weight:700;color:var(--warn);margin-bottom:8px;}
  .ci-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}
  .ci-form .f{display:flex;flex-direction:column;gap:3px;}
  .ci-form label{font-size:9.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;}
  .ci-form input{font-size:13px;padding:7px 9px;border-radius:8px;border:1px solid var(--border);width:90px;}
  .ci-form button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .ci-log{margin-top:10px;font-size:11.5px;color:var(--text-soft);}
  .ci-log-row{display:flex;justify-content:space-between;padding:3px 0;border-top:1px dashed var(--border-soft);}

  details.reference{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 14px;margin-top:12px;box-shadow:var(--shadow);}
  details.reference summary{cursor:pointer;font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;list-style:none;}
  details.reference summary::-webkit-details-marker{display:none;}
  details.reference summary::before{content:'▸ ';color:var(--text-faint);}
  details.reference[open] summary::before{content:'▾ ';}
  details.reference p{font-size:12px;color:var(--text-soft);line-height:1.6;margin:8px 0 0;}
  details.reference ul{font-size:12px;color:var(--text-soft);line-height:1.7;margin:8px 0 0;padding-left:18px;}

  .emergency-banner{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:12px;font-size:12px;}
  .emergency-banner b{display:block;margin-bottom:4px;}

  .rc-link-btn{margin-left:auto;flex:none;background:var(--surface-alt);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--text-soft);cursor:pointer;}
  .rc-link-btn.linked{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);}

  .modal-overlay{position:fixed;inset:0;background:rgba(28,32,26,0.45);display:none;align-items:center;justify-content:center;z-index:210;padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--surface);border-radius:var(--radius-lg);padding:18px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow);}
  .modal-box h3{margin:0 0 4px;font-size:15px;}
  .modal-sub{font-size:11.5px;color:var(--text-faint);margin:0 0 12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  .subtle{color:var(--text-faint);font-size:12px;}
  .ms-sched-day{margin-bottom:10px;}
  .ms-sched-daylabel{font-size:10.5px;font-weight:800;color:var(--text-faint);text-transform:uppercase;margin-bottom:4px;}
  .ms-sched-row{display:block;font-size:12.5px;padding:5px 2px;cursor:pointer;}
  .ms-sched-row input{margin-right:6px;}
  .modal-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .modal-btn.secondary{background:var(--surface-alt);color:var(--text);}
</style>
</head>
<body>

<div id="loading-gate" class="loading-gate">Loading…</div>

<div id="profile-overlay" class="loading-gate" style="display:none;">
  <div class="profile-inner">
    <h1>Whose skin plan?</h1>
    <div class="profile-row" id="profile-row"></div>
  </div>
</div>

<div class="wrap" id="app-wrap" style="display:none;">
  <div class="topbar">
    <a href="../index.html">← All apps</a>
    <button class="switch-btn" id="switch-profile-btn">Switch profile</button>
  </div>

  <header class="app-head">
    <div class="who-badge" id="who-badge"></div>
    <h1>Skin Plan</h1>
    <p id="app-sub"></p>
  </header>

  <div id="week-banner-wrap"></div>

  <div class="segmented">
    <button id="tab-today-btn" class="active">Today</button>
    <button id="tab-shopping-btn">Shopping</button>
    <button id="tab-milestones-btn">Milestones</button>
    <button id="tab-checkins-btn">Check-ins</button>
  </div>

  <div id="today-view"></div>
  <div id="shopping-view" style="display:none;"></div>
  <div id="milestones-view" style="display:none;"></div>
  <div id="checkins-view" style="display:none;"></div>
</div>

<div class="modal-overlay" id="skinLinkModal">
  <div class="modal-box">
    <h3 id="skinLinkModalTitle">Attach to Schedule</h3>
    <p class="modal-sub">Check every Schedule block this routine should show up under.</p>
    <div id="skinLinkWrap"><div class="subtle">Loading Schedule…</div></div>
    <div class="modal-actions">
      <button type="button" class="modal-btn secondary" id="skinLinkCancelBtn">Cancel</button>
      <button type="button" class="modal-btn" id="skinLinkSaveBtn">Save</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   FIREBASE — same account as the rest of the hub; sign-in lives on the
   hub itself, this page just checks and redirects if not signed in.
===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBe01eR2RZwSbU_aoJMeh_2MMJ5mqkVuKk",
  authDomain: "iron-log-bfc55.firebaseapp.com",
  projectId: "iron-log-bfc55",
  storageBucket: "iron-log-bfc55.firebasestorage.app",
  messagingSenderId: "106586808946",
  appId: "1:106586808946:web:f4736554ba9fc82c6fd8eb"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
// See clock.html for why this is skipped when embedded in the Hub's app
// viewer — its iframe-reuse reload pattern can leave a stale multi-tab
// persistence lock that hangs the next load.
if(window.self === window.top){
  try{ db.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}
}
let currentUser = null;
let activeProfile = null;
const LAST_PROFILE_KEY = 'skin-last-profile';

function skinDoc(key){
  return db.collection('users').doc(currentUser.uid).collection('skin-profiles').doc(activeProfile).collection('data').doc(key);
}

/* =====================================================================
   SCHEDULE INTEGRATION — a routine card here ("Morning", "Shower &
   body", "Nizoral", "Night — face", or Anusha's "Morning"/"Night") can
   be attached to one or more Schedule blocks (skinBlockLinks, keyed by
   section, each an array of {wd,label} pairs — same shape chores.html/
   todo.html/diet.html already write from their own "Attach to
   Schedule" pickers). schedule.html reads this SAME doc and matches it
   against each block's weekday+activity text to decide what to show in
   that block's expand panel — the link is set here, not there.
===================================================================== */
function scheduleProfileDocForSkin(profileCap, key){
  return db.collection('users').doc(currentUser.uid).collection('schedule-profiles').doc(profileCap).collection('data').doc(key);
}
let skinScheduleTemplatesCache = {};
async function ensureSkinScheduleTemplatesLoaded(profileCap){
  if(skinScheduleTemplatesCache[profileCap]) return skinScheduleTemplatesCache[profileCap];
  try{
    const doc = await scheduleProfileDocForSkin(profileCap,'dayTemplates').get();
    skinScheduleTemplatesCache[profileCap] = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : {};
  }catch(e){ skinScheduleTemplatesCache[profileCap] = {}; }
  return skinScheduleTemplatesCache[profileCap];
}
const SKIN_SCHED_WD_ORDER = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function skinScheduleChecklistHtml(templates, selected){
  const sel = new Set((selected||[]).map(function(s){ return s.wd+'||'+s.label; }));
  let html = '';
  SKIN_SCHED_WD_ORDER.forEach(function(wd){
    const blocks = (templates[wd]||[]).filter(function(b){ return b.activity; });
    if(!blocks.length) return;
    html += '<div class="ms-sched-day"><div class="ms-sched-daylabel">'+escapeHtml(wd)+'</div>'+
      blocks.map(function(b){
        const checked = sel.has(wd+'||'+b.activity);
        return '<label class="ms-sched-row"><input type="checkbox" data-skwd="'+escapeHtml(wd)+'" data-sklabel="'+escapeHtml(b.activity)+'" '+(checked?'checked':'')+'> '+escapeHtml(b.activity)+(b.start?' <small class="subtle">('+escapeHtml(b.start)+')</small>':'')+'</label>';
      }).join('')+
    '</div>';
  });
  return html || '<div class="subtle" style="padding:6px 0;">No Schedule blocks set up yet for this profile.</div>';
}
let skinBlockLinks = {}; // { sectionKey: [{wd,label}] }
async function saveSkinBlockLinks(){ try{ await skinDoc('blockLinks').set({json: JSON.stringify(skinBlockLinks)}); }catch(e){} }
let skinLinkModalSection = null;
const SKIN_SECTION_LABELS = {am:'Morning', body:'Shower & body', nizoral:'Nizoral', face:'Night — face', pm:'Night'};
async function openSkinLinkModal(section){
  skinLinkModalSection = section;
  document.getElementById('skinLinkModalTitle').textContent = 'Attach "'+(SKIN_SECTION_LABELS[section]||section)+'" to Schedule';
  document.getElementById('skinLinkWrap').innerHTML = '<div class="subtle">Loading Schedule…</div>';
  document.getElementById('skinLinkModal').classList.add('open');
  const templates = await ensureSkinScheduleTemplatesLoaded(activeProfile);
  if(skinLinkModalSection !== section) return; // closed/reopened while loading
  document.getElementById('skinLinkWrap').innerHTML = skinScheduleChecklistHtml(templates, skinBlockLinks[section]||[]);
}
function closeSkinLinkModal(){
  document.getElementById('skinLinkModal').classList.remove('open');
  skinLinkModalSection = null;
}
async function saveSkinLinkSelection(){
  if(!skinLinkModalSection) return closeSkinLinkModal();
  const wrap = document.getElementById('skinLinkWrap');
  const selected = [...wrap.querySelectorAll('input[data-skwd]')].filter(function(cb){ return cb.checked; }).map(function(cb){ return {wd:cb.dataset.skwd, label:cb.dataset.sklabel}; });
  skinBlockLinks[skinLinkModalSection] = selected;
  await saveSkinBlockLinks();
  closeSkinLinkModal();
  renderToday();
}
function skinLinkCount(section){ return (skinBlockLinks[section]||[]).length; }
function rcLinkBtnHtml(section){
  const n = skinLinkCount(section);
  return '<button type="button" class="rc-link-btn'+(n?' linked':'')+'" data-linksection="'+section+'" title="Attach to Schedule">🔗'+(n?' '+n:'')+'</button>';
}
function attachRcLinkHandlers(el){
  el.querySelectorAll('.rc-link-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ openSkinLinkModal(btn.dataset.linksection); });
  });
}

/* =====================================================================
   GROCERY INTEGRATION — sends a product into Grocery's own list (Week 1
   tray, same shape as a manually-added item there) rather than keeping
   a second disconnected shopping list. Safe to send again any time you
   run out and need to restock — it just skips adding a duplicate if
   one's already sitting there unbought.
===================================================================== */
function groceryStateDoc(){
  return db.collection('users').doc(currentUser.uid).collection('apps').doc('grocery').collection('data').doc('state');
}
async function sendItemToGrocery(name){
  try{
    const doc = await groceryStateDoc().get();
    let state = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : {checked:{},customItems:{},qtyOverride:{},sectionOverride:{}};
    if(!state.customItems) state.customItems = {};
    if(!state.customItems['1']) state.customItems['1'] = [];
    const already = state.customItems['1'].some(function(it){ return it.name === name; });
    if(!already){
      state.customItems['1'].push({
        id: 'skin-'+Date.now()+'-'+Math.floor(Math.random()*1000),
        name: name, qty: '', section: 'tray', kitchenZone: 'pantry'
      });
      await groceryStateDoc().set({json: JSON.stringify(state)});
    }
    return { added: !already };
  }catch(e){ console.error('send to grocery failed', e); return { added:false, error:true }; }
}

/* =====================================================================
   GYM INTEGRATION — weight and waist are already logged weekly/biweekly
   in the Gym app's daily check-in. Read that directly instead of asking
   for the same numbers twice.
===================================================================== */
function gymDailyLogsCol(){
  return db.collection('users').doc(currentUser.uid).collection('profiles').doc(activeProfile.toLowerCase()).collection('dailyLogs');
}
let gymWeightEntries = [];
let gymWaistEntries = [];
async function loadGymLogs(){
  try{
    const snap = await gymDailyLogsCol().get();
    const all = [];
    snap.forEach(function(d){ all.push(d.data()); });
    all.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    gymWeightEntries = all.filter(function(d){ return d.weight != null && d.weight !== ''; }).map(function(d){ return {date:d.date, value:d.weight}; });
    gymWaistEntries = all.filter(function(d){ return d.waist != null && d.waist !== ''; }).map(function(d){ return {date:d.date, value:d.waist}; });
  }catch(e){ gymWeightEntries = []; gymWaistEntries = []; }
}

/* =====================================================================
   AUTH + PROFILE PICKER — sign-in itself lives on the hub; this page
   checks and redirects if not signed in, then asks whose plan to open.
===================================================================== */
function showProfilePicker(){
  document.getElementById('loading-gate').style.display = 'none';
  document.getElementById('app-wrap').style.display = 'none';
  document.getElementById('profile-overlay').style.display = 'flex';
  const row = document.getElementById('profile-row');
  row.innerHTML = '';
  [{id:'Bhargav',cls:'av-b'},{id:'Anusha',cls:'av-a'}].forEach(function(p){
    const card = document.createElement('button');
    card.className = 'profile-card';

    '<div class="routine-card am"><div class="rc-head"><div class="rc-icon">☀️</div><div><div class="rc-title">Morning</div></div>'+rcLinkBtnHtml('am')+'</div>'+
      ANUSHA_MORNING.map(function(s,i){ return stepRowHtml(today,'am',i,s); }).join('')+
    '</div>'+
    '<div class="routine-card pm"><div class="rc-head"><div class="rc-icon">🌙</div><div><div class="rc-title">Night</div></div>'+rcLinkBtnHtml('pm')+'</div>'+
      ANUSHA_NIGHT.map(function(s,i){ return stepRowHtml(today,'pm',i,s); }).join('')+
    '</div>';
  attachStepHandlers(el);
  attachRcLinkHandlers(el);
}
function renderTodayBhargav(){
  const today = todayStr();
  const entry = SKIN_DATE_PLAN[today];
  const month = skinMonthFor(today);
  const el = document.getElementById('today-view');
  if(!entry || !month){
    el.innerHTML = '<div class="routine-card"><div class="empty-note">No plan defined for today — the 5-month program runs Oct 1, 2026 through Feb 28, 2027.</div></div>';
    return;
  }
  const treatment = SKIN_TREATMENTS[entry.face] || SKIN_TREATMENTS.regular;
  const bodySteps = skinBodyStepsFor(entry);

  let html = '';
  html += '<div class="routine-card am"><div class="rc-head"><div class="rc-icon">☀️</div><div><div class="rc-title">Morning</div><div class="rc-time">7:00 AM</div></div>'+rcLinkBtnHtml('am')+'</div>'+
    SKIN_AM_ROUTINE.map(function(s,i){ return stepRowHtml(today,'am',i,s.text,s.qty); }).join('')+
  '</div>';

  html += '<div class="routine-card pm"><div class="rc-head"><div class="rc-icon">🚿</div><div><div class="rc-title">Shower & body</div><div class="rc-time">7:30 PM</div></div>'+rcLinkBtnHtml('body')+'</div>'+
    bodySteps.map(function(s,i){ return stepRowHtml(today,'body',i,s.text,s.qty); }).join('')+
  '</div>';

  if(entry.nizoral){
    html += '<div class="routine-card pm"><div class="rc-head"><div class="rc-icon">🧴</div><div><div class="rc-title">Nizoral — scheduled tonight</div></div>'+rcLinkBtnHtml('nizoral')+'</div>'+
      ['Wet the scalp completely','Apply '+SKIN_QTY.nizoral,'Massage gently for 30 seconds','Leave on for the time on the bottle','Rinse thoroughly'].map(function(s,i){ return stepRowHtml(today,'nizoral',i,s); }).join('')+
    '</div>';
  }

  html += '<div class="routine-card pm"><div class="rc-head"><div class="rc-icon">🌙</div><div><div class="rc-title">'+escapeHtml(treatment.label)+'</div><div class="rc-time">9:30 PM</div></div>'+rcLinkBtnHtml('face')+'</div>'+
    treatment.steps.map(function(s,i){ return stepRowHtml(today,'face',i,s.text,s.qty); }).join('')+
    (entry.note ? '<div class="step-note" style="color:var(--text-faint);">'+escapeHtml(entry.note)+'</div>' : '')+
  '</div>';

  html += renderTrackingCardHtml(today, month.key);

  el.innerHTML = html;
  attachStepHandlers(el);
  attachTrackingHandlers(el, today);
  attachRcLinkHandlers(el);
}
function renderTrackingCardHtml(date, monthKey){
  const fields = SKIN_TRACKING_FIELDS[monthKey] || [];
  const rec = trackingLog[date] || {};
  const rows = fields.map(function(f){
    if(f.type==='text'){
      return '<div class="f" style="flex:1 1 100%;"><label>'+escapeHtml(f.label)+'</label><input type="text" data-trackfield="'+f.key+'" value="'+escapeHtml(rec[f.key]||'')+'" placeholder="none" style="width:100%;"></div>';
    }
    return '<div class="f"><label>'+escapeHtml(f.label)+' (0–10)</label><input type="number" min="0" max="10" data-trackfield="'+f.key+'" value="'+(rec[f.key]!=null?escapeHtml(rec[f.key]):'')+'" style="width:60px;"></div>';
  }).join('');
  return '<div class="checkin-card"><h3>Daily tracking</h3><div class="ci-sub">Fill this in each night.</div>'+
    '<div class="ci-form" style="flex-wrap:wrap;">'+rows+'</div>'+
    '<div class="ci-form" style="margin-top:10px;"><div class="f"><label>Overall today</label><select data-trackfield="overall">'+
      '<option value="">—</option>'+
      '<option value="better" '+(rec.overall==='better'?'selected':'')+'>Better</option>'+
      '<option value="same" '+(rec.overall==='same'?'selected':'')+'>Same</option>'+
      '<option value="worse" '+(rec.overall==='worse'?'selected':'')+'>Worse</option>'+
    '</select></div></div>'+
    '<div class="f" style="margin-top:8px;"><label>One observation</label><textarea data-trackfield="observation" rows="2" style="width:100%;font-size:12.5px;padding:7px 9px;border-radius:8px;border:1px solid var(--border);box-sizing:border-box;">'+escapeHtml(rec.observation||'')+'</textarea></div>'+
    '<button type="button" id="save-tracking-btn" class="send-grocery-btn" style="margin-top:8px;">'+(rec.savedAt?'Update tonight’s tracking':'Save tonight’s tracking')+'</button>'+
  '</div>';
}
function attachTrackingHandlers(el, date){
  const btn = document.getElementById('save-tracking-btn');
  if(!btn) return;
  btn.addEventListener('click', async function(){
    const rec = trackingLog[date] || {};
    el.querySelectorAll('[data-trackfield]').forEach(function(input){ rec[input.dataset.trackfield] = input.value; });
    rec.savedAt = new Date().toISOString();
    trackingLog[date] = rec;
    await saveTrackingLog();
    btn.textContent = 'Saved ✓';
    setTimeout(function(){ btn.textContent = 'Update tonight’s tracking'; }, 1500);
  });
}

/* =====================================================================
   SHOPPING
===================================================================== */
function daysAgo(dateStr){ return Math.floor((new Date(todayStr()+'T00:00:00') - new Date(dateStr+'T00:00:00'))/86400000); }
function renderShopping(){
  const el = document.getElementById('shopping-view');
  el.innerHTML = '<div class="routine-card"><div class="rc-head"><div><div class="rc-title">Products</div><div class="rc-time">Skip scrubs, brushes, bleach, pore vacuums, strong peels, extra acids/serums. Send anything you\'re low on straight into Grocery\'s list — safe to send again whenever you run out.</div></div></div>'+
    currentShoppingList().map(function(it){
      const sentDate = shoppingLog[it.name];
      const statusHtml = sentDate
        ? '<span class="shop-sent">Sent to Grocery '+(daysAgo(sentDate)===0?'today':daysAgo(sentDate)+'d ago')+'</span>'
        : '';
      return '<div class="shop-row"><div style="flex:1;"><div class="shop-text">'+escapeHtml(it.name)+'</div><div class="shop-sub">'+escapeHtml(it.sub)+'</div>'+statusHtml+'</div>'+
        '<button class="send-grocery-btn" data-senditem="'+escapeHtml(it.name)+'">'+(sentDate?'Send again':'Send to Grocery')+'</button></div>';
    }).join('')+
    '<div style="margin-top:10px;"><button class="send-grocery-btn wide" id="send-all-btn">Send everything not yet sent</button></div>'+
  '</div>';

  el.querySelectorAll('[data-senditem]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      const name = btn.dataset.senditem;
      btn.disabled = true; btn.textContent = 'Sending…';
      const result = await sendItemToGrocery(name);
      shoppingLog[name] = todayStr();
      await saveShoppingLog();
      renderShopping();
    });
  });
  document.getElementById('send-all-btn').addEventListener('click', async function(){
    const btn = document.getElementById('send-all-btn');
    btn.disabled = true; btn.textContent = 'Sending…';
    const unsent = currentShoppingList().filter(function(it){ return !shoppingLog[it.name]; });
    for(const it of unsent){
      await sendItemToGrocery(it.name);
      shoppingLog[it.name] = todayStr();
    }
    await saveShoppingLog();
    renderShopping();
  });
}

/* =====================================================================
   MILESTONES
===================================================================== */
function renderMilestones(){
  const el = document.getElementById('milestones-view');
  const today = todayStr();
  const list = currentMilestones();
  if(!list.length){
    el.innerHTML = '<div class="routine-card"><div class="empty-note">No dated milestones for this routine — it\'s a steady daily plan rather than a phased one.</div></div>';
    return;
  }
  el.innerHTML = '<div class="routine-card">'+
    list.map(function(m){
      const key = m.date+':'+m.text;
      const done = !!milestoneLog[key];
      const status = done ? '' : (m.date<today ? 'overdue' : (m.date===today ? 'today' : ''));
      const badge = !done && status==='overdue' ? '<span class="badge">overdue</span>' : (!done && status==='today' ? '<span class="badge today">today</span>' : '');
      return '<div class="milestone-row '+status+'"><div class="milestone-date">'+fmtHeaderDate(m.date)+'</div>'+
        '<div class="milestone-text '+(done?'strike':'')+'">'+escapeHtml(m.text)+' '+badge+'</div>'+
        '<input type="checkbox" class="step-chk" data-mskey="'+escapeHtml(key)+'" '+(done?'checked':'')+'></div>';
    }).join('')+
  '</div>';
  el.querySelectorAll('[data-mskey]').forEach(function(cb){
    cb.addEventListener('change', async function(){
      const key = cb.dataset.mskey;
      if(cb.checked) milestoneLog[key] = true; else delete milestoneLog[key];
      await saveMilestoneLog();
      renderMilestones();
    });
  });
}

/* =====================================================================
   CHECK-INS
===================================================================== */
function lastEntry(arr){ return arr.length ? arr[arr.length-1] : null; }
function daysSince(dateStr){ return Math.floor((new Date(todayStr()+'T00:00:00') - new Date(dateStr+'T00:00:00'))/86400000); }
function dueNote(arr, intervalDays, label){
  const last = lastEntry(arr);
  if(!last) return 'Not logged yet — log your first '+label+'.';
  const since = daysSince(last.date);
  if(since >= intervalDays) return 'Due now — last logged '+since+' days ago.';
  return 'Logged '+since+' day'+(since===1?'':'s')+' ago. Next due in '+(intervalDays-since)+' day'+((intervalDays-since)===1?'':'s')+'.';
}
function renderCheckins(){
  if(activeProfile !== 'Anusha'){ renderMonthReviewBhargav(); return; }
  const el = document.getElementById('checkins-view');
  el.innerHTML =
    gymSyncedCardHtml('Weight', 'Weekly, same conditions', 'kg', 7, gymWeightEntries)+
    gymSyncedCardHtml('Waist', 'Every 2 weeks', 'cm', 14, gymWaistEntries)+
    checkinCardHtml('pimples','Active pimple count','Every 2 weeks','count',14)+
    photosCardHtml();

  const btn = document.getElementById('log-pimples-btn');
  btn.addEventListener('click', async function(){
    const input = document.getElementById('log-pimples-input');
    const val = parseFloat(input.value);
    if(isNaN(val)) return;
    checkins.pimples.push({date: todayStr(), value: val});
    await saveCheckins();
    input.value = '';
    renderCheckins();
  });
  const photoBtn = document.getElementById('log-photos-btn');
  photoBtn.addEventListener('click', async function(){
    checkins.photos.push({date: todayStr()});
    await saveCheckins();
    renderCheckins();
  });
}
function gymSyncedCardHtml(label, freq, unit, intervalDays, arr){
  const recent = arr.slice(-5).reverse();
  return '<div class="checkin-card"><h3>'+label+' <span class="gym-sync-tag">synced from Gym</span></h3><div class="ci-sub">'+freq+'</div>'+
    '<div class="ci-due">'+dueNote(arr, intervalDays, label.toLowerCase())+'</div>'+
    '<div class="ci-form"><a class="gym-log-link" href="../gym/index.html">Log today\'s '+label.toLowerCase()+' in Gym app →</a></div>'+
    (recent.length ? '<div class="ci-log">'+recent.map(function(e){ return '<div class="ci-log-row"><span>'+fmtHeaderDate(e.date)+'</span><span>'+e.value+' '+unit+'</span></div>'; }).join('')+'</div>' : '<div class="ci-log"><div class="ci-log-row"><span>No weigh-ins logged in Gym yet.</span></div></div>')+
  '</div>';
}
function checkinCardHtml(kind, label, freq, unit, intervalDays){
  const arr = checkins[kind] || [];
  const recent = arr.slice(-5).reverse();
  return '<div class="checkin-card"><h3>'+label+'</h3><div class="ci-sub">'+freq+'</div>'+
    '<div class="ci-due">'+dueNote(arr, intervalDays, label.toLowerCase())+'</div>'+
    '<div class="ci-form"><div class="f"><label>'+unit+'</label><input type="number" step="0.1" id="log-'+kind+'-input"></div><button id="log-'+kind+'-btn">Log today</button></div>'+
    (recent.length ? '<div class="ci-log">'+recent.map(function(e){ return '<div class="ci-log-row"><span>'+fmtHeaderDate(e.date)+'</span><span>'+e.value+' '+unit+'</span></div>'; }).join('')+'</div>' : '')+
  '</div>';
}
function photosCardHtml(){
  const arr = checkins.photos || [];
  const recent = arr.slice(-4).reverse();
  return '<div class="checkin-card"><h3>Face photos</h3><div class="ci-sub">Every 4 weeks — same daylight, no filter, same camera, neutral expression: front, both 45°, both profiles, forehead/nose close-up, both cheeks, under-eye.</div>'+
    '<div class="ci-due">'+dueNote(arr, 28, 'photo set')+'</div>'+
    '<div class="ci-form"><button id="log-photos-btn">Mark photos taken today</button></div>'+
    (recent.length ? '<div class="ci-log">'+recent.map(function(e){ return '<div class="ci-log-row"><span>'+fmtHeaderDate(e.date)+'</span><span>✓ taken</span></div>'; }).join('')+'</div>' : '')+
  '</div>';
}

/* =====================================================================
   MONTH REVIEW (Bhargav) — how many nights each month's tracking form
   has actually been filled in, out of the days elapsed so far.
===================================================================== */
function renderMonthReviewBhargav(){
  const el = document.getElementById('checkins-view');
  const today = todayStr();
  el.innerHTML = SKIN_MONTHS.map(function(m){
    const start = m.range[0], end = m.range[1];
    let status = 'Starts '+fmtHeaderDate(start);
    let bodyHtml = '';
    if(today >= start){
      const elapsedEnd = today > end ? end : today;
      let loggedDays = 0, elapsedDays = 0, d = start;
      while(d <= elapsedEnd){
        elapsedDays++;
        if(trackingLog[d] && trackingLog[d].savedAt) loggedDays++;
        d = addDays(d, 1);
      }
      status = today > end ? 'Complete' : 'In progress';
      bodyHtml = '<div class="ci-due">Tracking logged '+loggedDays+' of '+elapsedDays+' day'+(elapsedDays===1?'':'s')+' so far.</div>';
    }
    return '<div class="checkin-card"><h3>'+escapeHtml(m.name)+'</h3><div class="ci-sub">'+fmtHeaderDate(start)+' – '+fmtHeaderDate(end)+' · '+status+'</div>'+bodyHtml+'</div>';
  }).join('');
}
