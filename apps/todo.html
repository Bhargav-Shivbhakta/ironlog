<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#14161F; --surface:#1B1E2A; --surface-2:#232637;
    --border:#2E3245; --border-soft:#262A3A;
    --text:#F1F0EC; --text-soft:#9A9DAD; --text-faint:#5F6376;
    --accent:#FF6B4A; --accent-soft:#3A2620; --accent-deep:#FF8A6E;
    --done:#34D399; --done-soft:#16342A;
    --amber:#F5B942; --amber-soft:#332A14;
    --danger:#F0596B; --danger-soft:#3A1F26;
    --radius-lg:16px; --radius-md:11px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(0,0,0,0.2), 0 10px 24px -16px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:18px 14px 70px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;}
  button,input,select{font-family:inherit;}
  a{color:var(--accent-deep);}

  .auth-overlay,.profile-overlay{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-box{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 26px;text-align:center;box-shadow:var(--shadow);}
  .auth-box h2{font-size:22px;margin:0 0 4px;}
  .auth-box p{color:var(--text-soft);font-size:13px;margin:0 0 18px;}
  .auth-box input{width:100%;font-size:13.5px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text);margin-bottom:9px;}
  .auth-box button{width:100%;background:var(--accent);color:#1A0E09;border:none;border-radius:var(--radius-sm);padding:10px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .auth-toggle{margin-top:12px;font-size:12px;color:var(--text-soft);}
  .auth-toggle button{background:none;color:var(--accent-deep);text-decoration:underline;font-weight:600;width:auto;padding:0 0 0 4px;}
  .auth-error{color:var(--danger);font-size:12px;min-height:15px;margin-bottom:6px;}

  .profile-inner{text-align:center;}
  .profile-inner h1{font-size:24px;margin:0 0 32px;font-weight:600;}
  .profile-row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;}
  .profile-card{background:none;border:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:11px;cursor:pointer;}
  .profile-avatar{width:96px;height:96px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#fff;border:3px solid transparent;font-family:'Space Grotesk',sans-serif;}
  .profile-card:hover .profile-avatar{border-color:var(--accent);}
  .av-b{background:linear-gradient(135deg,#FF6B4A,#D6402C);}
  .av-a{background:linear-gradient(135deg,#34D399,#0F7A5A);}
  .profile-name{font-size:14px;font-weight:600;color:var(--text-soft);}

  .topbar{max-width:600px;margin:0 auto 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .topbar a.back,.topbar button.switch{font-size:12px;color:var(--text-faint);text-decoration:none;background:none;border:none;cursor:pointer;padding:0;}

  header.app-head{text-align:center;margin-bottom:20px;}
  header.app-head .who-badge{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 14px 4px 5px;margin-bottom:10px;}
  header.app-head .who-avatar{width:22px;height:22px;border-radius:7px;font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;}
  header.app-head .who-avatar.av-b{background:#FF6B4A;}
  header.app-head .who-avatar.av-a{background:#34D399;}
  header.app-head .who-name{font-size:12px;font-weight:600;color:var(--text-soft);}
  header.app-head h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-0.01em;}

  .quick-add{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:6px;box-shadow:var(--shadow);display:flex;gap:6px;margin-bottom:14px;}
  .quick-add input[type=text]{
    flex:1;border:none;background:transparent;color:var(--text);font-size:15px;padding:11px 12px;outline:none;
  }
  .quick-add input[type=text]::placeholder{color:var(--text-faint);}
  .quick-add button.add-submit{background:var(--accent);color:#1A0E09;border:none;border-radius:var(--radius-sm);padding:0 18px;font-size:14px;font-weight:700;cursor:pointer;}
  .quick-add button.add-submit:hover{background:var(--accent-deep);}
  .add-toggle{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:0 6px;font-size:18px;}
  .add-toggle:hover{color:var(--text-soft);}

  .advanced-row{display:none;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;margin:-8px 0 14px;box-shadow:var(--shadow);}
  .advanced-row.open{display:flex;}
  .advanced-row .f{display:flex;flex-direction:column;gap:3px;}
  .advanced-row label{font-size:9.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
  .advanced-row select,.advanced-row input[type=date]{
    font-size:12.5px;padding:6px 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  }
  .target-toggle{display:flex;gap:4px;background:var(--surface-2);border-radius:8px;padding:3px;}
  .target-toggle button{border:none;background:transparent;color:var(--text-soft);font-size:12px;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer;}
  .target-toggle button.active{background:var(--accent);color:#1A0E09;}

  .tabs-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
  .filter-tabs{display:flex;gap:16px;}
  .filter-tabs button{background:none;border:none;color:var(--text-faint);font-size:13px;font-weight:600;padding:4px 0;cursor:pointer;border-bottom:2px solid transparent;}
  .filter-tabs button.active{color:var(--text);border-bottom-color:var(--accent);}
  .sort-select{font-size:12px;color:var(--text-soft);background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:5px 8px;}

  .section-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--text-soft);margin:22px 0 8px;display:flex;align-items:center;gap:8px;}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border);}

  .task-row{
    display:flex;align-items:flex-start;gap:11px;padding:12px 14px 12px 8px;background:var(--surface);
    border:1px solid var(--border-soft);border-left:2px dashed var(--border);border-radius:var(--radius-md);
    margin-bottom:7px;cursor:grab;transition:opacity .18s ease, transform .18s ease;position:relative;
  }
  .task-row.dragging{opacity:0.35;}
  .task-row.done{border-left-color:var(--done);}
  .task-row.priority-high{border-left-color:var(--accent);}
  .task-row.priority-high.done{border-left-color:var(--done);}

  .task-chk{
    appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex:none;margin-top:1px;
    cursor:pointer;position:relative;background:var(--surface-2);transition:all .15s cubic-bezier(.34,1.56,.64,1);
  }
  .task-chk:checked{background:var(--done);border-color:var(--done);transform:scale(1.08);}
  .task-chk:checked::after{
    content:'';position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #0D2018;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);
  }

  .task-body{flex:1;min-width:0;}
  .task-text{font-size:14.5px;font-weight:500;outline:none;line-height:1.4;}
  .task-text[contenteditable]:hover,.task-text[contenteditable]:focus{border-bottom:1px dashed var(--border);}
  .task-text.strike{text-decoration:line-through;color:var(--text-faint);}
  .task-meta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap;}
  .prio-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .prio-dot.high{background:var(--accent);}
  .prio-dot.medium{background:var(--amber);}
  .prio-dot.low{background:var(--text-faint);}
  .due-chip{font-size:10.5px;font-weight:600;border-radius:20px;padding:2px 8px;background:var(--surface-2);color:var(--text-soft);}
  .due-chip.overdue{background:var(--danger-soft);color:var(--danger);}
  .due-chip.today{background:var(--amber-soft);color:var(--amber);}
  .from-tag{font-size:10.5px;font-weight:600;border-radius:20px;padding:2px 8px;background:var(--accent-soft);color:var(--accent-deep);}

  .task-actions{display:flex;gap:4px;flex:none;}
  .icon-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:14px;padding:3px;line-height:1;}
  .icon-btn:hover{color:var(--text);}

  .empty-note{color:var(--text-faint);font-size:13px;padding:18px 6px;text-align:center;}

  .drop-zone{border-radius:var(--radius-md);transition:background .15s ease;}
  .drop-zone.drag-over{background:rgba(255,107,74,0.06);outline:1.5px dashed var(--accent);outline-offset:3px;}

  .undo-toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);
    font-size:13px;z-index:150;opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .undo-toast.show{opacity:1;pointer-events:auto;}
  .undo-toast button{background:none;border:none;color:var(--accent-deep);font-weight:700;font-size:13px;cursor:pointer;}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>

<div id="auth-overlay" class="auth-overlay">
  <div class="auth-box">
    <h2>To-Do</h2>
    <p>Sign in to sync across devices.</p>
    <form id="auth-form">
      <input type="email" id="auth-email" placeholder="Email" required>
      <input type="password" id="auth-password" placeholder="Password" required minlength="6">
      <div class="auth-error" id="auth-error"></div>
      <button type="submit" id="auth-submit">Sign in</button>
    </form>
    <div class="auth-toggle"><span id="auth-toggle-text">New here?</span><button type="button" id="auth-toggle-btn">Create an account</button></div>
  </div>
</div>

<div id="profile-overlay" class="profile-overlay" style="display:none;">
  <div class="profile-inner">
    <h1>Whose list?</h1>
    <div class="profile-row" id="profile-row"></div>
  </div>
</div>

<div class="wrap" id="app-wrap" style="display:none;">
  <div class="topbar">
    <a class="back" href="../index.html">← All apps</a>
    <button class="switch" id="switch-profile-btn">Switch profile</button>
  </div>

  <header class="app-head">
    <div class="who-badge" id="who-badge"></div>
    <h1>To-Do</h1>
  </header>

  <div class="quick-add">
    <input type="text" id="quick-add-input" placeholder="Add something you need to do…">
    <button class="add-toggle" id="advanced-toggle" title="Priority, due date, assign">⋯</button>
    <button class="add-submit" id="quick-add-btn">Add</button>
  </div>
  <div class="advanced-row" id="advanced-row">
    <div class="f"><label>Priority</label>
      <select id="new-priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
    </div>
    <div class="f"><label>Due</label><input type="date" id="new-due"></div>
    <div class="f"><label>Add to</label>
      <div class="target-toggle" id="target-toggle">
        <button type="button" data-target="me" class="active">Me</button>
        <button type="button" data-target="partner">Partner</button>
      </div>
    </div>
  </div>

  <div class="tabs-row">
    <div class="filter-tabs">
      <button data-filter="active" class="active">Active</button>
      <button data-filter="all">All</button>
      <button data-filter="done">Done</button>
    </div>
    <select class="sort-select" id="sort-select">
      <option value="manual">My order</option>
      <option value="priority">By priority</option>
      <option value="due">By due date</option>
    </select>
  </div>

  <div id="my-task-list"></div>

  <div class="section-title" id="sent-title">Sent to partner</div>
  <div id="sent-task-list"></div>
</div>

<div class="undo-toast" id="undo-toast">
  <span id="undo-text">Task deleted</span>
  <button id="undo-btn">Undo</button>
</div>

<script>
/* =====================================================================
   FIREBASE
===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBe01eR2RZwSbU_aoJMeh_2MMJ5mqkVuKk",
  authDomain: "iron-log-bfc55.firebaseapp.com",
  projectId: "iron-log-bfc55",
  storageBucket: "iron-log-bfc55.firebasestorage.app",
  messagingSenderId: "106586808946",
  appId: "1:106586808946:web:f4736554ba9fc82c6fd8eb"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
let currentUser = null;
let activeProfile = null;

function profileDoc(profileId, key){
  return db.collection('users').doc(currentUser.uid).collection('todo-profiles').doc(profileId).collection('data').doc(key);
}
function otherProfile(p){ return p==='Bhargav' ? 'Anusha' : 'Bhargav'; }

/* =====================================================================
   AUTH
===================================================================== */
let authMode = 'signin';
document.getElementById('auth-toggle-btn').addEventListener('click', ()=>{
  authMode = authMode==='signin' ? 'signup' : 'signin';
  document.getElementById('auth-submit').textContent = authMode==='signin' ? 'Sign in' : 'Create account';
  document.getElementById('auth-toggle-text').textContent = authMode==='signin' ? 'New here?' : 'Already have an account?';
  document.getElementById('auth-toggle-btn').textContent = authMode==='signin' ? 'Create an account' : 'Sign in';
});
document.getElementById('auth-form').addEventListener('submit', async e=>{
  e.preventDefault();
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  try{
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    if(authMode==='signin') await auth.signInWithEmailAndPassword(email, password);
    else await auth.createUserWithEmailAndPassword(email, password);
  }catch(err){ errEl.textContent = err.message.replace('Firebase: ',''); }
});

function showProfilePicker(){
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('app-wrap').style.display = 'none';
  document.getElementById('profile-overlay').style.display = 'flex';
  const row = document.getElementById('profile-row');
  row.innerHTML = '';
  [{id:'Bhargav',cls:'av-b'},{id:'Anusha',cls:'av-a'}].forEach(p=>{
    const card = document.createElement('button');
    card.className = 'profile-card';
    card.innerHTML = '<div class="profile-avatar '+p.cls+'">'+p.id[0]+'</div><div class="profile-name">'+p.id+'</div>';
    card.addEventListener('click', ()=> enterProfile(p.id));
    row.appendChild(card);
  });
}
function showAuth(){
  document.getElementById('auth-overlay').style.display = 'flex';
  document.getElementById('profile-overlay').style.display = 'none';
  document.getElementById('app-wrap').style.display = 'none';
}
auth.onAuthStateChanged(user=>{
  currentUser = user;
  user ? showProfilePicker() : showAuth();
});

async function enterProfile(profileId){
  activeProfile = profileId;
  document.getElementById('profile-overlay').style.display = 'none';
  document.getElementById('app-wrap').style.display = 'block';
  document.getElementById('who-badge').innerHTML = '<span class="who-avatar av-'+(profileId==='Bhargav'?'b':'a')+'">'+profileId[0]+'</span><span class="who-name">'+profileId+'</span>';
  document.getElementById('switch-profile-btn').onclick = showProfilePicker;
  document.getElementById('sent-title').textContent = 'Sent to '+otherProfile(profileId);
  document.querySelector('.target-toggle button[data-target="partner"]').textContent = otherProfile(profileId);
  initControls();
  await loadTasks();
  render();
}

/* =====================================================================
   DATA
===================================================================== */
let myTasks = [];
let activeFilter = 'active';
let activeSort = 'manual';

async function loadTasks(){
  try{ const doc = await profileDoc(activeProfile,'tasks').get(); myTasks = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : []; }
  catch(e){ myTasks = []; }
}
async function saveTasks(){
  try{ await profileDoc(activeProfile,'tasks').set({json: JSON.stringify(myTasks)}); }
  catch(e){ console.error('tasks save failed', e); }
}
async function loadPartnerTasksRaw(){
  try{ const doc = await profileDoc(otherProfile(activeProfile),'tasks').get(); return (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : []; }
  catch(e){ return []; }
}
async function savePartnerTasksRaw(list){
  try{ await profileDoc(otherProfile(activeProfile),'tasks').set({json: JSON.stringify(list)}); }
  catch(e){ console.error('partner tasks save failed', e); }
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDue(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function dueClass(dateStr){
  if(!dateStr) return '';
  if(dateStr < todayStr()) return 'overdue';
  if(dateStr === todayStr()) return 'today';
  return '';
}

/* =====================================================================
   ADD / TOGGLE / DELETE
===================================================================== */
let lastDeleted = null;
let undoTimer = null;

async function addTask(text, opts){
  const item = {
    id:'task-'+Date.now()+'-'+Math.floor(Math.random()*1000),
    text, done:false,
    priority: opts.priority || 'medium',
    due: opts.due || null,
    createdBy: activeProfile,
    order: Date.now(),
    createdAt: new Date().toISOString()
  };
  if(opts.target === 'partner'){
    const list = await loadPartnerTasksRaw();
    list.push(item);
    await savePartnerTasksRaw(list);
  } else {
    myTasks.push(item);
    await saveTasks();
  }
}
async function toggleMyTask(id){
  const t = myTasks.find(x=>x.id===id);
  if(t) t.done = !t.done;
  await saveTasks();
}
async function toggleSentTask(id){
  const list = await loadPartnerTasksRaw();
  const t = list.find(x=>x.id===id);
  if(t) t.done = !t.done;
  await savePartnerTasksRaw(list);
}
function deleteMyTask(id){
  const idx = myTasks.findIndex(x=>x.id===id);
  if(idx<0) return;
  lastDeleted = { scope:'me', item: myTasks[idx], idx };
  myTasks.splice(idx,1);
  saveTasks();
  showUndo('Task deleted');
}
async function deleteSentTask(id){
  const list = await loadPartnerTasksRaw();
  const idx = list.findIndex(x=>x.id===id);
  if(idx<0) return;
  lastDeleted = { scope:'partner', item: list[idx], idx };
  list.splice(idx,1);
  await savePartnerTasksRaw(list);
  showUndo('Task deleted');
}
function showUndo(msg){
  document.getElementById('undo-text').textContent = msg;
  document.getElementById('undo-toast').classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(()=>{ document.getElementById('undo-toast').classList.remove('show'); lastDeleted=null; }, 5000);
}
document.getElementById('undo-btn').addEventListener('click', async ()=>{
  if(!lastDeleted) return;
  if(lastDeleted.scope === 'me'){
    myTasks.splice(lastDeleted.idx, 0, lastDeleted.item);
    await saveTasks();
  } else {
    const list = await loadPartnerTasksRaw();
    list.splice(lastDeleted.idx, 0, lastDeleted.item);
    await savePartnerTasksRaw(list);
  }
  lastDeleted = null;
  document.getElementById('undo-toast').classList.remove('show');
  render();
});

/* =====================================================================
   RENDER
===================================================================== */
function filterAndSort(list){
  let out = list.slice();
  if(activeFilter==='active') out = out.filter(t=>!t.done);
  if(activeFilter==='done') out = out.filter(t=>t.done);
  const prioRank = {high:0, medium:1, low:2};
  if(activeSort==='priority') out.sort((a,b)=> prioRank[a.priority]-prioRank[b.priority] || a.order-b.order);
  else if(activeSort==='due') out.sort((a,b)=> (a.due||'9999-99-99').localeCompare(b.due||'9999-99-99'));
  else out.sort((a,b)=> a.order-b.order);
  return out;
}

function taskRowHtml(t, scope){
  const dc = dueClass(t.due);
  const dueChip = t.due ? '<span class="due-chip '+dc+'">'+(dc==='overdue'?'overdue ':'')+fmtDue(t.due)+'</span>' : '';
  const fromTag = (scope==='mine' && t.createdBy !== activeProfile) ? '<span class="from-tag">from '+escapeHtml(t.createdBy)+'</span>' : '';
  const editable = scope==='mine' ? 'contenteditable="true"' : '';
  const dragAttrs = (scope==='mine' && activeSort==='manual') ? 'draggable="true"' : '';
  return '<div class="task-row '+(t.done?'done':'')+' priority-'+t.priority+'" data-taskid="'+t.id+'" data-scope="'+scope+'" '+dragAttrs+'>'+
    '<input type="checkbox" class="task-chk" data-toggle="'+t.id+'" data-scope="'+scope+'" '+(t.done?'checked':'')+'>'+
    '<div class="task-body">'+
      '<div class="task-text '+(t.done?'strike':'')+'" '+editable+' data-edit="'+t.id+'">'+escapeHtml(t.text)+'</div>'+
      '<div class="task-meta"><span class="prio-dot '+t.priority+'"></span>'+dueChip+fromTag+'</div>'+
    '</div>'+
    '<div class="task-actions"><button class="icon-btn" data-del="'+t.id+'" data-scope="'+scope+'">✕</button></div>'+
    '</div>';
}

async function render(){
  document.querySelectorAll('.filter-tabs button').forEach(b=> b.classList.toggle('active', b.dataset.filter===activeFilter));

  const myList = filterAndSort(myTasks);
  document.getElementById('my-task-list').innerHTML = myList.length
    ? myList.map(t=>taskRowHtml(t,'mine')).join('')
    : '<div class="empty-note">'+(activeFilter==='done' ? 'Nothing finished yet.' : 'Add something you need to do.')+'</div>';

  const partnerRaw = await loadPartnerTasksRaw();
  const sentList = filterAndSort(partnerRaw.filter(t=>t.createdBy===activeProfile));
  document.getElementById('sent-task-list').innerHTML = sentList.length
    ? sentList.map(t=>taskRowHtml(t,'sent')).join('')
    : '<div class="empty-note">Nothing sent to '+otherProfile(activeProfile)+' yet.</div>';

  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('.task-chk').forEach(cb=>{
    cb.addEventListener('change', async ()=>{
      const id = cb.dataset.toggle;
      if(cb.dataset.scope==='mine') await toggleMyTask(id);
      else await toggleSentTask(id);
      render();
    });
  });
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(btn.dataset.scope==='mine') deleteMyTask(btn.dataset.del);
      else await deleteSentTask(btn.dataset.del);
      render();
    });
  });
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('blur', async ()=>{
      const id = el.dataset.edit;
      const t = myTasks.find(x=>x.id===id);
      if(t && t.text !== el.textContent.trim()){
        t.text = el.textContent.trim();
        await saveTasks();
      }
    });
  });
  document.querySelectorAll('.task-row[draggable="true"]').forEach(row=>{
    row.addEventListener('dragstart', ()=>{ row.classList.add('dragging'); row.dataset.dragging='1'; });
    row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); });
  });
  const listEl = document.getElementById('my-task-list');
  listEl.addEventListener('dragover', e=>{
    e.preventDefault();
    const dragging = listEl.querySelector('.dragging');
    if(!dragging) return;
    const after = [...listEl.querySelectorAll('.task-row:not(.dragging)')].find(row=>{
      const box = row.getBoundingClientRect();
      return e.clientY < box.top + box.height/2;
    });
    if(after) listEl.insertBefore(dragging, after);
    else listEl.appendChild(dragging);
  });
  listEl.addEventListener('drop', async ()=>{
    const ids = [...listEl.querySelectorAll('.task-row')].map(r=>r.dataset.taskid);
    ids.forEach((id,i)=>{ const t = myTasks.find(x=>x.id===id); if(t) t.order = i; });
    await saveTasks();
  });
}

/* =====================================================================
   CONTROLS
===================================================================== */
let addTarget = 'me';
function initControls(){
  document.getElementById('advanced-toggle').addEventListener('click', ()=>{
    document.getElementById('advanced-row').classList.toggle('open');
  });
  document.querySelectorAll('#target-toggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      addTarget = btn.dataset.target;
      document.querySelectorAll('#target-toggle button').forEach(b=>b.classList.toggle('active', b===btn));
    });
  });
  document.querySelectorAll('.filter-tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeFilter = btn.dataset.filter; render(); });
  });
  document.getElementById('sort-select').addEventListener('change', e=>{ activeSort = e.target.value; render(); });

  async function submitAdd(){
    const input = document.getElementById('quick-add-input');
    const text = input.value.trim();
    if(!text) return;
    await addTask(text, {
      priority: document.getElementById('new-priority').value,
      due: document.getElementById('new-due').value || null,
      target: addTarget
    });
    input.value = '';
    document.getElementById('new-due').value = '';
    render();
  }
  document.getElementById('quick-add-btn').addEventListener('click', submitAdd);
  document.getElementById('quick-add-input').addEventListener('keydown', e=>{
    if(e.key==='Enter') submitAdd();
  });
}
</script>
