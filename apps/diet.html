<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nourish Duo — Integrated Diet System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#f5f4ef; --surface:#ffffff; --surface-alt:#eff4ef;
    --border:#e3e8e3; --border-soft:#edf1ec;
    --text:#1d2821; --text-soft:#536158; --text-faint:#718078;
    --cal:#236b4c; --cal-soft:#dcefe4;
    --protein:#618ca8; --protein-soft:#e4edf1;
    --carbs:#e59b53; --carbs-soft:#faeee0;
    --fat:#b9d763; --fat-soft:#f2f7e2;
    --green:#236b4c; --green-soft:#dcefe4;
    --lime:#b9d763; --orange:#e59b53; --blue:#618ca8;
    --danger:#bd5b52; --danger-soft:#f9e7e5;
    --sidebar-bg:#173d2d; --sidebar-text:#eef7f1; --sidebar-muted:#bdd0c5; --sidebar-active:#285541;
    --radius-lg:20px; --radius-md:13px; --radius-sm:9px;
    --shadow:0 18px 45px rgba(35,55,43,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:680px;margin:0 auto;}
  h1,h2,h3{font-family:'Inter',sans-serif;}
  button,input,select,textarea{font-family:inherit;}
  button{transition:transform .12s cubic-bezier(.34,1.56,.64,1);}
  button:active{transform:scale(0.96);}

  .loading-gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-soft);}

  .profile-inner{text-align:center;}
  .profile-inner h1{font-size:22px;margin:0 0 30px;font-weight:800;}
  .profile-row{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;}
  .profile-card{background:none;border:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;}
  .profile-avatar{width:88px;height:88px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;font-family:'Inter',sans-serif;}
  .av-b{background:linear-gradient(135deg,#FF7A45,#D6402C);}
  .av-a{background:linear-gradient(135deg,#22C55E,#0F7A5A);}
  .profile-name{font-size:13.5px;font-weight:600;color:var(--text-soft);}

  .app{min-height:100vh;display:grid;grid-template-columns:230px 1fr;}
  .sidebar{background:var(--sidebar-bg);color:var(--sidebar-text);padding:28px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:800;padding:0 10px 20px;}
  .brandmark{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--lime);color:var(--sidebar-bg);font-size:18px;font-weight:800;flex:none;}
  .back-link{display:block;color:var(--sidebar-muted);text-decoration:none;font-size:11.5px;padding:0 10px;margin:-10px 0 18px;}
  .nav{display:grid;gap:7px;}
  .nav button{border:0;color:var(--sidebar-muted);background:transparent;border-radius:12px;padding:12px 13px;text-align:left;font-weight:650;display:flex;gap:10px;align-items:center;font-size:13.5px;cursor:pointer;}
  .nav button::before{content:attr(data-navicon);font-size:15px;}
  .nav button.active,.nav button:hover{background:var(--sidebar-active);color:#fff;}
  .side-note{margin-top:auto;background:#204b38;border:1px solid #36614d;padding:14px;border-radius:14px;color:var(--sidebar-muted);font-size:12px;}
  .side-note strong{color:#fff;display:block;margin-bottom:8px;font-weight:700;}
  .switch-btn{background:none;border:1px solid #4a735e;color:var(--sidebar-text);font-size:11.5px;padding:7px 10px;border-radius:8px;cursor:pointer;width:100%;}

  .main{padding:28px 34px 60px;max-width:1200px;width:100%;margin:0 auto;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .eyebrow{text-transform:uppercase;letter-spacing:0.12em;font-size:11px;color:var(--green);font-weight:800;}
  .topbar h1{font-size:26px;margin:3px 0;font-weight:800;letter-spacing:-0.01em;}
  .back-link-topbar{display:none;color:var(--text-faint);text-decoration:none;font-size:12px;}

  .page{display:none;}
  .page.active{display:block;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 3px 14px rgba(35,55,43,0.025);}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px;gap:12px;flex-wrap:wrap;}
  .subtle{color:var(--text-faint);font-size:13px;}
  .btn{border:0;border-radius:11px;padding:10px 14px;font-weight:750;background:var(--green);color:#fff;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn.secondary{background:var(--green-soft);color:var(--green);}
  .btn.ghost{background:transparent;color:var(--green);border:1px solid var(--border);}
  .btn.danger{background:var(--danger-soft);color:#9a3d35;}
  .stock-low{color:var(--danger);font-weight:800;}
  .stock-good{color:var(--green);font-weight:800;}
  .pantry-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;}
  .pantry-row-view{display:grid;grid-template-columns:1.4fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-soft);}
  .pantry-row-view:last-child{border-bottom:none;}
  .pantry-row-name{font-weight:700;font-size:13.5px;}
  .pantry-row-meta{font-size:11.5px;color:var(--text-faint);}
  .pantry-status-tag{font-size:12px;text-align:right;}
  .pantry-loading{color:var(--text-faint);font-style:italic;padding:30px;text-align:center;}
  .grid{display:grid;grid-template-columns:1.35fr 0.65fr;gap:20px;}
  .trend{height:110px;display:flex;align-items:flex-end;gap:6px;padding-top:14px;}
  .trend-col{flex:1;display:grid;justify-items:center;gap:5px;}
  .trend-bar{width:100%;max-width:32px;background:var(--green);border-radius:6px 6px 2px 2px;min-height:5px;}
  .progress-latest-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px;}
  .progress-latest-cell{background:var(--surface-alt);border-radius:12px;padding:11px;}
  .progress-latest-cell span{font-size:10.5px;color:var(--text-faint);display:block;margin-bottom:3px;}
  .progress-latest-cell b{font-size:16px;}
  .table-scroll{overflow-x:auto;}
  .food-table{width:100%;border-collapse:collapse;min-width:600px;}
  .food-table th{text-align:left;color:var(--text-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;padding:10px;border-bottom:1px solid var(--border);}
  .food-table td{padding:11px 10px;border-bottom:1px solid var(--border-soft);font-size:13px;}
  .food-table .num{text-align:right;font-variant-numeric:tabular-nums;}
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} }

  @media (max-width:900px){
    .app{display:block;}
    .sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;align-items:center;padding:8px 6px;z-index:40;border-top:1px solid #2d5644;overflow-x:auto;}
    .brand,.back-link,.side-note{display:none;}
    .back-link-topbar{display:block;}
    .nav{grid-auto-flow:column;gap:2px;}
    .nav button{flex-direction:column;gap:3px;font-size:9px;padding:7px 8px;white-space:nowrap;}
    .main{padding:18px 16px 84px;}
  }

  .date-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;}
  .date-nav button{background:var(--surface);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:14px;box-shadow:var(--shadow);}
  .date-nav .date-label{font-family:'Inter',sans-serif;font-weight:700;font-size:14.5px;min-width:120px;text-align:center;}
  .date-nav .date-label small{display:block;font-weight:500;font-size:11px;color:var(--text-faint);}

  .summary-card{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-lg);padding:22px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
  .cal-ring-row{display:flex;align-items:center;gap:20px;}
  .cal-ring-wrap{position:relative;width:112px;height:112px;flex:none;}
  .cal-ring-svg{width:112px;height:112px;transform:rotate(-90deg);}
  .cal-ring-track{fill:none;stroke:#e8eee9;stroke-width:11;}
  .rb-totals-box{background:var(--sidebar-bg);color:#fff;border-radius:16px;padding:16px;margin-top:6px;}
  .rb-totals-eyebrow{text-transform:uppercase;letter-spacing:0.1em;font-size:10px;color:var(--lime);font-weight:800;}
  .rb-totals-cal{font-size:30px;font-weight:800;margin:6px 0 2px;}
  .rb-totals-cal small{font-size:14px;font-weight:600;color:#acc2b5;}
  .rb-totals-sub{color:#acc2b5;font-size:12.5px;margin-bottom:10px;}
  .rb-totals-perserv{border-top:1px solid #3a5c4c;padding-top:10px;font-size:12.5px;color:#c9d9d0;}
  .rb-totals-perserv b{color:#fff;}
  .cal-ring-fill{fill:none;stroke:url(#calGradient);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.34,1.2,.64,1);}
  .cal-ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .cal-ring-num{font-family:'Inter',sans-serif;font-weight:800;font-size:24px;color:var(--text);letter-spacing:-0.02em;}
  .cal-ring-label{font-size:9px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;}
  .cal-side{flex:1;}
  .cal-side-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;color:var(--text-soft);}
  .cal-side-row b{font-weight:700;color:var(--text);}

  .macro-bars{display:flex;gap:12px;margin-top:18px;}
  .macro-bar-item{flex:1;}
  .macro-bar-label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-soft);font-weight:600;margin-bottom:5px;}
  .macro-bar-track{height:7px;border-radius:20px;background:var(--surface-alt);overflow:hidden;}
  .macro-bar-fill{height:100%;border-radius:20px;transition:width .4s ease;}

  .meal-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);transition:box-shadow .2s ease;}
  .meal-block:hover{box-shadow:0 2px 6px rgba(20,20,50,0.06), 0 16px 32px -18px rgba(20,20,50,0.22);}
  .meal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .meal-head h3{font-size:14.5px;margin:0;}
  .meal-head .meal-cal{font-size:12px;color:var(--text-soft);font-weight:600;}
  .add-food-btn{background:var(--cal-soft);color:var(--cal);border:none;border-radius:var(--radius-sm);padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}

  .food-entry-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--border-soft);}
  .ing-qty-row{display:flex;align-items:center;gap:6px;margin-top:3px;}
  .ing-qty-input{width:70px;padding:5px 8px;border-radius:8px;border:1px solid var(--border);font-size:13px;}
  .ing-qty-unit{font-size:11.5px;color:var(--text-faint);font-weight:600;}
  .food-entry-row:first-of-type{border-top:none;}
  .fe-name{font-size:13px;font-weight:600;}
  .fe-serving{font-size:11px;color:var(--text-faint);}
  .fe-excluded-note{color:var(--accent-deep,#B8860B);font-weight:600;}
  .fe-macros{font-size:11.5px;color:var(--text-soft);text-align:right;}
  .fe-remove{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;padding:2px 6px;}
  .fe-remove:hover{color:var(--danger);}

  .empty-meal{color:var(--text-faint);font-size:12.5px;font-style:italic;padding:6px 0;}

  .search-overlay{position:fixed;inset:0;z-index:180;background:rgba(20,20,40,0.4);display:flex;align-items:flex-end;justify-content:center;}
  .search-sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px 24px;max-height:82vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,0.2);}
  .mr-recipe-block{background:var(--surface-alt);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:10px;}
  .mr-recipe-name{font-weight:700;font-size:13px;margin-bottom:6px;}
  .mr-ing-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:5px 0;cursor:pointer;}
  .mr-ing-row input{margin-top:3px;flex:none;}
  .mr-ing-qty{color:var(--text-faint);font-size:11.5px;}
  .mr-plain-row{font-size:13px;padding:6px 0;color:var(--text-soft);}
  .mr-totals{font-size:12.5px;color:var(--text-soft);font-weight:600;margin:8px 0 4px;padding:8px 10px;background:var(--surface-alt);border-radius:var(--radius-sm);}
  .search-sheet h3{margin:0 0 10px;font-size:16px;}
  .search-sheet input[type=text]{width:100%;font-size:14px;padding:10px 12px;border-radius:var(--radius-md);border:1px solid var(--border);margin-bottom:10px;}
  .search-result-item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
  .sri-peek{background:var(--surface-alt);border:none;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;flex:none;margin-left:8px;}
  .sri-peek:hover{background:var(--cal-soft);}
  .search-result-item:hover{background:var(--surface-alt);}
  .sri-name{font-size:13.5px;font-weight:600;}
  .sri-meta{font-size:11px;color:var(--text-faint);}
  .sri-cal{font-size:12px;color:var(--text-soft);font-weight:600;}
  .create-food-btn{width:100%;margin-top:10px;background:var(--surface-alt);border:1.5px dashed var(--border);border-radius:var(--radius-md);padding:11px;font-size:13px;font-weight:700;color:var(--text-soft);cursor:pointer;}
  .qty-sheet .qf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
  .qty-sheet .f{display:flex;flex-direction:column;gap:4px;}
  .qty-sheet label{font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;}
  .qty-sheet input,.qty-sheet select{font-size:13px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);}
  .sheet-actions{display:flex;gap:8px;margin-top:10px;}
  .btn-mini{font-size:12.5px;font-weight:700;border:none;border-radius:var(--radius-sm);padding:9px 16px;cursor:pointer;}
  .btn-mini.primary{background:var(--cal);color:#fff;}
  .btn-mini.ghost{background:var(--surface-alt);color:var(--text-soft);}

  .foods-list-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 13px;margin-bottom:7px;box-shadow:var(--shadow);}
  .flr-top{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .flr-name{font-size:13.5px;font-weight:700;}
  .flr-macros{font-size:11px;color:var(--text-faint);}
  .food-edit{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .food-edit.open{display:block;}

  .targets-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .targets-card h3{font-size:15px;margin:0 0 4px;}
  .targets-card p{font-size:12px;color:var(--text-soft);margin:0 0 12px;}
  .targets-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .targets-grid .f{display:flex;flex-direction:column;gap:4px;}
  .targets-grid label{font-size:10.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;}
  .targets-grid input{font-size:14px;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);}

  .history-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 14px;margin-bottom:7px;box-shadow:var(--shadow);}
  .hr-date{font-size:13px;font-weight:700;}
  .hr-nums{font-size:11.5px;color:var(--text-soft);text-align:right;}
  .hr-hit{color:var(--green);}
  .hr-miss{color:var(--danger);}

  .empty-note{color:var(--text-faint);font-style:italic;font-size:13px;padding:18px 6px;text-align:center;}
  .integration-links{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.integration-links a{color:#eef7f1;border:1px solid #4a735e;border-radius:8px;padding:7px;text-align:center;text-decoration:none;font-size:11px}.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.week-day{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:12px;min-height:138px;text-align:left;cursor:pointer}.week-day.active{border:2px solid var(--green);background:#f3faf5}.wd-name{font-size:10px;color:var(--text-faint);text-transform:uppercase;font-weight:700}.wd-num{font-size:22px;font-weight:800;margin:2px 0 12px}.wd-meta{font-size:10.5px;color:var(--text-faint);line-height:1.55}.wd-dot{width:8px;height:8px;border-radius:50%;background:#cbd6ce;display:inline-block}.wd-dot.done{background:var(--green)}.wd-dot.partial{background:var(--orange)}.prep-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px;margin-bottom:7px}.prep-row.done{opacity:.55;text-decoration:line-through}.yield-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.yield-result{background:var(--sidebar-bg);color:#fff;border-radius:14px;padding:14px;margin-top:11px}.yield-result b{font-size:22px}.micro-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.micro-card{background:var(--surface-alt);border-radius:12px;padding:12px}.micro-head{display:flex;justify-content:space-between;gap:8px;font-size:12px}.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.score-card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:14px}.score-card b{display:block;font-size:24px}.score-card span{font-size:11px;color:var(--text-faint)}.adherence-row{display:grid;grid-template-columns:120px 1fr auto;gap:9px;align-items:center;padding:8px 0}.app-chip{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);color:var(--green);padding:7px 10px;border-radius:10px;text-decoration:none;font-weight:700;font-size:12px}.main{max-width:1380px}.brand{font-size:20px}.brandmark{background:var(--lime)}
  @media(max-width:1000px){.week-grid{grid-template-columns:repeat(2,1fr)}.feature-grid{grid-template-columns:1fr}.score-grid{grid-template-columns:1fr 1fr}.yield-grid{grid-template-columns:1fr}.micro-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loading-gate" class="loading-gate">Loading…</div>

<div id="profile-overlay" class="loading-gate" style="display:none;">
  <div class="profile-inner">
    <h1>Whose diary?</h1>
    <div class="profile-row" id="profile-row"></div>
  </div>
</div>

<div class="app" id="app-wrap" style="display:none;">
  <aside class="sidebar">
    <div class="brand"><span class="brandmark">N</span> Nourish Duo</div>
    <a href="../index.html" class="back-link">← All apps</a>
    <nav class="nav" id="nav">
      <button id="tab-today-btn" class="active" data-navicon="◫">Diary</button>
      <button id="tab-meals-btn" data-navicon="▦">Meal plan</button>
      <button id="tab-week-btn" data-navicon="▦">Week</button>
      <button id="tab-prep-btn" data-navicon="◷">Meal prep</button>
      <button id="tab-foods-btn" data-navicon="◉">Ingredients</button>
      <button id="tab-recipes-btn" data-navicon="▤">Recipes</button>
      <button id="tab-pantry-btn" data-navicon="▣">Pantry</button>
      <button id="tab-progress-btn" data-navicon="↗">Progress</button>
      <button id="tab-nutrition-btn" data-navicon="◎">Nutrition</button>
      <button id="tab-adherence-btn" data-navicon="◈">Adherence</button>
      <button id="tab-targets-btn" data-navicon="⚙">Targets</button>
      <button id="tab-history-btn" data-navicon="◈">History</button>
    </nav>
    <div class="side-note"><strong id="app-sub"></strong><button class="switch-btn" id="switch-profile-btn">Switch profile</button><div class="integration-links"><a href="grocery.html">Grocery</a><a href="../gym/index.html">Gym</a></div></div>

let latestGymWeight = null;
async function loadGymWeight(){
  try{
    const snap = await gymDailyLogsCol().get();
    const all = [];

/* =====================================================================
   ENERGY BALANCE — real BMR/TDEE-based tracking instead of just a
   weight-progress bar. Uses Mifflin-St Jeor (the standard, well-validated
   formula) for BMR — a real physiological estimate, not adjusted.

   The 5% margin applies specifically to ESTIMATES that could otherwise
   overstate progress: calories burned from a logged workout, and the
   projected weekly weight change. Both get shaved down 5% before being
   shown, so if the raw math says "0.85 kg this week," what actually
   displays is ~0.80 kg — a deliberately conservative number, so results
   and what the tracker promised stay honest with each other instead of
   the tracker quietly overselling progress that doesn't show up on the
   scale.
===================================================================== */
const ESTIMATE_MARGIN = 0.95; // conservative shave on any *estimated* quantity
// Exercise calorie-per-set rates, since a bench press and a bicep curl
// clearly don't burn the same. Classified by keyword match against the
// exercise name — an approximation (there's no perfect universal table for
// this), but it distinguishes big compound lifts from small isolation work
// rather than treating every set the same.
const EXERCISE_CALORIE_RULES = [
  { pattern: /squat|deadlift|leg press|lunge/i, kcalPerSet: 12, label: 'Large lower-body compound' },
  { pattern: /press|pulldown|pull-up|pullup|row|dip\b/i, kcalPerSet: 9, label: 'Large upper-body compound' },
  { pattern: /curl|extension|raise|fly|calf|forearm/i, kcalPerSet: 4, label: 'Isolation / small muscle' },
  { pattern: /crunch|plank|pallof|ab\b|core/i, kcalPerSet: 4, label: 'Core' }
];
const DEFAULT_KCAL_PER_SET = 7;
function kcalPerSetFor(exerciseName){
  const rule = EXERCISE_CALORIE_RULES.find(function(r){ return r.pattern.test(exerciseName); });
  return rule ? rule.kcalPerSet : DEFAULT_KCAL_PER_SET;
}
function calculateBMR(){
  const wg = weightGoal;
  const weight = latestGymWeight != null ? latestGymWeight : wg.startWeight;
  if(!wg.height || !wg.age || !weight) return null;
  const base = 10*weight + 6.25*wg.height - 5*wg.age;
  return wg.sex==='female' ? base - 161 : base + 5;
}
// Detailed breakdown: every workout logged for the day, every exercise
// within it, its own set count and calorie estimate — so this refreshes
// automatically any time a workout is added or edited in Gym, since it
// reads straight from Gym's real saved data rather than a cached number.
// Cardio is logged completely separately from lift sets (duration/speed/
// incline on a machine, no calorie field at all) — this estimates it with
// a standard METs approach: kcal = METs × weight(kg) × hours. Speed
// buckets are walk/jog/run pace on a treadmill; other machines get a
// reasonable typical MET value. Same conservative margin as everything
// else here.
function metsForCardio(cardio){
  const machine = (cardio.machine||'').toLowerCase();
  const speed = cardio.speed || 0;
  const incline = cardio.incline || 0;
  if(machine.includes('bike') || machine.includes('cycle')) return 7;
  if(machine.includes('elliptical')) return 5;
  if(machine.includes('row')) return 7;
  let mets;
  if(speed < 4) mets = 3.5;       // walking pace
  else if(speed < 5.5) mets = 6;  // jogging pace
  else if(speed < 7) mets = 9;    // running pace
  else mets = 11;                 // fast running
  mets += (incline/2)*0.5;        // rough incline bump
  return mets;
}
async function cardioBreakdownFor(dateStr){
  try{
    const doc = await db.collection('users').doc(currentUser.uid).collection('profiles').doc(activeProfile.toLowerCase()).collection('cardioLogs').doc(dateStr).get();
    if(!doc.exists || !doc.data().duration) return null;
    const cardio = doc.data();
    const weight = latestGymWeight != null ? latestGymWeight : weightGoal.startWeight;
    const mets = metsForCardio(cardio);
    const hours = cardio.duration/60;
    const rawKcal = mets * (weight||70) * hours;
    return { machine:cardio.machine||'Cardio', duration:cardio.duration, mets:Math.round(mets*10)/10, kcal: rawKcal };
  }catch(e){ return null; }
}
async function workoutBreakdownFor(dateStr){
  const workouts = [];
  try{
    const col = db.collection('users').doc(currentUser.uid).collection('profiles').doc(activeProfile.toLowerCase()).collection('workoutLogs');
    const snap = await col.get();
    snap.forEach(function(doc){
      const id = doc.id; // "YYYY-MM-DD:mode:day"
      if(id.indexOf(dateStr+':')!==0) return;
      const data = doc.data();
      const exercises = (data.exercises||[]).map(function(ex){
        const rate = kcalPerSetFor(ex.name);
        const kcal = (ex.sets||[]).length * rate;
        return { name:ex.name, setCount:(ex.sets||[]).length, kcalPerSet:rate, kcal:kcal };
      });
      const workoutTotal = exercises.reduce(function(s,e){ return s+e.kcal; }, 0);
      workouts.push({ key:id, day:data.day||'', exercises:exercises, totalKcal:workoutTotal, isCardio:false });
    });
  }catch(e){}
  const cardio = await cardioBreakdownFor(dateStr);
  if(cardio){
    workouts.push({
      key:dateStr+':cardio', day:cardio.machine, isCardio:true,
      exercises:[{ name:cardio.machine+' — '+cardio.duration+' min (≈'+cardio.mets+' METs)', setCount:null, kcalPerSet:null, kcal:cardio.kcal }],
      totalKcal:cardio.kcal
    });
  }
  return workouts;
}
async function stepsCaloriesFor(dateStr){
  try{
    const doc = await gymDailyLogsCol().doc(dateStr).get();
    const steps = doc.exists ? doc.data().steps : null;
    if(!steps) return { steps:0, kcal:0 };
    const weight = latestGymWeight != null ? latestGymWeight : weightGoal.startWeight;
    // Roughly-standard walking-economy approximation: ~0.0005 kcal per step
    // per kg of body weight — lines up with commonly-cited "~400-500 kcal
    // per 10,000 steps" figures for an average adult.
    const rawKcal = steps * (weight||70) * 0.0005;
    return { steps:steps, kcal:rawKcal*ESTIMATE_MARGIN };
  }catch(e){ return { steps:0, kcal:0 }; }
}
async function workoutCaloriesFor(dateStr){
  const workouts = await workoutBreakdownFor(dateStr);
  const rawTotal = workouts.reduce(function(s,w){ return s+w.totalKcal; }, 0);
  return rawTotal * ESTIMATE_MARGIN;
}
async function energyBalanceFor(dateStr){
  const bmr = calculateBMR();
  if(!bmr) return null;
  const baselineActivity = 1.375; // light daily activity, exercise added separately below
  const workoutCal = await workoutCaloriesFor(dateStr);
  const stepsInfo = await stepsCaloriesFor(dateStr);
  const tdee = bmr*baselineActivity + workoutCal + stepsInfo.kcal;
  return { bmr:Math.round(bmr), tdee:Math.round(tdee), workoutCal:Math.round(workoutCal), stepsKcal:Math.round(stepsInfo.kcal), steps:stepsInfo.steps };
}
// Looks at the last 7 days of actual logged intake vs. that day's TDEE to
// get a real average daily deficit, projects it across a week, converts
// to kg via the standard ~7700 kcal/kg rule, then applies the same
// conservative 5% shave before showing it — exactly your 0.85→0.80 example.
async function projectedWeeklyChange(){
  const bmr = calculateBMR();
  if(!bmr) return null;
  const baselineActivity = 1.375;
  let totalDeficit = 0, daysCounted = 0;
  for(let i=0;i<7;i++){
    const d = addDays(todayStr(), -i);
    const dayLogs = logs[d] || (await loadLogForDate(d));
    if(!dayLogs || !dayLogs.length) continue;
    const eaten = totalsFor(dayLogs).cal;
    const workoutCal = await workoutCaloriesFor(d);
    const stepsInfo = await stepsCaloriesFor(d);
    const tdee = bmr*baselineActivity + workoutCal + stepsInfo.kcal;
    totalDeficit += (tdee - eaten);
    daysCounted++;
  }
  if(!daysCounted) return null;
  const avgDailyDeficit = totalDeficit/daysCounted;
  const rawWeeklyKg = (avgDailyDeficit*7)/7700;
  return { kg: rawWeeklyKg*ESTIMATE_MARGIN, daysCounted: daysCounted, losing: rawWeeklyKg>0 };
}

function pad2(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

function foodById(id){ return foods.find(function(f){ return f.id===id; }); }
// Display label for a food's typical/default amount — "each"-unit foods
// (eggs, whey scoops, whole fruit) get their own descriptive label since
// "1 each" reads oddly; ml/g foods just show the amount and unit.
function foodServingLabel(f){
  if(!f) return '';
  if(f.unit==='each') return f.label || (f.defaultQty+' each');
  return (f.defaultQty!=null?f.defaultQty:f.perAmount)+' '+f.unit;
}
// Label for a specific logged/ingredient quantity of a food, e.g. "150 ml".
function quantityLabel(f, qty){
  if(!f) return '';
  if(f.unit==='each') return qty+'×'+(f.label?' '+f.label.replace(/^1 /,''):'');
  return n2(qty)+' '+f.unit;
}
function recipeById(id){ return recipes.find(function(r){ return r.id===id; }); }
function mealById(id){ return meals.find(function(m){ return m.id===id; }); }
function n2(v){ return v==null ? null : Math.round(v*10)/10; }

// A recipe's macros are always derived live from its ingredients ÷
// servings, never stored — so editing an ingredient food automatically
// updates every recipe (and every meal) that uses it.
function recipeMacros(r){
  const t = totalsFor(r.ingredients.map(function(ing){ return {sourceType:'food', sourceId:ing.foodId, quantity:ing.quantity, servings:ing.servings}; }));
  const s = r.recipeServings || 1;
  return { cal:Math.round(t.cal/s), protein:n2(t.protein/s), carbs:t.carbs!=null?n2(t.carbs/s):null, fat:t.fat!=null?n2(t.fat/s):null, fiber:t.fiber!=null?n2(t.fiber/s):null, sodium:t.sodium!=null?Math.round(t.sodium/s):null, sugar:t.sugar!=null?n2(t.sugar/s):null, satFat:t.satFat!=null?n2(t.satFat/s):null };
}
function macrosForComponent(c){
  if(c.type==='recipe'){ const r = recipeById(c.id); if(!r) return {cal:0,protein:0,carbs:0,fat:0,fiber:0,sodium:0,sugar:0,satFat:0}; const m = recipeMacros(r); const mult = c.servings||1; return {cal:m.cal*mult, protein:(m.protein||0)*mult, carbs:m.carbs!=null?m.carbs*mult:0, fat:m.fat!=null?m.fat*mult:0, fiber:m.fiber!=null?m.fiber*mult:0, sodium:m.sodium!=null?m.sodium*mult:0, sugar:m.sugar!=null?m.sugar*mult:0, satFat:m.satFat!=null?m.satFat*mult:0}; }
  const f = foodById(c.id); if(!f) return {cal:0,protein:0,carbs:0,fat:0,fiber:0,sodium:0,sugar:0,satFat:0};
  const perAmount = f.perAmount || 1;
  const defaultQty = f.defaultQty!=null ? f.defaultQty : perAmount;
  const qty = c.quantity!=null ? c.quantity : (c.servings!=null ? c.servings*defaultQty : defaultQty);
  const factor = qty / perAmount;
  return {cal:(f.cal||0)*factor, protein:(f.protein||0)*factor, carbs:f.carbs!=null?f.carbs*factor:0, fat:f.fat!=null?f.fat*factor:0, fiber:f.fiber!=null?f.fiber*factor:0, sodium:f.sodium!=null?f.sodium*factor:0, sugar:f.sugar!=null?f.sugar*factor:0, satFat:f.satFat!=null?f.satFat*factor:0};
}
function mealMacros(m){
  const t = {cal:0,protein:0,carbs:0,fat:0,fiber:0,sodium:0,sugar:0,satFat:0};
  m.components.forEach(function(c){
    const cm = macrosForComponent(c);
    t.cal+=cm.cal; t.protein+=cm.protein; t.carbs+=cm.carbs; t.fat+=cm.fat; t.fiber+=cm.fiber; t.sodium+=cm.sodium; t.sugar+=cm.sugar||0; t.satFat+=cm.satFat||0;
  });
  return t;
}

// Recipes are logged as whole-recipe "servings" (2 recipes worth, half a
// recipe, etc.) — that stays a simple multiplier. Standalone foods (used
// directly as an ingredient or logged on their own) are now quantity-based
// in the food's own unit (ml/g/each), since food macros are stored per
// perAmount units rather than per one fixed serving. e.quantity is
// preferred; e.servings is still read as a fallback (old data, or a food
// multiplier of its defaultQty) so nothing already saved breaks.
function totalsFor(entries){
  const t = {cal:0, protein:0, carbs:0, fat:0, fiber:0, sodium:0, sugar:0, satFat:0};
  entries.forEach(function(e){
    if(e.sourceType==='recipe'){
      const r = recipeById(e.sourceId);
      if(!r) return;
      const mult = e.servings!=null ? e.servings : 1;
      // adjustments let a single logged instance skip an ingredient (e.g.
      // "no salad today") or use a different quantity, without touching
      // the master recipe — every other log of this recipe stays as-is.
      const m = (e.excluded && e.excluded.length) || (e.overrides && Object.keys(e.overrides).length)
        ? recipeMacrosAdjusted(r, e.excluded||[], e.overrides||{})
        : recipeMacros(r);
      t.cal += (m.cal||0)*mult; t.protein += (m.protein||0)*mult; t.carbs += (m.carbs||0)*mult;
      t.fat += (m.fat||0)*mult; t.fiber += (m.fiber||0)*mult; t.sodium += (m.sodium||0)*mult;
      t.sugar += (m.sugar||0)*mult; t.satFat += (m.satFat||0)*mult;
    } else {
      const f = foodById(e.sourceId);
      if(!f) return;
      const perAmount = f.perAmount || 1;
      const defaultQty = f.defaultQty!=null ? f.defaultQty : perAmount;
      const qty = e.quantity!=null ? e.quantity : (e.servings!=null ? e.servings*defaultQty : defaultQty);
      const factor = qty / perAmount;
      t.cal += (f.cal||0)*factor; t.protein += (f.protein||0)*factor; t.carbs += (f.carbs||0)*factor;
      t.fat += (f.fat||0)*factor; t.fiber += (f.fiber||0)*factor; t.sodium += (f.sodium||0)*factor;
      t.sugar += (f.sugar||0)*factor; t.satFat += (f.satFat||0)*factor;
    }
  });
  return t;
}
// Same math as recipeMacros, but skips excluded ingredients and applies
// per-log quantity overrides before dividing by servings — a one-off
// customization for a single logged entry, never written back to the
// recipe itself.
function recipeMacrosAdjusted(r, excluded, overrides){
  const keptIngredients = r.ingredients.filter(function(ing){ return excluded.indexOf(ing.foodId)===-1; });
  const t = totalsFor(keptIngredients.map(function(ing){
    const hasOverride = Object.prototype.hasOwnProperty.call(overrides, ing.foodId);
    return { sourceType:'food', sourceId:ing.foodId, quantity: hasOverride ? overrides[ing.foodId] : ing.quantity, servings: hasOverride ? null : ing.servings };
  }));
  const s = r.recipeServings || 1;
  return { cal:Math.round(t.cal/s), protein:n2(t.protein/s), carbs:t.carbs!=null?n2(t.carbs/s):null, fat:t.fat!=null?n2(t.fat/s):null, fiber:t.fiber!=null?n2(t.fiber/s):null, sodium:t.sodium!=null?Math.round(t.sodium/s):null, sugar:t.sugar!=null?n2(t.sugar/s):null, satFat:t.satFat!=null?n2(t.satFat/s):null };
}

function showTab(name){
  activeTab = name;
  const titles = {today:'Today', foods:'Ingredients', recipes:'Recipes', meals:'Meal plan', week:'Weekly calendar', prep:'Meal preparation', pantry:'Pantry', progress:'Progress', nutrition:'Expanded nutrition', adherence:'Adherence', targets:'Targets', history:'History'};
  document.getElementById('page-title').textContent = titles[name] || name;
  ['today','foods','recipes','meals','week','prep','pantry','progress','nutrition','adherence','targets','history'].forEach(function(t){
    document.getElementById('tab-'+t+'-btn').classList.toggle('active', t===name);
    document.getElementById(t+'-view').style.display = t===name ? 'block':'none';
  });
  if(name==='today') renderToday();
  if(name==='foods') renderFoods();
  if(name==='recipes') renderRecipes();
  if(name==='meals') renderMeals();
  if(name==='week') renderWeek();
  if(name==='prep') renderPrepPlanner();
  if(name==='pantry') renderPantry();
  if(name==='progress') renderProgress();
  if(name==='nutrition') renderExpandedNutrition();
  if(name==='adherence') renderAdherence();
  if(name==='targets') renderTargets();
  if(name==='history') renderHistoryTab();
}

const MEAL_SLOTS = [
  {key:'breakfast', label:'Breakfast'},
  {key:'lunch', label:'Lunch'},
  {key:'dinner', label:'Dinner'},
  {key:'snacks', label:'Snacks'}
];
async function renderToday(){
  const el = document.getElementById('today-view');
  const entries = await loadLogForDate(activeDate);
  const t = totalsFor(entries);
  const energyBalance = await energyBalanceFor(activeDate);
  const workoutBreakdown = energyBalance ? await workoutBreakdownFor(activeDate) : [];
  const weeklyProjection = energyBalance ? await projectedWeeklyChange() : null;
  const effectiveTarget = energyBalance ? energyBalance.tdee : targets.cal;
  const remaining = Math.round((effectiveTarget||0) - t.cal);
  const pct = effectiveTarget ? Math.min(100, Math.round(100*t.cal/effectiveTarget)) : 0;
  const r = 46, circumference = Math.round(2*Math.PI*r*100)/100;
  const offset = Math.round((circumference*(1-pct/100))*100)/100;

  el.innerHTML =
    dateNavHtml() +
    weightProgressCardHtml() +
    energyBalanceCardHtml(energyBalance, t.cal, weeklyProjection, workoutBreakdown) +
    '<div class="summary-card">'+
      '<div class="cal-ring-row">'+
        '<div class="cal-ring-wrap"><svg class="cal-ring-svg" viewBox="0 0 100 100">'+
          '<defs><linearGradient id="calGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#236b4c"/><stop offset="100%" stop-color="#236b4c"/></linearGradient></defs>'+
          '<circle class="cal-ring-track" cx="50" cy="50" r="'+r+'"></circle>'+
          '<circle class="cal-ring-fill" cx="50" cy="50" r="'+r+'" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'"></circle>'+
        '</svg><div class="cal-ring-center"><div class="cal-ring-num">'+Math.round(t.cal)+'</div><div class="cal-ring-label">kcal</div></div></div>'+
        '<div class="cal-side">'+
          '<div class="cal-side-row"><span>Maintenance'+(energyBalance?' (TDEE)':' target')+'</span><b>'+(effectiveTarget||'—')+' kcal</b></div>'+
          '<div class="cal-side-row"><span>Remaining</span><b>'+(effectiveTarget ? remaining+' kcal' : '—')+'</b></div>'+
          '<div class="cal-side-row"><span>Fiber / Sodium</span><b>'+Math.round(t.fiber)+'g / '+Math.round(t.sodium)+'mg</b></div>'+
          '<div class="cal-side-row"><span>Sugar / Sat. fat</span><b>'+Math.round(t.sugar)+'g / '+Math.round(t.satFat)+'g</b></div>'+
        '</div>'+
      '</div>'+
      macroBarsHtml(t)+
    '</div>'+
    MEAL_SLOTS.map(function(slot){ return mealBlockHtml(slot, entries); }).join('');

  el.querySelectorAll('[data-addfood]').forEach(function(btn){
    btn.addEventListener('click', function(){ openFoodSearch(btn.dataset.addfood); });
  });
  el.querySelectorAll('[data-addmeal]').forEach(function(btn){
    btn.addEventListener('click', function(){ openMealPicker(btn.dataset.addmeal); });
  });
  el.querySelectorAll('[data-viewrecipe]').forEach(function(btn){
    btn.addEventListener('click', function(){ showInstructionsPopup([btn.dataset.viewrecipe], null); });
  });
  el.querySelectorAll('[data-clearsection]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      const slotKey = btn.dataset.clearsection;
      const slotLabel = MEAL_SLOTS.find(function(s){ return s.key===slotKey; }).label;
      if(!confirm('Remove everything logged for '+slotLabel+' today?')) return;
      logs[activeDate] = (logs[activeDate]||[]).filter(function(e){ return e.mealSlot!==slotKey; });
      await saveLogForDate(activeDate);
      renderToday();
    });
  });
  el.querySelectorAll('[data-removeentry]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      logs[activeDate] = logs[activeDate].filter(function(e){ return e.id!==btn.dataset.removeentry; });
      await saveLogForDate(activeDate);
      renderToday();
    });
  });
  el.querySelectorAll('[data-adjustentry]').forEach(function(btn){
    btn.addEventListener('click', function(){ openAdjustEntrySheet(btn.dataset.adjustentry); });
  });
  const prevBtn = document.getElementById('date-prev-btn');
  const nextBtn = document.getElementById('date-next-btn');
  if(prevBtn) prevBtn.addEventListener('click', async function(){ activeDate = addDays(activeDate,-1); await loadLogForDate(activeDate); renderToday(); });
  if(nextBtn) nextBtn.addEventListener('click', async function(){ activeDate = addDays(activeDate,1); await loadLogForDate(activeDate); renderToday(); });
}
function dateNavHtml(){
  const isToday = activeDate===todayStr();
  return '<div class="date-nav"><button id="date-prev-btn">‹</button>'+
    '<div class="date-label">'+(isToday?'Today':fmtHuman(activeDate))+(isToday?'<small>'+fmtHuman(activeDate)+'</small>':'')+'</div>'+
    '<button id="date-next-btn" '+(isToday?'disabled style="opacity:0.3;"':'')+'>›</button></div>';
}
function macroBarsHtml(t){
  function bar(label, val, target, color){
    const pct = target ? Math.min(100, Math.round(100*val/target)) : 0;
    return '<div class="macro-bar-item"><div class="macro-bar-label"><span>'+label+'</span><span>'+Math.round(val)+(target?'/'+target:'')+'g</span></div>'+
      '<div class="macro-bar-track"><div class="macro-bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div></div>';
  }
  return '<div class="macro-bars">'+
    bar('Protein', t.protein, targets.protein, '#618ca8')+
    bar('Carbs', t.carbs, targets.carbs, '#e59b53')+
    bar('Fat', t.fat, targets.fat, '#b9d763')+
  '</div>';
}
function energyBalanceCardHtml(eb, eatenCal, weeklyProjection, workoutBreakdown){
  if(!eb){
    return '<div class="targets-card" style="margin-bottom:14px;"><h3 style="margin:0 0 4px;font-size:14px;">Energy balance</h3>'+
      '<p style="margin:0;font-size:12.5px;color:var(--text-faint);">Add your height and age in Targets to see your real BMR, TDEE, and a weekly projection based on them.</p></div>';
  }
  const deficitToday = Math.round(eb.tdee - eatenCal);
  const inDeficit = deficitToday >= 0;
  let projectionHtml = '';
  if(weeklyProjection){
    const kg = Math.abs(weeklyProjection.kg).toFixed(2);
    const verb = weeklyProjection.losing ? 'Projected loss this week' : 'Projected gain this week';
    projectionHtml = '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:6px 0;border-top:1px solid rgba(0,0,0,0.06);"><span>'+verb+' (conservative)</span><span>~'+kg+' kg</span></div>'+
      '<p style="margin:2px 0 0;font-size:10.5px;color:var(--text-faint);">Based on your last '+weeklyProjection.daysCounted+' logged day'+(weeklyProjection.daysCounted===1?'':'s')+', shaved 5% down from the raw estimate — a deliberately conservative number, not a promise.</p>';
  }

  // Detailed workout breakdown — every workout logged today, every
  // exercise inside it, its own calorie-per-set rule and total. Reads
  // straight from Gym's live data, so editing a workout there and coming
  // back here shows the updated numbers immediately, not a cached figure.
  let workoutDetailHtml = '';
  if(workoutBreakdown && workoutBreakdown.length){
    workoutDetailHtml = '<details class="recipe-detail" style="margin-top:8px;border-top:1px solid rgba(0,0,0,0.06);padding-top:4px;">'+
      '<summary style="cursor:pointer;font-size:12.5px;font-weight:700;color:var(--text-soft);padding:4px 0;">🏋 '+workoutBreakdown.length+' workout'+(workoutBreakdown.length===1?'':'s')+' logged today (incl. cardio) — '+Math.round(workoutBreakdown.reduce(function(s,w){return s+w.totalKcal;},0))+' kcal raw (tap for detail)</summary>'+
      workoutBreakdown.map(function(w){
        return '<div style="margin:8px 0;padding:8px 10px;background:rgba(0,0,0,0.03);border-radius:10px;">'+
          '<div style="font-size:12px;font-weight:700;margin-bottom:4px;">'+(w.isCardio?'🏃 ':'')+escapeHtml(w.day||'Workout')+' — '+Math.round(w.totalKcal)+' kcal</div>'+
          w.exercises.map(function(e){
            const detail = e.setCount!=null ? (e.setCount+' set'+(e.setCount===1?'':'s')+' × '+e.kcalPerSet+' kcal') : '';
            return '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-soft);padding:2px 0;">'+
              '<span>'+escapeHtml(e.name)+(detail?' — '+detail:'')+'</span><span>'+Math.round(e.kcal)+' kcal</span></div>';
          }).join('')+
        '</div>';
      }).join('')+
      '<p style="margin:4px 0 0;font-size:10.5px;color:var(--text-faint);">Lift rates: large compound ~9–12 kcal/set, isolation/core ~4, everything else ~7. Cardio: standard METs × weight × time. Both shaved 5% conservative before counting toward TDEE.</p>'+
    '</details>';
  }

  return '<div class="targets-card" style="margin-bottom:14px;background:linear-gradient(135deg,#FFF7ED,#FFF1DC);">'+
    '<h3 style="margin:0 0 4px;font-size:14px;">Energy balance — today</h3>'+
    '<p style="margin:0 0 10px;font-size:12px;color:var(--text-soft);">BMR '+eb.bmr+' kcal'+(eb.workoutCal>0?' · +'+eb.workoutCal+' kcal from workout':' · no workout logged yet today')+(eb.stepsKcal>0?' · +'+eb.stepsKcal+' kcal from '+eb.steps+' steps':'')+' → TDEE ~'+eb.tdee+' kcal</p>'+
    '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:6px 0;border-top:1px solid rgba(0,0,0,0.06);color:'+(inDeficit?'#178152':'#C1522E')+';"><span>'+(inDeficit?'Deficit today':'Surplus today')+'</span><span>'+Math.abs(deficitToday)+' kcal</span></div>'+
    projectionHtml+
    workoutDetailHtml+
    '</div>';
}
function weightProgressCardHtml(){
  const wg = weightGoal;
  const current = latestGymWeight != null ? latestGymWeight : wg.startWeight;
  const totalToLose = wg.startWeight - wg.targetWeight;
  const lostSoFar = wg.startWeight - current;
  const pct = totalToLose ? Math.max(0, Math.min(100, Math.round(100*lostSoFar/totalToLose))) : 0;
  const remaining = Math.max(0, (current - wg.targetWeight));
  const bmi = wg.height ? (current / ((wg.height/100)*(wg.height/100))) : null;
  const bmiCat = bmi==null ? '' : bmi<18.5?'Underweight':bmi<25?'Healthy range':bmi<30?'Overweight':'Higher range';
  return '<div class="targets-card" style="margin-bottom:16px;">'+
    '<h3>⚖️ Weight goal</h3>'+
    '<p>'+wg.startWeight+' kg → '+wg.targetWeight+' kg'+(latestGymWeight!=null?' · currently '+current+' kg (from Gym)':' · no weigh-in logged in Gym yet')+'</p>'+
    '<div class="macro-bar-track" style="height:10px;margin-bottom:6px;"><div class="macro-bar-fill" style="width:'+pct+'%;background:linear-gradient(90deg,#22C55E,#16A34A);"></div></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-soft);">'+
      '<span>'+n2(lostSoFar)+' kg lost so far</span><span>'+n2(remaining)+' kg to go</span><span>'+pct+'%</span>'+
    '</div>'+
    (bmi ? '<div style="margin-top:10px;font-size:12.5px;color:var(--text-soft);">BMI: <b style="color:var(--text);">'+n2(bmi)+'</b> — '+bmiCat+'</div>' :
      '<div style="margin-top:10px;font-size:12px;color:var(--text-faint);">Add your height in Targets to see BMI.</div>')+
  '</div>';
}
function mealBlockHtml(slot, entries){
  const slotEntries = entries.filter(function(e){ return e.mealSlot===slot.key; });
  const slotTotals = totalsFor(slotEntries);
  return '<div class="meal-block">'+
    '<div class="meal-head"><h3>'+slot.label+'</h3><div style="display:flex;align-items:center;gap:8px;"><div class="meal-cal">'+Math.round(slotTotals.cal)+' kcal</div>'+
      (slotEntries.length ? '<button type="button" class="sri-peek" data-clearsection="'+slot.key+'" title="Remove everything logged for '+slot.label+'">🗑</button>' : '')+
    '</div></div>'+
    (slotEntries.length ? slotEntries.map(function(e){
      let name, servingText, excludedNote = '';
      if(e.sourceType==='recipe'){
        const r = recipeById(e.sourceId); if(!r) return '';
        name = '🍳 '+r.name;
        const mult = e.servings!=null?e.servings:1;
        servingText = (mult===1?'1×':n2(mult)+'×')+' recipe serving';
        if(e.excluded && e.excluded.length){
          const skippedNames = e.excluded.map(function(fid){ const f=foodById(fid); return f?f.name:null; }).filter(Boolean);
          if(skippedNames.length) excludedNote = 'No '+skippedNames.join(', ').toLowerCase()+' today';
        }
      } else {
        const f = foodById(e.sourceId); if(!f) return '';
        name = f.name;
        const qty = e.quantity!=null ? e.quantity : (e.servings!=null ? e.servings*(f.defaultQty!=null?f.defaultQty:f.perAmount) : f.defaultQty);
        servingText = quantityLabel(f, qty);
      }
      // Use the same adjusted calculation as the day total so this row's
      // displayed macros always match what's actually being counted.
      const m = (e.sourceType==='recipe' && e.excluded && e.excluded.length)
        ? (function(){ const r=recipeById(e.sourceId); const mm=recipeMacrosAdjusted(r, e.excluded, e.overrides||{}); const mult=e.servings!=null?e.servings:1; return {cal:mm.cal*mult, protein:(mm.protein||0)*mult}; })()
        : macrosForComponent({type:e.sourceType, id:e.sourceId, servings:e.servings, quantity:e.quantity});
      return '<div class="food-entry-row"><div><div class="fe-name">'+escapeHtml(name)+'</div><div class="fe-serving">'+escapeHtml(servingText)+(excludedNote?' · <span class="fe-excluded-note">'+escapeHtml(excludedNote)+'</span>':'')+'</div></div>'+
        '<div style="display:flex;align-items:center;gap:8px;"><div class="fe-macros">'+Math.round(m.cal)+' kcal<br>'+n2(m.protein)+'g protein</div>'+
        (e.sourceType==='recipe' ? '<button class="sri-peek" data-adjustentry="'+e.id+'" title="Adjust ingredients for this log">✎</button><button class="sri-peek" data-viewrecipe="'+e.sourceId+'" title="See how to make this">👁</button>' : '')+
        '<button class="fe-remove" data-removeentry="'+e.id+'">✕</button></div></div>';
    }).join('') : '<div class="empty-meal">Nothing logged yet.</div>')+
    '<div style="display:flex;gap:8px;margin-top:10px;">'+
      '<button class="add-food-btn" data-addfood="'+slot.key+'">+ Add food or recipe</button>'+
      '<button class="add-food-btn" data-addmeal="'+slot.key+'" style="background:var(--surface-alt);color:var(--text-soft);">🍽 Log a whole meal</button>'+
    '</div>'+
  '</div>';
}

/* =====================================================================
   ADD-FOOD FLOW — search foods AND recipes together, or create a new
   one, then set servings and log it to the selected meal.
===================================================================== */
function closeModal(){ document.getElementById('modal-mount').innerHTML = ''; }
function openFoodSearch(mealSlot){
  const mount = document.getElementById('modal-mount');
  mount.innerHTML = '<div class="search-overlay" id="search-overlay"><div class="search-sheet">'+
    '<h3>Add to '+MEAL_SLOTS.find(function(s){return s.key===mealSlot;}).label+'</h3>'+
    '<input type="text" id="food-search-input" placeholder="Search foods, recipes, or whole meals…" autofocus>'+
    '<div id="food-search-results"></div>'+
    '<button class="create-food-btn" id="create-food-btn">+ Create a new raw ingredient</button>'+
    '<button class="create-food-btn" id="build-recipe-btn" style="margin-top:8px;">🍳 Build a recipe from ingredients</button>'+
  '</div></div>';
  function renderResults(q){
    const query = (q||'').toLowerCase().trim();
    const foodMatches = foods.filter(function(f){ return !query || f.name.toLowerCase().indexOf(query)!==-1; }).map(function(f){ return {type:'food', id:f.id, name:f.name, serving:foodServingLabel(f), cal:f.cal}; });
    const recipeMatches = recipes.filter(function(r){ return !query || r.name.toLowerCase().indexOf(query)!==-1; }).map(function(r){ const m = recipeMacros(r); return {type:'recipe', id:r.id, name:'🍳 '+r.name, serving:'1 serving', cal:m.cal}; });
    const mealMatches = meals.filter(function(m){ return !query || m.name.toLowerCase().indexOf(query)!==-1; }).map(function(m){ const mm = mealMacros(m); return {type:'meal', id:m.id, name:'🍽 '+m.name+' (whole meal)', serving:m.components.length+' item'+(m.components.length===1?'':'s'), cal:Math.round(mm.cal)}; });
    const matches = mealMatches.concat(recipeMatches).concat(foodMatches);
    const resEl = document.getElementById('food-search-results');
    resEl.innerHTML = matches.length ? matches.map(function(m){
      const canPeek = m.type==='recipe' || m.type==='meal';
      return '<div class="search-result-item"><div class="sri-click" data-picktype="'+m.type+'" data-pickid="'+m.id+'" style="flex:1;display:flex;justify-content:space-between;align-items:center;cursor:pointer;">'+
        '<div><div class="sri-name">'+escapeHtml(m.name)+'</div><div class="sri-meta">'+escapeHtml(m.serving)+'</div></div><div class="sri-cal">'+m.cal+' kcal</div></div>'+
        (canPeek ? '<button class="sri-peek" data-peektype="'+m.type+'" data-peekid="'+m.id+'" title="See recipe / instructions">👁</button>' : '')+
      '</div>';
    }).join('') : '<div class="empty-note">No matches — create one below.</div>';
    resEl.querySelectorAll('[data-pickid]').forEach(function(row){
      row.addEventListener('click', function(){
        if(row.dataset.picktype==='meal') logMealComponents(row.dataset.pickid, mealSlot);
        else openQuantitySheet(row.dataset.picktype, row.dataset.pickid, mealSlot);
      });
    });
    resEl.querySelectorAll('[data-peekid]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        const recipeIds = btn.dataset.peektype==='meal' ? mealById(btn.dataset.peekid).components.filter(function(c){return c.type==='recipe';}).map(function(c){return c.id;}) : [btn.dataset.peekid];
        showInstructionsPopup(recipeIds, {reopenSearch:true, mealSlot:mealSlot, query:document.getElementById('food-search-input').value});
      });
    });
  }
  renderResults('');
  document.getElementById('food-search-input').addEventListener('input', function(e){ renderResults(e.target.value); });
  document.getElementById('search-overlay').addEventListener('click', function(e){ if(e.target.id==='search-overlay') closeModal(); });
  document.getElementById('create-food-btn').addEventListener('click', function(){ openCreateFoodSheet(mealSlot); });
  document.getElementById('build-recipe-btn').addEventListener('click', function(){ openRecipeBuilder(mealSlot); });
}
async function logMealComponents(mealId, targetSlot){
  const m = mealById(mealId);
  if(!m) return;
  const hasAnyRecipe = m.components.some(function(c){ return c.type==='recipe'; });
  if(!hasAnyRecipe){
    // Nothing to adjust — log it straight through as before.
    if(!logs[activeDate]) logs[activeDate] = [];
    m.components.forEach(function(c){
      logs[activeDate].push({ id:'entry-'+Date.now()+'-'+Math.floor(Math.random()*10000), sourceType:c.type, sourceId:c.id, mealSlot:targetSlot, servings:c.servings||1 });
    });
    await saveLogForDate(activeDate);
    closeModal();
    renderToday();
    return;
  }
  openMealReviewSheet(m, targetSlot);
}
// Lets you uncheck an ingredient you skipped today (e.g. "no salad") right
// when logging a meal — the recipe itself is never touched, only this one
// logged instance. Every ingredient defaults to checked (log it exactly
// as written) so doing nothing behaves exactly like before.
function openMealReviewSheet(m, targetSlot){
  const mount = document.getElementById('modal-mount');
  let html = '<div class="search-overlay" id="mealreview-overlay"><div class="search-sheet qty-sheet">'+
    '<h3>Log '+escapeHtml(m.name)+'</h3>'+
    '<p style="font-size:12px;color:var(--text-faint);margin:0 0 12px;">Uncheck anything you skipped today — this only changes this log, never the recipe itself.</p>';
  m.components.forEach(function(c, ci){
    if(c.type==='recipe'){
      const r = recipeById(c.id);
      if(!r){ html += '<div class="mr-plain-row" style="color:var(--text-faint);font-style:italic;">Recipe not found</div>'; return; }
      html += '<div class="mr-recipe-block" data-mrcomp="'+ci+'"><div class="mr-recipe-name">'+escapeHtml(r.name)+'</div>';
      r.ingredients.forEach(function(ing){
        const f = foodById(ing.foodId);
        if(!f) return;
        const qty = ing.quantity!=null ? ing.quantity : (ing.servings!=null ? ing.servings*(f.defaultQty!=null?f.defaultQty:f.perAmount) : f.defaultQty);
        html += '<label class="mr-ing-row"><input type="checkbox" checked data-mring="'+ci+':'+ing.foodId+'"><span>'+escapeHtml(f.name)+' <span class="mr-ing-qty">('+escapeHtml(quantityLabel(f,qty))+')</span></span></label>';
      });
      html += '</div>';
    } else {
      const f = foodById(c.id);
      html += '<div class="mr-plain-row">'+(f?escapeHtml(f.name):'Item')+'</div>';
    }
  });
  html += '<div id="mealreview-totals" class="mr-totals"></div>'+
    '<div class="sheet-actions"><button class="btn-mini primary" id="mealreview-confirm">Log it</button><button class="btn-mini ghost" id="mealreview-cancel">Cancel</button></div>'+
  '</div></div>';
  mount.innerHTML = html;

  function currentExclusionsFor(ci){
    const excluded = [];
    mount.querySelectorAll('[data-mring^="'+ci+':"]').forEach(function(cb){
      if(!cb.checked) excluded.push(cb.dataset.mring.split(':')[1]);
    });
    return excluded;
  }
  function recompute(){
    const t = {cal:0,protein:0,carbs:0,fat:0};
    m.components.forEach(function(c, ci){
      if(c.type==='recipe'){
        const r = recipeById(c.id); if(!r) return;
        const excluded = currentExclusionsFor(ci);
        const mm = excluded.length ? recipeMacrosAdjusted(r, excluded, {}) : recipeMacros(r);
        const mult = c.servings||1;
        t.cal += (mm.cal||0)*mult; t.protein += (mm.protein||0)*mult; t.carbs += (mm.carbs||0)*mult; t.fat += (mm.fat||0)*mult;
      } else {
        const cm = macrosForComponent(c);
        t.cal += cm.cal; t.protein += cm.protein; t.carbs += cm.carbs; t.fat += cm.fat;
      }
    });
    document.getElementById('mealreview-totals').textContent = Math.round(t.cal)+' kcal · '+n2(t.protein)+'g protein · '+n2(t.carbs)+'g carbs · '+n2(t.fat)+'g fat';
  }
  recompute();
  mount.querySelectorAll('[data-mring]').forEach(function(cb){ cb.addEventListener('change', recompute); });
  document.getElementById('mealreview-cancel').addEventListener('click', closeModal);
  document.getElementById('mealreview-overlay').addEventListener('click', function(e){ if(e.target.id==='mealreview-overlay') closeModal(); });
  document.getElementById('mealreview-confirm').addEventListener('click', async function(){
    if(!logs[activeDate]) logs[activeDate] = [];
    m.components.forEach(function(c, ci){
      const entry = { id:'entry-'+Date.now()+'-'+Math.floor(Math.random()*10000), sourceType:c.type, sourceId:c.id, mealSlot:targetSlot, servings:c.servings||1 };
      if(c.type==='recipe'){
        const excluded = currentExclusionsFor(ci);
        if(excluded.length) entry.excluded = excluded;
      }
      logs[activeDate].push(entry);
    });
    await saveLogForDate(activeDate);
    closeModal();
    renderToday();
  });
}
// Same idea as the review-before-logging sheet, but for something already
// logged — lets you go back and say "actually I skipped the salad" after
// the fact, updating just that one entry.
function openAdjustEntrySheet(entryId){
  const entry = (logs[activeDate]||[]).find(function(e){ return e.id===entryId; });
  if(!entry || entry.sourceType!=='recipe') return;
  const r = recipeById(entry.sourceId);
  if(!r) return;
  const currentlyExcluded = entry.excluded || [];
  const mount = document.getElementById('modal-mount');
  let html = '<div class="search-overlay" id="adjustentry-overlay"><div class="search-sheet qty-sheet">'+
    '<h3>Adjust '+escapeHtml(r.name)+'</h3>'+
    '<p style="font-size:12px;color:var(--text-faint);margin:0 0 12px;">Uncheck anything you didn\'t actually have.</p>'+
    '<div class="mr-recipe-block">';
  r.ingredients.forEach(function(ing){
    const f = foodById(ing.foodId);
    if(!f) return;
    const qty = ing.quantity!=null ? ing.quantity : (ing.servings!=null ? ing.servings*(f.defaultQty!=null?f.defaultQty:f.perAmount) : f.defaultQty);
    const isChecked = currentlyExcluded.indexOf(ing.foodId)===-1;
    html += '<label class="mr-ing-row"><input type="checkbox" '+(isChecked?'checked':'')+' data-aeing="'+ing.foodId+'"><span>'+escapeHtml(f.name)+' <span class="mr-ing-qty">('+escapeHtml(quantityLabel(f,qty))+')</span></span></label>';
  });
  html += '</div><div id="adjustentry-totals" class="mr-totals"></div>'+
    '<div class="sheet-actions"><button class="btn-mini primary" id="adjustentry-save">Save</button><button class="btn-mini ghost" id="adjustentry-cancel">Cancel</button></div>'+
  '</div></div>';
  mount.innerHTML = html;

  function currentExclusions(){
    const excluded = [];
    mount.querySelectorAll('[data-aeing]').forEach(function(cb){ if(!cb.checked) excluded.push(cb.dataset.aeing); });
    return excluded;
  }
  function recompute(){
    const excluded = currentExclusions();
    const mm = excluded.length ? recipeMacrosAdjusted(r, excluded, entry.overrides||{}) : recipeMacros(r);
    const mult = entry.servings!=null ? entry.servings : 1;
    document.getElementById('adjustentry-totals').textContent = Math.round((mm.cal||0)*mult)+' kcal · '+n2((mm.protein||0)*mult)+'g protein';
  }
  recompute();
  mount.querySelectorAll('[data-aeing]').forEach(function(cb){ cb.addEventListener('change', recompute); });
  document.getElementById('adjustentry-cancel').addEventListener('click', closeModal);
  document.getElementById('adjustentry-overlay').addEventListener('click', function(e){ if(e.target.id==='adjustentry-overlay') closeModal(); });
  document.getElementById('adjustentry-save').addEventListener('click', async function(){
    const excluded = currentExclusions();
    if(excluded.length) entry.excluded = excluded; else delete entry.excluded;
    await saveLogForDate(activeDate);
    closeModal();
    renderToday();
  });
}
// Shows one or more recipes' full ingredient list + cooking instructions —
// used both to peek before adding something, and later to reference while

function openQuantitySheet(sourceType, sourceId, mealSlot){
  const isRecipe = sourceType==='recipe';
  const item = isRecipe ? recipeById(sourceId) : foodById(sourceId);
  const m = isRecipe ? recipeMacros(item) : item;
  const name = (isRecipe?'🍳 ':'')+item.name;
  const mount = document.getElementById('modal-mount');
  const perAmount = isRecipe ? 1 : (item.perAmount||1);
  const defaultQty = isRecipe ? 1 : (item.defaultQty!=null?item.defaultQty:perAmount);
  const unitLabel = isRecipe ? 'serving' : item.unit;
  mount.innerHTML = '<div class="search-overlay" id="qty-overlay"><div class="search-sheet qty-sheet">'+
    '<h3>'+escapeHtml(name)+'</h3>'+
    (isRecipe ? '<p style="font-size:12px;color:var(--text-soft);margin:0 0 8px;white-space:pre-wrap;">'+escapeHtml(item.instructions||'')+'</p>' : '')+
    '<p style="font-size:12px;color:var(--text-soft);margin:0;">'+(isRecipe?'1 serving':foodServingLabel(item))+' = '+m.cal+' kcal · '+m.protein+'g protein</p>'+
    '<div class="qf-grid"><div class="f"><label>'+(isRecipe?'Servings':'Amount ('+unitLabel+')')+'</label><input type="number" id="qty-amount" value="'+defaultQty+'" step="'+(isRecipe?'0.25':(item.unit==='each'?'1':'5'))+'" min="'+(isRecipe?'0.1':'0')+'"></div>'+
    '<div class="f"><label>Total calories</label><input type="text" id="qty-cal-preview" disabled value="'+m.cal+' kcal"></div></div>'+
    '<div class="sheet-actions"><button class="btn-mini primary" id="qty-confirm-btn">Add to diary</button><button class="btn-mini ghost" id="qty-cancel-btn">Cancel</button></div>'+
  '</div></div>';
  const amountInput = document.getElementById('qty-amount');
  amountInput.addEventListener('input', function(){
    const amt = parseFloat(amountInput.value)||0;
    const factor = isRecipe ? amt : (amt/perAmount);
    document.getElementById('qty-cal-preview').value = Math.round(m.cal*factor)+' kcal';
  });
  document.getElementById('qty-confirm-btn').addEventListener('click', async function(){
    const amt = parseFloat(amountInput.value)||defaultQty;
    if(!logs[activeDate]) logs[activeDate] = [];
    const entry = { id:'entry-'+Date.now()+'-'+Math.floor(Math.random()*1000), sourceType:sourceType, sourceId:sourceId, mealSlot:mealSlot };
    if(isRecipe) entry.servings = amt; else entry.quantity = amt;
    logs[activeDate].push(entry);
    await saveLogForDate(activeDate);
    closeModal();
    renderToday();
  });
  document.getElementById('qty-cancel-btn').addEventListener('click', closeModal);
  document.getElementById('qty-overlay').addEventListener('click', function(e){ if(e.target.id==='qty-overlay') closeModal(); });
}

function wireCreateFoodFormUnitToggle(scope){
  scope = scope || document;
  const unitSel = scope.querySelector('#cf-unit');

  unitSel.addEventListener('change', function(){
    const isEach = unitSel.value==='each';
    scope.querySelector('#cf-label-field').style.display = isEach ? 'block' : 'none';
    scope.querySelector('#cf-typical-field').style.display = isEach ? 'none' : 'block';
    scope.querySelector('#cf-basis-amount').textContent = isEach ? '1' : '100';
    scope.querySelector('#cf-basis-unit').textContent = isEach ? 'item' : unitSel.value;
  });
}
function readCreateFoodForm(){
  const num = function(id){ const v = document.getElementById(id).value; return v===''?null:parseFloat(v); };
  const unit = document.getElementById('cf-unit').value;
  const isEach = unit==='each';
  return {
    name: document.getElementById('cf-name').value.trim(),
    unit: unit,
    perAmount: isEach ? 1 : 100,
    defaultQty: isEach ? 1 : (num('cf-typical') || 100),
    label: isEach ? (document.getElementById('cf-label').value.trim() || '1 item') : null,
    groceryProductId: document.getElementById('cf-grocery-link').value || null,
    cal: num('cf-cal')||0, protein: num('cf-protein')||0,
    carbs: num('cf-carbs'), fat: num('cf-fat'), fiber: num('cf-fiber'), sodium: num('cf-sodium'),
    sugar: num('cf-sugar'), satFat: num('cf-satfat')
  };
}
function openCreateFoodSheet(mealSlot){

/* =====================================================================
   RECIPE BUILDER — combine raw ingredients (with quantities) plus real
   cooking instructions into a named dish, saved to the recipes list.
   Macros are computed live from ingredients, never stored, so editing
   an ingredient food keeps every recipe using it accurate automatically.
===================================================================== */
let recipeIngredients = [];
function openRecipeBuilder(mealSlot, existingRecipe){
  recipeIngredients = existingRecipe ? existingRecipe.ingredients.slice() : [];
  const mount = document.getElementById('modal-mount');
  mount.innerHTML = '<div class="search-overlay" id="recipe-overlay"><div class="search-sheet qty-sheet">'+
    '<h3>'+(existingRecipe?'Edit recipe':'Build a recipe')+'</h3>'+
    '<div class="qf-grid"><div class="f" style="grid-column:1/-1;"><label>Recipe name</label><input type="text" id="rc-name" value="'+(existingRecipe?escapeHtml(existingRecipe.name):'')+'" placeholder="e.g. Boiled Eggs, 2 whole + 4 whites"></div>'+
    '<div class="f"><label>Makes how many servings</label><input type="number" id="rc-servings" value="'+(existingRecipe?existingRecipe.recipeServings:1)+'" min="1" step="0.5"></div></div>'+
    '<div class="qf-grid"><div class="f" style="grid-column:1/-1;"><label>Instructions (what you\'ll read while cooking)</label><textarea id="rc-instructions" rows="3" placeholder="e.g. Boil 6 eggs. Eat 2 whole. Discard yolks from the other 4, eat only the whites.">'+(existingRecipe?escapeHtml(existingRecipe.instructions||''):'')+'</textarea></div></div>'+
    '<div class="rp-label" style="margin:10px 0 6px;font-size:11px;color:var(--text-faint);font-weight:700;text-transform:uppercase;">Ingredients</div>'+
    '<div id="recipe-ing-list" style="margin-bottom:8px;"></div>'+
    '<input type="text" id="recipe-ing-search" placeholder="Search raw ingredients to add…">'+
    '<div id="recipe-ing-results"></div>'+
    '<div id="recipe-totals" style="margin-top:10px;font-size:12.5px;color:var(--text-soft);"></div>'+
    '<div class="sheet-actions"><button class="btn-mini primary" id="rc-save-btn">Save recipe</button><button class="btn-mini ghost" id="rc-cancel-btn">Cancel</button></div>'+
  '</div></div>';

  function renderIngList(){
    const listEl = document.getElementById('recipe-ing-list');
    listEl.innerHTML = recipeIngredients.length ? recipeIngredients.map(function(ing, i){
      const f = foodById(ing.foodId);
      if(!f) return '';
      const qty = ing.quantity!=null ? ing.quantity : (ing.servings!=null ? ing.servings*(f.defaultQty!=null?f.defaultQty:f.perAmount) : f.defaultQty);
      const isEach = f.unit==='each';
      return '<div class="food-entry-row ing-edit-row"><div style="flex:1;min-width:0;"><div class="fe-name">'+escapeHtml(f.name)+'</div>'+
        (isEach ?
          '<div class="fe-serving">'+qty+'× '+escapeHtml(f.label||'item')+'</div>' :
          '<div class="ing-qty-row"><input type="number" class="ing-qty-input" data-ingqty="'+i+'" value="'+qty+'" min="0" step="5"><span class="ing-qty-unit">'+f.unit+'</span></div>'
        )+
        '</div><button class="fe-remove" data-rmving="'+i+'">✕</button></div>';
    }).join('') : '<div class="empty-meal">No ingredients yet — search below to add some.</div>';
    listEl.querySelectorAll('[data-rmving]').forEach(function(btn){
      btn.addEventListener('click', function(){ recipeIngredients.splice(Number(btn.dataset.rmving),1); renderIngList(); updateTotals(); });
    });
    // Editing the quantity right here recalculates macros live — this is
    // the actual fix for "only one option, 200ml" — any amount now works.
    listEl.querySelectorAll('[data-ingqty]').forEach(function(input){
      input.addEventListener('input', function(){
        const idx = Number(input.dataset.ingqty);
        recipeIngredients[idx].quantity = parseFloat(input.value)||0;
        delete recipeIngredients[idx].servings;
        updateTotals();
      });
    });
    updateTotals();
  }
  function updateTotals(){
    const t = totalsFor(recipeIngredients.map(function(ing){ return {sourceType:'food', sourceId:ing.foodId, quantity:ing.quantity, servings:ing.servings}; }));
    const servings = parseFloat(document.getElementById('rc-servings').value)||1;
    document.getElementById('recipe-totals').innerHTML =
      '<div class="rb-totals-box"><div class="rb-totals-eyebrow">Batch total</div><div class="rb-totals-cal">'+Math.round(t.cal)+' <small>kcal</small></div>'+
      '<div class="rb-totals-sub">'+n2(t.protein)+'g protein</div>'+
      '<div class="rb-totals-perserv">Per serving (÷'+servings+'): <b>'+Math.round(t.cal/servings)+' kcal</b>, '+n2(t.protein/servings)+'g protein</div></div>';
  }
  function renderIngResults(q){
    const query = (q||'').toLowerCase().trim();
    const matches = query ? foods.filter(function(f){ return f.name.toLowerCase().indexOf(query)!==-1; }) : [];
    document.getElementById('recipe-ing-results').innerHTML = matches.map(function(f){
      return '<div class="search-result-item" data-addving="'+f.id+'"><div><div class="sri-name">'+escapeHtml(f.name)+'</div><div class="sri-meta">'+escapeHtml(foodServingLabel(f))+'</div></div><div class="sri-cal">'+f.cal+' kcal</div></div>';
    }).join('');
    document.getElementById('recipe-ing-results').querySelectorAll('[data-addving]').forEach(function(row){
      row.addEventListener('click', function(){
        const f = foodById(row.dataset.addving);
        recipeIngredients.push({foodId: f.id, quantity: f.defaultQty!=null?f.defaultQty:f.perAmount});
        document.getElementById('recipe-ing-search').value = '';
        document.getElementById('recipe-ing-results').innerHTML = '';
        renderIngList();
      });
    });
  }
  document.getElementById('recipe-ing-search').addEventListener('input', function(e){ renderIngResults(e.target.value); });
  document.getElementById('rc-servings').addEventListener('input', updateTotals);
  renderIngList();

  document.getElementById('rc-save-btn').addEventListener('click', async function(){
    const name = document.getElementById('rc-name').value.trim();
    if(!name){ document.getElementById('rc-name').style.outline='2px solid var(--danger)'; return; }
    if(!recipeIngredients.length) return;
    const servings = parseFloat(document.getElementById('rc-servings').value)||1;
    const instructions = document.getElementById('rc-instructions').value.trim();
    let saved;
    if(existingRecipe){
      existingRecipe.name = name; existingRecipe.instructions = instructions;
      existingRecipe.ingredients = recipeIngredients.slice(); existingRecipe.recipeServings = servings;
      saved = existingRecipe;
    } else {
      saved = { id:'recipe-'+Date.now()+'-'+Math.floor(Math.random()*1000), name:name, instructions:instructions, ingredients:recipeIngredients.slice(), recipeServings:servings };
      recipes.push(saved);
    }
    await saveRecipes();
    if(mealSlot){ openQuantitySheet('recipe', saved.id, mealSlot); }
    else { closeModal(); renderRecipes(); }
  });
  document.getElementById('rc-cancel-btn').addEventListener('click', closeModal);
  document.getElementById('recipe-overlay').addEventListener('click', function(e){ if(e.target.id==='recipe-overlay') closeModal(); });
}

  });
  el.querySelectorAll('.food-edit').forEach(function(box){ wireCreateFoodFormUnitToggle(box); });
  el.querySelectorAll('[data-savefood]').forEach(function(btn){
    btn.addEventListener('click', async function(e){
      e.stopPropagation();
      const f = foodById(btn.dataset.savefood);
      const box = btn.closest('.food-edit');
      const num = function(sel){ const v = box.querySelector(sel).value; return v===''?null:parseFloat(v); };
      const unit = box.querySelector('#cf-unit').value;
      const isEach = unit==='each';
      f.name = box.querySelector('#cf-name').value.trim() || f.name;
      f.unit = unit;
      f.perAmount = isEach ? 1 : 100;
      f.defaultQty = isEach ? 1 : (num('#cf-typical') || 100);
      f.label = isEach ? (box.querySelector('#cf-label').value.trim() || f.label || '1 item') : null;
      f.cal = num('#cf-cal')||0; f.protein = num('#cf-protein')||0;
      f.carbs = num('#cf-carbs'); f.fat = num('#cf-fat'); f.fiber = num('#cf-fiber'); f.sodium = num('#cf-sodium');
      f.sugar = num('#cf-sugar'); f.satFat = num('#cf-satfat');
      f.groceryProductId = box.querySelector('#cf-grocery-link').value || null;
      await saveFoods();
      renderFoods();

  el.querySelectorAll('[data-delfood]').forEach(function(btn){
    btn.addEventListener('click', async function(e){
      e.stopPropagation();
      if(!confirm('Delete this food from your database?')) return;
      foods = foods.filter(function(f){ return f.id!==btn.dataset.delfood; });
      await saveFoods();
      renderFoods();
    });
  });
}
