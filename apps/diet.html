function openMealBuilder(existingMeal){
  mealComponents = existingMeal ? existingMeal.components.slice() : [];
  const mount = document.getElementById('modal-mount');
  mount.innerHTML = '<div class="search-overlay" id="meal-build-overlay"><div class="search-sheet qty-sheet">'+
    '<h3>'+(existingMeal?'Edit meal':'Build a meal')+'</h3>'+
    '<div class="qf-grid"><div class="f" style="grid-column:1/-1;"><label>Meal name</label><input type="text" id="mb-name" value="'+(existingMeal?escapeHtml(existingMeal.name):'')+'" placeholder="e.g. Breakfast"></div>'+
    '<div class="f" style="grid-column:1/-1;"><label>Which slot does this belong to?</label><select id="mb-slot">'+
      MEAL_SLOTS.map(function(s){ return '<option value="'+s.key+'" '+(existingMeal&&existingMeal.mealSlot===s.key?'selected':'')+'>'+s.label+'</option>'; }).join('')+
    '</select></div></div>'+
    '<div class="rp-label" style="margin:10px 0 6px;font-size:11px;color:var(--text-faint);font-weight:700;text-transform:uppercase;">Components</div>'+
    '<div id="meal-comp-list" style="margin-bottom:8px;"></div>'+
    '<input type="text" id="meal-comp-search" placeholder="Search recipes and raw foods to add…">'+
    '<div id="meal-comp-results"></div>'+
    '<div id="meal-totals" style="margin-top:10px;font-size:12.5px;color:var(--text-soft);"></div>'+
    '<div class="sheet-actions"><button class="btn-mini primary" id="mb-save-btn">Save meal</button><button class="btn-mini ghost" id="mb-cancel-btn">Cancel</button></div>'+
  '</div></div>';

  function renderCompList(){
    const listEl = document.getElementById('meal-comp-list');
    listEl.innerHTML = mealComponents.length ? mealComponents.map(function(c, i){
      const item = c.type==='recipe' ? recipeById(c.id) : foodById(c.id);
      if(!item) return '';
      return '<div class="food-entry-row"><div><div class="fe-name">'+(c.type==='recipe'?'🍳 ':'')+escapeHtml(item.name)+'</div><div class="fe-serving">'+(c.servings||1)+'×</div></div>'+
        '<button class="fe-remove" data-rmcomp="'+i+'">✕</button></div>';
    }).join('') : '<div class="empty-meal">No components yet — search below to add some.</div>';
    listEl.querySelectorAll('[data-rmcomp]').forEach(function(btn){
      btn.addEventListener('click', function(){ mealComponents.splice(Number(btn.dataset.rmcomp),1); renderCompList(); updateMealTotals(); });
    });
    updateMealTotals();
  }
  function updateMealTotals(){
    const t = totalsFor(mealComponents.map(function(c){ return {sourceType:c.type, sourceId:c.id, servings:c.servings||1}; }));
    document.getElementById('meal-totals').innerHTML = '<b>Whole meal total:</b> '+Math.round(t.cal)+' kcal, '+n2(t.protein)+'g protein';
  }
  function renderCompResults(q){
    const query = (q||'').toLowerCase().trim();
    if(!query){ document.getElementById('meal-comp-results').innerHTML = ''; return; }
    const recipeMatches = recipes.filter(function(r){ return r.name.toLowerCase().indexOf(query)!==-1; }).map(function(r){ return {type:'recipe', id:r.id, name:'🍳 '+r.name}; });
    const foodMatches = foods.filter(function(f){ return f.name.toLowerCase().indexOf(query)!==-1; }).map(function(f){ return {type:'food', id:f.id, name:f.name}; });
    const matches = recipeMatches.concat(foodMatches);
    document.getElementById('meal-comp-results').innerHTML = matches.map(function(m){
      return '<div class="search-result-item" data-addcomp-type="'+m.type+'" data-addcomp-id="'+m.id+'"><div class="sri-name">'+escapeHtml(m.name)+'</div></div>';
    }).join('');
    document.getElementById('meal-comp-results').querySelectorAll('[data-addcomp-id]').forEach(function(row){
      row.addEventListener('click', function(){
        mealComponents.push({type: row.dataset.addcompType, id: row.dataset.addcompId, servings: 1});
        document.getElementById('meal-comp-search').value = '';
        document.getElementById('meal-comp-results').innerHTML = '';
        renderCompList();
      });
    });
  }
  document.getElementById('meal-comp-search').addEventListener('input', function(e){ renderCompResults(e.target.value); });
  renderCompList();

  document.getElementById('mb-save-btn').addEventListener('click', async function(){
    const name = document.getElementById('mb-name').value.trim();
    if(!name){ document.getElementById('mb-name').style.outline='2px solid var(--danger)'; return; }
    if(!mealComponents.length) return;
    const slot = document.getElementById('mb-slot').value;
    if(existingMeal){
      existingMeal.name = name; existingMeal.mealSlot = slot; existingMeal.components = mealComponents.slice();
    } else {
      meals.push({ id:'meal-'+Date.now()+'-'+Math.floor(Math.random()*1000), name:name, mealSlot:slot, components:mealComponents.slice() });
    }
    await saveMeals();
    closeModal();
    renderMeals();
  });
  document.getElementById('mb-cancel-btn').addEventListener('click', closeModal);
  document.getElementById('meal-build-overlay').addEventListener('click', function(e){ if(e.target.id==='meal-build-overlay') closeModal(); });
}

/* =====================================================================
   PANTRY — a live read of Grocery's actual inventory, not a separate
   tracked list. Grocery owns the data and the editing; this is a
   dashboard view of it, with a link across for anything that needs
   changing.
===================================================================== */
const PANTRY_STOCK_LABELS = {full:'Full', '75':'75%', half:'Half', '25':'25%', low:'Low', finished:'Finished'};
const PANTRY_STOCK_ORDER = ['finished','low','25','half','75','full'];
async function renderPantry(){
  const el = document.getElementById('pantry-view');
  el.innerHTML = '<div class="pantry-loading">Loading pantry from Grocery…</div>';
  let inventory = {};
  let loadFailed = false;
  try{
    const doc = await groceryDataDoc('inventory').get();
    inventory = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : {};
  }catch(e){ loadFailed = true; }

  if(loadFailed){
    el.innerHTML = '<div class="pantry-card"><p class="subtle">Couldn\'t reach Grocery\'s inventory right now — try again in a moment.</p></div>';
    return;
  }

  const rows = GROCERY_PRODUCTS_REFERENCE.map(function(p){
    const inv = inventory[p.id];
    return { id:p.id, name:p.name, status: inv ? inv.status : null, lastPurchased: inv ? inv.lastPurchased : null };
  }).sort(function(a,b){
    const ai = a.status ? PANTRY_STOCK_ORDER.indexOf(a.status) : -1;
    const bi = b.status ? PANTRY_STOCK_ORDER.indexOf(b.status) : -1;
    return ai-bi;
  });

  el.innerHTML = '<div class="pantry-card">'+
    '<div class="section-head"><div><h2>Pantry inventory</h2><div class="subtle">Live from Grocery\'s inventory — edit stock levels there</div></div>'+
    '<a class="btn secondary" href="grocery.html" target="_blank" rel="noopener">Open Grocery</a></div>'+
    rows.map(function(r){
      const isLow = r.status==='low' || r.status==='finished';
      return '<div class="pantry-row-view"><div class="pantry-row-name">'+escapeHtml(r.name)+'</div>'+
        '<div class="pantry-row-meta">'+(r.lastPurchased ? 'Last bought '+r.lastPurchased : 'Never logged in Grocery')+'</div>'+
        '<div class="pantry-status-tag '+(isLow?'stock-low':'stock-good')+'">'+(r.status ? PANTRY_STOCK_LABELS[r.status] : 'Not tracked')+'</div></div>';
    }).join('')+
  '</div>';
}

/* =====================================================================
   PROGRESS — a live read of Gym's real daily logs (weight, waist, steps,
   sleep, water, notes) and workout completion. Gym owns entry; this is
   the trend/history view, with a link across for logging a new entry.
===================================================================== */
async function renderProgress(){
  const el = document.getElementById('progress-view');
  el.innerHTML = '<div class="pantry-loading">Loading progress from Gym…</div>';
  let dailyLogs = [], workoutDates = new Set();
  let loadFailed = false;
  try{
    const snap = await gymDailyLogsCol().get();
    snap.forEach(function(d){ dailyLogs.push(d.data()); });
    dailyLogs.sort(function(a,b){ return a.date<b.date?1:-1; });
    const wSnap = await db.collection('users').doc(currentUser.uid).collection('profiles').doc(activeProfile.toLowerCase()).collection('workoutLogs').get();
    wSnap.forEach(function(d){ workoutDates.add(d.id.split(':')[0]); });
  }catch(e){ loadFailed = true; }

  if(loadFailed){
    el.innerHTML = '<div class="pantry-card"><p class="subtle">Couldn\'t reach Gym\'s logs right now — try again in a moment.</p></div>';
    return;
  }

  const withWeight = dailyLogs.filter(function(d){ return d.weight != null; });
  const trendPoints = withWeight.slice(0, 14).slice().reverse();
  const maxW = trendPoints.length ? Math.max.apply(null, trendPoints.map(function(d){ return d.weight; })) : 0;
  const minW = trendPoints.length ? Math.min.apply(null, trendPoints.map(function(d){ return d.weight; })) : 0;
  const range = (maxW-minW) || 1;

  el.innerHTML =
    '<div class="grid">'+
      '<div class="card"><div class="section-head"><div><h2>Weight trend</h2><div class="subtle">Last '+trendPoints.length+' logged weigh-ins, from Gym</div></div>'+
        '<a class="btn secondary" href="../gym/index.html" target="_blank" rel="noopener">Log in Gym</a></div>'+
        (trendPoints.length ? '<div class="trend">'+trendPoints.map(function(d){
          const h = Math.max(6, Math.round(80*((d.weight-minW)/range)));
          return '<div class="trend-col"><div class="trend-bar" style="height:'+h+'px;"></div><small class="subtle">'+d.date.slice(5)+'</small></div>';
        }).join('')+'</div>' : '<div class="empty-note" style="padding:24px 0;">No weigh-ins logged in Gym yet.</div>')+
      '</div>'+
      '<div class="card"><h2>Latest entry</h2>'+
        (dailyLogs.length ? progressLatestHtml(dailyLogs[0]) : '<p class="subtle" style="margin-top:10px;">Nothing logged yet.</p>')+
      '</div>'+
    '</div>'+
    '<div class="card" style="margin-top:17px;"><h2>History</h2><div class="table-scroll"><table class="food-table"><thead><tr>'+
      '<th>Date</th><th class="num">Weight</th><th class="num">Waist</th><th class="num">Steps</th><th class="num">Sleep</th><th class="num">Water</th><th>Workout</th><th>Notes</th></tr></thead><tbody>'+
      (dailyLogs.length ? dailyLogs.slice(0,30).map(function(d){
        const didWorkout = workoutDates.has(d.date);
        return '<tr><td>'+d.date+'</td><td class="num">'+(d.weight!=null?d.weight:'—')+'</td><td class="num">'+(d.waist!=null?d.waist:'—')+'</td>'+
          '<td class="num">'+(d.steps!=null?d.steps:'—')+'</td><td class="num">'+(d.sleep!=null?d.sleep:'—')+'</td><td class="num">'+(d.water!=null?d.water:'—')+'</td>'+
          '<td><span class="'+(didWorkout?'stock-good':'subtle')+'">'+(didWorkout?'✓ Completed':'—')+'</span></td><td class="subtle">'+escapeHtml(d.notes||'')+'</td></tr>';
      }).join('') : '<tr><td colspan="8" class="subtle" style="text-align:center;padding:24px;">No entries yet — log one in Gym.</td></tr>')+
    '</tbody></table></div></div>';
}
function progressLatestHtml(d){
  return '<div class="progress-latest-grid">'+
    [['Weight', d.weight!=null?d.weight+' lb':'—'], ['Waist', d.waist!=null?d.waist+' in':'—'],
     ['Steps', d.steps!=null?d.steps:'—'], ['Sleep', d.sleep!=null?d.sleep+' hrs':'—'],
     ['Water', d.water!=null?d.water+' L':'—'], ['Date', d.date]].map(function(pair){
      return '<div class="progress-latest-cell"><span>'+pair[0]+'</span><b>'+pair[1]+'</b></div>';
    }).join('')+
  '</div>';
}

async function renderHistoryTab(){
  const el = document.getElementById('history-view');
  el.innerHTML = '<div class="empty-note">Loading…</div>';
  const dates = await loadRecentLogs(14);
  const trendDates = dates.slice(0,7).reverse(); // last 7 days, oldest first for left-to-right bars

  const calVals = trendDates.map(function(d){ return totalsFor(logs[d]||[]).cal; });
  const proVals = trendDates.map(function(d){ return totalsFor(logs[d]||[]).protein; });
  const maxCal = Math.max(1, targets.cal||0, Math.max.apply(null, calVals));
  const maxPro = Math.max(1, targets.protein||0, Math.max.apply(null, proVals));

  const daysWithData = trendDates.filter(function(d){ return (logs[d]||[]).length; });
  const avgCal = daysWithData.length ? daysWithData.reduce(function(s,d){ return s+totalsFor(logs[d]).cal; },0)/daysWithData.length : 0;
  const avgPro = daysWithData.length ? daysWithData.reduce(function(s,d){ return s+totalsFor(logs[d]).protein; },0)/daysWithData.length : 0;
  const daysOnTarget = daysWithData.filter(function(d){ const c=totalsFor(logs[d]).cal; return targets.cal && Math.abs(c-targets.cal)<=targets.cal*0.1; }).length;

  function barsHtml(vals, max, color, dates, target){
    return '<div class="macro-bars" style="align-items:flex-end;height:90px;margin:8px 0 4px;">'+
      vals.map(function(v,i){
        const h = Math.max(3, Math.round(100*v/max));
        const hit = target && Math.abs(v-target)<=target*0.15;
        return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">'+
          '<div title="'+Math.round(v)+'" style="width:70%;height:'+h+'%;border-radius:4px 4px 0 0;background:'+(hit?'var(--green)':color)+';"></div></div>';
      }).join('')+
    '</div><div class="macro-bars">'+dates.map(function(d){ return '<div style="flex:1;text-align:center;font-size:9.5px;color:var(--text-faint);">'+fmtHuman(d).slice(0,3)+'</div>'; }).join('')+'</div>';
  }

  el.innerHTML =
    '<div class="targets-card"><h3>Weekly trends</h3><p>Last 7 days · green bar means within 10–15% of target that day.</p>'+
      '<div class="stat-strip-row" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;">'+
        '<div class="targets-grid" style="grid-template-columns:1fr;text-align:center;"><div><label style="display:block;">Avg calories</label><div style="font-family:\'Inter\',sans-serif;font-weight:800;font-size:17px;">'+Math.round(avgCal)+'</div></div></div>'+
        '<div class="targets-grid" style="grid-template-columns:1fr;text-align:center;"><div><label style="display:block;">Avg protein</label><div style="font-family:\'Inter\',sans-serif;font-weight:800;font-size:17px;">'+n2(avgPro)+'g</div></div></div>'+
        '<div class="targets-grid" style="grid-template-columns:1fr;text-align:center;"><div><label style="display:block;">Days on target</label><div style="font-family:\'Inter\',sans-serif;font-weight:800;font-size:17px;">'+daysOnTarget+'/'+daysWithData.length+'</div></div></div>'+
      '</div>'+
      '<div style="font-size:11.5px;color:var(--text-soft);margin-bottom:2px;font-weight:700;">Calories</div>'+
      barsHtml(calVals, maxCal, '#FF7A45', trendDates, targets.cal)+
      '<div style="font-size:11.5px;color:var(--text-soft);margin:14px 0 2px;font-weight:700;">Protein</div>'+
      barsHtml(proVals, maxPro, '#3D8BFD', trendDates, targets.protein)+
    '</div>'+
    dates.map(function(d){
      const entries = logs[d]||[];
      const t = totalsFor(entries);
      const hitCal = targets.cal ? Math.abs(t.cal-targets.cal) <= targets.cal*0.1 : false;
      return '<div class="history-row"><div class="hr-date">'+fmtHuman(d)+'</div>'+
        '<div class="hr-nums"><span class="'+(entries.length ? (hitCal?'hr-hit':'hr-miss') : '')+'">'+Math.round(t.cal)+' kcal</span> · '+n2(t.protein)+'g protein</div></div>';
    }).join('');
}

/* ===== NOURISH DUO CONNECTED FEATURES ===== */
function weekStart(dateStr){ const d=new Date(dateStr+'T12:00:00'); return addDays(dateStr,-((d.getDay()+6)%7)); }
async function renderWeek(){
  const el=document.getElementById('week-view'); el.innerHTML='<div class="pantry-loading">Loading your cloud diary…</div>';
  const start=weekStart(activeDate), days=Array.from({length:7},function(_,i){return addDays(start,i);});
  await Promise.all(days.map(function(d){return loadLogForDate(d);}));
  el.innerHTML='<div class="section-head"><div><h2>'+fmtHuman(start)+' – '+fmtHuman(days[6])+'</h2><div class="subtle">Seven-day calorie, protein, and logging view</div></div><div><button class="btn ghost" id="week-prev">← Previous</button> <button class="btn secondary" id="week-today">Today</button> <button class="btn ghost" id="week-next">Next →</button></div></div><div class="week-grid">'+days.map(function(d){const entries=logs[d]||[],t=totalsFor(entries),ratio=targets.cal?t.cal/targets.cal:0,status=entries.length?(ratio>=.85&&ratio<=1.15?'done':'partial'):'';return '<button class="week-day '+(d===activeDate?'active':'')+'" data-weekdate="'+d+'"><span class="wd-dot '+status+'"></span><div class="wd-name">'+new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'})+'</div><div class="wd-num">'+new Date(d+'T12:00:00').getDate()+'</div><div class="wd-meta"><b>'+entries.length+' logged item'+(entries.length===1?'':'s')+'</b><br>'+Math.round(t.cal)+' kcal<br>'+n2(t.protein)+' g protein</div></button>';}).join('')+'</div><div class="card" style="margin-top:16px"><b>Connected history</b><p class="subtle" style="margin-bottom:0">Selecting a day opens the same cloud diary used throughout your app suite.</p></div>';
  el.querySelectorAll('[data-weekdate]').forEach(function(b){b.onclick=function(){activeDate=b.dataset.weekdate;showTab('today');};});
  document.getElementById('week-prev').onclick=function(){activeDate=addDays(start,-7);renderWeek();}; document.getElementById('week-next').onclick=function(){activeDate=addDays(start,7);renderWeek();}; document.getElementById('week-today').onclick=function(){activeDate=todayStr();renderWeek();};
}
function profileDataDoc(profile,key){return db.collection('users').doc(currentUser.uid).collection('diet-profiles').doc(profile).collection('data').doc(key);}
async function connectedPlan(profile){
  const ff=profile==='Bhargav'?FOODS_SEED_BHARGAV:FOODS_SEED_ANUSHA, rr=profile==='Bhargav'?RECIPES_SEED_BHARGAV:RECIPES_SEED_ANUSHA, mm=profile==='Bhargav'?MEALS_SEED_BHARGAV:MEALS_SEED_ANUSHA;
  try{const docs=await Promise.all(['foods','recipes','meals'].map(function(k){return profileDataDoc(profile,k).get();}));return{foods:docs[0].exists?JSON.parse(docs[0].data().json):ff,recipes:docs[1].exists?JSON.parse(docs[1].data().json):rr,meals:docs[2].exists?JSON.parse(docs[2].data().json):mm};}catch(e){return{foods:ff,recipes:rr,meals:mm};}
}
async function prepTotals(scope,days){
  const profiles=scope==='both'?['Bhargav','Anusha']:[activeProfile],packs=await Promise.all(profiles.map(connectedPlan)),result={};
  packs.forEach(function(pack){const fBy=function(id){return pack.foods.find(function(f){return f.id===id;});},rBy=function(id){return pack.recipes.find(function(r){return r.id===id;});};pack.meals.forEach(function(m){m.components.forEach(function(c){if(c.type!=='recipe')return;const r=rBy(c.id);if(!r)return;r.ingredients.forEach(function(ing){const f=fBy(ing.foodId);if(!f)return;const key=(f.name+'|'+f.unit).toLowerCase();if(!result[key])result[key]={name:f.name,unit:f.unit,qty:0};result[key].qty+=(ing.quantity||0)*(c.servings||1)/(r.recipeServings||1)*days;});});});});
  return Object.values(result).sort(function(a,b){return a.name.localeCompare(b.name);});
}
async function renderPrepPlanner(){
  const el=document.getElementById('prep-view'); el.innerHTML='<div class="pantry-loading">Calculating both meal plans…</div>';
  const scope=(document.getElementById('prep-scope')||{}).value||'both',days=parseInt((document.getElementById('prep-days')||{}).value||'7',10),rows=await prepTotals(scope,days);
  el.innerHTML='<div class="feature-grid"><div class="card"><div class="section-head"><div><h2>Combined meal preparation</h2><div class="subtle">Exact quantities derived from saved cloud recipes</div></div><div><select id="prep-scope"><option value="both" '+(scope==='both'?'selected':'')+'>Both profiles</option><option value="current" '+(scope==='current'?'selected':'')+'>Current profile</option></select> <select id="prep-days"><option value="3" '+(days===3?'selected':'')+'>3 days</option><option value="7" '+(days===7?'selected':'')+'>7 days</option><option value="14" '+(days===14?'selected':'')+'>14 days</option></select></div></div>'+rows.filter(function(x){return !/salt|chilli|water/i.test(x.name);}).map(function(x){return '<label class="prep-row"><input type="checkbox" data-prepcheck><span><b>'+escapeHtml(x.name)+'</b><br><small class="subtle">Measure, cook, or confirm inventory</small></span><b>'+n2(x.qty)+' '+x.unit+'</b></label>';}).join('')+'<a class="btn secondary" href="grocery.html" style="margin-top:10px">Open connected Grocery inventory</a></div><div class="card"><h2>Cooking-yield calculator</h2><p class="subtle">Convert raw or dry batches into accurate cooked portions.</p><div class="f"><label>Recipe</label><select id="yield-recipe">'+recipes.map(function(r){return '<option value="'+r.id+'">'+escapeHtml(r.name)+'</option>';}).join('')+'</select></div><div class="yield-grid" style="margin-top:10px"><div class="f"><label>Dry/raw (g)</label><input id="yield-raw" type="number" value="300"></div><div class="f"><label>Cooked yield (g)</label><input id="yield-cooked" type="number" value="825"></div><div class="f"><label>Cooked portion (g)</label><input id="yield-portion" type="number" value="150"></div></div><div class="yield-result"><b id="yield-answer">54.5 g</b><div>dry/raw equivalent for this portion</div></div><div class="sheet-actions"><button class="btn-mini primary" id="yield-save">Save to recipe</button></div></div></div>';
  document.getElementById('prep-scope').onchange=renderPrepPlanner; document.getElementById('prep-days').onchange=renderPrepPlanner;
  function calc(){const raw=+document.getElementById('yield-raw').value||0,cooked=+document.getElementById('yield-cooked').value||0,portion=+document.getElementById('yield-portion').value||0;document.getElementById('yield-answer').textContent=(cooked?n2(raw*portion/cooked):0)+' g';}
  ['yield-raw','yield-cooked','yield-portion'].forEach(function(id){document.getElementById(id).oninput=calc;});
  document.getElementById('yield-save').onclick=async function(){const r=recipeById(document.getElementById('yield-recipe').value);if(!r)return;r.cookingYield={raw:+document.getElementById('yield-raw').value||0,cooked:+document.getElementById('yield-cooked').value||0,portion:+document.getElementById('yield-portion').value||0};await saveRecipes();this.textContent='Saved ✓';};
  document.querySelectorAll('[data-prepcheck]').forEach(function(c){c.onchange=function(){c.closest('.prep-row').classList.toggle('done',c.checked);};});
}

async function renderExpandedNutrition(){
  const el=document.getElementById('nutrition-view');
  el.innerHTML='<div class="pantry-loading">Calculating today\'s complete nutrition…</div>';
  await loadLogForDate(activeDate);
  const entries=logs[activeDate]||[], t=totalsFor(entries);
  const nutrients=[
    {name:'Fiber',value:t.fiber||0,target:targets.fiber||28,unit:'g',color:'var(--green)'},
    {name:'Sodium',value:t.sodium||0,target:targets.sodium||2300,unit:'mg',color:'var(--orange)'},
    {name:'Sugar',value:t.sugar||0,target:50,unit:'g',color:'#7c6fd1',reference:true},
    {name:'Saturated fat',value:t.satFat||0,target:20,unit:'g',color:'#d06464',reference:true}
  ];
  el.innerHTML='<div class="feature-grid"><div class="card"><div class="section-head"><div><h2>Expanded nutrition</h2><div class="subtle">'+fmtHuman(activeDate)+' · calculated from the exact amounts you logged</div></div><button class="btn secondary" id="nutrition-foods">Edit ingredient nutrition</button></div><div class="micro-grid">'+nutrients.map(function(n){const pct=n.target?Math.min(100,Math.round(n.value/n.target*100)):0;return '<div class="micro-card"><div class="micro-head"><b>'+n.name+'</b><span>'+n2(n.value)+' / '+n.target+' '+n.unit+'</span></div><div class="macro-track" style="margin-top:9px"><div style="width:'+pct+'%;background:'+n.color+'"></div></div><div class="subtle" style="margin-top:7px">'+(n.reference?'General reference limit; personalize with a professional.':pct+'% of your saved target')+'</div></div>';}).join('')+'</div></div><div class="card"><h2>Data quality</h2><p class="subtle">Calories, protein, carbs, fat, and fiber are populated for the plan foods. Sodium, sugar, and saturated fat only total values entered on each ingredient label.</p><div class="yield-result"><b>'+entries.length+'</b><div>items included in today\'s calculation</div></div><p class="subtle">For packaged foods such as whey, paneer, milk, yogurt, and fruit cups, copy the current label into Ingredients for the most accurate result.</p></div></div>';
  document.getElementById('nutrition-foods').onclick=function(){showTab('foods');};
}

async function renderAdherence(){
  const el=document.getElementById('adherence-view');
  el.innerHTML='<div class="pantry-loading">Building your seven-day scorecard…</div>';
  const dates=[]; for(let i=6;i>=0;i--) dates.push(addDays(activeDate,-i));
  await Promise.all(dates.map(function(d){return loadLogForDate(d);}));
  const days=dates.map(function(d){const entries=logs[d]||[],t=totalsFor(entries);return{date:d,entries:entries.length,total:t,calHit:entries.length&&targets.cal&&Math.abs(t.cal-targets.cal)<=targets.cal*.1,proteinHit:entries.length&&targets.protein&&t.protein>=targets.protein*.9};});
  const used=days.filter(function(d){return d.entries;});
  const avgCal=used.length?used.reduce(function(s,d){return s+d.total.cal;},0)/used.length:0;
  const avgProtein=used.length?used.reduce(function(s,d){return s+d.total.protein;},0)/used.length:0;
  const calHits=used.filter(function(d){return d.calHit;}).length, proteinHits=used.filter(function(d){return d.proteinHit;}).length;
  const score=used.length?Math.round(50*calHits/used.length+50*proteinHits/used.length):0;
  el.innerHTML='<div class="score-grid"><div class="score-card"><b>'+score+'%</b><span>balanced adherence</span></div><div class="score-card"><b>'+used.length+'/7</b><span>days logged</span></div><div class="score-card"><b>'+Math.round(avgCal)+'</b><span>average calories</span></div><div class="score-card"><b>'+n2(avgProtein)+' g</b><span>average protein</span></div></div><div class="feature-grid"><div class="card"><h2>Daily consistency</h2>'+days.map(function(d){const calPct=targets.cal?Math.min(100,Math.round(d.total.cal/targets.cal*100)):0;return '<div class="adherence-row"><b>'+fmtHuman(d.date)+'</b><div class="macro-track"><div style="width:'+calPct+'%;background:'+(d.calHit?'var(--green)':'var(--orange)')+'"></div></div><span class="subtle">'+(d.entries?(Math.round(d.total.cal)+' kcal · '+n2(d.total.protein)+'g P'):'Not logged')+'</span></div>';}).join('')+'</div><div class="card"><h2>How the score works</h2><p class="subtle">Half of the score is earned for calories within 10% of your saved target. Half is earned for reaching at least 90% of your protein target. Only logged days are scored.</p><div class="yield-result"><b>'+calHits+' calorie days · '+proteinHits+' protein days</b><div>among '+used.length+' logged day'+(used.length===1?'':'s')+'</div></div><p class="subtle">This is a consistency aid, not a medical grade. One unusual day should not drive food restriction or compensation.</p></div></div>';
}
