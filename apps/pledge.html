<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pledge — Turn ambition into a kept promise</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../assets/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Pledge — built entirely on the Hub's theme tokens (--bg --surface
   --surface-soft --line --text --muted --faint --ink --shadow + --accent),
   which HubTheme.applyHubAppearance / applyHubTheme set at runtime. So it
   follows the Hub's mode, palette, wallpaper and each person's accent. */
:root{--bg:#f4f4f0;--surface:#fff;--surface-soft:#f8f8f5;--line:#e3e3dc;--text:#20211e;--muted:#74766f;--faint:#9c9e97;--ink:#171714;
--accent:#ad7b20;--on-accent:#fff;--radius:16px;--shadow:0 18px 50px rgba(37,38,32,.08);
--green:var(--accent);--lime:var(--accent);--gold:var(--accent);
--panel:var(--surface);--panel2:var(--surface-soft);
--green2:color-mix(in srgb,var(--accent) 14%,var(--surface));
--line-accent:color-mix(in srgb,var(--accent) 40%,var(--line));
--ok:#2f9d6b;--ok2:color-mix(in srgb,var(--ok) 14%,var(--surface));
--warn:#d9822b;--warn2:color-mix(in srgb,var(--warn) 14%,var(--surface));
--bad:#c4493f;--bad2:color-mix(in srgb,var(--bad) 12%,var(--surface));
--info:#4a78c9;--info2:color-mix(in srgb,var(--info) 12%,var(--surface))}
:root[data-theme="dark"],:root[data-theme="dark"] body{color-scheme:dark}
:root[data-theme="dark"]{--ok:#4cc58d;--warn:#f0a050;--bad:#ef7a70;--info:#7ea7ee}
body.embedded .topbar-wrap{display:none}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:transparent;color:var(--text);font:14.5px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
html{background-attachment:fixed;background-size:300% 300%}
html.wallpaper-live{animation:wp-drift 40s ease-in-out infinite alternate}
@keyframes wp-drift{from{background-position:0% 50%}to{background-position:100% 50%}}
h1,h2,h3,h4{font-family:Manrope,Inter,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}
.topbar-wrap{padding:14px 20px 4px}
.topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand-cluster{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;font-family:Manrope,sans-serif}
.mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:800}
.hub-link{color:var(--muted);text-decoration:none;font-size:12.5px;font-weight:600}.hub-link:hover{color:var(--text)}
.profile-buttons{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.profile-buttons button{border:0;border-radius:999px;background:transparent;color:var(--muted);padding:6px 13px;font-weight:700;font-size:12.5px}
.profile-buttons button.active{background:var(--accent);color:var(--on-accent)}
.sync-box{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.sync-box b{font-weight:600}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}.sync-dot.on{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.navbar-wrap{position:sticky;top:0;z-index:60;padding:10px 20px;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 78%,transparent)}
.nav-row{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:9px 16px;font-weight:700;white-space:nowrap;font-size:13.5px;display:flex;align-items:center;gap:7px}
.nav button .ni{font-size:15px;line-height:1}
.nav button.active{background:var(--accent);color:var(--on-accent)}.nav button:not(.active):hover{color:var(--text)}
.goal-switch{display:flex;align-items:center;gap:8px}
.goal-switch select{min-width:150px;max-width:230px}
.main{width:100%;max-width:1100px;margin:auto;padding:18px 20px 70px}
.top{margin-bottom:18px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-size:10.5px;font-weight:800}
.top h1{font-size:28px;line-height:1.15;margin:4px 0}.top .sub{color:var(--muted);font-size:13.5px}
.page{display:none}.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.metric span{font-size:12px;color:var(--muted);font-weight:600}.metric b{font-size:24px;display:block;margin-top:3px;font-family:Manrope,sans-serif}
.btn{white-space:nowrap;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);padding:10px 15px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.soft{background:var(--green2);color:var(--accent);color:color-mix(in srgb,var(--accent) 70%,var(--text))}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text)}
.btn.danger{background:var(--bad2);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,var(--line))}
.btn.gold{background:var(--accent);color:var(--on-accent)}.btn.big{padding:13px 20px;font-size:15px;border-radius:14px}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}.btn:disabled{opacity:.45;cursor:default}
.input,select,textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
.input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.hint{font-size:12px;color:var(--faint);margin-top:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2,.card h3{margin:0 0 4px}.card>h3:first-child{font-size:16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px}
/* ---- reward hero: the thing you are working toward ---- */
.prize{position:relative;overflow:hidden;border-radius:22px;margin-bottom:16px;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 80%,#000),color-mix(in srgb,var(--accent) 45%,#000));box-shadow:var(--shadow)}
.prize-img{position:absolute;inset:0;background-size:cover;background-position:center;transition:filter .6s,transform .6s}
.prize:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.72) 100%)}
.prize-body{position:relative;z-index:2;padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;min-height:250px}
.prize-kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.9;display:flex;align-items:center;gap:6px}
.prize h1{font-size:30px;line-height:1.1;margin:8px 0 6px;color:#fff}
.prize-sub{font-size:13.5px;opacity:.92;max-width:460px}
.prize-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.pchip{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.ring{width:132px;height:132px;position:relative;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{stroke:rgba(255,255,255,.25)}.ring .rf{stroke:#fff;transition:stroke-dashoffset .8s}
.ring-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring-c b{font-size:30px;font-family:Manrope,sans-serif}.ring-c small{font-size:11px;opacity:.9;display:block;margin-top:2px}
.prize-empty{font-size:64px;position:absolute;right:26px;top:18px;z-index:2;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35))}
.fund{margin-top:12px;max-width:420px}.fund .bar{background:rgba(255,255,255,.22);border:0;height:8px}.fund .bar i{background:#fff}.fund small{font-size:12px;opacity:.92;display:flex;justify-content:space-between;margin-bottom:5px}
.prize .btn.ghost{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.prize .btn.gold{background:#fff;color:#1c1a14}
.prize-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.earned-glow{animation:glow 2.2s ease-in-out infinite alternate}@keyframes glow{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent),var(--shadow)}to{box-shadow:0 0 0 10px transparent,var(--shadow)}}
/* ---- player strip ---- */
.player{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;margin-bottom:14px}
.rank-badge{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:Manrope,sans-serif;font-weight:800;font-size:19px;flex:none}
.player-main{flex:1;min-width:180px}.player-main b{font-size:15px}.player-main .bar{margin-top:6px}
.stat-chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 11px;font-weight:700;font-size:12.5px;white-space:nowrap;background:var(--green2);color:color-mix(in srgb,var(--accent) 70%,var(--text))}
.chip.ok{background:var(--ok2);color:var(--ok)}.chip.info{background:var(--info2);color:var(--info)}.chip.warn{background:var(--warn2);color:var(--warn)}
.streak-chip{display:inline-flex;align-items:center;gap:4px;background:var(--green2);color:color-mix(in srgb,var(--accent) 70%,var(--text));border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;white-space:nowrap}
/* ---- checklist ---- */
.today-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.today-head h2{font-size:19px}.today-head span{font-size:13px;color:var(--muted);font-weight:600}
.task-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}.task-row:last-child{border:0}
.chk{width:32px;height:32px;flex:none;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:transparent;font-size:17px;display:grid;place-items:center;transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .15s}
.chk:hover{border-color:var(--accent)}.chk.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent);transform:scale(1.06)}
.task-row.all-done .task-label{text-decoration:line-through;color:var(--muted)}
.task-label{font-weight:700;font-size:15px}.task-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.task-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--green2);color:color-mix(in srgb,var(--accent) 70%,var(--text))}
.tag-pill.peer{background:var(--info2);color:var(--info)}.tag-pill.proof{background:var(--warn2);color:var(--warn)}
.alldone{text-align:center;padding:16px 8px 6px;font-weight:700}.alldone big{display:block;font-size:34px}
/* ---- banners ---- */
.recovery-banner{background:var(--bad2);border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));border-radius:var(--radius);padding:16px;margin:0 0 14px}
.recovery-banner h3{margin:0 0 4px;color:var(--bad)}
.recovery-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.checkpoint-banner{background:var(--info2);border:1px solid color-mix(in srgb,var(--info) 35%,var(--line));border-radius:var(--radius);padding:15px;margin:0 0 14px}
.win-banner{background:var(--ok2);border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line));border-radius:var(--radius);padding:15px;margin:0 0 14px}
.stake-banner{background:var(--warn2);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:var(--radius);padding:13px 15px;margin:0 0 14px;font-size:13.5px}
.commit-note{background:var(--green2);border-left:4px solid var(--accent);border-radius:12px;padding:12px 15px;font-size:14px;font-style:italic;margin:0 0 14px}
.commit-note small{display:block;font-style:normal;font-weight:700;color:var(--muted);font-size:11px;margin-bottom:2px;letter-spacing:.06em;text-transform:uppercase}
.deadline-pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface-soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.deadline-pill.danger{background:var(--bad2);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
/* ---- stage path ---- */
.ladder{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;margin:0 0 14px;scroll-snap-type:x proximity}
.rung{flex:0 0 168px;scroll-snap-align:start;border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--surface);cursor:pointer;position:relative}
.rung.current{border-color:var(--accent);background:var(--green2)}
.rung.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--ok2)}
.rung.recovery{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:var(--bad2)}
.rung.upcoming{opacity:.7}
.rung .rung-index{font-size:11px;color:var(--muted);font-weight:800}.rung h3{font-size:15px;margin:5px 0 3px}.rung .rung-meta{font-size:12px;color:var(--muted)}
.rung .rg{position:absolute;right:10px;top:9px;font-size:18px}
/* ---- road chart / badges ---- */
.road svg{width:100%;height:auto;display:block}
.road-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.road-legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:var(--surface-soft)}
.badge .bi{font-size:28px;filter:grayscale(1);opacity:.35}.badge b{display:block;font-size:13px;margin-top:4px}.badge small{color:var(--muted);font-size:11.5px;display:block}
.badge.got{background:var(--green2);border-color:var(--line-accent)}.badge.got .bi{filter:none;opacity:1}
.bar{height:9px;background:var(--surface-soft);border:1px solid var(--line);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
/* ---- goals / rewards ---- */
.pledge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.war-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.war-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.war-card.active{border-color:var(--accent)}
.vault-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.vault-item{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.vault-image{height:130px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 60%,#000),color-mix(in srgb,var(--accent) 30%,#000));background-size:cover;background-position:center;display:grid;place-items:center;font-size:40px;position:relative}
.vault-image.locked{filter:grayscale(.85) blur(1.5px)}
.vault-copy{padding:13px}.vault-copy small{color:var(--muted);font-weight:700;font-size:11.5px}
.reward-status-chip{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--green2);color:color-mix(in srgb,var(--accent) 70%,var(--text));letter-spacing:.04em}
.reward-status-chip.earned,.reward-status-chip.claimed,.reward-status-chip.purchased{background:var(--ok2);color:var(--ok)}
.timeline-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.timeline-thumb{width:72px;height:72px;border-radius:12px;background-size:cover;background-position:center;border:1px solid var(--line);flex:none}
.history-item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.history-item:last-child{border:0}.history-item small{color:var(--muted)}
/* ---- modal / forms ---- */
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin:auto}
.modal h2{margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.steps{display:flex;gap:6px;margin:14px 0 16px}.steps i{flex:1;height:5px;border-radius:99px;background:var(--line)}.steps i.on{background:var(--accent)}
.chips-row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.pick{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13px}.pick:hover,.pick.on{border-color:var(--accent);background:var(--green2)}
.stack{display:grid;gap:12px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:15px 18px;font-weight:800;font-family:Manrope,sans-serif;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}details.sec>summary:after{content:"＋";color:var(--muted);font-weight:400}details.sec[open]>summary:after{content:"–"}
details.sec>summary small{font-weight:500;color:var(--muted);font-size:12.5px;font-family:Inter,sans-serif;margin-left:8px;margin-right:auto}
details.sec>.sec-body{padding:2px 18px 18px}
details.more{margin-top:8px}details.more>summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:700;padding:4px 0}
.task-editor{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;background:var(--surface-soft)}
.reward-edit{border:1px dashed var(--line-accent);border-radius:14px;padding:13px;background:var(--green2);display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;z-index:80;opacity:0;transition:.2s;pointer-events:none;box-shadow:var(--shadow);max-width:min(340px,92vw);font-weight:600;font-size:13.5px}.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;text-align:center}.loading div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:25px}
.empty{text-align:center;color:var(--muted);padding:30px 14px}
.welcome{text-align:center;padding:38px 18px;background:var(--surface);border:1px solid var(--line);border-radius:22px}
.welcome .big-i{font-size:54px}.welcome h2{font-size:23px;margin:8px 0}.welcome p{color:var(--muted);max-width:420px;margin:0 auto 16px}
.template-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.focus-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:90;display:grid;place-items:center;padding:20px}
.focus-dialog{width:min(440px,100%);background:var(--surface);color:var(--text);border-radius:22px;padding:30px;text-align:center;position:relative}
.focus-dialog .eyebrow2{color:var(--accent);text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800}
.focus-timer{font-size:56px;font-weight:800;color:var(--accent);margin:14px 0;font-family:Manrope,sans-serif}
.focus-close{position:absolute;top:10px;right:14px;background:none;border:0;color:var(--muted);font-size:24px}

<script>
window.addEventListener('error',e=>{const l=document.getElementById('loadingText');if(l&&document.getElementById('loading').style.display!=='none')l.textContent='Something went wrong: '+e.message});
if(typeof firebase==='undefined'){document.getElementById('loadingText').textContent='Connected services could not load. Check your connection and refresh.'}else{
const CONFIG={apiKey:'AIzaSyBe01eR2RZwSbU_aoJMeh_2MMJ5mqkVuKk',authDomain:'iron-log-bfc55.firebaseapp.com',projectId:'iron-log-bfc55',storageBucket:'iron-log-bfc55.firebasestorage.app',messagingSenderId:'106586808946',appId:'1:106586808946:web:f4736554ba9fc82c6fd8eb'};
if(!firebase.apps.length)firebase.initializeApp(CONFIG);const auth=firebase.auth(),db=firebase.firestore();if(window.self===window.top){try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}}
const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,state=null,saveTimer=null;

/* ===================== dates ===================== */
function pad2(n){return String(n).padStart(2,'0')}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function formatDate(iso){return iso?new Date(iso+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—'}
function dowOf(iso){return new Date(iso+'T12:00:00').getDay()}

/* ===================== persistence ===================== */
function doc(k){return db.collection('users').doc(user.uid).collection('apps').doc('pledge-v2').collection('data').doc(k)}
function save(){if(!user)return;$('syncLabel').textContent='Saving…';$('syncDot').classList.remove('on');clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await doc('state').set({json:JSON.stringify(state),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});$('syncLabel').textContent='Saved to cloud';$('syncDot').classList.add('on')}catch(e){$('syncLabel').textContent='Save needs retry'}},300)}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2800)}

/* ===================== templates ===================== */
const TEMPLATES={
  exam:{title:'Pass the certification',description:'Earn the result through disciplined preparation.',type:'Education',why:'This qualification opens the next door.',target:'Pass the exam',days:14,task:'Complete one focused study block',detail:'60 minutes with practice questions'},
  fitness:{title:'Build the body',description:'Train consistently and earn the result.',type:'Fitness',why:'Strength and health compound over time.',target:'Complete the training block',days:30,task:"Complete today's training",detail:'Follow the planned session without skipping the final set'},
  career:{title:'Advance the career',description:'Build the evidence and skill for the next role.',type:'Career',why:'The next opportunity requires a stronger standard.',target:'Complete the career milestone',days:30,task:'Complete one career-building block',detail:'90 minutes of deliberate work'},
  project:{title:'Finish the project',description:'Turn the idea into a finished deliverable.',type:'Project',why:'Finished work creates leverage.',target:'Ship the defined project',days:21,task:'Move the project forward',detail:'Complete one clearly defined deliverable'}
};

/* ===================== model ===================== */
function freshTask(over){return Object.assign({id:'t-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),title:'New task',detail:'Define the exact requirement',xp:100,time:'',duration:'',priority:'Normal',minimum:'',frequency:'daily',selectedDays:[],peer:'',requiresPhoto:false,doneOnce:false},over||{})}
function freshReward(over){return Object.assign({name:'Choose the reward',price:0,url:'',image:'',status:'committed',fundSaved:0},over||{})}
function freshLevel(over){return Object.assign({id:'lv-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),title:'Stage 1',days:7,rule:'Do every task each day, honestly. A missed day starts a recovery.',status:'upcoming',startedAt:null,shared:false,tasks:[freshTask()],reward:freshReward(),days_log:{},recoveryEvents:[],excusedDates:[],recoveryTriggerDate:null,pausedOn:null,difficultySuggestion:null,sunkCostCheckpoint:{shown:false,decision:null}},over||{})}
function freshGoal(over){
  const lvl=freshLevel({status:'current',startedAt:todayKey()});
  return Object.assign({
    id:'g-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),profileId:state?state.activeProfile:'Bhargav',
    title:'New goal',description:'',type:'Personal',why:'',startingPoint:'',target:'',deadline:'',priority:'High',
    prepChecklist:'',reminderTime:'',reviewDay:'Sunday',background:'',
    status:'active',currentLevelIndex:0,levels:[lvl],
    milestones:[],commitNote:'',commitNoteSealedAt:null,
    graceTokens:0,perfectDayStreak:0,xpBank:0,bonusRewards:[],
    photoCheckins:[],
    createdAt:Date.now()
  },over||{});
}
function fresh(){return{version:2,activeProfile:'Bhargav',activeGoalId:null,goals:[],archivedGoals:[],history:[],reviews:{}}}

async function load(){
  const snap=await doc('state').get();
  state=snap.exists?JSON.parse(snap.data().json):null;
  if(!state||!state.goals){state=fresh()}
  const qp=new URLSearchParams(location.search).get('profile');
  state.activeProfile=qp==='Anusha'||qp==='Bhargav'?qp:(state.activeProfile||'Bhargav');
  // No auto-created blank goal: every screen already has an empty-state
  // prompting "+ New goal", so a first-time open starts genuinely empty
  // instead of leaving an unwanted "New operation" cluttering the switcher.
  if(state.activeGoalId&&!state.goals.some(g=>g.id===state.activeGoalId))state.activeGoalId=null;
  if(!state.activeGoalId){const mine=state.goals.find(g=>g.profileId===state.activeProfile);if(mine)state.activeGoalId=mine.id}
  state.goals.forEach(g=>evaluateGoal(g));
}

function myGoals(){return state.goals.filter(g=>g.profileId===state.activeProfile)}
function activeGoal(){return state.goals.find(g=>g.id===state.activeGoalId)||myGoals()[0]}
function currentLevel(g){return g.levels[g.currentLevelIndex]||g.levels[g.levels.length-1]}
function levelProgress(l){const done=l.tasks.filter(t=>t.doneOnce||dayHasTask(l,todayKey(),t.id)).length;const total=l.tasks.length;if(!total)return 0;
  // overall level progress = days with a fully-complete log / total days (more meaningful than today's checklist alone)
  const end=addDays(l.startedAt||todayKey(),l.days-1);let doneDays=0,cursor=l.startedAt||todayKey();
  while(cursor<=end){const rec=l.days_log[cursor];if((rec&&rec.complete)||(l.excusedDates||[]).includes(cursor))doneDays++;cursor=addDays(cursor,1)}
  return Math.min(100,Math.round(doneDays/l.days*100));
}
function dayHasTask(level,dateKey,taskId){const rec=level.days_log[dateKey];return !!(rec&&rec.doneTaskIds&&rec.doneTaskIds.includes(taskId))}
function logEvent(goalId,action,detail){state.history.unshift({id:Date.now()+Math.random(),date:new Date().toISOString(),goalId,action,detail});state.history=state.history.slice(0,400)}

/* ===================== task due-today logic ===================== */
function taskDueToday(task,dateKey){
  if(task.frequency==='once')return !task.doneOnce;
  if(task.frequency==='weekdays'){const d=dowOf(dateKey);return d>=1&&d<=5}
  if(task.frequency==='selected')return (task.selectedDays||[]).includes(dowOf(dateKey));
  return true;
}
function dueTasksFor(level,dateKey){return level.tasks.filter(t=>taskDueToday(t,dateKey))}

/* ===================== grace tokens ===================== */
function accrueGrace(goal){
  if(goal.perfectDayStreak>0&&goal.perfectDayStreak%7===0){goal.graceTokens=(goal.graceTokens||0)+1;logEvent(goal.id,'Grace token earned','7 perfect days in a row');toast('🛡️ Free pass earned — it covers one missed day');}
}

/* ===================== evaluation / recovery engine =====================
   Walks every fully-elapsed day of the current level's period. A day
   counts as satisfied if its log is complete, OR the date is in
   excusedDates (recovery actions, pause-resume, or an auto-spent grace
   token all funnel through here). The first unsatisfied day either
   silently consumes a grace token (if any are banked) or flips the level
   into 'recovery' and waits for a manual choice. Nothing is ever
   silently deleted — every excuse is logged. */
function evaluateLevel(goal,level){
  if(level.status!=='current')return;
  const today=todayKey(),end=addDays(level.startedAt,level.days-1);
  const lastCheck=today<=end?addDays(today,-1):end;
  let cursor=level.startedAt;
  while(cursor<=lastCheck){
    const excused=(level.excusedDates||[]).includes(cursor);
    const rec=level.days_log[cursor];
    if(!excused&&!(rec&&rec.complete)){
      if((goal.graceTokens||0)>0){
        goal.graceTokens--;
        level.excusedDates=level.excusedDates||[];level.excusedDates.push(cursor);
        logEvent(goal.id,'Grace token auto-spent',cursor+' was about to break the streak');
        cursor=addDays(cursor,1);continue;
      }
      level.status='recovery';level.recoveryTriggerDate=cursor;return;
    }
    cursor=addDays(cursor,1);
  }
  if(today>end){
    level.status='done';
    if(level.reward.status==='committed'||level.reward.status==='in-progress')level.reward.status='earned';
    computeDifficultySuggestion(level);
    logEvent(goal.id,'Level completed',level.title);
    advanceGoal(goal);
  }
}
function evaluateGoal(goal){(goal.levels||[]).forEach(l=>evaluateLevel(goal,l))}
function computeDifficultySuggestion(level){
  const n=(level.recoveryEvents||[]).length;
  if(n===0)level.difficultySuggestion={days:Math.max(level.days,Math.round(level.days*1.3)),note:'Perfect run — raise the bar. Suggested a longer next level.'};
  else if(n<=2)level.difficultySuggestion={days:level.days,note:'Solid run with a couple of recoveries — keep the same length next.'};
  else level.difficultySuggestion={days:Math.max(3,Math.round(level.days*0.7)),note:'Several recoveries — suggested a shorter level next to rebuild momentum.'};
}
function advanceGoal(goal){
  const next=goal.levels[goal.currentLevelIndex+1];
  if(next){goal.currentLevelIndex++;next.status='current';next.startedAt=todayKey();}
  else{toast('🏆 '+goal.title+' — every stage complete!');logEvent(goal.id,'Ladder complete','Every level finished');}
}

/* ===================== checklist interaction ===================== */
function recordPerfectStreak(goal,level,dateKey,wasComplete){
  if(!wasComplete)return;
  const yest=addDays(dateKey,-1);
  const prevOk=(level.days_log[yest]&&level.days_log[yest].complete)||(level.excusedDates||[]).includes(yest)||dateKey===level.startedAt;
  goal.perfectDayStreak=prevOk?(goal.perfectDayStreak||0)+1:1;
  accrueGrace(goal);
}
function maybeSpotCheck(cb){
  if(Math.random()<0.2){openSpotCheck(cb)}else cb(null);
}
function toggleTask(goalId,levelId,taskId){
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId),task=level.tasks.find(t=>t.id===taskId);
  if(!goal||!level||!task||level.status!=='current')return;
  const today=todayKey();
  if(!dueTasksFor(level,today).some(t=>t.id===taskId))return;
  const applyToggle=(note)=>{
    level.days_log[today]=level.days_log[today]||{doneTaskIds:[],complete:false,spotCheckNotes:{}};
    const rec=level.days_log[today];
    const idx=rec.doneTaskIds.indexOf(taskId);
    const turningOn=idx===-1;
    if(turningOn){rec.doneTaskIds.push(taskId);if(note)rec.spotCheckNotes[taskId]=note;if(task.frequency==='once')task.doneOnce=true;goal.xpBank=(goal.xpBank||0)+(task.xp||0);
      if(task.requiresPhoto){openPhotoCheckin(goal.id,level.id,taskId);}
    }else{rec.doneTaskIds.splice(idx,1);if(task.frequency==='once')task.doneOnce=false;goal.xpBank=Math.max(0,(goal.xpBank||0)-(task.xp||0));}
    const due=dueTasksFor(level,today);
    rec.complete=due.length>0&&due.every(t=>rec.doneTaskIds.includes(t.id));
    recordPerfectStreak(goal,level,today,rec.complete);
    logEvent(goal.id,turningOn?'Task completed':'Task reopened',task.title);
    evaluateLevel(goal,level);
    save();renderPage(document.querySelector('.page.active').id);
    if(level.status==='done')renderPage('home');
  };
  const currentlyDone=(level.days_log[today]&&level.days_log[today].doneTaskIds.includes(taskId));
  if(currentlyDone){applyToggle(null)}else{maybeSpotCheck(applyToggle)}
}

/* ===================== recovery actions ===================== */
function recoveryAction(goalId,levelId,action){
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);
  if(!goal||!level)return;
  const date=level.recoveryTriggerDate;
  if(action==='pause'){level.status='paused';level.pausedOn=todayKey();level.recoveryEvents.push({date,action,note:'Paused intentionally'});logEvent(goal.id,'Recovery: paused',level.title);save();renderPage('mission');toast('Paused — resume any time, nothing is erased');return}
  level.excusedDates=level.excusedDates||[];level.excusedDates.push(date);
  if(action==='extend')level.days=Number(level.days||0)+1;
  level.recoveryEvents.push({date,action,note:action==='repeat'?'Repeated the day':action==='extend'?'Added a recovery day':'Used the minimum-day standard'});
  level.status='current';level.recoveryTriggerDate=null;
  logEvent(goal.id,'Recovery: '+action,level.title+' · '+date);
  evaluateLevel(goal,level);
  save();renderPage('mission');
  toast('Recovery recorded — you are back on track');
}
function resumeLevel(goalId,levelId){
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);
  if(!goal||!level||level.status!=='paused')return;
  const from=level.pausedOn,today=todayKey();
  level.excusedDates=level.excusedDates||[];
  let cursor=from;while(cursor<=today){if(!level.excusedDates.includes(cursor))level.excusedDates.push(cursor);cursor=addDays(cursor,1)}
  level.status='current';level.pausedOn=null;
  logEvent(goal.id,'Level resumed',level.title);
  evaluateLevel(goal,level);
  save();renderPage('mission');toast('Resumed — the paused days are excused');
}

/* ===================== sunk-cost checkpoint ===================== */
function daysElapsedIn(level){const today=todayKey(),end=addDays(level.startedAt,level.days-1),cap=today<end?today:end;const a=new Date(level.startedAt+'T12:00:00'),b=new Date(cap+'T12:00:00');return Math.max(0,Math.round((b-a)/86400000)+1)}
function checkpointDue(level){return level.status==='current'&&!level.sunkCostCheckpoint.shown&&daysElapsedIn(level)>=Math.ceil(level.days/2)}
function checkpointRespond(goalId,levelId,decision){
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);
  level.sunkCostCheckpoint={shown:true,decision,shownAt:Date.now()};
  if(decision==='downgrade'){const remaining=level.days-daysElapsedIn(level);const cut=Math.max(1,Math.round(remaining*0.5));level.days=daysElapsedIn(level)+cut;toast('Scope downgraded — '+cut+' days left instead of '+remaining)}
  else toast('Recommitted — full scope stays');
  logEvent(goal.id,'Midpoint checkpoint',decision);
  save();renderPage('mission');
}

/* ===================== reward lifecycle ===================== */
function rewardAction(goalId,levelId,action){
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);
  if(action!=='abandoned'&&level.reward.status!=='earned'&&level.reward.status!=='purchased'){toast('Finish this stage before claiming its reward');return}
  level.reward.status=action;logEvent(goal.id,'Reward status changed',action);save();renderPage(document.querySelector('.page.active').id);toast('Reward updated');
}
function depositToFund(goalId,levelId,amount){
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);
  level.reward.fundSaved=Math.max(0,(level.reward.fundSaved||0)+amount);save();renderPage(document.querySelector('.page.active').id);
}

/* ===================== bonus (XP bank) rewards ===================== */
function addBonusReward(goalId){
  const goal=state.goals.find(g=>g.id===goalId);
  const name=prompt('Name this bonus treat');if(!name)return;
  const xpRequired=Number(prompt('Points needed to unlock it','500'))||500;
  goal.bonusRewards.push({id:'b-'+Date.now(),name,xpRequired,claimed:false});
  save();renderPage('vault');
}
function claimBonus(goalId,bonusId){
  const goal=state.goals.find(g=>g.id===goalId),b=goal.bonusRewards.find(x=>x.id===bonusId);
  if(!b||b.claimed)return;if((goal.xpBank||0)<b.xpRequired){toast('Not enough points yet');return}
  b.claimed=true;logEvent(goal.id,'Bonus reward claimed',b.name);save();renderPage('vault');toast('🎉 '+b.name+' claimed with your points');
}

/* ===================== goal CRUD (guided 3-step creator) ===================== */
function switchGoal(id){state.activeGoalId=id;save();renderGoalSelect();go(document.querySelector('.page.active').id==='plan'?'plan':document.querySelector('.page.active').id)}
var nd=null;
function openNewGoal(){nd={step:1,title:'',why:'',type:'Personal',rewardName:'',rewardPrice:'',image:'',taskTitle:'',taskDetail:'',days:7,stakeText:'',stakeAmount:'',referee:''};renderNewGoal()}
function ndTemplate(key){const t=TEMPLATES[key];nd.title=t.title;nd.why=t.why;nd.type=t.type;nd.taskTitle=t.task;nd.taskDetail=t.detail;nd.days=t.days;nd.target=t.target;renderNewGoal()}
function ndNext(){
  if(nd.step===1&&!nd.title.trim())return toast('Give your goal a name first');
  if(nd.step===2&&!nd.rewardName.trim())return toast('Pick a reward — it is what keeps you going');
  if(nd.step===3)return createGoalFromDraft();
  nd.step++;renderNewGoal();
}
function ndImage(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{nd.image=r.result;renderNewGoal()};r.readAsDataURL(f)}
function renderNewGoal(){
  const other=state.activeProfile==='Bhargav'?'Anusha':'Bhargav';
  const bar='<div class="steps">'+[1,2,3].map(i=>'<i class="'+(i<=nd.step?'on':'')+'"></i>').join('')+'</div>';
  let body='';
  if(nd.step===1){
    body='<h2>What do you want to achieve?</h2><div class="sub">Step 1 of 3 · Start from an idea or type your own.</div>'+bar
    +'<div class="chips-row">'+Object.entries(TEMPLATES).map(([k,t])=>'<button class="pick'+(nd.type===t.type&&nd.title===t.title?' on':'')+'" onclick="ndTemplate(\''+k+'\')">'+esc(t.type)+'</button>').join('')+'</div>'
    +'<div class="stack"><div><div class="label">Goal</div><input class="input" id="ndTitle" value="'+esc(nd.title)+'" placeholder="e.g. Run a half marathon" oninput="nd.title=this.value"></div>'
    +'<div><div class="label">Why does this matter to you?</div><textarea class="input" rows="3" placeholder="We will show this back to you on hard days" oninput="nd.why=this.value">'+esc(nd.why)+'</textarea></div></div>';
  }else if(nd.step===2){
    body='<h2>Choose your reward</h2><div class="sub">Step 2 of 3 · Something you really want. You only get it by finishing.</div>'+bar

/* ===================== motivation helpers ===================== */
const RANKS=['Rookie','Starter','Climber','Grinder','Achiever','Champion','Legend'];
function lifetimeXp(){return myGoals().concat(state.archivedGoals.filter(g=>g.profileId===state.activeProfile)).reduce((s,g)=>s+(g.xpBank||0),0)}
function rankInfo(xp){
  const n=Math.floor(Math.sqrt(xp/150))+1,lo=150*(n-1)*(n-1),hi=150*n*n;
  return{n,name:RANKS[Math.min(n-1,RANKS.length-1)],xp,lo,hi,pct:Math.round((xp-lo)/(hi-lo)*100),toNext:hi-xp};
}
function daySatisfied(level,d){const rec=level.days_log[d];return !!((rec&&rec.complete)||(level.excusedDates||[]).includes(d))}
function currentStreak(level){
  if(!level.startedAt)return 0;const today=todayKey();let d=daySatisfied(level,today)?today:addDays(today,-1),n=0;
  while(d>=level.startedAt&&daySatisfied(level,d)){n++;d=addDays(d,-1)}return n;
}
function longestStreak(goals){
  let best=0;
  goals.forEach(g=>g.levels.forEach(l=>{if(!l.startedAt)return;const end=addDays(l.startedAt,l.days-1),stop=end<todayKey()?end:todayKey();let run=0,d=l.startedAt;
    while(d<=stop){const rec=l.days_log[d];if(rec&&rec.complete){run++;best=Math.max(best,run)}else run=0;d=addDays(d,1)}}));
  return best;
}
function satisfiedDays(level){if(!level.startedAt)return 0;const end=addDays(level.startedAt,level.days-1);let d=level.startedAt,n=0;while(d<=end){if(daySatisfied(level,d))n++;d=addDays(d,1)}return n}
function paceInfo(level){
  // Beeminder-style: where you should be vs where you are.
  if(level.status==='done')return{state:'done',text:'Stage complete'};
  if(level.status==='recovery')return{state:'off',text:'Off track — pick a recovery option'};
  if(level.status==='paused')return{state:'pause',text:'Paused'};
  const elapsedBefore=Math.max(0,daysElapsedIn(level)-1);
  let doneBefore=0,d=level.startedAt;while(d<todayKey()&&d<=addDays(level.startedAt,level.days-1)){if(daySatisfied(level,d))doneBefore++;d=addDays(d,1)}
  const behind=elapsedBefore-doneBefore;
  return behind<=0?{state:'on',text:'On track'}:{state:'behind',text:behind+' day'+(behind>1?'s':'')+' behind'};
}
function badgesFor(goals){
  const all=goals.concat(state.archivedGoals.filter(g=>g.profileId===state.activeProfile));
  const ev=state.history.filter(e=>all.some(g=>g.id===e.goalId));
  const has=a=>ev.some(e=>e.action===a);
  const best=longestStreak(all);
  const levels=all.flatMap(g=>g.levels);
  return[
    {i:'🌱',n:'First step',d:'Check off your first task',got:has('Task completed')},
    {i:'🔥',n:'3-day streak',d:'3 perfect days in a row',got:best>=3},
    {i:'⚡',n:'7-day streak',d:'A full perfect week',got:best>=7},
    {i:'💪',n:'14-day streak',d:'Two weeks without a miss',got:best>=14},
    {i:'👑',n:'30-day streak',d:'A whole month',got:best>=30},
    {i:'🛡️',n:'Free pass',d:'Earn a free pass',got:all.some(g=>(g.graceTokens||0)>0)||has('Grace token earned')},
    {i:'🔁',n:'Comeback',d:'Recover from a missed day and keep going',got:levels.some(l=>(l.recoveryEvents||[]).length>0)},
    {i:'🏁',n:'Stage cleared',d:'Finish a whole stage',got:levels.some(l=>l.status==='done')},
    {i:'📷',n:'Proof',d:'Add a photo check-in',got:all.some(g=>(g.photoCheckins||[]).length>0)},
    {i:'🎁',n:'Reward earned',d:'Earn a reward',got:levels.some(l=>['earned','purchased','claimed'].includes(l.reward.status))},
    {i:'🏆',n:'Goal complete',d:'Finish every stage of a goal',got:all.some(g=>g.levels.length&&g.levels.every(l=>l.status==='done'))}
  ];
}
function rewardIsSet(r){return !!(r&&r.name&&r.name!=='Choose the reward')}
function rewardStatusLabel(s){return{committed:'Locked in',locked:'Locked','in-progress':'In progress',earned:'Earned!',purchased:'Purchased',claimed:'Claimed',abandoned:'Given up'}[s]||s}
function deadlineHtml(goal){
  if(!goal.deadline)return '';
  const days=Math.ceil((new Date(goal.deadline+'T23:59:59')-new Date())/86400000);
  const txt=days<0?'Target date passed':days===0?'Target date is today':days+' days until '+formatDate(goal.deadline);
  return '<span class="deadline-pill'+(days<=2?' danger':'')+'">⏰ '+txt+'</span>';

function roadHtml(level){
  const N=Math.max(1,level.days),W=600,H=230,L=34,R=574,T=18,B=200,px=i=>L+(R-L)*i/N,py=v=>B-(B-T)*v/N;
  const elapsed=Math.min(N,daysElapsedIn(level)),today=todayKey();
  let pts=[[0,0]],cum=0;
  for(let i=0;i<elapsed;i++){const d=addDays(level.startedAt,i);if(daySatisfied(level,d))cum++;if(d===today&&!daySatisfied(level,d))break;pts.push([i+1,cum])}
  const path=pts.map((p,i)=>(i?'L':'M')+px(p[0]).toFixed(1)+' '+py(p[1]).toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  let grid='';for(let i=0;i<=N;i+=Math.max(1,Math.ceil(N/7)))grid+='<text x="'+px(i)+'" y="'+(B+16)+'" font-size="10" fill="var(--faint)" text-anchor="middle">'+i+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Road to reward"><line x1="'+L+'" y1="'+B+'" x2="'+R+'" y2="'+B+'" stroke="var(--line)"/><line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+B+'" stroke="var(--line)"/>'
    +'<line x1="'+px(0)+'" y1="'+py(0)+'" x2="'+px(N)+'" y2="'+py(N)+'" stroke="var(--faint)" stroke-width="2" stroke-dasharray="6 6"/>'
    +'<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<circle cx="'+px(last[0]).toFixed(1)+'" cy="'+py(last[1]).toFixed(1)+'" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"/>'
    +'<text x="'+px(N)+'" y="'+(py(N)-8)+'" font-size="20" text-anchor="end">🎁</text>'+grid
    +'<text x="'+(L-6)+'" y="'+(T+4)+'" font-size="10" fill="var(--faint)" text-anchor="end">'+N+'</text><text x="'+(L-6)+'" y="'+(B+4)+'" font-size="10" fill="var(--faint)" text-anchor="end">0</text></svg>';
}

    :'<p class="sub" style="margin-top:0">Write why you will not give up. Once sealed it cannot be edited, so it stays honest.</p><textarea class="input" id="commitNoteInput" rows="3" placeholder="Dear me, on a day you want to quit, remember…"></textarea><button class="btn sm" style="margin-top:8px" onclick="sealCommitNote(\''+goal.id+'\')">Seal this note</button>');
  html+=sec('miles','Milestones','big markers along the way',
    goal.milestones.map(m=>'<div class="grid-3" style="margin-bottom:8px"><input class="input" value="'+esc(m.title)+'" onchange="updateMilestone(\''+goal.id+'\',\''+m.id+'\',\'title\',this.value)"><input class="input" value="'+esc(m.criteria)+'" onchange="updateMilestone(\''+goal.id+'\',\''+m.id+'\',\'criteria\',this.value)"><div style="display:flex;gap:6px"><select class="input" onchange="updateMilestone(\''+goal.id+'\',\''+m.id+'\',\'status\',this.value)">'+['upcoming','active','complete'].map(s=>'<option '+(m.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn danger sm" onclick="deleteMilestone(\''+goal.id+'\',\''+m.id+'\')">×</button></div></div>').join('')
    +'<button class="btn soft sm" onclick="addMilestone(\''+goal.id+'\')">+ Add milestone</button>');
  html+=sec('prep','Reminders & preparation','',
    '<div class="grid-2"><div style="grid-column:1/-1"><div class="label">Get ready checklist</div><textarea class="input" id="gPrep" rows="3">'+esc(goal.prepChecklist)+'</textarea></div>'
    +field('Daily reminder time','gReminder',goal.reminderTime,'time')+selectField('Weekly check-in day','gReviewDay',['Sunday','Monday','Friday','Saturday'],goal.reviewDay)+'</div>');
  $('plan').innerHTML=html;
  $('plan').querySelectorAll('details.sec').forEach(d=>d.addEventListener('toggle',()=>{d.open?openSecs.add(d.dataset.k):openSecs.delete(d.dataset.k)}));
  wireEditorInputs(goal);
}
function levelEditorCard(goal,level,i){
  const suggestion=level.difficultySuggestion,isCur=level.id===currentLevel(goal).id;
  return '<div class="card" style="'+(isCur?'border-color:var(--accent)':'')+'">'
    +'<div class="head"><div><div class="eyebrow">Stage '+(i+1)+(isCur?' · now':'')+'</div><h3 style="margin:4px 0">'+esc(level.title)+'</h3><p class="sub" style="margin:0">'+level.days+' days · '+level.tasks.length+' task'+(level.tasks.length>1?'s':'')+' · '+levelProgress(level)+'% · '+({current:'active',done:'complete',recovery:'needs recovery',paused:'paused',upcoming:'not started'}[level.status]||level.status)+'</p></div>'+(goal.levels.length>1?'<button class="btn danger sm" onclick="deleteLevel(\''+goal.id+'\',\''+level.id+'\')">Delete stage</button>':'')+'</div>'
    +(suggestion?'<div class="checkpoint-banner"><b>Tip for the next stage:</b> '+esc(suggestion.note)+' ('+suggestion.days+' days)</div>':'')
    +'<div class="grid-2">'+field('Stage name','lvTitle-'+level.id,level.title)+field('Days to complete','lvDays-'+level.id,level.days,'number')
    +'<div class="re-field" style="grid-column:1/-1"><div class="label">The rule</div><textarea class="input" id="lvRule-'+level.id+'" rows="2">'+esc(level.rule)+'</textarea></div>'
    +'<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);grid-column:1/-1"><input type="checkbox" id="lvShared-'+level.id+'" '+(level.shared?'checked':'')+'> Shared stage — both of you complete your own tasks each day</label></div>'
    +'<div class="head" style="margin-top:14px"><h3 style="font-size:15px">Daily tasks</h3><button class="btn soft sm" onclick="addTask(\''+goal.id+'\',\''+level.id+'\')">+ Add task</button></div>'
    +level.tasks.map(t=>taskEditorHtml(goal,level,t)).join('')
    +'<div class="head" style="margin-top:14px"><h3 style="font-size:15px">🎁 Reward for this stage</h3></div>'+rewardEditorHtml(goal,level)+'</div>';
}
function taskEditorHtml(goal,level,t){
  const dayBtns=t.frequency==='selected'?'<div class="chips-row" style="grid-column:1/-1">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((n,d)=>'<label class="pick'+((t.selectedDays||[]).includes(d)?' on':'')+'" style="cursor:pointer"><input type="checkbox" style="display:none" data-sd="'+t.id+'" data-d="'+d+'" '+((t.selectedDays||[]).includes(d)?'checked':'')+'>'+n+'</label>').join('')+'</div>':'';
  return '<div class="task-editor" data-task="'+t.id+'"><div class="grid-3" style="grid-template-columns:2fr 1fr auto;align-items:end">'+field('Task','tt-'+t.id,t.title)+field('Points','tx-'+t.id,t.xp,'number')+'<button class="btn danger sm" onclick="deleteTask(\''+goal.id+'\',\''+level.id+'\',\''+t.id+'\')">Delete</button></div>'
    +'<div style="margin-top:10px">'+field('Details (what counts as done)','td-'+t.id,t.detail)+'</div>'
    +'<details class="more"><summary>More options</summary><div class="grid-2" style="margin-top:8px">'
    +field('Time of day','tm-'+t.id,t.time)+field('Minutes','tu-'+t.id,t.duration,'number')
    +selectField('Importance','tp-'+t.id,['Critical','High','Normal','Low'],t.priority)
    +selectField('How often','tf-'+t.id,[['daily','Every day'],['weekdays','Weekdays'],['selected','Chosen days'],['once','One time']],t.frequency)+dayBtns
    +selectField('Needs approval from','tr-'+t.id,[['','Nobody'],['Bhargav','Bhargav'],['Anusha','Anusha']],t.peer)
    +field('Small version for a hard day','tn-'+t.id,t.minimum)
    +'<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);grid-column:1/-1"><input type="checkbox" id="tphoto-'+t.id+'" '+(t.requiresPhoto?'checked':'')+'> Ask for a photo as proof when done</label></div>'
    +'<button class="btn ghost sm" style="margin-top:8px" onclick="openFocus(\''+goal.id+'\',\''+level.id+'\',\''+t.id+'\')">⏱ Try the focus timer</button></details></div>';
}
function rewardEditorHtml(goal,level){
  const r=level.reward;
  return '<div class="reward-edit"><div class="grid-2">'+field('Reward','rn-'+level.id,rewardIsSet(r)?r.name:'')+field('Price ($)','rp-'+level.id,r.price||'','number')
    +'<div style="grid-column:1/-1">'+field('Link to it (optional)','ru-'+level.id,r.url)+'</div></div>'
    +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+(r.image?'<div style="width:64px;height:64px;border-radius:12px;background:url(\''+r.image.replace(/\'/g,'%27')+'\') center/cover"></div>':'')
    +'<label class="btn ghost sm" style="cursor:pointer">'+(r.image?'Change picture':'Add a picture')+'<input type="file" accept="image/*" style="display:none" onchange="uploadRewardImage(\''+goal.id+'\',\''+level.id+'\',this)"></label><span class="hint">A clear picture makes you want it more.</span></div></div>';
}
function wireEditorInputs(goal){
  const bind=(id,obj,key,num)=>{const el=$(id);if(!el)return;el.addEventListener('input',()=>{obj[key]=num?Number(el.value)||0:el.value;save()})};
  bind('gTitle',goal,'title');bind('gType',goal,'type');bind('gDescription',goal,'description');bind('gWhy',goal,'why');bind('gStarting',goal,'startingPoint');bind('gTarget',goal,'target');bind('gDeadline',goal,'deadline');bind('gPriority',goal,'priority');bind('gPrep',goal,'prepChecklist');bind('gReminder',goal,'reminderTime');bind('gReviewDay',goal,'reviewDay');
  ['gTitle'].forEach(id=>{const el=$(id);if(el)el.addEventListener('input',()=>renderGoalSelect())});
  goal.stake=goal.stake||{text:'',amount:0,referee:''};
  bind('gStakeText',goal.stake,'text');bind('gStakeAmt',goal.stake,'amount',true);bind('gReferee',goal.stake,'referee');
  goal.levels.forEach(level=>{
    bind('lvTitle-'+level.id,level,'title');bind('lvDays-'+level.id,level,'days',true);bind('lvRule-'+level.id,level,'rule');
    const sh=$('lvShared-'+level.id);if(sh)sh.addEventListener('change',()=>{level.shared=sh.checked;save()});
    level.tasks.forEach(t=>{
      bind('tt-'+t.id,t,'title');bind('tx-'+t.id,t,'xp',true);bind('td-'+t.id,t,'detail');bind('tm-'+t.id,t,'time');bind('tu-'+t.id,t,'duration',true);bind('tp-'+t.id,t,'priority');bind('tr-'+t.id,t,'peer');bind('tn-'+t.id,t,'minimum');
      const tf=$('tf-'+t.id);if(tf)tf.addEventListener('change',()=>{t.frequency=tf.value;if(t.frequency==='selected'&&!(t.selectedDays||[]).length)t.selectedDays=[1,2,3,4,5];save();renderEditor();const m=$('plan').querySelector('[data-task="'+t.id+'"] details.more');if(m)m.open=true});
      document.querySelectorAll('[data-sd="'+t.id+'"]').forEach(cb=>cb.addEventListener('change',()=>{const d=Number(cb.dataset.d),set=new Set(t.selectedDays||[]);cb.checked?set.add(d):set.delete(d);t.selectedDays=[...set].sort();cb.parentElement.classList.toggle('on',cb.checked);save()}));
      const ph=$('tphoto-'+t.id);if(ph)ph.addEventListener('change',()=>{t.requiresPhoto=ph.checked;save()});
    });
    bind('rn-'+level.id,level.reward,'name');bind('rp-'+level.id,level.reward,'price',true);bind('ru-'+level.id,level.reward,'url');
  });
}
function addTask(goalId,levelId){const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);level.tasks.push(freshTask());save();renderEditor();toast('Task added')}
function deleteTask(goalId,levelId,taskId){const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);level.tasks=level.tasks.filter(t=>t.id!==taskId);save();renderEditor();toast('Task deleted')}
function uploadRewardImage(goalId,levelId,input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);level.reward.image=r.result;save();renderEditor();toast('Picture saved')};r.readAsDataURL(f)}
function addLevel(goalId){
  const goal=state.goals.find(g=>g.id===goalId),prev=goal.levels[goal.levels.length-1];
  const suggestion=prev&&prev.difficultySuggestion;
  const carried=prev?prev.tasks.map(t=>freshTask({title:t.title,detail:t.detail,xp:t.xp,frequency:t.frequency,priority:t.priority})):[];
  const nl=freshLevel({title:'Stage '+(goal.levels.length+1),days:suggestion?suggestion.days:7,tasks:carried.length?carried:[freshTask()]});
  goal.levels.push(nl);save();renderEditor();toast(suggestion?'Stage added using the suggested length':'Stage added with your tasks carried forward');
}
function deleteLevel(goalId,levelId){
  if(!confirm('Delete this stage and its reward?'))return;
  const goal=state.goals.find(g=>g.id===goalId),idx=goal.levels.findIndex(l=>l.id===levelId);
  goal.levels.splice(idx,1);goal.currentLevelIndex=Math.min(goal.currentLevelIndex,goal.levels.length-1);
  if(!goal.levels.some(l=>l.status==='current')&&goal.levels[goal.currentLevelIndex]){goal.levels[goal.currentLevelIndex].status='current';goal.levels[goal.currentLevelIndex].startedAt=goal.levels[goal.currentLevelIndex].startedAt||todayKey()}
  save();renderEditor();toast('Stage deleted');
}
function createFromTemplate(key){
  const t=TEMPLATES[key];
  const g=freshGoal({title:t.title,description:t.description,type:t.type,why:t.why,target:t.target});
  g.levels=[freshLevel({title:'Stage 1',days:t.days,status:'current',startedAt:todayKey(),tasks:[freshTask({title:t.task,detail:t.detail})]})];
  state.goals.push(g);state.activeGoalId=g.id;
  save();closeModal();renderGoalSelect();go('plan');toast(t.type+' idea loaded. Add your reward below.');
}

/* ===================== profile + live Hub look ===================== */
let lookUnsubs=[];
function applyLook(name){
  if(!window.HubTheme)return;
  HubTheme.applyHubTheme(name,{base:'--accent',deep:'--accent-deep',soft:'--accent-soft'}).then(sh=>{document.documentElement.style.setProperty('--on-accent',HubTheme.readableOn(sh.accent))}).catch(()=>{});
  HubTheme.applyHubAppearance(name).catch(()=>{});
}
function watchLook(name){
  lookUnsubs.forEach(f=>{try{f()}catch(e){}});lookUnsubs=[];applyLook(name);
  try{
    const u=firebase.auth().currentUser;if(!u)return;const fs=firebase.firestore();
    const refs=[fs.collection('users').doc(u.uid).collection('hub-profiles').doc(name).collection('data').doc('appearance'),fs.collection('users').doc(u.uid).collection('apps').doc('hub').collection('data').doc('theme-accents')];
    refs.forEach(r=>{let first=true;lookUnsubs.push(r.onSnapshot(()=>{if(first){first=false;return}applyLook(name)},()=>{}))});
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state)applyLook(state.activeProfile)});
function setProfile(name){
  state.activeProfile=name;
  if(!myGoals().some(g=>g.id===state.activeGoalId))state.activeGoalId=myGoals()[0]?myGoals()[0].id:null;
  save();
  $('profileBhargav').classList.toggle('active',name==='Bhargav');$('profileAnusha').classList.toggle('active',name==='Anusha');
  watchLook(name);
  renderGoalSelect();go(document.querySelector('.page.active').id);
}
function wire(){
  $('profileBhargav').classList.toggle('active',state.activeProfile==='Bhargav');
  $('profileAnusha').classList.toggle('active',state.activeProfile==='Anusha');
}
auth.onAuthStateChanged(async u=>{if(!u){if(window.self!==window.top)return;location.href='../index.html';return}user=u;try{await load();wire();$('shell').style.visibility='visible';$('loading').style.display='none';$('syncLabel').textContent='Saved to cloud';$('syncDot').classList.add('on');go('today');watchLook(state.activeProfile)}catch(e){$('loadingText').textContent='Your goals could not load. Refresh to try again.';console.error(e)}})
}
</script>
</body></html>
