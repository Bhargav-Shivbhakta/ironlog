    milestones:[],commitNote:'',commitNoteSealedAt:null,
    graceTokens:0,perfectDayStreak:0,xpBank:0,bonusRewards:[],

  },over||{});

function fresh(){return{version:2,activeProfile:'Bhargav',activeGoalId:null,goals:[],archivedGoals:[],history:[],reviews:{}}}

async function load(){
  const snap=await doc('state').get();
  state=snap.exists?JSON.parse(snap.data().json):null;
  if(!state||!state.goals){state=fresh()}
  const qp=new URLSearchParams(location.search).get('profile');
  state.activeProfile=qp==='Anusha'||qp==='Bhargav'?qp:(state.activeProfile||'Bhargav');
  // No auto-created blank goal: every screen already has an empty-state
  // prompting "+ New goal", so a first-time open starts genuinely empty
  // instead of leaving an unwanted "New operation" cluttering the switcher.
  if(state.activeGoalId&&!state.goals.some(g=>g.id===state.activeGoalId))state.activeGoalId=null;
  if(!state.activeGoalId){const mine=state.goals.find(g=>g.profileId===state.activeProfile);if(mine)state.activeGoalId=mine.id}
  state.goals.forEach(g=>evaluateGoal(g));
}

function myGoals(){return state.goals.filter(g=>g.profileId===state.activeProfile)}
function activeGoal(){return state.goals.find(g=>g.id===state.activeGoalId)||myGoals()[0]}
function currentLevel(g){return g.levels[g.currentLevelIndex]||g.levels[g.levels.length-1]}
function levelProgress(l){const done=l.tasks.filter(t=>t.doneOnce||dayHasTask(l,todayKey(),t.id)).length;const total=l.tasks.length;if(!total)return 0;
  // overall level progress = days with a fully-complete log / total days (more meaningful than today's checklist alone)
  const end=addDays(l.startedAt||todayKey(),l.days-1);let doneDays=0,cursor=l.startedAt||todayKey();
  while(cursor<=end){const rec=l.days_log[cursor];if((rec&&rec.complete)||(l.excusedDates||[]).includes(cursor))doneDays++;cursor=addDays(cursor,1)}
  return Math.min(100,Math.round(doneDays/l.days*100));
}
function dayHasTask(level,dateKey,taskId){const rec=level.days_log[dateKey];return !!(rec&&rec.doneTaskIds&&rec.doneTaskIds.includes(taskId))}
function logEvent(goalId,action,detail){state.history.unshift({id:Date.now()+Math.random(),date:new Date().toISOString(),goalId,action,detail});state.history=state.history.slice(0,400)}

/* ===================== task due-today logic ===================== */
function taskDueToday(task,dateKey){
  if(task.frequency==='once')return !task.doneOnce;
  if(task.frequency==='weekdays'){const d=dowOf(dateKey);return d>=1&&d<=5}
  if(task.frequency==='selected')return (task.selectedDays||[]).includes(dowOf(dateKey));
  return true;
}
function dueTasksFor(level,dateKey){return level.tasks.filter(t=>taskDueToday(t,dateKey))}

/* ===================== grace tokens ===================== */
function accrueGrace(goal){
  if(goal.perfectDayStreak>0&&goal.perfectDayStreak%7===0){goal.graceTokens=(goal.graceTokens||0)+1;logEvent(goal.id,'Grace token earned','7 perfect days in a row');toast('🛡️ Grace token earned — a free pass for one missed day');}
}

/* ===================== evaluation / recovery engine =====================
   Walks every fully-elapsed day of the current level's period. A day
   counts as satisfied if its log is complete, OR the date is in
   excusedDates (recovery actions, pause-resume, or an auto-spent grace
   token all funnel through here). The first unsatisfied day either
   silently consumes a grace token (if any are banked) or flips the level
   into 'recovery' and waits for a manual choice. Nothing is ever
   silently deleted — every excuse is logged. */
function evaluateLevel(goal,level){
  if(level.status!=='current')return;
  const today=todayKey(),end=addDays(level.startedAt,level.days-1);
  const lastCheck=today<=end?addDays(today,-1):end;
  let cursor=level.startedAt;
  while(cursor<=lastCheck){
    const excused=(level.excusedDates||[]).includes(cursor);
    const rec=level.days_log[cursor];
    if(!excused&&!(rec&&rec.complete)){
      if((goal.graceTokens||0)>0){
        goal.graceTokens--;
        level.excusedDates=level.excusedDates||[];level.excusedDates.push(cursor);
        logEvent(goal.id,'Grace token auto-spent',cursor+' was about to break the streak');
        cursor=addDays(cursor,1);continue;
      }
      level.status='recovery';level.recoveryTriggerDate=cursor;return;
    }
    cursor=addDays(cursor,1);
  }
  if(today>end){
    level.status='done';
    if(level.reward.status==='committed'||level.reward.status==='in-progress')level.reward.status='earned';
    computeDifficultySuggestion(level);
    logEvent(goal.id,'Level completed',level.title);
    advanceGoal(goal);
  }
}
function evaluateGoal(goal){(goal.levels||[]).forEach(l=>evaluateLevel(goal,l))}
function computeDifficultySuggestion(level){
  const n=(level.recoveryEvents||[]).length;
  if(n===0)level.difficultySuggestion={days:Math.max(level.days,Math.round(level.days*1.3)),note:'Perfect run — raise the bar. Suggested a longer next level.'};
  else if(n<=2)level.difficultySuggestion={days:level.days,note:'Solid run with a couple of recoveries — keep the same length next.'};
  else level.difficultySuggestion={days:Math.max(3,Math.round(level.days*0.7)),note:'Several recoveries — suggested a shorter level next to rebuild momentum.'};
}
function advanceGoal(goal){
  const next=goal.levels[goal.currentLevelIndex+1];
  if(next){goal.currentLevelIndex++;next.status='current';next.startedAt=todayKey();}
  else{toast('🏆 '+goal.title+' — the whole ladder is climbed!');logEvent(goal.id,'Ladder complete','Every level finished');}
}

/* ===================== checklist interaction ===================== */
function recordPerfectStreak(goal,level,dateKey,wasComplete){
  if(!wasComplete)return;
  const yest=addDays(dateKey,-1);
  const prevOk=(level.days_log[yest]&&level.days_log[yest].complete)||(level.excusedDates||[]).includes(yest)||dateKey===level.startedAt;
  goal.perfectDayStreak=prevOk?(goal.perfectDayStreak||0)+1:1;
  accrueGrace(goal);
}
function maybeSpotCheck(cb){
  if(Math.random()<0.2){openSpotCheck(cb)}else cb(null);
}
function toggleTask(goalId,levelId,taskId){
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId),task=level.tasks.find(t=>t.id===taskId);
  if(!goal||!level||!task||level.status!=='current')return;
  const today=todayKey();
  if(!dueTasksFor(level,today).some(t=>t.id===taskId))return;
  const applyToggle=(note)=>{
    level.days_log[today]=level.days_log[today]||{doneTaskIds:[],complete:false,spotCheckNotes:{}};
    const rec=level.days_log[today];
    const idx=rec.doneTaskIds.indexOf(taskId);
    const turningOn=idx===-1;
    if(turningOn){rec.doneTaskIds.push(taskId);if(note)rec.spotCheckNotes[taskId]=note;if(task.frequency==='once')task.doneOnce=true;goal.xpBank=(goal.xpBank||0)+(task.xp||0);
      if(task.requiresPhoto){openPhotoCheckin(goal.id,level.id,taskId);}
    }else{rec.doneTaskIds.splice(idx,1);if(task.frequency==='once')task.doneOnce=false;goal.xpBank=Math.max(0,(goal.xpBank||0)-(task.xp||0));}
    const due=dueTasksFor(level,today);
    rec.complete=due.length>0&&due.every(t=>rec.doneTaskIds.includes(t.id));
    recordPerfectStreak(goal,level,today,rec.complete);
    logEvent(goal.id,turningOn?'Task completed':'Task reopened',task.title);
    evaluateLevel(goal,level);
    save();renderPage(document.querySelector('.page.active').id);
    if(level.status==='done')renderPage('home');
  };
  const currentlyDone=(level.days_log[today]&&level.days_log[today].doneTaskIds.includes(taskId));
  if(currentlyDone){applyToggle(null)}else{maybeSpotCheck(applyToggle)}
}

/* ===================== recovery actions ===================== */
function recoveryAction(goalId,levelId,action){
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);
  if(!goal||!level)return;
  const date=level.recoveryTriggerDate;
  if(action==='pause'){level.status='paused';level.pausedOn=todayKey();level.recoveryEvents.push({date,action,note:'Paused intentionally'});logEvent(goal.id,'Recovery: paused',level.title);save();renderPage('mission');toast('Order paused — resume any time, the gap stays visible, never erased');return}
  level.excusedDates=level.excusedDates||[];level.excusedDates.push(date);
  if(action==='extend')level.days=Number(level.days||0)+1;
  level.recoveryEvents.push({date,action,note:action==='repeat'?'Repeated the day':action==='extend'?'Added a recovery day':'Used the minimum-day standard'});
  level.status='current';level.recoveryTriggerDate=null;
  logEvent(goal.id,'Recovery: '+action,level.title+' · '+date);
  evaluateLevel(goal,level);
  save();renderPage('mission');
  toast('Recovery recorded — the ladder continues');
}
function resumeLevel(goalId,levelId){
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);
  if(!goal||!level||level.status!=='paused')return;
  const from=level.pausedOn,today=todayKey();
  level.excusedDates=level.excusedDates||[];
  let cursor=from;while(cursor<=today){if(!level.excusedDates.includes(cursor))level.excusedDates.push(cursor);cursor=addDays(cursor,1)}
  level.status='current';level.pausedOn=null;
  logEvent(goal.id,'Level resumed',level.title);
  evaluateLevel(goal,level);
  save();renderPage('mission');toast('Resumed — the paused days are excused, not counted against you');
}

/* ===================== sunk-cost checkpoint ===================== */
function daysElapsedIn(level){const today=todayKey(),end=addDays(level.startedAt,level.days-1),cap=today<end?today:end;const a=new Date(level.startedAt+'T12:00:00'),b=new Date(cap+'T12:00:00');return Math.max(0,Math.round((b-a)/86400000)+1)}
function checkpointDue(level){return level.status==='current'&&!level.sunkCostCheckpoint.shown&&daysElapsedIn(level)>=Math.ceil(level.days/2)}
function checkpointRespond(goalId,levelId,decision){
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);
  level.sunkCostCheckpoint={shown:true,decision,shownAt:Date.now()};
  if(decision==='downgrade'){const remaining=level.days-daysElapsedIn(level);const cut=Math.max(1,Math.round(remaining*0.5));level.days=daysElapsedIn(level)+cut;toast('Scope downgraded — '+cut+' days left instead of '+remaining)}
  else toast('Recommitted — full scope stays');
  logEvent(goal.id,'Midpoint checkpoint',decision);
  save();renderPage('mission');
}

/* ===================== reward lifecycle ===================== */
function rewardAction(goalId,levelId,action){
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);
  if(action!=='abandoned'&&level.reward.status!=='earned'&&level.reward.status!=='purchased'){toast('Finish this level before claiming its reward');return}
  level.reward.status=action;logEvent(goal.id,'Reward status changed',action);save();renderPage(document.querySelector('.page.active').id);toast('Reward status updated');
}
function depositToFund(goalId,levelId,amount){
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);
  level.reward.fundSaved=Math.max(0,(level.reward.fundSaved||0)+amount);save();renderPage(document.querySelector('.page.active').id);
}

/* ===================== bonus (XP bank) rewards ===================== */
function addBonusReward(goalId){
  const goal=state.goals.find(g=>g.id===goalId);
  const name=prompt('Name this bonus reward');if(!name)return;
  const xpRequired=Number(prompt('XP required to unlock it','500'))||500;
  goal.bonusRewards.push({id:'b-'+Date.now(),name,xpRequired,claimed:false});
  save();renderPage('vault');
}
function claimBonus(goalId,bonusId){
  const goal=state.goals.find(g=>g.id===goalId),b=goal.bonusRewards.find(x=>x.id===bonusId);
  if(!b||b.claimed)return;if((goal.xpBank||0)<b.xpRequired){toast('Not enough XP banked yet');return}
  b.claimed=true;logEvent(goal.id,'Bonus reward claimed',b.name);save();renderPage('vault');toast('🎉 '+b.name+' claimed from the XP bank');
}

function switchGoal(id){state.activeGoalId=id;save();renderGoalSelect();go(document.querySelector('.page.active').id)}
function openNewGoal(){
  $('modal').innerHTML='<div class="modal-wrap"><div class="modal"><div class="head"><div><h2>New operation</h2><div class="sub">Start blank or load a template, then refine it in the Command desk.</div></div><button class="btn ghost sm" onclick="closeModal()">×</button></div>'
    +'<div><div class="label">Operation name</div><input class="input" id="ngTitle" placeholder="e.g. Run a half marathon"></div>'
    +'<div class="template-row">'+Object.entries(TEMPLATES).map(([k,t])=>'<button class="btn soft sm" onclick="createFromTemplate(\''+k+'\')">'+esc(t.type)+' template</button>').join('')+'</div>'

}
function createBlankGoal(){
  const title=$('ngTitle').value.trim()||'New operation';
  const g=freshGoal({title});state.goals.push(g);state.activeGoalId=g.id;
  save();closeModal();renderGoalSelect();go('editor');toast('Operation created — define the work in the Command desk');
}
function createFromTemplate(key){
  const t=TEMPLATES[key];
  const g=freshGoal({title:t.title,description:t.description,type:t.type,why:t.why,target:t.target});
  g.levels=[freshLevel({title:'Foundation',days:t.days,status:'current',startedAt:todayKey(),tasks:[freshTask({title:t.task,detail:t.detail})]})];
  state.goals.push(g);state.activeGoalId=g.id;
  save();closeModal();renderGoalSelect();go('home');toast(t.type+' template loaded');
}
function archiveGoal(goalId){
  if(!confirm('Archive this operation? Its history and levels stay, just out of the active list.'))return;
  const idx=state.goals.findIndex(g=>g.id===goalId),g=state.goals[idx];
  g.status='archived';state.archivedGoals.push(g);state.goals.splice(idx,1);
  if(!myGoals().length){const fresh2=freshGoal({});state.goals.push(fresh2);state.activeGoalId=fresh2.id}
  else state.activeGoalId=myGoals()[0].id;
  save();renderGoalSelect();go('home');toast('Operation archived');
}

function addMilestone(goalId){
  const goal=state.goals.find(g=>g.id===goalId);
  goal.milestones.push({id:'m-'+Date.now(),title:'New milestone',criteria:'Define the exit condition',status:'upcoming'});
  save();renderPage('editor');
}
function updateMilestone(goalId,mid,field,value){
  const goal=state.goals.find(g=>g.id===goalId),m=goal.milestones.find(x=>x.id===mid);
  m[field]=value;save();
}
function deleteMilestone(goalId,mid){const goal=state.goals.find(g=>g.id===goalId);goal.milestones=goal.milestones.filter(x=>x.id!==mid);save();renderPage('editor')}

/* ===================== commit note ===================== */
function sealCommitNote(goalId){
  const goal=state.goals.find(g=>g.id===goalId),val=$('commitNoteInput').value.trim();
  if(!val)return toast('Write the note before sealing it');
  goal.commitNote=val;goal.commitNoteSealedAt=Date.now();

  $('modal').innerHTML='<div class="modal-wrap"><div class="modal"><div class="head"><div><h2>Quick spot-check</h2><div class="sub">Random integrity check — one line on what you actually did.</div></div></div><textarea class="input" id="spotCheckNote" placeholder="What did you actually do?" rows="3"></textarea><div class="modal-actions"><button class="btn gold" onclick="submitSpotCheck()">Confirm and check off</button></div></div></div>';

/* ===================== photo check-in ===================== */
function openPhotoCheckin(goalId,levelId,taskId){
  $('modal').innerHTML='<div class="modal-wrap"><div class="modal"><div class="head"><div><h2>Progress photo</h2><div class="sub">Optional — attach today’s check-in photo to the timeline.</div></div></div><input type="file" accept="image/*" class="input" id="photoFileInput"><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Skip</button><button class="btn gold" onclick="savePhotoCheckin(\''+goalId+'\',\''+levelId+'\',\''+taskId+'\')">Attach photo</button></div></div></div>';

function savePhotoCheckin(goalId,levelId,taskId){
  const file=$('photoFileInput').files[0];
  if(!file){closeModal();return}
  const reader=new FileReader();
  reader.onload=()=>{
    const goal=state.goals.find(g=>g.id===goalId);

    save();closeModal();renderPage(document.querySelector('.page.active').id);toast('Photo added to the timeline');
  };

/* ===================== focus timer ===================== */
let focusInterval=null,focusSeconds=0;
function openFocus(goalId,levelId,taskId){
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId),task=level.tasks.find(t=>t.id===taskId);
  focusSeconds=(Number(task.duration)||25)*60;
  $('focusHost').innerHTML='<div class="focus-overlay" id="focusOverlay"><div class="focus-dialog"><button class="focus-close" onclick="closeFocus()">×</button><div class="eyebrow2">Focus mode</div><h2 style="margin:10px 0 4px">'+esc(task.title)+'</h2><p style="color:#C9C7D6;font-size:12px">'+esc(task.detail||'')+'</p><div class="focus-timer" id="focusTimer">'+pad2(Math.floor(focusSeconds/60))+':'+pad2(focusSeconds%60)+'</div><div class="modal-actions" style="justify-content:center"><button class="btn gold" id="focusStartBtn" onclick="startFocusTimer()">Start timer</button><button class="btn" onclick="completeFocusTask(\''+goalId+'\',\''+levelId+'\',\''+taskId+'\')">Complete task</button></div></div></div>';
  logEvent(goalId,'Focus opened',task.title);
}
function startFocusTimer(){
  clearInterval(focusInterval);
  const tick=()=>{const el=$('focusTimer');if(!el)return;el.textContent=pad2(Math.floor(focusSeconds/60))+':'+pad2(focusSeconds%60);if(focusSeconds<=0){clearInterval(focusInterval);toast('Focus session complete')}else focusSeconds--};
  tick();focusInterval=setInterval(tick,1000);toast('Focus session started');
}
function closeFocus(){clearInterval(focusInterval);$('focusHost').innerHTML=''}
function completeFocusTask(goalId,levelId,taskId){
  closeFocus();
  const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId),today=todayKey();
  const alreadyDone=level.days_log[today]&&level.days_log[today].doneTaskIds.includes(taskId);
  if(!alreadyDone)toggleTask(goalId,levelId,taskId);
}

/* ===================== export / import / calendar / print / reminder ===================== */
function exportBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='pledge-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importBackup(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const parsed=JSON.parse(r.result);if(!parsed.goals)throw new Error('bad file');state=parsed;save();renderGoalSelect();go('home');toast('Backup imported')}catch(e){toast('Import failed: invalid backup file')}};
  r.readAsText(f);
}
function exportCalendar(goal,level){
  const start=new Date();
  const rows=level.tasks.map((t,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const day=d.toISOString().slice(0,10).replace(/-/g,'');return'BEGIN:VEVENT\nUID:pledge-'+Date.now()+'-'+i+'\nDTSTAMP:'+day+'T080000Z\nDTSTART:'+day+'T080000\nSUMMARY:'+(t.title||'Task').replace(/[;,]/g,'')+'\nDESCRIPTION:'+(t.detail||'').replace(/[;,]/g,'')+'\nEND:VEVENT'}).join('\n');
  const blob=new Blob(['BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Pledge//Goals//EN\n'+rows+'\nEND:VCALENDAR'],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pledge-order.ics';a.click();URL.revokeObjectURL(a.href);toast('Calendar file exported');
}
function requestReminder(){if('Notification' in window){Notification.requestPermission().then(x=>toast(x==='granted'?'Reminder permission granted.':'Reminder permission not granted.'))}else toast('Browser reminders are unavailable here.')}
function printReport(){window.print()}

/* ===================== weekly review ===================== */
function saveReview(goalId){
  const worked=$('reviewWorked').value,friction=$('reviewFriction').value,changes=$('reviewChanges').value;
  state.reviews[goalId]=state.reviews[goalId]||[];
  state.reviews[goalId].unshift({worked,friction,changes,savedAt:Date.now()});
  logEvent(goalId,'After-action review saved','Weekly review recorded');
  save();renderPage('review');toast('Review saved');
}

/* ===================== nav / render dispatch ===================== */
function go(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===page));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  const titles={home:'The operation',editor:'The command desk',mission:"Today's order",war:'The war room',vault:'The vault',review:'After-action review'};
  const subs={home:'Pick the work. Pick the reward. Climb the ladder.',editor:'Every field is saved automatically and can be changed later.',mission:'Complete every requirement honestly.',war:'Every active operation, side by side.',vault:'Every reward, tied to the level that earns it.',review:'Improve the system using what actually happened.'};
  $('pageTitle').textContent=titles[page];$('pageSub').textContent=subs[page];
  renderPage(page);
}
function renderPage(page){state.goals.forEach(g=>evaluateGoal(g));renderGoalSelect();
  if(page==='home')renderHome();else if(page==='editor')renderEditor();else if(page==='mission')renderMission();else if(page==='war')renderWar();else if(page==='vault')renderVault();else if(page==='review')renderReview();
}

function rewardStatusLabel(s){return{committed:'COMMITTED',locked:'LOCKED','in-progress':'IN PROGRESS',earned:'EARNED',purchased:'PURCHASED',claimed:'CLAIMED',abandoned:'ABANDONED'}[s]||s.toUpperCase()}
function deadlineHtml(goal){
  if(!goal.deadline)return '<div class="deadline-pill">No deadline set — add one in the Command desk</div>';
  const days=Math.ceil((new Date(goal.deadline+'T23:59:59')-new Date())/86400000);
  const txt=days<0?'Deadline passed — choose a recovery action':days===0?'Deadline is today':days+' days remaining until '+formatDate(goal.deadline);
  return '<div class="deadline-pill'+(days<=2?' danger':'')+'">⏰ '+txt+'</div>';
}

function rewardEditorHtml(goal,level){
  const r=level.reward;
  return '<div class="reward-banner" style="background:#FAFAF7;color:var(--ink);border-color:var(--line)"><div style="display:grid;gap:8px;grid-column:1/-1">'

    +'</div></div>';

function wireEditorInputs(goal){
  const bind=(id,obj,key,num)=>{const el=$(id);if(!el)return;el.addEventListener('input',()=>{obj[key]=num?Number(el.value)||0:el.value;save()})};
  bind('gTitle',goal,'title');bind('gType',goal,'type');bind('gDescription',goal,'description');bind('gWhy',goal,'why');bind('gStarting',goal,'startingPoint');bind('gTarget',goal,'target');bind('gDeadline',goal,'deadline');bind('gPriority',goal,'priority');bind('gPrep',goal,'prepChecklist');bind('gReminder',goal,'reminderTime');bind('gReviewDay',goal,'reviewDay');
  ['gTitle','gDescription'].forEach(id=>{const el=$(id);if(el)el.addEventListener('input',()=>renderGoalSelect())});
  goal.levels.forEach(level=>{
    bind('lvTitle-'+level.id,level,'title');bind('lvDays-'+level.id,level,'days',true);bind('lvRule-'+level.id,level,'rule');
    const sh=$('lvShared-'+level.id);if(sh)sh.addEventListener('change',()=>{level.shared=sh.checked;save()});
    level.tasks.forEach(t=>{
      bind('tt-'+t.id,t,'title');bind('tx-'+t.id,t,'xp',true);bind('td-'+t.id,t,'detail');bind('tm-'+t.id,t,'time');bind('tu-'+t.id,t,'duration',true);bind('tp-'+t.id,t,'priority');bind('tf-'+t.id,t,'frequency');bind('tr-'+t.id,t,'peer');bind('tn-'+t.id,t,'minimum');
      const ph=$('tphoto-'+t.id);if(ph)ph.addEventListener('change',()=>{t.requiresPhoto=ph.checked;save()});
    });
    bind('rn-'+level.id,level.reward,'name');bind('rp-'+level.id,level.reward,'price',true);bind('ru-'+level.id,level.reward,'url');
  });
}
function addTask(goalId,levelId){const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);level.tasks.push(freshTask());save();renderEditor();toast('Task added')}
function deleteTask(goalId,levelId,taskId){const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);level.tasks=level.tasks.filter(t=>t.id!==taskId);save();renderEditor();toast('Task deleted')}
function uploadRewardImage(goalId,levelId,input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const goal=state.goals.find(g=>g.id===goalId),level=goal.levels.find(l=>l.id===levelId);level.reward.image=r.result;save();renderEditor();toast('Reward image saved')};r.readAsDataURL(f)}
function addLevel(goalId){
  const goal=state.goals.find(g=>g.id===goalId),prev=goal.levels[goal.levels.length-1];
  const suggestion=prev&&prev.difficultySuggestion;
  const carried=prev?prev.tasks.map(t=>freshTask({title:t.title,detail:t.detail,xp:t.xp,frequency:t.frequency,priority:t.priority})):[];
  const nl=freshLevel({title:'New level',days:suggestion?suggestion.days:7,tasks:carried.length?carried:[freshTask()]});
  goal.levels.push(nl);save();renderEditor();toast(suggestion?'New level added using the suggested length':'New level added with previous tasks carried forward');
}
function deleteLevel(goalId,levelId){
  if(!confirm('Delete this level and its reward?'))return;
  const goal=state.goals.find(g=>g.id===goalId),idx=goal.levels.findIndex(l=>l.id===levelId);
  goal.levels.splice(idx,1);goal.currentLevelIndex=Math.min(goal.currentLevelIndex,goal.levels.length-1);
  if(!goal.levels.some(l=>l.status==='current')&&goal.levels[goal.currentLevelIndex]){goal.levels[goal.currentLevelIndex].status='current';goal.levels[goal.currentLevelIndex].startedAt=goal.levels[goal.currentLevelIndex].startedAt||todayKey()}
  save();renderEditor();toast('Level deleted');
}

/* ===================== MISSION (today's order) ===================== */
function renderMission(){
  const goal=activeGoal();
  if(!goal){$('mission').innerHTML='<div class="empty">Create an operation first.</div>';return}
  const level=currentLevel(goal),today=todayKey();
  let html='<div class="card"><div class="eyebrow">Level '+(goal.levels.indexOf(level)+1)+' · '+level.days+'-day commitment</div><h2 style="margin:6px 0">'+esc(level.title)+'</h2><p class="sub">'+level.rule+'</p>'+deadlineHtml(goal)+'</div>';
  html+=rewardBannerHtml(goal,level,'mission');

  if(level.status==='recovery'){
    html+='<div class="recovery-banner"><h3>Missed '+formatDate(level.recoveryTriggerDate)+'</h3><p>Nothing is silently erased — choose a deliberate recovery action.</p>'
      +(goal.commitNote?'<div class="commit-note">Remember why: “'+esc(goal.commitNote)+'”</div>':'')
      +'<div class="recovery-actions"><button class="btn soft sm" onclick="recoveryAction(\''+goal.id+'\',\''+level.id+'\',\'repeat\')">Repeat that day</button><button class="btn soft sm" onclick="recoveryAction(\''+goal.id+'\',\''+level.id+'\',\'extend\')">Add a recovery day</button><button class="btn soft sm" onclick="recoveryAction(\''+goal.id+'\',\''+level.id+'\',\'minimum\')">Use the minimum-day standard</button><button class="btn danger sm" onclick="recoveryAction(\''+goal.id+'\',\''+level.id+'\',\'pause\')">Pause intentionally</button></div></div>';
  }else if(level.status==='paused'){
    html+='<div class="recovery-banner"><h3>Paused since '+formatDate(level.pausedOn)+'</h3><p>The paused days will be excused, not counted against you, once you resume.</p><button class="btn gold sm" onclick="resumeLevel(\''+goal.id+'\',\''+level.id+'\')">Resume order</button></div>';
  }else if(level.status==='done'){
    html+='<div class="checkpoint-banner"><h3 style="margin:0 0 4px">Level complete 🏆</h3><p class="sub" style="margin:0">Head to the Command desk to add the next level'+(level.difficultySuggestion?' — a suggested length is waiting for you there.':'.')+'</p></div>';
  }else{
    if(checkpointDue(level)){
      html+='<div class="checkpoint-banner"><h3 style="margin:0 0 4px">Still worth it?</h3><p class="sub" style="margin:0 0 10px">You’re past the midpoint of '+esc(level.title)+'. Recommit to the full scope, or deliberately downgrade it — either way it’s logged, not abandoned silently.</p><div class="modal-actions" style="justify-content:flex-start"><button class="btn gold sm" onclick="checkpointRespond(\''+goal.id+'\',\''+level.id+'\',\'recommit\')">Recommit to full scope</button><button class="btn ghost sm" onclick="checkpointRespond(\''+goal.id+'\',\''+level.id+'\',\'downgrade\')">Downgrade scope</button></div></div>';
    }
    const due=dueTasksFor(level,today);
    const rec=level.days_log[today]||{doneTaskIds:[]};
    html+='<div class="card"><div class="head"><h3 style="margin:0">Today’s requirements</h3><div class="modal-actions"><button class="btn ghost sm" onclick="exportCalendar(activeGoal(),currentLevel(activeGoal()))">Add to calendar</button><button class="btn ghost sm" onclick="requestReminder()">Enable reminder</button></div></div>'
      +(due.length?due.map(t=>taskRowHtml(goal,level,t,rec)).join(''):'<div class="empty">Nothing due today for this level.</div>')
      +'</div>';
  }
  if(level.recoveryEvents&&level.recoveryEvents.length){
    html+='<div class="card"><h3>Recovery history for this level</h3>'+level.recoveryEvents.map(e=>'<div class="history-item"><span>'+e.note+'</span><small>'+e.date+'</small></div>').join('')+'</div>';
  }
  $('mission').innerHTML=html;
}
function taskRowHtml(goal,level,task,rec){
  const done=rec.doneTaskIds.includes(task.id);
  return '<div class="task-row'+(done?' all-done':'')+'"><button type="button" class="chk'+(done?' done':'')+'" onclick="toggleTask(\''+goal.id+'\',\''+level.id+'\',\''+task.id+'\')">'+(done?'✓':'')+'</button><div style="flex:1"><div class="task-label">'+esc(task.title)+'</div><div class="task-sub">'+esc(task.detail||'')+'</div><div class="task-tags"><span class="tag-pill">+'+task.xp+' XP</span>'+(task.peer?'<span class="tag-pill peer">Peer: '+esc(task.peer)+'</span>':'')+(task.requiresPhoto?'<span class="tag-pill">📷 photo</span>':'')+(task.frequency!=='daily'?'<span class="tag-pill">'+task.frequency+'</span>':'')+'</div></div><button class="btn ghost sm" onclick="openFocus(\''+goal.id+'\',\''+level.id+'\',\''+task.id+'\')">Focus</button></div>';
}

/* ===================== WAR ROOM ===================== */
function renderWar(){
  const mine=myGoals();
  if(!mine.length){$('war').innerHTML='<div class="empty">No active operations yet.</div>';return}
  const totalXp=mine.reduce((s,g)=>s+(g.xpBank||0),0),totalGrace=mine.reduce((s,g)=>s+(g.graceTokens||0),0);
  let html='<div class="cards"><div class="metric"><span>Active operations</span><b>'+mine.length+'</b></div><div class="metric"><span>Combined XP bank</span><b>'+totalXp+'</b></div><div class="metric"><span>Combined grace tokens</span><b>🛡️ '+totalGrace+'</b></div></div>';
  html+='<div class="pledge-grid">'+mine.map(g=>{
    const level=currentLevel(g),pct=levelProgress(level);
    return '<div class="war-card"><div class="war-row"><div><b>'+esc(g.title)+'</b><div class="sub">'+esc(level.title)+' · '+level.status+'</div></div><span class="streak-chip">'+pct+'%</span></div><div class="bar" style="margin:9px 0"><i style="width:'+pct+'%"></i></div>'+deadlineHtml(g)+'<div class="modal-actions" style="margin-top:9px"><button class="btn soft sm" onclick="switchGoal(\''+g.id+'\');go(\'mission\')">Open today’s order</button></div></div>';
  }).join('')+'</div>';
  $('war').innerHTML=html;
}

/* ===================== VAULT ===================== */
function renderVault(){
  const goal=activeGoal();
  if(!goal){$('vault').innerHTML='<div class="empty">Create an operation first.</div>';return}
  let html='<div class="head"><h2 style="margin:0">Rewards for '+esc(goal.title)+'</h2></div><div class="vault-grid">'
    +goal.levels.map((l,i)=>'<div class="vault-item"><div class="vault-image" style="'+(l.reward.image?'background-image:url(\''+l.reward.image+'\')':'')+'"></div><div class="vault-copy"><small>Level '+(i+1)+' · '+rewardStatusLabel(l.reward.status)+'</small><h3 style="font-size:16px;margin:4px 0">'+esc(l.reward.name)+'</h3><p class="sub">$'+(l.reward.price||0)+(l.reward.url?' · link saved':'')+'</p></div></div>').join('')
    +'</div>';
  html+='<div class="head" style="margin-top:20px"><h2 style="margin:0">Bonus rewards — unlocked by XP bank ('+(goal.xpBank||0)+' banked)</h2><button class="btn soft sm" onclick="addBonusReward(\''+goal.id+'\')">+ Add bonus reward</button></div>';
  html+=(goal.bonusRewards&&goal.bonusRewards.length)?'<div class="pledge-grid">'+goal.bonusRewards.map(b=>'<div class="war-card"><b>'+esc(b.name)+'</b><div class="sub">Needs '+b.xpRequired+' XP</div><div class="bar" style="margin:8px 0"><i style="width:'+Math.min(100,Math.round((goal.xpBank||0)/b.xpRequired*100))+'%"></i></div>'+(b.claimed?'<span class="reward-status-chip" style="background:var(--green2);color:var(--green)">CLAIMED</span>':'<button class="btn gold sm" onclick="claimBonus(\''+goal.id+'\',\''+b.id+'\')" '+((goal.xpBank||0)<b.xpRequired?'disabled':'')+'>Claim</button>')+'</div>').join('')+'</div>':'<div class="empty">No bonus rewards yet — add one so banked XP is never wasted, even through a recovery.</div>';
  $('vault').innerHTML=html;
}

/* ===================== REVIEW ===================== */
function renderReview(){
  const goal=activeGoal();
  if(!goal){$('review').innerHTML='<div class="empty">Create an operation first.</div>';return}
  const level=currentLevel(goal),pct=levelProgress(level),events=state.history.filter(e=>e.goalId===goal.id),reviews=state.reviews[goal.id]||[];
  let html='<div class="cards"><div class="metric"><span>This level</span><b>'+pct+'%</b></div><div class="metric"><span>Recorded action days</span><b>'+(new Set(events.map(e=>e.date.slice(0,10))).size)+'</b></div><div class="metric"><span>Reward position</span><b>'+rewardStatusLabel(level.reward.status)+'</b></div></div>';
  html+='<div class="card"><div class="head"><h2 style="margin:0">After-action questions</h2><span class="sub">'+goal.reviewDay+' is your review day</span></div>'
    +'<div class="label">What worked?</div><textarea class="input" id="reviewWorked" rows="2"></textarea>'
    +'<div class="label" style="margin-top:9px">What failed or created friction?</div><textarea class="input" id="reviewFriction" rows="2"></textarea>'
    +'<div class="label" style="margin-top:9px">What changes next week?</div><textarea class="input" id="reviewChanges" rows="2"></textarea>'
    +'<button class="btn gold sm" style="margin-top:10px" onclick="saveReview(\''+goal.id+'\')">Save after-action review</button></div>';
  html+='<div class="card"><h3>Past reviews</h3>'+(reviews.length?reviews.map(r=>'<div class="history-item" style="display:block"><small>'+new Date(r.savedAt).toLocaleString()+'</small><div><b>Worked:</b> '+esc(r.worked||'—')+'</div><div><b>Friction:</b> '+esc(r.friction||'—')+'</div><div><b>Changes:</b> '+esc(r.changes||'—')+'</div></div>').join(''):'<div class="empty">No reviews saved yet.</div>')+'</div>';
  html+='<div class="card"><div class="head"><h3 style="margin:0">Permanent history</h3><span class="sub">'+events.length+' records</span></div><div class="modal-actions" style="justify-content:flex-start;margin-bottom:10px"><button class="btn ghost sm" onclick="printReport()">Print report</button></div>'
    +(events.length?events.slice(0,40).map(e=>'<div class="history-item"><span>'+esc(e.action)+(e.detail?' · '+esc(e.detail):'')+'</span><small>'+new Date(e.date).toLocaleString()+'</small></div>').join(''):'<div class="empty">No actions recorded yet.</div>')+'</div>';
  $('review').innerHTML=html;
}

/* ===================== profile ===================== */
function setProfile(name){
  state.activeProfile=name;
  if(!myGoals().some(g=>g.id===state.activeGoalId))state.activeGoalId=myGoals()[0]?myGoals()[0].id:null;
  save();
  $('profileBhargav').classList.toggle('active',name==='Bhargav');$('profileAnusha').classList.toggle('active',name==='Anusha');
  if(window.HubTheme)HubTheme.applyHubTheme(name,{base:'--green'}).catch(()=>{});
  renderGoalSelect();go(document.querySelector('.page.active').id);
}
function wire(){
  $('profileBhargav').classList.toggle('active',state.activeProfile==='Bhargav');
  $('profileAnusha').classList.toggle('active',state.activeProfile==='Anusha');
}
auth.onAuthStateChanged(async u=>{if(!u){if(window.self!==window.top)return;location.href='../index.html';return}user=u;try{await load();wire();$('shell').style.visibility='visible';$('loading').style.display='none';$('syncLabel').textContent='Saved to cloud';$('syncDot').classList.add('on');go('home');if(window.HubTheme)HubTheme.applyHubTheme(state.activeProfile,{base:'--green'}).catch(()=>{})}catch(e){$('loadingText').textContent='Your commitments could not load. Refresh to try again.';console.error(e)}})
}
</script>
</body></html>
