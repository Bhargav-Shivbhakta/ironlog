<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pledge — Keep the promise, earn the prize</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../assets/firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Pledge has its own look on purpose: an ink-dark room, one ember colour,
   big serif numerals, and every pledge drawn like a ticket with the prize
   as the stub. It does not read the Hub theme. */
:root{--bg:#0e0d0c;--card:#171513;--card2:#1e1b18;--line:#2d2925;--text:#f4eee5;--muted:#a1988c;--faint:#6f685f;
--ember:#ff7a3d;--ember2:#ffb067;--gold:#f2c14e;--ok:#8fd694;--bad:#ea6a5e;--r:18px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
background:radial-gradient(900px 500px at 8% -10%,rgba(255,122,61,.16),transparent 60%),radial-gradient(700px 420px at 100% 0%,rgba(242,193,78,.07),transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;font-weight:600;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:22px 20px 90px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.brand{display:flex;align-items:baseline;gap:12px}
.word{font-family:Fraunces,serif;font-weight:800;font-size:26px;letter-spacing:-.02em}
.word i{color:var(--ember);font-style:normal}
.back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}.back:hover{color:var(--text)}
body.embedded .back{display:none}
.who{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.who button{border:0;background:transparent;color:var(--muted);padding:6px 15px;border-radius:999px;font-weight:600;font-size:13px}
.who button.on{background:var(--text);color:var(--bg)}
.btn{border:0;border-radius:999px;background:var(--ember);color:#1a0d05;padding:10px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.ghost:hover{border-color:var(--faint)}
.btn.sm{padding:6px 13px;font-size:12.5px}.btn.gold{background:var(--gold)}
.btn.bad{background:transparent;border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:end;margin-bottom:30px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.hero .big{font-family:Fraunces,serif;font-weight:800;font-size:104px;line-height:.85;letter-spacing:-.05em}
.hero .big small{font-size:46px;color:var(--faint);font-weight:600;letter-spacing:-.02em}
.hero .lab{color:var(--ember2);font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
.hero p{margin:0;color:var(--muted);font-size:14.5px;max-width:420px}
.hero p b{color:var(--text)}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}
.sect h2{font-size:15px;font-family:Inter,sans-serif;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ticket{display:grid;grid-template-columns:1fr 210px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;right:197px;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{top:-14px}.ticket::after{bottom:-14px}
.ticket.nostub{grid-template-columns:1fr}.ticket.nostub::before,.ticket.nostub::after{display:none}
.main{padding:20px 22px 18px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.chip{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.link{color:var(--ember2);border-color:color-mix(in srgb,var(--ember) 40%,var(--line))}
.ticket h3{font-size:27px;line-height:1.15}
.why{color:var(--muted);font-style:italic;font-family:Fraunces,serif;margin:6px 0 0;font-size:14.5px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:18px 0 14px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.stamp{width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:transparent;font-size:17px;font-weight:800;color:transparent;padding:0}
.stamp.off{border-style:dashed;opacity:.4}
.stamp.done{background:var(--ember);border-color:var(--ember);color:#1a0d05}
.stamp.miss{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));color:var(--bad)}
.stamp.now{border-color:var(--ember);box-shadow:0 0 0 4px color-mix(in srgb,var(--ember) 18%,transparent)}
.stamp.up{border-color:var(--line)}
button.stamp:hover{border-color:var(--ember2)}
.stats{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline}
.stats div{font-size:12px;color:var(--muted)}
.stats b{display:block;font-family:Fraunces,serif;font-size:27px;color:var(--text);line-height:1.05;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.auto{font-size:12.5px;color:var(--muted)}.auto i{color:var(--ok);font-style:normal}
.stub{border-left:2px dashed var(--line);padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:6px;background:linear-gradient(160deg,color-mix(in srgb,var(--ember) 8%,var(--card2)),var(--card2))}
.stub .k{font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ember2)}
.stub .p{font-family:Fraunces,serif;font-size:22px;line-height:1.15;font-weight:600}
.stub .s{font-size:12.5px;color:var(--muted)}
.ticket.earned{border-color:var(--gold)}.ticket.earned .stub{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 20%,var(--card2)),var(--card2))}
.ticket.earned .stub .k{color:var(--gold)}
.ticket.failed{opacity:.9}
.ticket.claimed{opacity:.75}
.menu{margin-left:auto;display:flex;gap:6px}
.link-btn{background:none;border:0;color:var(--faint);font-size:12.5px;font-weight:600;padding:4px 6px}.link-btn:hover{color:var(--text)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:44px 24px;text-align:center}
.empty h3{font-size:30px;margin-bottom:8px}.empty p{color:var(--muted);max-width:430px;margin:0 auto 20px}
details.done-sec summary{cursor:pointer;color:var(--muted);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin:26px 0 12px}
/* form */
.scrim{position:fixed;inset:0;background:rgba(5,4,3,.72);backdrop-filter:blur(6px);z-index:50;display:grid;place-items:center;padding:14px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:24px}
.modal h2{font-size:28px;margin-bottom:4px}.modal .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.f{margin-bottom:16px}.f>label,.lab2{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.in{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
.in:focus{border-color:var(--ember)}
textarea.in{resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left}
.opt b{display:block;font-size:14px}.opt span{font-size:12px;color:var(--muted)}
.opt.on{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 10%,var(--card2))}
.dows{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dows button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 0;font-size:12px;font-weight:700;color:var(--muted)}
.dows button.on{background:var(--ember);border-color:var(--ember);color:#1a0d05}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
details.adv summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sync{font-size:12px;color:var(--faint)}
.load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:90;text-align:center;color:var(--muted)}
.load b{font-family:Fraunces,serif;font-size:26px;color:var(--text)}
@media(max-width:700px){
 .wrap{padding:16px 14px 80px}
 .hero{grid-template-columns:1fr;gap:12px}.hero .big{font-size:84px}
 .ticket{grid-template-columns:1fr}.ticket::before,.ticket::after{display:none}
 .stub{border-left:0;border-top:2px dashed var(--line);padding:16px 22px}
 .ticket h3{font-size:24px}.two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<script>try{if(window.self!==window.top)document.body.classList.add('embedded')}catch(e){document.body.classList.add('embedded')}</script>
<div class="load" id="load"><div><b>Pledge</b><p id="loadText">Opening…</p></div></div>
<div class="wrap" id="app" style="visibility:hidden">
  <div class="bar">
    <div class="brand"><div class="word">Pledge<i>.</i></div><a class="back" href="../index.html">← Home hub</a></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="sync" id="sync"></span>
      <div class="who"><button id="pB" onclick="setProfile('Bhargav')">Bhargav</button><button id="pA" onclick="setProfile('Anusha')">Anusha</button></div>
      <button class="btn" onclick="openForm()">+ New pledge</button>
    </div>
  </div>
  <div id="view"></div>
</div>
<div id="modal"></div><div class="toast" id="toast"></div>
<script>
window.addEventListener('error',e=>{const l=document.getElementById('loadText');if(l&&document.getElementById('load').style.display!=='none')l.textContent='Something went wrong: '+e.message});
if(typeof firebase==='undefined'){document.getElementById('loadText').textContent='Could not load. Check your connection and refresh.'}else{
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!firebase.apps.length)firebase.initializeApp(window.IRONLOG_FIREBASE);
const auth=firebase.auth(),db=firebase.firestore();
let user=null,state={profile:'Bhargav',pledges:[]},saveTimer=null,syncing=false;
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONFIRST=[1,2,3,4,5,6,0];
const GYM_DAYS=[0,1,3,4,5];

/* ---------- dates (local calendar day, same as the other apps) ---------- */
const p2=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function dow(iso){return new Date(iso+'T12:00:00').getDay()}
function between(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function pretty(iso){return new Date(iso+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2400)}

/* ---------- storage: one document, merged pledge-by-pledge ---------- */
const uref=()=>db.collection('users').doc(user.uid);
const stateRef=()=>uref().collection('apps').doc('pledge-v3').collection('data').doc('state');
async function readJson(ref,def){try{const s=await ref.get();return s.exists&&s.data().json?JSON.parse(s.data().json):def}catch(e){return def}}
function save(){$('sync').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(flush,350)}
async function flush(){
  saveTimer=null;
  try{
    const ref=stateRef();let merged;
    const build=raw=>{
      let remote=[];try{remote=raw?(JSON.parse(raw).pledges||[]):[]}catch(e){}
      const by={};remote.forEach(p=>by[p.id]=p);
      state.pledges.forEach(p=>{if(!by[p.id]||(p.u||0)>=(by[p.id].u||0))by[p.id]=p});
      merged=Object.values(by);return JSON.stringify({version:3,pledges:merged});
    };
    await db.runTransaction(async tx=>{const sn=await tx.get(ref);tx.set(ref,{json:build(sn.exists?sn.data().json:null),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})});
    state.pledges=merged;$('sync').textContent='Saved';
  }catch(e){$('sync').textContent='Save needs retry'}
}
window.addEventListener('pagehide',()=>{if(saveTimer){clearTimeout(saveTimer);flush()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(saveTimer){clearTimeout(saveTimer);flush()}}else if(user){syncLinked().then(render)}});

async function load(){
  const raw=await readJson(stateRef(),null);
  state.pledges=(raw&&Array.isArray(raw.pledges))?raw.pledges:[];
  const qp=new URLSearchParams(location.search).get('profile');let lp=null;try{lp=localStorage.getItem('pledge-profile')}catch(e){}
  state.profile=qp==='Anusha'||qp==='Bhargav'?qp:(lp==='Anusha'||lp==='Bhargav'?lp:'Bhargav');
}
function setProfile(n){state.profile=n;try{localStorage.setItem('pledge-profile',n)}catch(e){}paintWho();render();syncLinked().then(render)}
function paintWho(){$('pB').classList.toggle('on',state.profile==='Bhargav');$('pA').classList.toggle('on',state.profile==='Anusha')}
const mine=()=>state.pledges.filter(p=>!p.deleted&&p.owner===state.profile);

/* ---------- the maths: ticks out of what was due ---------- */
function calc(p){
  const T=today(),end=addDays(p.start,p.weeks*7-1);
  let totalDue=0,done=0,missed=0,left=0;
  for(let d=p.start;d<=end;d=addDays(d,1)){
    if(!p.days.includes(dow(d)))continue;
    totalDue++;
    if(p.log[d])done++;else if(d<T)missed++;else left++;
  }
  const allowed=p.misses||0;let status='active';
  if(p.claimed)status='claimed';
  else if(totalDue&&done>=Math.max(1,totalDue-allowed))status='earned';
  else if(missed>allowed)status='failed';
  let streak=0;
  for(let d=T>end?end:T;d>=p.start;d=addDays(d,-1)){
    if(!p.days.includes(dow(d)))continue;
    if(p.log[d])streak++;else if(d===T)continue;else break;
  }
  return{end,totalDue,done,missed,left,allowed,status,streak,daysLeft:Math.max(0,between(T,end)+1),need:Math.max(0,Math.max(1,totalDue-allowed)-done)};
}
function isDue(p,d){return d>=p.start&&d<=addDays(p.start,p.weeks*7-1)&&p.days.includes(dow(d))}

/* ---------- linked sources: read the other apps ---------- */
const SRC={
  schedule:{label:'A Schedule block',sub:'Ticks when you tick it in Schedule'},
  gym:{label:'A Gym session',sub:'Ticks when you log a workout'},
  weigh:{label:'Weigh-in',sub:'Ticks when you log your weight'},
  water:{label:'Water goal',sub:'Ticks when you reach your goal'},
  diet:{label:'Diet',sub:'Ticks when every planned meal is eaten'},
  chore:{label:'A chore',sub:'Ticks when that chore is done'}
};
function srcText(s){
  if(!s)return'';
  if(s.type==='schedule')return'Schedule · '+s.name;
  if(s.type==='chore')return'Chore · '+s.name;
  return SRC[s.type]?SRC[s.type].label.replace(/^An? /,''):'';
}
async function gymData(owner,start,C){
  const k='gym:'+owner+start;if(C[k])return C[k];
  const base=uref().collection('profiles').doc(owner.toLowerCase()),FP=firebase.firestore.FieldPath.documentId();
  const [w,dl]=await Promise.all([base.collection('workoutLogs').where(FP,'>=',start).get(),base.collection('dailyLogs').where(FP,'>=',start).get()]);
  const trained=new Set(),weighed=new Set();
  w.forEach(s=>{const v=s.data()||{},date=v.date||String(s.id).split(':')[0];let any=false;(Array.isArray(v.exercises)?v.exercises:[]).forEach(e=>(e.sets||[]).forEach(()=>{any=true}));if(any)trained.add(date)});
  dl.forEach(s=>{const v=s.data()||{},date=v.date||s.id;if(v.habits&&v.habits.workout)trained.add(date);if(Number(v.weight)>0)weighed.add(date)});
  return C[k]={trained,weighed};
}
async function sourceDone(p,C){
  const out=new Set(),s=p.src||{},T=today();
  if(s.type==='schedule'){
    const base=uref().collection('schedule-profiles').doc(p.owner).collection('data');
    const [tpl,log]=await Promise.all([readJson(base.doc('dayTemplates'),{}),readJson(base.doc('templateLog'),{})]);
    const want=String(s.name||'').trim().toLowerCase();
    for(let d=p.start;d<=T;d=addDays(d,1)){
      const blocks=tpl[FULL[dow(d)]]||[];
      for(let i=0;i<blocks.length;i++){
        const nm=String(blocks[i].activity||blocks[i].title||'').trim().toLowerCase();
        if(nm===want&&log[d+':'+i]){out.add(d);break}
      }
    }
  }else if(s.type==='gym'||s.type==='weigh'){
    const g=await gymData(p.owner,p.start,C);(s.type==='gym'?g.trained:g.weighed).forEach(d=>{if(d>=p.start)out.add(d)});
  }else if(s.type==='water'){
    const w=await readJson(uref().collection('hub-profiles').doc(p.owner).collection('data').doc('water'),null);
    if(w&&w.log){const goal=Number(w.goal)>0?Number(w.goal):(p.owner==='Anusha'?3000:3500);
      Object.keys(w.log).forEach(d=>{const a=w.log[d];const t=Array.isArray(a)?a.reduce((x,y)=>x+(Number(y)||0),0):0;if(d>=p.start&&t>=goal)out.add(d)})}
  }else if(s.type==='diet'){
    if(!C.diet)C.diet=await readJson(uref().collection('apps').doc('nourish-diet-v2').collection('data').doc('state'),null);
    const pid=p.owner.toLowerCase(),by={};
    ((C.diet&&C.diet.diary)||[]).forEach(x=>{if(x.profileId!==pid||x.replaced)return;const r=by[x.date]=by[x.date]||{t:0,e:0};r.t++;if((x.status||'eaten')==='eaten')r.e++});
    Object.keys(by).forEach(d=>{if(d>=p.start&&by[d].t&&by[d].e===by[d].t)out.add(d)});
  }else if(s.type==='chore'){
    const h=await readJson(uref().collection('apps').doc('chores').collection('data').doc('history'),[]);
    h.forEach(x=>{if(!x.kind&&(x.choreId===s.id||(!x.choreId&&x.task===s.name))&&x.date>=p.start)out.add(x.date)});
  }
  return out;
}
async function syncLinked(){
  if(!user||syncing)return;
  const list=mine().filter(p=>p.kind==='linked'&&!p.claimed);if(!list.length)return;
  syncing=true;const C={};let changed=false;
  for(const p of list){
    try{
      const set=await sourceDone(p,C),log={};
      Array.from(set).sort().forEach(d=>{log[d]=1});
      if(JSON.stringify(log)!==JSON.stringify(p.log)){p.log=log;p.u=Date.now();changed=true}
    }catch(e){}
  }
  syncing=false;if(changed)save();
}

/* ---------- screen ---------- */
function render(){
  paintWho();
  const all=mine(),T=today();
  const active=all.filter(p=>calc(p).status!=='claimed'),past=all.filter(p=>calc(p).status==='claimed');
  const dueNow=active.filter(p=>isDue(p,T)&&calc(p).status==='active'),doneNow=dueNow.filter(p=>p.log[T]);
  let h='';
  if(!all.length){
    h='<div class="empty"><h3>Make a promise worth keeping.</h3><p>Pick something you will do — wake at 4:30, lift five days, hit your water — name the prize you get for keeping it, and Pledge counts every tick.</p><button class="btn" onclick="openForm()">+ New pledge</button></div>';
    $('view').innerHTML=h;return;
  }
  const best=active.reduce((m,p)=>Math.max(m,calc(p).streak),0);
  h+='<div class="hero"><div class="big">'+doneNow.length+'<small>/'+dueNow.length+'</small></div><div><div class="lab">Kept today</div>'+
    '<p>'+(dueNow.length?(doneNow.length===dueNow.length?'<b>Every pledge kept today.</b> ':'<b>'+(dueNow.length-doneNow.length)+' still open.</b> ')+'':'<b>Nothing due today.</b> Rest days never count against you. ')+(best>1?'Longest streak running: <b>'+best+' days</b>.':'')+'</p></div></div>';
  h+='<div class="sect"><h2>Active pledges</h2></div>';
  h+=active.length?active.map(ticket).join(''):'<div class="empty"><p>No active pledges. Start a new one.</p></div>';
  if(past.length)h+='<details class="done-sec"><summary>Earned ('+past.length+')</summary>'+past.map(ticket).join('')+'</details>';
  $('view').innerHTML=h;
}
function ticket(p){
  const c=calc(p),T=today(),linked=p.kind==='linked';
  const prize=p.prize&&p.prize.name;
  const mon=addDays(T,-((dow(T)+6)%7));
  let wk='<div class="week">';
  for(let i=0;i<7;i++){
    const d=addDays(mon,i),due=isDue(p,d),done=!!p.log[d];
    let cls='stamp',sym='✓',tip=pretty(d);
    if(!due&&!done){cls+=' off';sym=''}
    else if(done){cls+=' done'}
    else if(d>T){cls+=' up';sym=''}
    else if(d===T){cls+=' now';sym=''}
    else{cls+=' miss';sym='✕'}
    const canTap=!linked&&c.status!=='claimed'&&due&&d<=T;
    wk+='<div class="day">'+DOW[dow(d)]+(canTap?'<button class="'+cls+'" title="'+tip+'" onclick="tick(\''+p.id+'\',\''+d+'\')">'+sym+'</button>':'<div class="'+cls+'" title="'+tip+'">'+sym+'</div>')+'</div>';
  }
  wk+='</div>';
  const dueToday=isDue(p,T);
  let act='';
  if(c.status==='active'){
    if(linked)act='<span class="auto"><i>●</i> Ticks itself from '+esc(srcText(p.src))+(dueToday?(p.log[T]?' — done today':' — not yet today'):' — rest day')+'</span>';
    else if(dueToday)act=p.log[T]?'<button class="btn ghost sm" onclick="tick(\''+p.id+'\',\''+T+'\')">✓ Kept today · undo</button>':'<button class="btn" onclick="tick(\''+p.id+'\',\''+T+'\')">Mark today kept</button>';
    else act='<span class="auto">Rest day today</span>';
  }else if(c.status==='failed'){
    act='<span class="auto">Too many missed days.</span> <button class="btn sm" onclick="restart(\''+p.id+'\')">Start over today</button>';
  }
  let stub='';
  if(prize){
    const k=c.status==='claimed'?'Claimed':c.status==='earned'?'Earned':'The prize';
    let s=c.status==='earned'?'<button class="btn gold sm" onclick="claim(\''+p.id+'\')">Claim it</button>':c.status==='claimed'?'Enjoy it.':c.status==='failed'?'Not this round.':c.need+' more tick'+(c.need===1?'':'s')+' to unlock';
    stub='<div class="stub"><div class="k">'+k+'</div><div class="p">'+esc(p.prize.name)+'</div><div class="s">'+s+'</div></div>';
  }else if(c.status==='earned'){
    stub='<div class="stub"><div class="k">Pledge kept</div><div class="p">Done.</div><div class="s"><button class="btn gold sm" onclick="claim(\''+p.id+'\')">Mark complete</button></div></div>';
  }
  return '<div class="ticket '+c.status+(stub?'':' nostub')+'"><div class="main">'+
    '<div class="chips"><span class="chip'+(linked?' link':'')+'">'+(linked?'Linked · '+esc(srcText(p.src)):'Tick it myself')+'</span><span class="chip">'+p.days.map(d=>DOW[d]).join(' ')+'</span></div>'+
    '<h3>'+esc(p.title)+'</h3>'+(p.why?'<p class="why">“'+esc(p.why)+'”</p>':'')+wk+
    '<div class="stats"><div><b>'+c.done+' / '+c.totalDue+'</b>ticks</div><div><b>'+c.streak+'</b>day streak</div><div><b>'+(c.status==='active'?c.daysLeft:'—')+'</b>days left</div></div>'+
    '<div class="row">'+act+'<div class="menu"><button class="link-btn" onclick="openForm(\''+p.id+'\')">Edit</button><button class="link-btn" onclick="remove(\''+p.id+'\')">Delete</button></div></div>'+
  '</div>'+stub+'</div>';
}
function find(id){return state.pledges.find(p=>p.id===id)}
function tick(id,d){const p=find(id);if(!p||p.kind==='linked')return;if(p.log[d])delete p.log[d];else p.log[d]=1;p.u=Date.now();save();render();if(p.log[d]&&calc(p).status==='earned')toast('Pledge kept — your prize is unlocked')}
function claim(id){const p=find(id);if(!p)return;p.claimed=Date.now();p.u=Date.now();save();render();toast('Claimed. You earned it.')}
function restart(id){const p=find(id);if(!p)return;p.start=today();p.log={};p.claimed=null;p.u=Date.now();save();syncLinked().then(render);render();toast('Fresh start')}
function remove(id){const p=find(id);if(!p||!confirm('Delete “'+p.title+'”?'))return;p.deleted=true;p.u=Date.now();save();render()}

/* ---------- the form ---------- */
let nf=null,srcCache=null;
async function loadChoices(){
  if(srcCache&&srcCache.owner===state.profile)return srcCache;
  const base=uref().collection('schedule-profiles').doc(state.profile).collection('data');
  const [tpl,chores]=await Promise.all([readJson(base.doc('dayTemplates'),{}),readJson(uref().collection('apps').doc('chores').collection('data').doc('chores'),[])]);
  const blocks={};
  FULL.forEach((fn,i)=>(tpl[fn]||[]).forEach(b=>{const nm=String(b.activity||b.title||'').trim();if(!nm)return;const k=nm.toLowerCase();(blocks[k]=blocks[k]||{name:nm,days:new Set()}).days.add(i)}));
  const mineC=(Array.isArray(chores)?chores:[]).filter(c=>c.active!==false&&(!Array.isArray(c.assignedTo)||c.assignedTo.includes(state.profile)));
  return srcCache={owner:state.profile,blocks:Object.values(blocks).map(b=>({name:b.name,days:Array.from(b.days).sort()})).sort((a,b)=>a.name.localeCompare(b.name)),chores:mineC.map(c=>({id:c.id,name:c.name}))};
}
async function openForm(id){
  const p=id?find(id):null;
  nf=p?JSON.parse(JSON.stringify(p)):{id:'p-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),owner:state.profile,title:'',why:'',kind:'own',src:null,days:[0,1,2,3,4,5,6],start:today(),weeks:4,misses:0,prize:{name:''},log:{},claimed:null,createdAt:Date.now()};
  nf._edit=!!p;
  await loadChoices().catch(()=>null);
  drawForm();
}
function drawForm(){
  const ch=srcCache||{blocks:[],chores:[]};
  let srcPick='';
  if(nf.kind==='linked'){
    srcPick='<div class="f"><label>What does it track?</label><div class="seg" style="grid-template-columns:1fr 1fr">'+
      Object.keys(SRC).map(k=>'<button class="opt'+(nf.src&&nf.src.type===k?' on':'')+'" onclick="pickSrc(\''+k+'\')"><b>'+SRC[k].label+'</b><span>'+SRC[k].sub+'</span></button>').join('')+'</div></div>';
    if(nf.src&&nf.src.type==='schedule'){
      srcPick+='<div class="f"><label>Which block?</label>'+(ch.blocks.length?'<select class="in" onchange="pickBlock(this.value)"><option value="">Choose a block…</option>'+ch.blocks.map(b=>'<option value="'+esc(b.name)+'"'+(nf.src.name===b.name?' selected':'')+'>'+esc(b.name)+' ('+b.days.map(d=>DOW[d]).join(' ')+')</option>').join('')+'</select>':'<div class="sub">No blocks found in Schedule for '+esc(state.profile)+'. Add one there first.</div>')+'</div>';
    }
    if(nf.src&&nf.src.type==='chore'){
      srcPick+='<div class="f"><label>Which chore?</label>'+(ch.chores.length?'<select class="in" onchange="pickChore(this.value)"><option value="">Choose a chore…</option>'+ch.chores.map(c=>'<option value="'+esc(c.id)+'"'+(nf.src.id===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select>':'<div class="sub">No chores found for '+esc(state.profile)+'.</div>')+'</div>';
    }
  }
  $('modal').innerHTML='<div class="scrim" onclick="if(event.target===this)closeForm()"><div class="modal"><h2>'+(nf._edit?'Edit pledge':'New pledge')+'</h2><div class="sub">One promise, the days it counts, and what you get for keeping it.</div>'+
    '<div class="f"><label>I pledge to…</label><input class="in" id="fTitle" value="'+esc(nf.title)+'" placeholder="e.g. Wake up at 4:30" oninput="nf.title=this.value"></div>'+
    '<div class="f"><label>How do you tick it?</label><div class="seg"><button class="opt'+(nf.kind==='linked'?' on':'')+'" onclick="setKind(\'linked\')"><b>Track an app</b><span>It ticks itself</span></button><button class="opt'+(nf.kind==='own'?' on':'')+'" onclick="setKind(\'own\')"><b>I tick it</b><span>Own pledge, any promise</span></button></div></div>'+srcPick+
    '<div class="f"><label>Counts on</label><div class="dows">'+MONFIRST.map(d=>'<button class="'+(nf.days.includes(d)?'on':'')+'" onclick="toggleDay('+d+')">'+DOW[d]+'</button>').join('')+'</div></div>'+
    '<div class="two"><div class="f"><label>For how many weeks</label><input class="in" type="number" min="1" max="52" value="'+nf.weeks+'" oninput="nf.weeks=Math.max(1,Math.min(52,parseInt(this.value)||1))"></div>'+
    '<div class="f"><label>Prize when kept</label><input class="in" value="'+esc(nf.prize.name)+'" placeholder="e.g. New headphones" oninput="nf.prize.name=this.value"></div></div>'+
    '<details class="adv"><summary>More options</summary><div class="f"><label>Why does this matter?</label><textarea class="in" rows="2" placeholder="Shown back to you on the card" oninput="nf.why=this.value">'+esc(nf.why)+'</textarea></div>'+
    '<div class="f"><label>Days you may miss</label><input class="in" type="number" min="0" max="20" value="'+(nf.misses||0)+'" oninput="nf.misses=Math.max(0,parseInt(this.value)||0)"></div></details>'+
    '<div class="mfoot"><button class="btn ghost" onclick="closeForm()">Cancel</button><button class="btn" onclick="submitForm()">'+(nf._edit?'Save':'Make the pledge')+'</button></div></div></div>';
}
function closeForm(){$('modal').innerHTML='';nf=null}
function setKind(k){nf.kind=k;if(k==='own')nf.src=null;drawForm()}
function pickSrc(t){
  nf.src={type:t};
  if(t==='gym')nf.days=GYM_DAYS.slice();
  if(t==='schedule'||t==='chore'){}
  if(!nf.title){nf.title={gym:'Train as planned',weigh:'Weigh in every day',water:'Hit my water goal',diet:'Eat every planned meal'}[t]||''}
  drawForm();
}
function pickBlock(v){
  if(!v){nf.src={type:'schedule'};drawForm();return}
  const b=srcCache.blocks.find(x=>x.name===v);nf.src={type:'schedule',name:v};
  if(b)nf.days=b.days.slice();
  if(!nf.title)nf.title=v;
  drawForm();
}
function pickChore(id){
  const c=srcCache.chores.find(x=>x.id===id);nf.src=c?{type:'chore',id:c.id,name:c.name}:{type:'chore'};
  if(c&&!nf.title)nf.title=c.name;drawForm();
}
function toggleDay(d){const i=nf.days.indexOf(d);if(i>=0)nf.days.splice(i,1);else nf.days.push(d);nf.days.sort();drawForm()}
function submitForm(){
  nf.title=(nf.title||'').trim();
  if(!nf.title)return toast('Give the pledge a name');
  if(!nf.days.length)return toast('Pick at least one day');
  if(nf.kind==='linked'){
    const s=nf.src;
    if(!s||!s.type)return toast('Choose what it tracks');
    if(s.type==='schedule'&&!s.name)return toast('Choose a Schedule block');
    if(s.type==='chore'&&!s.id)return toast('Choose a chore');
  }
  const n=JSON.parse(JSON.stringify(nf));delete n._edit;n.u=Date.now();n.prize={name:(n.prize.name||'').trim()};
  const i=state.pledges.findIndex(p=>p.id===n.id);
  if(i>=0){if(n.kind==='own')n.log=state.pledges[i].log||{};state.pledges[i]=n}else state.pledges.push(n);
  closeForm();save();render();
  if(n.kind==='linked')syncLinked().then(render);
  toast(i>=0?'Saved':'Pledge made');
}

auth.onAuthStateChanged(async u=>{
  if(!u){if(window.self!==window.top)return;location.href='../index.html';return}
  user=u;
  try{await load();paintWho();render();$('app').style.visibility='visible';$('load').style.display='none';$('sync').textContent='';syncLinked().then(render)}
  catch(e){$('loadText').textContent='Could not open Pledge: '+e.message}
});
window.setProfile=setProfile;window.openForm=openForm;window.closeForm=closeForm;window.setKind=setKind;window.pickSrc=pickSrc;window.pickBlock=pickBlock;window.pickChore=pickChore;window.toggleDay=toggleDay;window.submitForm=submitForm;window.tick=tick;window.claim=claim;window.restart=restart;window.remove=remove;
Object.defineProperty(window,'nf',{get:()=>nf,set:v=>{nf=v}});
}
</script>
</body></html>
