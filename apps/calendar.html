<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  /* These match the Hub shell's own tokens exactly (assets/app.css's
     :root), same as the Todo restyle — Calendar was previously running an
     unrelated blue/indigo palette (#5B5CE8 etc.) that didn't match the
     rest of the suite at all. The per-source event colors (todo/gym/
     chores/schedule/skin) stay distinct on purpose, so events on the grid
     are still easy to tell apart at a glance; only the page chrome
     (background/surface/border/text/accent/shadow/radius) changes. */
  :root{
    --bg:#F4F4F0; --surface:#FFFFFF; --surface-alt:#F2F0E9;
    --border:#E3E3DC; --border-soft:#ECECE6;
    --text:#20211E; --text-soft:#74766F; --text-faint:#9C9E97;
    --accent:#AD7B20; --accent-soft:#F7EFD9; --accent-deep:#6F4A08;
    --danger:#B8493F; --danger-soft:#FAECEA;
    --today-ring:#6F4A08;
    --amavasya:#3A3D52; --amavasya-soft:#E7E7ED;
    --purnima:#F5B942; --purnima-soft:#FDF1D6;
    --todo:#5B8DEF; --todo-soft:#E4ECFC;
    --gym:#E8502F; --gym-soft:#FDE4DC;
    --chores:#16A37A; --chores-soft:#DDF4EC;
    --schedule:#A855F7; --schedule-soft:#F2E4FE;
    --skin:#EC3B87; --skin-soft:#FDE7F1;
    --radius-lg:16px; --radius-md:11px; --radius-sm:8px;
    --shadow:0 18px 50px rgba(37,38,32,.08);
  }
  /* Same accent swap the Hub shell itself uses for Anusha's profile. This
     affects the page's own chrome (accent buttons, "today" ring) — the
     per-source event colors are unaffected since they're keyed to which
     app an event came from, not who's viewing. */
  body[data-profile="anusha"]{--accent:#B25C78;--accent-soft:#FAEAF0;--accent-deep:#813B53;--today-ring:#813B53;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px 12px 70px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:min(95vw,1760px);margin:0 auto;}
  h1,h2,h3{font-family:'Manrope',sans-serif;}
  button,input,select{font-family:inherit;}
  button{transition:transform .12s cubic-bezier(.34,1.56,.64,1);cursor:pointer;}
  button:active{transform:scale(0.96);}

  .loading-gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-soft);}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .topbar a{font-size:12.5px;color:var(--text-soft);text-decoration:none;}
  /* This app's own "All apps" link navigates the WHOLE page — fine when
     opened standalone, but when the Hub has this open inside its app
     viewer, that navigation loads a second full copy of the Hub inside
     the iframe (the nested-Home-Hub-inside-Home-Hub bug). The Hub's own
     "Back to Hub" button in the viewer chrome already does this safely,
     so this in-page link is hidden whenever we detect we're embedded. */
  body.embedded .topbar .back{display:none}
  /* Hidden entirely when embedded in the Hub's app viewer — the Hub's own
     top bar already shows "Calendar" as the title there (see
     app-frame-title in index.html), so repeating "Calendar / Everything,
     in one place…" here would just be the same heading twice. Standalone
     (opened in its own tab, no Hub bar around it) it's the only copy, so
     it stays — same pattern already applied to Todo and Schedule. */
  body.embedded header.app-head{display:none}
  header.app-head{text-align:center;margin-bottom:14px;}
  header.app-head h1{font-size:22px;font-weight:800;margin:0 0 2px;letter-spacing:-0.02em;background:linear-gradient(135deg,var(--accent-deep),var(--purnima));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  header.app-head p{margin:0;color:var(--text-soft);font-size:12.5px;}
  header.app-head .who-badge{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 12px 3px 4px;margin-bottom:6px;cursor:pointer;font-family:inherit;}
  header.app-head .who-badge:hover{background:var(--accent-soft);}
  header.app-head .who-avatar{width:20px;height:20px;border-radius:6px;font-size:12.5px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;}
  header.app-head .who-avatar.av-b{background:#AD7B20;}
  header.app-head .who-avatar.av-a{background:#B25C78;}
  header.app-head .who-name{font-size:14px;font-weight:700;}

  .segmented{max-width:420px;margin:0 auto 14px;background:var(--surface-alt);border-radius:999px;padding:4px;display:flex;gap:2px;}
  .segmented button{flex:1;border:none;background:transparent;border-radius:999px;padding:8px 4px;font-size:12.5px;font-weight:700;color:var(--text-soft);}
  .segmented button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}

  .date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
  .date-nav .nav-btns{display:flex;gap:6px;}
  .date-nav button.nav-arrow{background:var(--surface);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;font-size:14px;box-shadow:var(--shadow);}
  .date-nav .nav-today{background:var(--accent-soft);color:var(--accent-deep);border:none;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;}
  .date-nav .date-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:16px;}

  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;justify-content:center;}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;justify-content:center;align-items:center;}
  .filter-toggle{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;padding:0;}
  .filter-toggle .ft-circle{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .18s cubic-bezier(.34,1.7,.64,1);}
  .filter-toggle.active .ft-circle{border-color:transparent;box-shadow:0 3px 10px -3px rgba(20,20,50,0.35);}
  .filter-toggle .ft-label{font-size:9px;color:var(--text-faint);font-weight:700;}
  .filter-toggle.active .ft-label{color:var(--text);}
  .filter-selectall{font-size:11px;font-weight:700;color:var(--text-soft);background:var(--surface-alt);border:none;border-radius:999px;padding:6px 12px;align-self:center;}

  .bday-overlay{position:fixed;inset:0;z-index:190;background:rgba(20,20,40,0.4);display:flex;align-items:center;justify-content:center;padding:20px;}
  .bday-modal{background:var(--surface);border-radius:20px;padding:20px 18px;width:100%;max-width:400px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  .bday-modal h3{margin:0 0 14px;font-size:16px;}
  .bday-add-row{display:flex;gap:6px;margin-bottom:14px;}
  .bday-add-row input[type=text]{flex:2;font-size:13px;padding:9px 10px;border-radius:9px;border:1px solid var(--border);}
  .bday-add-row input[type=number]{flex:1;font-size:13px;padding:9px 8px;border-radius:9px;border:1px solid var(--border);width:0;}
  .bday-add-row button{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border:none;border-radius:9px;padding:0 14px;font-size:13px;font-weight:700;}
  .bday-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border-soft);}

  #birthday-banner{background:linear-gradient(135deg,#FFD3E0,#FFB8CE);border-radius:14px;padding:12px 16px;margin-bottom:14px;text-align:center;font-weight:800;font-size:14px;color:#8A2E4A;box-shadow:0 6px 18px -8px rgba(224,86,126,0.5);animation:bday-pop .4s ease;}
  @keyframes bday-pop{0%{transform:scale(0.92);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .bday-row:first-of-type{border-top:none;}
  .bday-row .bd-name{font-size:13.5px;font-weight:600;}
  .bday-row .bd-date{font-size:11.5px;color:var(--text-faint);}
  .bday-row button{background:var(--danger-soft,#FCE1E5);color:var(--danger,#F0596B);border:none;border-radius:8px;width:26px;height:26px;font-size:12px;}
  .bday-close-btn{width:100%;margin-top:14px;padding:10px;background:var(--surface-alt);border:none;border-radius:10px;font-size:13px;font-weight:700;color:var(--text-soft);}

  /* MONTH VIEW */
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .month-weekday{text-align:center;font-size:10px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;padding-bottom:4px;}
  .month-cell{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);min-height:78px;padding:5px 5px 4px;cursor:pointer;position:relative;overflow:hidden;transition:box-shadow .15s ease;}
  .month-cell:hover{box-shadow:var(--shadow);}
  .month-cell.other-month{opacity:0.35;}
  .month-cell.is-today{border:2px solid var(--today-ring);}
  .month-cell .cell-date{font-size:12px;font-weight:700;}
  .month-cell.is-tithi-mark .cell-date{display:inline-flex;}
  .tithi-badge{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:3px;vertical-align:middle;}
  .sun-badge{display:inline-block;font-size:8px;margin-left:2px;vertical-align:middle;}
  .tithi-badge.amavasya{background:var(--amavasya);}
  .tithi-badge.purnima{background:var(--purnima);}
  .cell-festival{font-size:9.5px;color:#8A6200;background:var(--purnima-soft);border-radius:4px;padding:1px 3px;font-weight:800;line-height:1.2;margin-top:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cell-fest-more{opacity:0.7;font-weight:700;}
  .cell-events{margin-top:2px;display:flex;flex-direction:column;gap:1px;}
  .cell-pill{font-size:8px;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .cell-more{font-size:8px;color:var(--text-faint);}

  /* WEEK VIEW */
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .week-col{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:8px 6px;min-height:220px;}
  .week-col.is-today{border:2px solid var(--today-ring);}
  .week-col-head{text-align:center;margin-bottom:6px;}
  .week-col-head .wd{font-size:9.5px;color:var(--text-faint);font-weight:700;text-transform:uppercase;}
  .week-col-head .dn{font-size:15px;font-weight:800;}
  .week-tithi{text-align:center;font-size:8px;color:var(--text-faint);margin-bottom:4px;}
  .week-event{font-size:9.5px;padding:3px 5px;border-radius:6px;margin-bottom:3px;font-weight:600;line-height:1.25;}

  /* DAY / AGENDA VIEW */
  .day-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);}
  .day-card h3{font-size:14px;margin:0 0 8px;}
  .panchang-box{background:var(--amavasya-soft);border-radius:var(--radius-md);padding:10px 13px;font-size:12px;color:var(--text-soft);margin-bottom:12px;}
  .panchang-prominent{background:linear-gradient(135deg,var(--purnima-soft),var(--amavasya-soft));border:1px solid var(--purnima);padding:14px 16px;}
  .panchang-sun{background:linear-gradient(135deg,#FFF4DC,#FFE8B8);border:1px solid #F5A623;padding:12px 16px;}
  .panchang-sun-label{font-size:14.5px;font-weight:800;color:#8A5D00;}
  .panchang-tithi{font-size:15px;font-weight:800;color:var(--text);font-family:'Manrope',sans-serif;}
  .panchang-anchor{font-size:12px;color:var(--text-soft);margin-top:2px;}
  .panchang-festival{font-size:13.5px;font-weight:700;color:#B8860B;margin-top:6px;}
  .panchang-fest-list{margin:8px 0 0;padding-left:20px;list-style:disc;}
  .panchang-fest-list li{font-size:13.5px;font-weight:600;color:#7A5A00;line-height:1.65;margin-bottom:3px;}
  .panchang-box b{color:var(--text);}
  .agenda-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--border-soft);}
  .agenda-row:first-child{border-top:none;}
  .agenda-dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:none;}
  .agenda-title{font-size:13.5px;font-weight:600;}
  .agenda-meta{font-size:11px;color:var(--text-faint);}
  .empty-note{color:var(--text-faint);font-style:italic;font-size:13px;padding:16px;text-align:center;}

  .agenda-daygroup{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;margin:16px 0 6px;color:var(--text-soft);}
  .agenda-daygroup:first-child{margin-top:0;}

  /* ---- MEETING SCHEDULING — a real "schedule a meeting" flow, on top of
     the exact same event data Schedule's own Events panel manages
     (schedule-profiles/<profile>/data/events). Creating, editing or
     deleting here updates Schedule too, and vice versa. ---- */
  .toolbar-row{display:flex;justify-content:center;gap:8px;margin:-6px 0 14px;flex-wrap:wrap;}
  .new-event-btn{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border:none;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;box-shadow:var(--shadow);}
  .cell-pill[data-editnative],.week-event[data-editnative]{cursor:pointer;}
  .agenda-row[data-editnative]{cursor:pointer;}

  .evt-overlay{position:fixed;inset:0;z-index:190;background:rgba(20,20,40,0.4);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  .evt-modal{background:var(--surface);border-radius:20px;padding:20px 18px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,0.25);margin:auto;}
  .evt-modal h3{margin:0 0 14px;font-size:16px;}
  .evt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .evt-grid .f{display:flex;flex-direction:column;gap:3px;}
  .evt-grid .f.full{grid-column:1/-1;}
  .evt-grid label{font-size:11px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.02em;}
  .evt-grid input[type=text],.evt-grid input[type=date],.evt-grid input[type=time],.evt-grid input[type=number],.evt-grid select{font-size:14px;padding:8px 9px;border-radius:9px;border:1px solid var(--border);}
  .evt-check{grid-column:1/-1;display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--text-soft);}
  .evt-owner-toggle{grid-column:1/-1;display:flex;gap:6px;}
  .evt-owner-toggle button{flex:1;border:1px solid var(--border);background:var(--surface-alt);border-radius:9px;padding:7px;font-size:12.5px;font-weight:700;color:var(--text-soft);}
  .evt-owner-toggle button.on{background:var(--accent-soft);color:var(--accent-deep);border-color:var(--accent);}
  .evt-colors{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap;}
  .evt-color-swatch{width:26px;height:26px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;}
  .evt-color-swatch.on{border-color:var(--text);}
  .evt-conflict{grid-column:1/-1;background:var(--accent-soft);color:var(--accent-deep);border-radius:9px;padding:8px 10px;font-size:12px;display:none;}
  .evt-actions{grid-column:1/-1;display:flex;gap:6px;margin-top:2px;}
  .btn-mini{font-size:12.5px;font-weight:700;border:none;border-radius:9px;padding:8px 12px;cursor:pointer;}
  .btn-mini.primary{background:var(--accent);color:#fff;}
  .btn-mini.ghost{background:var(--surface-alt);color:var(--text-soft);}
  .btn-mini.danger{background:var(--danger-soft);color:var(--danger);}

  /* Week "Grid" mode — an hour-by-hour timeline (same drag-to-create
     pattern as Schedule's own week grid), shown only for meetings since
     that's what has real clock times; List mode (unchanged, existing
     behavior) still shows every source (Todo/Chores/Schedule/Panchang). */
  .cal-mode-toggle{display:flex;gap:4px;background:var(--surface-alt);border-radius:999px;padding:3px;width:fit-content;margin:0 auto 12px;}
  .cal-mode-toggle button{border:none;background:transparent;color:var(--text-soft);font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer;}
  .cal-mode-toggle button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
  .cal-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);}
  .cal-grid{display:grid;grid-template-columns:58px repeat(7,minmax(84px,1fr));min-width:700px;}
  .cal-daylabel{font-size:12px;font-weight:700;color:var(--text-soft);text-align:center;padding:6px 2px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);display:flex;flex-direction:column;gap:1px;}
  .cal-daylabel.today{color:var(--accent-deep);}
  .cal-daylabel-sub{font-size:9px;font-weight:600;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-timecol{position:relative;border-right:1px solid var(--border-soft);}
  .cal-timelabel{position:absolute;right:6px;font-size:10.5px;color:var(--text-faint);transform:translateY(-50%);white-space:nowrap;line-height:1;}
  .cal-daycol{position:relative;border-right:1px solid var(--border-soft);background-image:repeating-linear-gradient(to bottom, var(--border-soft) 0, var(--border-soft) 1px, transparent 1px, transparent 56px);}
  .cal-daycol.today{background-color:rgba(173,123,32,0.04);}
  .cal-block{position:absolute;left:2px;right:2px;border-radius:5px;border-left:3px solid;padding:2px 5px;overflow:hidden;font-size:11.5px;line-height:1.25;cursor:pointer;}
  .cal-block .cb-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-block-native{cursor:grab;user-select:none;}
  .cal-block-native:active{cursor:grabbing;}
  .cal-resize-handle{position:absolute;left:0;right:0;height:7px;cursor:ns-resize;}
  .cal-resize-handle.top{top:0;}
  .cal-resize-handle.bottom{bottom:0;}
  .cal-block-native:hover .cal-resize-handle{background:rgba(255,255,255,.4);}
  .cal-dragsel{position:absolute;left:2px;right:2px;background:var(--accent);opacity:0.25;border-radius:5px;pointer-events:none;}
  .cal-block-link{position:absolute;top:1px;right:1px;font-size:10.5px;text-decoration:none;line-height:1;background:rgba(255,255,255,.65);border-radius:3px;padding:0 2px;}
  .cal-now-line{position:absolute;left:0;right:0;height:0;border-top:2px solid #E0567E;z-index:6;pointer-events:none;}
  .cal-now-line::before{content:'';position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#E0567E;}

  /* Grid mode's left sidebar — date nav, a mini month picker, and the
     source checklist all live here instead of stacked above the grid,
     loosely in the spirit of Google Calendar's own sidebar (mini picker
     + "my calendars" list) but built from this app's own controls. */
  .grid-shell{display:flex;gap:16px;align-items:flex-start;}
  .grid-sidebar{width:228px;flex:none;display:flex;flex-direction:column;gap:12px;}
  .grid-main{flex:1;min-width:0;}
  .sidebar-create-btn{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border:none;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:700;box-shadow:var(--shadow);cursor:pointer;}
  .grid-sidebar-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px;box-shadow:var(--shadow);}
  .grid-daytoggle{display:flex;gap:4px;background:var(--surface-alt);border-radius:999px;padding:3px;margin-bottom:10px;width:fit-content;}
  .grid-daytoggle button{border:none;background:transparent;color:var(--text-soft);font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:999px;cursor:pointer;}
  .grid-daytoggle button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
  .grid-sidebar-card .date-nav{margin-bottom:0;}
  .mini-cal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px;box-shadow:var(--shadow);}
  .mini-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .mini-cal-head button{background:var(--surface-alt);border:1px solid var(--border);border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer;}
  .mini-cal-title{font-size:12px;font-weight:800;font-family:'Manrope',sans-serif;}
  .mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
  .mini-wd{font-size:9.5px;color:var(--text-faint);font-weight:700;padding-bottom:2px;}
  .mini-day{font-size:11px;padding:4px 0;border-radius:50%;cursor:pointer;color:var(--text-soft);}

// Interpolates the tithi (1-15 within its paksha) for any date between
// two verified anchors. Returns null outside the 2026-2027 range.
function getTithiInfo(dateStr){
  let before = null, after = null;
  for(let i=0;i<ALL_ANCHORS.length-1;i++){
    if(ALL_ANCHORS[i].date<=dateStr && ALL_ANCHORS[i+1].date>=dateStr){ before = ALL_ANCHORS[i]; after = ALL_ANCHORS[i+1]; break; }
  }
  if(!before || !after) return null;
  if(dateStr===before.date) return { paksha: before.tithi===0?'Krishna':'Shukla', tithiNum: 15, name: before.tithi===0?'Amavasya':'Purnima', isAnchor:true, anchorName: before.name };
  const span = daysBetween(before.date, after.date) || 1;
  const pos = daysBetween(before.date, dateStr);
  const frac = pos/span; // 0..1 across the half-lunar-month
  const tithiNum = Math.min(15, Math.max(1, Math.round(frac*15)+ (before.tithi===0?0:0) ));

  const names = paksha==='Shukla' ? TITHI_NAMES_SHUKLA : TITHI_NAMES_KRISHNA;
  const isAnchorDay = tithiNum===15 && dateStr===after.date;

   uniformly across Month/Week/Day/Agenda. Panchang and Birthdays are
   their own toggleable categories alongside the five apps.
===================================================================== */
const FILTER_KEY = 'calendar-active-filters';
const FILTER_DEFS = [
  {key:'meetings', label:'Meetings', icon:'📅', color:'var(--schedule)'},
  {key:'todo', label:'Todo', icon:'✓', color:'var(--todo)'},
  {key:'chores', label:'Chores', icon:'🧹', color:'var(--chores)'},
  {key:'schedule', label:'Schedule', icon:'📋', color:'var(--schedule)'},
  {key:'hindu', label:'Panchang', icon:'🌙', color:'var(--purnima)'},
  {key:'auspicious', label:'Auspicious', icon:'☀️', color:'#F5A623'},
  {key:'birthdays', label:'Reminders', icon:'🔔', color:'#E0567E'}
];
let activeFilters = new Set(FILTER_DEFS.map(function(f){ return f.key; }));
function loadFilters(){
  try{
    const saved = JSON.parse(localStorage.getItem(FILTER_KEY));
    if(saved && Array.isArray(saved)) activeFilters = new Set(saved);
  }catch(e){}
}
function saveFilters(){ try{ localStorage.setItem(FILTER_KEY, JSON.stringify([...activeFilters])); }catch(e){} }
function renderFilterToggles(){
  const mount = document.getElementById('filter-toggles');
  const allOn = activeFilters.size === FILTER_DEFS.length;
  mount.innerHTML = FILTER_DEFS.map(function(f){
    const isActive = activeFilters.has(f.key);
    return '<button type="button" class="filter-toggle '+(isActive?'active':'')+'" data-filtertoggle="'+f.key+'">'+
      '<div class="ft-circle" style="'+(isActive?'background:'+f.color+';color:#fff;':'color:var(--text-faint);')+'">'+f.icon+'</div>'+
      '<div class="ft-label">'+f.label+'</div></button>';
  }).join('') + '<button type="button" class="filter-selectall" id="filter-selectall-btn">'+(allOn?'Clear all':'Show all')+'</button>';
  mount.querySelectorAll('[data-filtertoggle]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const key = btn.dataset.filtertoggle;
      if(activeFilters.has(key)) activeFilters.delete(key); else activeFilters.add(key);
      saveFilters(); renderFilterToggles(); render();
    });
  });
  document.getElementById('filter-selectall-btn').addEventListener('click', function(){
    if(activeFilters.size===FILTER_DEFS.length) activeFilters.clear();
    else FILTER_DEFS.forEach(function(f){ activeFilters.add(f.key); });
    saveFilters(); renderFilterToggles(); render();
  });
}

let eventsByDate = {}; // 'YYYY-MM-DD' -> [{title, source, color, person, time}]
function addEvent(dateStr, title, source, color, person, time, link){
  if(!dateStr) return;
  if(!eventsByDate[dateStr]) eventsByDate[dateStr] = [];
  // time here is already raw 24h "HH:MM" (from Todo's due time) or empty —
  // used directly as the chronological sort key, before any display
  // formatting happens.
  eventsByDate[dateStr].push({title:title, source:source, color:color, person:person||'', time:time||'', sortKey:time||'', link:link||null});
}

async function loadChoresEvents(){
  try{
    const doc = await jdoc('users/'+currentUser.uid+'/apps/chores/data/chores').get();
    const chores = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : [];
    const today = todayStr();
    chores.forEach(function(c){
      if(c.freqType==='asNeeded') return;
      let due = null;
      if(!c.lastCompleted && c.dueOverride) due = c.dueOverride;
      else if(c.freqType==='daily') due = c.lastCompleted ? addDays(c.lastCompleted,1) : today;
      else if(c.freqType==='everyNDays') due = c.lastCompleted ? addDays(c.lastCompleted, c.freqDays) : today;
      else if(c.freqType==='specificDays'){
        const start = c.lastCompleted ? addDays(c.lastCompleted,1) : today;
        for(let i=0;i<14;i++){ const dd = addDays(start,i); if(c.days && c.days.indexOf(WEEKDAY_NAMES[new Date(dd+'T00:00:00').getDay()])!==-1){ due = dd; break; } }
      }
      if(due) addEvent(due, c.name, 'Chores', 'var(--chores)', '', '', 'chores.html?chore='+encodeURIComponent(c.id));
    });
  }catch(e){}
}

async function loadScheduleEvents(){
  // Schedule is a weekly recurring template, not fixed calendar dates —
  // shown by mapping each weekday's items onto every matching date in the
  // visible range at render time (see eventsForRecurringWeekday below).
  const profiles = ['Bhargav','Anusha'];
  window.scheduleTemplates = {};
  for(const p of profiles){
    try{
      const doc = await jdoc('users/'+currentUser.uid+'/schedule-profiles/'+p+'/data/dayTemplates').get();
      window.scheduleTemplates[p] = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : {};
    }catch(e){ window.scheduleTemplates[p] = {}; }
  }
}
function fmtScheduleTime(t){
  if(!t) return '';
  const parts = t.split(':');
  let h = parseInt(parts[0],10), m = parts[1]||'00';
  const ampm = h>=12 ? 'PM' : 'AM';
  h = h%12; if(h===0) h=12;
  return h+':'+m+' '+ampm;
}
function eventsForRecurringWeekday(dateStr){
  const out = [];
  const wd = WEEKDAY_NAMES[new Date(dateStr+'T00:00:00').getDay()];
  // Schedule is inherently personal — only the active profile's routine
  // shows, not both people's schedules merged into one list. Every block
  // for the day shows, sorted chronologically by its actual start time,
  // so the whole day reads in order — gym, then class, then whatever's next.
  const dayItems = ((window.scheduleTemplates||{})[activeCalendarProfile]||{})[wd];
  if(Array.isArray(dayItems)){
    const sorted = dayItems.slice().sort(function(a,b){ return (a.start||'').localeCompare(b.start||''); });
    sorted.forEach(function(item){
      const label = item.activity || item.title || item.name || item.label || (typeof item==='string'?item:null);
      if(!label) return;
      const timeRange = item.start ? fmtScheduleTime(item.start)+(item.end?' – '+fmtScheduleTime(item.end):'') : '';
      // time/endTime stay raw 24h ("HH:MM") so the Grid view can do real
      // minute math on them; displayTime carries the pretty "4:00 AM –
      // 4:15 AM" range the Classic list views show instead. Passing the
      // pretty string as `time` used to break the Grid (toMinutes() on
      // "4:00 AM – 4:15 AM" is NaN), which is why every routine block
      // used to pile up at the same spot.
      out.push({title:label, source:'Schedule', color:'var(--schedule)', person:activeCalendarProfile, time:item.start||'', endTime:item.end||'', displayTime:timeRange, sortKey:item.start||''});
    });
  }
  return out;
}

   meeting here shows up in Schedule immediately and vice versa. Unlike

   are editable and deletable directly from Calendar.
===================================================================== */
function scheduleEventsDoc(profile){ return db.collection('users').doc(currentUser.uid).collection('schedule-profiles').doc(profile).collection('data').doc('events'); }
let nativeEvents = { Bhargav: [], Anusha: [] };
async function loadNativeMeetingEvents(){

    try{ const doc = await scheduleEventsDoc(p).get(); nativeEvents[p] = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : []; }
    catch(e){ nativeEvents[p] = []; }

async function saveNativeMeetingEvents(profile){
  try{ await scheduleEventsDoc(profile).set({json: JSON.stringify(nativeEvents[profile])}); }
  catch(e){ console.error('meeting save failed', e); }
}
// A shared meeting is mirrored into the partner's own events array too —
// the exact same mirroring convention Schedule's mirrorToPartner uses, so
// either app sees one consistent, non-duplicated result either way.
async function mirrorMeetingToPartner(owner, item, deleted){
  if(!item.shared) return;
  const partner = owner==='Bhargav' ? 'Anusha' : 'Bhargav';
  try{
    const doc = await scheduleEventsDoc(partner).get();
    let list = (doc.exists && doc.data().json) ? JSON.parse(doc.data().json) : [];
    list = list.filter(function(e){ return e.id !== item.id; });
    if(!deleted) list.push(Object.assign({}, item, {mirrored:true, ownerProfile:owner}));
    await scheduleEventsDoc(partner).set({json: JSON.stringify(list)});
    nativeEvents[partner] = list;
  }catch(e){ console.error('meeting mirror failed', e); }
}
function findNativeEvent(id){
  for(const p of ['Bhargav','Anusha']){
    const ev = (nativeEvents[p]||[]).find(function(e){ return e.id===id; });
    if(ev) return {owner:p, ev:ev};
  }
  return null;
}
function weekdayOf(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function toMinutes(hhmm){ const parts=hhmm.split(':').map(Number); return parts[0]*60+parts[1]; }
function minutesToTime(mins){ mins=Math.max(0,Math.min(1439,mins)); return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0'); }
// Same generalized recurrence rule as Schedule's own eventOccursOn (kept
// in sync deliberately — same event objects, same meaning).
function eventOccursOn(ev, dateStr){
  if(ev.kind==='task') return false;
  if(!ev.recurring) return ev.date === dateStr;
  if(!ev.startDate || dateStr < ev.startDate) return false;
  const repeat = ev.repeat || {type:'weekly', until:null};
  if(repeat.until && dateStr > repeat.until) return false;
  if(repeat.type==='daily') return true;
  if(repeat.type==='monthly') return new Date(dateStr+'T00:00:00').getDate() === new Date(ev.startDate+'T00:00:00').getDate();
  if(repeat.type==='yearly'){
    const d=new Date(dateStr+'T00:00:00'), s=new Date(ev.startDate+'T00:00:00');
    return d.getMonth()===s.getMonth() && d.getDate()===s.getDate();
  }
  return weekdayOf(dateStr) === (ev.weekday!=null ? ev.weekday : weekdayOf(ev.startDate));
}
function nativeEventsForDate(dateStr){
  const out = [];
  ['Bhargav','Anusha'].forEach(function(owner){
    (nativeEvents[owner]||[]).forEach(function(ev){
      if(ev.mirrored) return; // the owner's own copy already represents it; skip the partner's mirrored duplicate
      if(!eventOccursOn(ev, dateStr)) return;
      out.push({
        title: ev.title, source:'Meetings', color: ev.color || 'var(--schedule)',
        person: owner, time: ev.time||'', sortKey: ev.time||'', link:null,
        nativeId: ev.id, ownerProfile: owner, endTime: ev.endTime||'', notes: ev.notes||'',
        location: ev.location||'', meetingLink: ev.link||''
      });
    });
  });
  return out;
}
function findScheduleConflicts(owner, dateStr, startTime, endTime, excludeId){
  if(!startTime) return [];
  const start=toMinutes(startTime), end = endTime && toMinutes(endTime)>start ? toMinutes(endTime) : start+45;
  const conflicts = [];
  (nativeEvents[owner]||[]).forEach(function(item){
    if(item.id===excludeId || !eventOccursOn(item, dateStr) || !item.time) return;
    const a=toMinutes(item.time), b=item.endTime&&toMinutes(item.endTime)>a?toMinutes(item.endTime):a+45;
    if(start<b && end>a) conflicts.push(item.title);
  });
  const wd = WEEKDAY_NAMES[weekdayOf(dateStr)];
  (((window.scheduleTemplates||{})[owner]||{})[wd]||[]).forEach(function(block){
    if(!block.start || !block.end) return;
    const a=toMinutes(block.start), b=toMinutes(block.end);
    if(start<b && end>a) conflicts.push(block.activity||block.title||block.name);
  });
  return [...new Set(conflicts)];
}

const EVT_COLORS = ['var(--schedule)','#4A7CF6','#E0574E','#2FA86B','#B8493F','#8A5CF6','#F0A93B'];
function openEventModal(existing, defaultDate, defaultTime){

  const owner0 = existing ? existing.owner : activeCalendarProfile;

      // Meeting moved to a different owner — pull it out of the old

        await saveNativeMeetingEvents(owner0);

      if(idx>=0) arr[idx] = item; else arr.push(item);
      await saveNativeMeetingEvents(owner);
      if(shared2) await mirrorMeetingToPartner(owner, item, false);
      else if(wasShared) await mirrorMeetingToPartner(owner, item, true);
      mount.innerHTML='';
      await loadAllEvents(); render();
    });

  draw(owner0);
}

/* =====================================================================
   GRID CALENDAR — a real Google-Calendar-style hour-by-hour week grid:
   drag existing meetings to move them (including across days), drag
   their top/bottom edge to resize, and drag on empty space to create a
   new one. Only native meetings (this app's own, linked to Schedule)
   are draggable — everything else (Todo/Chores/routine/Panchang/
   birthdays) is shown for context but stays read-only, since it isn't
   this app's data to move.
===================================================================== */
const GRID_START_HOUR = 4;
const GRID_END_HOUR = 23;
const GRID_HOUR_PX = 56;
const GRID_SNAP_PX = GRID_HOUR_PX/4; // 15-minute snap
async function applyNativeMove(id, newDate, newStartTime){
  const found = findNativeEvent(id);
  if(!found) return;
  const ev = found.ev, owner = found.owner;
  const durMin = ev.endTime && toMinutes(ev.endTime)>toMinutes(ev.time||'00:00') ? toMinutes(ev.endTime)-toMinutes(ev.time) : 45;
  const newStartMin = toMinutes(newStartTime);
  ev.time = newStartTime;
  ev.endTime = minutesToTime(Math.min(newStartMin+durMin,1439));
  if(ev.recurring){ ev.startDate = newDate; ev.weekday = weekdayOf(newDate); }
  else { ev.date = newDate; }
  await saveNativeMeetingEvents(owner);
  if(ev.shared) await mirrorMeetingToPartner(owner, ev, false);
  await loadAllEvents();
  render();
}
async function applyNativeResize(id, newStart, newEnd){
  const found = findNativeEvent(id);
  if(!found) return;
  const ev = found.ev, owner = found.owner;
  ev.time = newStart; ev.endTime = newEnd;
  await saveNativeMeetingEvents(owner);
  if(ev.shared) await mirrorMeetingToPartner(owner, ev, false);
  await loadAllEvents();
  render();
}
function renderGridCalendarView(mountEl, rangeStart, dayCount){
  dayCount = dayCount || 7;
  const totalHours = GRID_END_HOUR - GRID_START_HOUR;
  const gridHeight = totalHours * GRID_HOUR_PX;
  const today = todayStr();

  // Compact on-the-hour label ("4 AM" not "4:00 AM") — the grid's time
  // column only ever shows whole hours, so the ":00" was just noise that
  // made the label wrap onto two lines in a narrow column.
  function gridHourLabel(h){
    let hh = h%12; if(hh===0) hh=12;
    return hh+' '+(h>=12?'PM':'AM');
  }
  let timeLabels = '';
  for(let h=GRID_START_HOUR; h<GRID_END_HOUR; h++){
    timeLabels += '<div class="cal-timelabel" style="top:'+((h-GRID_START_HOUR)*GRID_HOUR_PX)+'px;">'+gridHourLabel(h)+'</div>';
  }

  let headHtml = '<div class="cal-daylabel"></div>';
  let colsHtml = '';
  for(let i=0;i<dayCount;i++){
    const d = addDays(rangeStart, i);
    const dd = new Date(d+'T00:00:00');
    const isToday = d === today;
    // A one-line Panchang/Auspicious summary under the date, instead of
    // separate checklist toggles that don't do much in a grid of timed
    // blocks (neither has a real clock time to place on the timeline).
    const tithi = getTithiInfo(d);
    const festList = festivalList(d);
    const ausp = auspiciousInfo(d);
    let subBits = [];
    if(festList.length) subBits.push(festList[0]);
    else if(tithi) subBits.push(tithi.name);
    if(ausp) subBits.push('☀️');
    const subLine = subBits.length ? '<div class="cal-daylabel-sub" title="'+escapeHtml(subBits.join(' · '))+'">'+escapeHtml(subBits.join(' · '))+'</div>' : '';
    headHtml += '<div class="cal-daylabel '+(isToday?'today':'')+'"><div>'+WEEKDAY_NAMES[dd.getDay()].slice(0,3)+' '+dd.getDate()+'</div>'+subLine+'</div>';

    // Only keep events with a real, parseable start time — anything
    // else can't be placed on a timeline and, left in, used to collapse
    // to the same top:0 spot and pile up unreadably.
    const dayEvents = eventsFor(d).filter(function(e){ return e.time && !isNaN(toMinutes(e.time)); });

    // Lay overlapping blocks out side-by-side in lanes (Google-Calendar
    // style) instead of stacking every block full-width on top of each
    // other, which is what made a packed day look like a single garbled
    // blob. Blocks that don't overlap anything else still get the full
    // column width.
    const items = dayEvents.map(function(e){
      const s = toMinutes(e.time);
      const dur = e.endTime && toMinutes(e.endTime)>s ? toMinutes(e.endTime)-s : 45;
      return {e:e, start:s, end:s+dur};
    }).sort(function(a,b){ return a.start-b.start || a.end-b.end; });
    const groups = [];
    items.forEach(function(item){
      const g = groups.find(function(gr){ return gr.some(function(o){ return o.start < item.end && item.start < o.end; }); });
      if(g) g.push(item); else groups.push([item]);
    });
    let mergedAny = true;
    while(mergedAny){
      mergedAny = false;
      for(let gi=0; gi<groups.length && !mergedAny; gi++){
        for(let gj=gi+1; gj<groups.length; gj++){
          const overlaps = groups[gi].some(function(a){ return groups[gj].some(function(b){ return a.start<b.end && b.start<a.end; }); });
          if(overlaps){ groups[gi] = groups[gi].concat(groups[gj]); groups.splice(gj,1); mergedAny = true; break; }
        }
      }
    }
    groups.forEach(function(group){
      const laneEnds = [];
      group.forEach(function(item){
        let lane = 0;
        while(laneEnds[lane]!==undefined && laneEnds[lane] > item.start) lane++;
        laneEnds[lane] = item.end;
        item.lane = lane;
      });
      const laneCount = laneEnds.length;
      group.forEach(function(item){ item.laneCount = laneCount; });
    });

    let blocksHtml = '';
    items.forEach(function(item){
      const e = item.e;
      const startMin = item.start - GRID_START_HOUR*60;
      const durMin = item.end - item.start;
      if(startMin+durMin < 0 || startMin > totalHours*60) return;
      const top = Math.max(0,(startMin/60))*GRID_HOUR_PX;
      const height = Math.max(20, (durMin/60)*GRID_HOUR_PX);
      const laneCount = item.laneCount||1;
      const laneWidth = 100/laneCount;
      const posStyle = laneCount>1
        ? 'left:calc('+(item.lane*laneWidth)+'% + 2px);width:calc('+laneWidth+'% - 4px);'
        : 'left:2px;right:2px;';
      const isNative = !!e.nativeId;
      const editAttr = isNative ? ' data-editnative="'+e.nativeId+'"' : '';
      const handles = isNative ? '<div class="cal-resize-handle top" data-resize="top"></div><div class="cal-resize-handle bottom" data-resize="bottom"></div>' : '';
      const linkIcon = e.meetingLink ? '<a class="cal-block-link" href="'+escapeHtml(e.meetingLink)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open link">🔗</a>' : '';
      blocksHtml += '<div class="cal-block'+(isNative?' cal-block-native':'')+'" style="top:'+top+'px;height:'+height+'px;'+posStyle+'border-left-color:'+e.color+';background:'+e.color+'22;color:'+e.color+';"'+editAttr+'><div class="cb-title">'+escapeHtml(e.title)+'</div>'+linkIcon+handles+'</div>';
    });
    if(isToday){
      const now = new Date();
      const nowMin = now.getHours()*60+now.getMinutes();
      if(nowMin >= GRID_START_HOUR*60 && nowMin <= GRID_END_HOUR*60){
        const nowTop = ((nowMin-GRID_START_HOUR*60)/60)*GRID_HOUR_PX;
        blocksHtml += '<div class="cal-now-line" style="top:'+nowTop+'px;"></div>';
      }
    }
    colsHtml += '<div class="cal-daycol '+(isToday?'today':'')+'" style="height:'+gridHeight+'px;" data-daycol="'+d+'">'+blocksHtml+'</div>';
  }

  const colTemplate = dayCount===1 ? '58px minmax(280px,1fr)' : '58px repeat('+dayCount+',minmax(84px,1fr))';
  const minWidth = dayCount===1 ? '0' : '680px';
  mountEl.innerHTML = '<div class="cal-wrap"><div class="cal-grid" style="grid-template-columns:'+colTemplate+';min-width:'+minWidth+';">'+
    headHtml+
    '<div class="cal-timecol" style="height:'+gridHeight+'px;">'+timeLabels+'</div>'+
    colsHtml+
    '</div></div>';

  const cols = Array.prototype.slice.call(mountEl.querySelectorAll('.cal-daycol'));
  function colForClientX(clientX){
    let best = cols[0], bestDist = Infinity;
    cols.forEach(function(c){
      const r = c.getBoundingClientRect();
      if(clientX >= r.left && clientX < r.right){ best = c; bestDist = -1; }
      else{ const dist = Math.abs(clientX - (r.left+r.width/2)); if(dist < bestDist){ best = c; bestDist = dist; } }
    });
    return best;
  }

  // Click an existing meeting to edit it — suppressed right after a drag
  // or resize so releasing the mouse doesn't also pop the edit modal.
  mountEl.querySelectorAll('[data-editnative]').forEach(function(block){
    block.addEventListener('click', function(e){
      if(block.dataset.suppressClick){ delete block.dataset.suppressClick; return; }
      e.stopPropagation();
      const found = findNativeEvent(block.dataset.editnative);
      if(found) openEventModal(found);
    });
  });

  // Drag an existing meeting to move it — across times and across days.
  mountEl.querySelectorAll('.cal-block-native').forEach(function(block){
    block.addEventListener('mousedown', function(e){
      if(e.target.closest('.cal-resize-handle')) return;
      e.preventDefault();
      const startCol = block.closest('.cal-daycol');
      const startRect = startCol.getBoundingClientRect();
      const blockStartTop = parseFloat(block.style.top);
      const grabOffsetY = e.clientY - startRect.top - blockStartTop;
      const startX = e.clientX, startPageY = e.clientY;
      let dragging = false, currentCol = startCol;
      const onMove = function(me){
        if(!dragging && (Math.abs(me.clientX-startX)>4 || Math.abs(me.clientY-startPageY)>4)){
          dragging = true; block.style.zIndex = 20; block.style.opacity = '0.85';
        }
        if(!dragging) return;
        currentCol = colForClientX(me.clientX);
        const rect = currentCol.getBoundingClientRect();
        let newTop = me.clientY - rect.top - grabOffsetY;
        newTop = Math.round(newTop/GRID_SNAP_PX)*GRID_SNAP_PX;
        newTop = Math.max(0, Math.min(newTop, gridHeight - parseFloat(block.style.height)));
        if(currentCol !== block.parentElement) currentCol.appendChild(block);
        block.style.top = newTop+'px';
      };
      const onUp = function(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        block.style.zIndex = ''; block.style.opacity = '';
        if(!dragging) return;
        block.dataset.suppressClick = '1';
        const newDate = currentCol.dataset.daycol;
        const startMinutes = GRID_START_HOUR*60 + Math.round(parseFloat(block.style.top)/GRID_HOUR_PX*60);
        applyNativeMove(block.dataset.editnative, newDate, minutesToTime(startMinutes));
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // Drag the top/bottom edge of a meeting to resize it (change start or
  // end time) — literal Google-Calendar-style gridline adjustment.
  mountEl.querySelectorAll('.cal-resize-handle').forEach(function(handle){
    handle.addEventListener('mousedown', function(e){
      e.preventDefault(); e.stopPropagation();
      const block = handle.closest('.cal-block');
      const col = block.closest('.cal-daycol');
      const rect = col.getBoundingClientRect();
      const edge = handle.dataset.resize;
      const startTop = parseFloat(block.style.top);
      const startHeight = parseFloat(block.style.height);
      const onMove = function(me){
        const y = Math.max(0, Math.min(gridHeight, me.clientY - rect.top));
        if(edge==='bottom'){
          let newHeight = Math.round((y-startTop)/GRID_SNAP_PX)*GRID_SNAP_PX;
          newHeight = Math.max(GRID_SNAP_PX, newHeight);
          block.style.height = newHeight+'px';
        } else {
          let newTop = Math.round(y/GRID_SNAP_PX)*GRID_SNAP_PX;
          newTop = Math.min(newTop, startTop+startHeight-GRID_SNAP_PX);
          block.style.top = newTop+'px';
          block.style.height = (startTop+startHeight-newTop)+'px';
        }
      };
      const onUp = function(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        block.dataset.suppressClick = '1';
        const newTop = parseFloat(block.style.top);
        const newHeight = parseFloat(block.style.height);
        const startMinutes = GRID_START_HOUR*60 + Math.round(newTop/GRID_HOUR_PX*60);
        const endMinutes = Math.min(1439, startMinutes + Math.round(newHeight/GRID_HOUR_PX*60));
        applyNativeResize(block.dataset.editnative, minutesToTime(startMinutes), minutesToTime(endMinutes));
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // Drag-to-create on empty grid space.
  cols.forEach(function(col){
    let dragEl = null, startY = 0;
    col.addEventListener('mousedown', function(e){
      if(e.target.closest('.cal-block')) return;
      const rect = col.getBoundingClientRect();
      startY = e.clientY - rect.top;
      dragEl = document.createElement('div');
      dragEl.className = 'cal-dragsel';
      dragEl.style.top = startY+'px';
      dragEl.style.height = '2px';
      col.appendChild(dragEl);
      const onMove = function(me){
        const y = Math.max(0, me.clientY - rect.top);
        const top = Math.min(startY, y), h = Math.abs(y-startY);
        dragEl.style.top = top+'px';
        dragEl.style.height = h+'px';
      };
      const onUp = function(me){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        const rect2 = col.getBoundingClientRect();
        const endY = Math.max(0, me.clientY - rect2.top);
        const top = Math.min(startY, endY);
        if(dragEl) dragEl.remove();
        const startMinutes = GRID_START_HOUR*60 + Math.round(top/GRID_HOUR_PX*60/15)*15;
        openEventModal(null, col.dataset.daycol, minutesToTime(startMinutes));
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

function showView(v){ activeView = v; ['month','week','day','agenda'].forEach(function(x){ document.getElementById('view-'+x+'-btn').classList.toggle('active', x===v); }); render(); }
function navigate(dir){
  if(calendarMode==='grid'){ activeDate = addDays(activeDate, gridDayMode ? dir : dir*7); render(); return; }
  if(activeView==='month'){ const d = new Date(activeDate+'T00:00:00'); d.setMonth(d.getMonth()+dir); activeDate = ymd(d.getFullYear(), d.getMonth()+1, 1); }

      const weekEnd = addDays(weekStart, 6);

      renderGridCalendarView(mount, weekStart, 7);

  } else if(activeView==='week'){

    const weekEnd = addDays(weekStart, 6);

// Reminders — birthdays, anniversaries, or anything else recurring
// yearly, grouped into categories you can create or remove yourself.
// Existing birthdays get migrated into a "Birthday" category automatically
// the first time this loads, so nothing already saved gets lost.
const DEFAULT_REMINDER_CATEGORIES = [
  { id:'cat-birthday', name:'Birthday' },
  { id:'cat-anniversary', name:'Anniversary' }
];
let reminderCategories = [];
let reminders = [];
function remindersDoc(key){ return db.collection('users').doc(currentUser.uid).collection('apps').doc('calendar').collection('data').doc(key); }
async function loadReminders(){
  try{
    const catDoc = await remindersDoc('reminderCategories').get();
    const remDoc = await remindersDoc('reminders').get();
    const hasNewData = catDoc.exists || remDoc.exists;
    reminderCategories = (catDoc.exists && catDoc.data().json) ? JSON.parse(catDoc.data().json) : [];
    reminders = (remDoc.exists && remDoc.data().json) ? JSON.parse(remDoc.data().json) : [];
    if(!hasNewData){
      // First time on the new system — pull in whatever was saved under
      // the old birthdays-only storage, if anything, tagged as Birthday.
      const oldDoc = await remindersDoc('birthdays').get();
      const oldBirthdays = (oldDoc.exists && oldDoc.data().json) ? JSON.parse(oldDoc.data().json) : [];
      reminderCategories = JSON.parse(JSON.stringify(DEFAULT_REMINDER_CATEGORIES));
      reminders = oldBirthdays.map(function(b){ return { id:b.id, name:b.name, month:b.month, day:b.day, categoryId:'cat-birthday' }; });
      await saveReminderCategories();
      await saveReminders();
    } else if(!reminderCategories.length){
      reminderCategories = JSON.parse(JSON.stringify(DEFAULT_REMINDER_CATEGORIES));
      await saveReminderCategories();
    }
  }catch(e){ reminderCategories = JSON.parse(JSON.stringify(DEFAULT_REMINDER_CATEGORIES)); reminders = []; }
}
async function saveReminders(){ try{ await remindersDoc('reminders').set({json: JSON.stringify(reminders)}); }catch(e){} }
async function saveReminderCategories(){ try{ await remindersDoc('reminderCategories').set({json: JSON.stringify(reminderCategories)}); }catch(e){} }
function categoryName(id){ const c = reminderCategories.find(function(x){ return x.id===id; }); return c ? c.name : 'Reminder'; }
function categoryIcon(id){ const n = categoryName(id).toLowerCase(); if(n==='birthday') return '🎂'; if(n==='anniversary') return '💍'; return '🔔'; }
function reminderEventsFor(dateStr){
  const mm = dateStr.slice(5,7), dd = dateStr.slice(8,10);
  return reminders.filter(function(r){ return r.month===mm && r.day===dd; })
    .map(function(r){ return { title: r.name+(categoryName(r.categoryId)==='Birthday'?"'s Birthday":' — '+categoryName(r.categoryId))+' '+categoryIcon(r.categoryId), source:'Birthdays', color:'#E0567E', person:'', time:'' }; });
}
// All-day banner — shown regardless of which view/date you're looking at,
// for as long as today matches a reminder.
function renderBirthdayBanner(){
  const el = document.getElementById('birthday-banner');
  const todays = reminders.filter(function(r){ const t=todayStr(); return r.month===t.slice(5,7) && r.day===t.slice(8,10); });
  if(!todays.length){ el.style.display = 'none'; el.innerHTML=''; return; }
  const lines = todays.map(function(r){
    const cat = categoryName(r.categoryId);
    if(cat==='Birthday') return '🎉 Happy Birthday, '+escapeHtml(r.name)+'! 🎂';
    if(cat==='Anniversary') return '💍 Happy Anniversary, '+escapeHtml(r.name)+'!';
    return '🔔 '+escapeHtml(r.name)+' — '+escapeHtml(cat)+' today';
  });
  el.innerHTML = lines.join(' · ');
  el.style.display = 'block';
}

      }).join('')+'</div>'+

      '<input type="number" class="be-day" value="'+parseInt(r.day,10)+'" min="1" max="31" style="flex:1;font-size:12.5px;padding:6px 6px;border-radius:7px;border:1px solid var(--border);"></div>'+
      '<select class="be-cat" style="font-size:12.5px;padding:6px;border-radius:7px;border:1px solid var(--border);">'+categoryOptionsHtml(r.categoryId)+'</select>'+
      '<div style="display:flex;gap:6px;"><button type="button" class="btn-mini primary" style="flex:1;" data-savebday="'+r.id+'">Save</button><button type="button" class="btn-mini ghost" style="flex:1;" data-editbday="'+r.id+'">Cancel</button></div>'+
    '</div>';
  }
  return '<div class="bday-row"><div><div class="bd-name">'+categoryIcon(r.categoryId)+' '+escapeHtml(r.name)+'</div><div class="bd-date">'+parseInt(r.month,10)+'/'+parseInt(r.day,10)+' every year · '+escapeHtml(categoryName(r.categoryId))+'</div></div>'+
    '<div style="display:flex;gap:5px;"><button type="button" data-editbday="'+r.id+'" style="background:var(--surface-alt);color:var(--text-soft);">✎</button><button type="button" data-delbday="'+r.id+'">✕</button></div></div>';
}
// Every event source, filtered down to whichever circles are currently on.
function eventsFor(dateStr){
  let out = (eventsByDate[dateStr]||[]).filter(function(e){ return activeFilters.has((e.source||'').toLowerCase()); });
  if(activeFilters.has('schedule')) out = out.concat(eventsForRecurringWeekday(dateStr));
  if(activeFilters.has('birthdays')) out = out.concat(reminderEventsFor(dateStr));
  if(activeFilters.has('meetings')) out = out.concat(nativeEventsForDate(dateStr));
  // Chronological order — anything with a real time sorts by that time;
  // untimed items (most chores, undated todos) stay grouped at the end,
  // in their original order, so the day reads like an actual timeline.
  const timed = out.filter(function(e){ return e.sortKey; }).sort(function(a,b){ return a.sortKey.localeCompare(b.sortKey); });
  const untimed = out.filter(function(e){ return !e.sortKey; });
  return timed.concat(untimed);
}

/* ---- MONTH VIEW ---- */
function renderMonthView(year, month){
  const el = document.createElement('div');
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDaysInMonth = new Date(year, month, 0).getDate();
  const today = todayStr();

  let cellsHtml = WEEKDAY_NAMES.map(function(w){ return '<div class="month-weekday">'+w.slice(0,3)+'</div>'; }).join('');
  for(let i=0;i<startOffset;i++){
    const dnum = prevDaysInMonth-startOffset+i+1;
    const pm = month===0?11:month-1, py = month===0?year-1:year;
    cellsHtml += monthCellHtml(ymd(py,pm+1,dnum), dnum, true, today);
  }
  for(let dnum=1;dnum<=daysInMonth;dnum++){
    cellsHtml += monthCellHtml(ymd(year,month+1,dnum), dnum, false, today);
  }
  const totalCells = startOffset+daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let i=1;i<=trailing;i++){
    const nm = month===11?0:month+1, ny = month===11?year+1:year;
    cellsHtml += monthCellHtml(ymd(ny,nm+1,i), i, true, today);
  }
  el.innerHTML = '<div class="month-grid">'+cellsHtml+'</div>';
  el.querySelectorAll('[data-daycell]').forEach(function(cell){
    cell.addEventListener('click', function(){ activeDate = cell.dataset.daycell; showView('day'); });
  });
  return el;
}
function monthCellHtml(dateStr, dnum, otherMonth, today){
  const showHindu = activeFilters.has('hindu');
  const showAuspicious = activeFilters.has('auspicious');
  const tithi = showHindu ? getTithiInfo(dateStr) : null;
  const festList = showHindu ? festivalList(dateStr) : [];
  const ausp = showAuspicious ? auspiciousInfo(dateStr) : null;
  const evs = eventsFor(dateStr);
  const badge = tithi && tithi.isAnchor ? '<span class="tithi-badge '+(tithi.name==='Amavasya'?'amavasya':'purnima')+'"></span>' : '';
  const sunBadge = ausp ? '<span class="sun-badge" title="'+escapeHtml(ausp.label)+'">☀️</span>' : '';
  const pills = evs.slice(0,3).map(function(e){
    const tag = e.link ? 'a' : 'div';
    const attrs = e.link ? ' href="'+escapeHtml(e.link)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()"' : (e.nativeId ? ' onclick="event.stopPropagation()"' : '');
    const editAttr = e.nativeId ? ' data-editnative="'+e.nativeId+'"' : '';
    return '<'+tag+' class="cell-pill" style="background:'+e.color+'22;color:'+e.color+';display:block;text-decoration:none;"'+attrs+editAttr+'>'+escapeHtml(e.title)+'</'+tag+'>';
  }).join('');
  const more = evs.length>3 ? '<div class="cell-more">+'+(evs.length-3)+' more</div>' : '';
  const festHtml = festList.length ? '<div class="cell-festival">'+escapeHtml(festList[0])+(festList.length>1?' <span class="cell-fest-more">+'+(festList.length-1)+'</span>':'')+'</div>' : '';
  return '<div class="month-cell '+(otherMonth?'other-month':'')+' '+(dateStr===today?'is-today':'')+'" data-daycell="'+dateStr+'">'+
    '<div class="cell-date">'+dnum+badge+sunBadge+'</div>'+
    festHtml+
    '<div class="cell-events">'+pills+more+'</div>'+
  '</div>';
}

/* ---- WEEK VIEW ---- */
function renderWeekView(weekStart){
  const el = document.createElement('div');
  const today = todayStr();
  let html = '<div class="week-grid">';
  for(let i=0;i<7;i++){
    const dateStr = addDays(weekStart, i);
    const d = new Date(dateStr+'T00:00:00');
    const tithi = activeFilters.has('hindu') ? getTithiInfo(dateStr) : null;
    const evs = eventsFor(dateStr);
    html += '<div class="week-col '+(dateStr===today?'is-today':'')+'" data-daycell="'+dateStr+'">'+
      '<div class="week-col-head"><div class="wd">'+WEEKDAY_NAMES[d.getDay()].slice(0,3)+'</div><div class="dn">'+d.getDate()+'</div></div>'+
      (tithi ? '<div class="week-tithi">'+(tithi.isAnchor?tithi.name:tithi.paksha.slice(0,1)+' '+tithi.tithiNum)+'</div>' : '')+
      evs.map(function(e){
        const tag = e.link ? 'a' : 'div';
        const attrs = e.link ? ' href="'+escapeHtml(e.link)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()"' : (e.nativeId ? ' onclick="event.stopPropagation()"' : '');
        const editAttr = e.nativeId ? ' data-editnative="'+e.nativeId+'"' : '';
        return '<'+tag+' class="week-event" style="background:'+e.color+'22;color:'+e.color+';display:block;text-decoration:none;"'+attrs+editAttr+'>'+escapeHtml(e.title)+'</'+tag+'>';
      }).join('')+
    '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
  el.querySelectorAll('[data-daycell]').forEach(function(cell){
    cell.addEventListener('click', function(){ activeDate = cell.dataset.daycell; showView('day'); });
  });
  return el;
}

function displayTime(t){
  // Raw 24h "HH:MM" (e.g. from Todo's due time) gets formatted for display;
  // anything else (like Schedule's already-formatted "2:30 PM – 3:00 PM"
  // range) is shown as-is.
  if(t && /^\d{1,2}:\d{2}$/.test(t)) return fmtScheduleTime(t);
  return t;
}
function agendaRowHtml(e){
  const tag = e.link ? 'a' : 'div';
  const attrs = e.link ? ' href="'+escapeHtml(e.link)+'" target="_blank" rel="noopener"' : '';
  const editAttr = e.nativeId ? ' data-editnative="'+e.nativeId+'"' : '';
  const shownTime = e.displayTime || displayTime(e.time);
  const linkHtml = e.meetingLink ? ' · <a href="'+escapeHtml(e.meetingLink)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 open link</a>' : '';
  const extraMeta = (e.location?' · 📍'+escapeHtml(e.location):'')+linkHtml;
  return '<'+tag+' class="agenda-row" style="text-decoration:none;color:inherit;"'+attrs+editAttr+'><div class="agenda-dot" style="background:'+e.color+';"></div>'+
    '<div><div class="agenda-title">'+escapeHtml(e.title)+(e.link?' ↗':'')+'</div><div class="agenda-meta">'+e.source+(e.person?' · '+e.person:'')+(shownTime?' · '+shownTime:'')+extraMeta+'</div></div></'+tag+'>';
}
/* ---- DAY VIEW ---- */
function renderDayView(dateStr){
  const tithi = getTithiInfo(dateStr);
  const festList = festivalList(dateStr);
  const ausp = activeFilters.has('auspicious') ? auspiciousInfo(dateStr) : null;
  const evs = eventsFor(dateStr);
  let panchangHtml = '';
  if(ausp){
    panchangHtml += '<div class="panchang-box panchang-sun"><div class="panchang-sun-label">☀️ '+escapeHtml(ausp.label)+'</div></div>';
  }
  if(activeFilters.has('hindu') && (tithi || festList.length)){
    panchangHtml += '<div class="panchang-box panchang-prominent">';
    if(tithi){
      panchangHtml += '<div class="panchang-tithi">🌙 '+tithi.paksha+' Paksha — '+tithi.name+'</div>'+(tithi.anchorName?'<div class="panchang-anchor">'+escapeHtml(tithi.anchorName)+'</div>':'');
    }
    if(festList.length){
      panchangHtml += '<ul class="panchang-fest-list">'+festList.map(function(f){ return '<li>'+escapeHtml(f)+'</li>'; }).join('')+'</ul>';
    }
    panchangHtml += '</div>';
  }

  const evsHtml = evs.length ? evs.map(agendaRowHtml).join('') : '<div class="empty-note">Nothing scheduled — or everything\'s filtered out above.</div>';

  return '<div class="day-card">'+panchangHtml+evsHtml+'</div>';
}

/* ---- AGENDA VIEW ---- */
function renderAgendaView(){
  let html = '';
  let anyEvents = false;
  const showHindu = activeFilters.has('hindu');
  const showAuspicious = activeFilters.has('auspicious');
  for(let i=0;i<30;i++){
    const dateStr = addDays(todayStr(), i);
    const evs = eventsFor(dateStr);
    const tithi = showHindu ? getTithiInfo(dateStr) : null;
    const festList = showHindu ? festivalList(dateStr) : [];
    const ausp = showAuspicious ? auspiciousInfo(dateStr) : null;
    if(!evs.length && !festList.length && !(tithi && tithi.isAnchor) && !ausp) continue;
    anyEvents = true;
    html += '<div class="agenda-daygroup">'+fmtLong(dateStr)+'</div>';
    if(ausp) html += '<div class="agenda-row"><div class="agenda-dot" style="background:#F5A623;"></div><div><div class="agenda-title">☀️ '+escapeHtml(ausp.label)+'</div><div class="agenda-meta">Auspicious</div></div></div>';
    festList.forEach(function(f){
      html += '<div class="agenda-row"><div class="agenda-dot" style="background:var(--purnima);"></div><div><div class="agenda-title">'+escapeHtml(f)+'</div><div class="agenda-meta">Panchang</div></div></div>';
    });
    if(tithi && tithi.isAnchor) html += '<div class="agenda-row"><div class="agenda-dot" style="background:var(--amavasya);"></div><div><div class="agenda-title">'+escapeHtml(tithi.anchorName||tithi.name)+'</div><div class="agenda-meta">Panchang</div></div></div>';
    evs.forEach(function(e){ html += agendaRowHtml(e); });
  }
  return anyEvents ? html : '<div class="empty-note">Nothing in the next 30 days.</div>';
}

} // end firebase-available guard
