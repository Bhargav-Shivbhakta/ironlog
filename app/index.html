<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Exam Practice</title>
  <meta name="description" content="Practice questions, timed exams and progress tracking.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="vendor/hljs/light.css" id="hl-light">
  <link rel="stylesheet" href="vendor/hljs/dark.css" id="hl-dark" disabled>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // apply theme before first paint
    try {
      var s = JSON.parse(localStorage.getItem('qp1:settings') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      if (s.textSize) document.documentElement.dataset.size = s.textSize;
    } catch (e) {}
  </script>
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/hljs/highlight.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="Home">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><circle cx="19" cy="9" r="5.5" class="filled"/><circle cx="9" cy="19" r="5.5"/><circle cx="19" cy="19" r="5.5"/></svg>
      <span id="site-name">Exam Practice</span>
    </a>
    <nav class="topnav" aria-label="Main">
      <a href="#/" data-nav="home">Exams</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <section class="page skeleton" aria-busy="true" aria-label="Loading"><span class="sk sk-eyebrow"></span><span class="sk sk-title"></span><span class="sk sk-line"></span><span class="sk sk-block"></span></section>
  </main>
  <footer class="sitefoot" id="sitefoot"></footer>
  <noscript><p style="padding:2rem">This site needs JavaScript turned on.</p></noscript>
</body>
</html>
